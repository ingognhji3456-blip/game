  const sfx = (name) => CB.audio && CB.audio.play(name);

  const TYPE_NAMES = { attack: '공격', skill: '스킬', power: '파워', status: '상태이상', curse: '저주' };
  const ACT_NAMES = { 1: '속삭이는 숲', 2: '잊혀진 폐허', 3: '불타는 심연' };
  CB.ui.TYPE_NAMES = TYPE_NAMES;
  CB.ui.ACT_NAMES = ACT_NAMES;
  CB.ui.sfx = sfx;

  /* ---------------- 화면 전환 ---------------- */
  const SCREEN_BG = { title: 'title', map: 'map', shop: 'shop', rest: 'rest', event: 'event', treasure: 'event', reward: 'map', gameover: 'title' };
  CB.ui.currentScreen = null;
  CB.ui.showScreen = (name, opts = {}) => {
    document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === `screen-${name}`));
    document.body.className = document.body.className.replace(/\bscreen-\w+/g, '').trim() + ` screen-${name}`;
    const run = CB.ui.flow && CB.ui.flow.run;
    const bg = opts.bg || (name === 'battle' || name === 'reward' ? `act${run ? run.act : 1}` : SCREEN_BG[name] || 'map');
    if (CB.art && CB.art.background) $('app').style.background = CB.art.background(bg);
    const showHud = !['title', 'gameover'].includes(name);
    $('hud').classList.toggle('hidden', !showHud);
    if (showHud && run) CB.ui.hud.render(run);
    CB.ui.tooltip.hide();
    CB.ui.currentScreen = name;
  };

  /* ---------------- 카드 ---------------- */
  CB.ui.renderCard = (view, opts = {}) => {
    const size = opts.size || 'md';
    const classes = ['card', `card-${view.type}`, `rarity-${view.rarity}`, `size-${size}`];
    if (view.upgraded) classes.push('upgraded');
    if (view.unplayable) classes.push('no-cost');
    if (view.playable === false) classes.push('unplayable-now');
    if (opts.hoverable) classes.push('hoverable');
    const costClass = view.cost < view.baseCost ? 'card-cost cheaper' : 'card-cost';
    const art = CB.art && CB.art.cardIcon ? CB.art.cardIcon(view.art, view.type) : '';
    const node = el('div', {
      class: classes.join(' '),
      dataset: { uid: view.uid || '', id: view.id },
      html: `
        <div class="card-frame">
          <div class="${costClass}">${view.cost}</div>
          <div class="card-gem"></div>
          <div class="card-name">${U.escapeHtml(view.name)}</div>
          <div class="card-art">${art}</div>
          <div class="card-type">${TYPE_NAMES[view.type] || view.type}</div>
          <div class="card-desc"><div>${view.descHTML}</div></div>
        </div>`,
    });
    if (opts.tooltip !== false && view.keywords && view.keywords.length) {
      CB.ui.tooltip.bind(node, () => CB.ui.keywordHTML(view.keywords), { side: 'right' });
    }
    return node;
  };

  /** 덱/보상 등 전투 밖 카드 */
  CB.ui.cardFromInst = (inst, opts) => CB.ui.renderCard(CB.combat.cardView(inst), opts);
  CB.ui.cardFromId = (id, upgraded, opts) => CB.ui.renderCard(CB.combat.cardView({ uid: `v_${id}`, id, upgraded: !!upgraded }), opts);

  /* ---------------- 툴팁 ---------------- */
  const tip = {
    node: null,
    owner: null,
    timer: null,
    show(html, target, side = 'top') {
      if (!html) return;
      const node = this.node || (this.node = $('tooltip'));
      node.innerHTML = html;
      node.classList.add('show');
      const r = target.getBoundingClientRect();
      const tw = node.offsetWidth;
      const th = node.offsetHeight;
      let x;
      let y;
      if (side === 'right') { x = r.right + 10; y = r.top + r.height / 2 - th / 2; }
      else if (side === 'bottom') { x = r.left + r.width / 2 - tw / 2; y = r.bottom + 10; }
      else { x = r.left + r.width / 2 - tw / 2; y = r.top - th - 10; }
      if (side === 'right' && x + tw > window.innerWidth - 8) x = r.left - tw - 10;
      if (side === 'top' && y < 8) y = r.bottom + 10;
      x = U.clamp(x, 8, window.innerWidth - tw - 8);
      y = U.clamp(y, 8, window.innerHeight - th - 8);
      node.style.left = `${x}px`;
      node.style.top = `${y}px`;
    },
    hide() {
      if (this.node) this.node.classList.remove('show');
      this.owner = null;
    },
    bind(target, content, opts = {}) {
      const resolve = () => (typeof content === 'function' ? content() : content);
      target.addEventListener('mouseenter', () => {
        if (CB.ui.dragging) return;
        tip.owner = target;
        clearTimeout(tip.timer);
        const showNow = () => { if (tip.owner === target && !CB.ui.dragging) tip.show(resolve(), target, opts.side || 'top'); };
        if (opts.delay) tip.timer = setTimeout(showNow, opts.delay);
        else showNow();
      });
      target.addEventListener('mouseleave', () => { clearTimeout(tip.timer); if (tip.owner === target) tip.hide(); });
      target.addEventListener('touchstart', () => {
        clearTimeout(tip.timer);
        tip.timer = setTimeout(() => { tip.owner = target; tip.show(resolve(), target, opts.side || 'top'); }, 420);
      }, { passive: true });
      target.addEventListener('touchend', () => { clearTimeout(tip.timer); setTimeout(() => tip.hide(), 1400); });
    },
  };
  CB.ui.tooltip = {
    bind: (t, c, o) => tip.bind(t, c, o),
    show: (h, t, s) => tip.show(h, t, s),
    hide: () => tip.hide(),
  };

  CB.ui.keywordHTML = (ids) => (ids || []).map((id) => {
    const k = CB.data.keywords[id];
    if (!k) return '';
    return `<div class="tt-kw"><span class="tt-title">${k.icon} ${k.name}</span><p>${k.desc.replace(/\s*\(\{value\}턴\)/g, '').replace(/\{value\}/g, 'X')}</p></div>`;
  }).join('');

  CB.ui.relicHTML = (id) => {
    const r = CB.data.relics[id];
    if (!r) return '';
    const rarity = { starter: '시작', common: '일반', uncommon: '고급', rare: '희귀', boss: '보스', shop: '상점', event: '이벤트' }[r.rarity] || '';
    return `<span class="tt-title">${r.icon} ${U.escapeHtml(r.name)}</span><span class="tt-sub">${rarity} 유물</span><p>${U.escapeHtml(r.desc)}</p>`;
  };
  CB.ui.potionHTML = (id) => {
    const p = CB.data.potions[id];
    if (!p) return '';
    return `<span class="tt-title">${U.escapeHtml(p.name)}</span><p>${U.escapeHtml(p.desc)}</p>`;
  };

  /* ---------------- 모달 ---------------- */
  const modalStack = [];
  CB.ui.modal = {
    open({ title, sub, html, el: content, buttons = [], dismissable = false, className = '', onClose }) {
      CB.ui.tooltip.hide();
      const box = el('div', { class: `modal ${className}` });
      if (title) box.appendChild(el('h2', { class: 'modal-title title-ornament', text: title }));
      if (sub) box.appendChild(el('p', { class: 'modal-sub', html: sub }));
      const body = el('div', { class: 'modal-body' });
      if (html) body.innerHTML = html;
      if (content) body.appendChild(content);
      box.appendChild(body);
      const handle = {};
      if (buttons.length) {
        const row = el('div', { class: 'modal-buttons' });
        for (const b of buttons) {
          const btn = el('button', {
            class: `btn ${b.kind === 'secondary' ? 'secondary' : b.kind === 'danger' ? 'danger' : ''}`,
            text: b.label,
            onclick: () => { sfx('click'); if (b.onClick) b.onClick(handle); else handle.close(); },
          });
          if (b.disabled) btn.disabled = true;
          if (b.id) btn.id = b.id;
          row.appendChild(btn);
        }
        box.appendChild(row);
        handle.buttons = row;
      }
      if (dismissable) {
        const x = el('button', { class: 'icon-btn modal-close', text: '✕', 'aria-label': '닫기', onclick: () => handle.close() });
        box.appendChild(x);
      }
      const backdrop = el('div', { class: 'modal-backdrop' }, [box]);
      if (dismissable) backdrop.addEventListener('click', (e) => { if (e.target === backdrop) handle.close(); });
      $('modal-root').appendChild(backdrop);
      handle.body = body;
      handle.box = box;
      handle.dismissable = dismissable;
      handle.close = () => {
        const i = modalStack.indexOf(handle);
        if (i >= 0) modalStack.splice(i, 1);
        backdrop.remove();
        CB.ui.tooltip.hide();
        if (onClose) onClose();
      };
      modalStack.push(handle);
      return handle;
    },
    close() {
      const top = modalStack[modalStack.length - 1];
      if (top) top.close();
    },
    isOpen: () => modalStack.length > 0,
    top: () => modalStack[modalStack.length - 1],
  };

  /* ---------------- 카드 선택 ---------------- */
  CB.ui.selectCards = (o) => new Promise((resolve) => {
    const cards = o.cards || [];
    const min = o.min != null ? o.min : 1;
    const max = o.max != null ? o.max : 1;
    const selected = new Set();
    const grid = el('div', { class: `card-grid${o.viewOnly ? ' view-only' : ''}` });
    const preview = el('div', { class: 'upgrade-preview' });
    const wrapEl = el('div', {}, o.preview === 'upgrade' ? [preview, grid] : [grid]);
    if (!cards.length) grid.appendChild(el('p', { class: 'modal-sub', text: '카드가 없습니다.' }));
    const sorted = o.sort === false ? cards : cards.slice().sort((a, b) => {
      const da = CB.combat.cardDef(a);
      const db = CB.combat.cardDef(b);
      const order = { attack: 0, skill: 1, power: 2, status: 3, curse: 4 };
      return (order[da.type] - order[db.type]) || (da.cost - db.cost) || da.name.localeCompare(db.name, 'ko');
    });
    let handle;
    const update = () => {
      if (handle && handle.buttons) {
        const ok = handle.buttons.querySelector('#select-confirm');
        if (ok) ok.disabled = selected.size < min || selected.size > max;
      }
      if (o.preview === 'upgrade') {
        preview.innerHTML = '';
        const uid = [...selected][0];
        const inst = cards.find((c) => c.uid === uid);
        if (inst) {
          preview.appendChild(CB.ui.cardFromInst(inst, { size: 'md', tooltip: false }));
          preview.appendChild(el('div', { class: 'arrow', text: '➜' }));
          preview.appendChild(CB.ui.cardFromInst({ ...inst, upgraded: true }, { size: 'md', tooltip: false }));
        } else {
          preview.appendChild(el('p', { class: 'modal-sub', text: '강화할 카드를 고르세요.' }));
        }
      }
    };
    for (const inst of sorted) {
      const node = CB.ui.cardFromInst(inst, { size: 'md', hoverable: !o.viewOnly });
      if (!o.viewOnly) {
        node.addEventListener('click', () => {
          sfx('select');
          if (selected.has(inst.uid)) selected.delete(inst.uid);
          else {
            if (max === 1) { selected.clear(); grid.querySelectorAll('.selected').forEach((n) => n.classList.remove('selected')); }
            if (selected.size >= max) return;
            selected.add(inst.uid);
          }
          node.classList.toggle('selected', selected.has(inst.uid));
          update();
        });
      }
      grid.appendChild(node);
    }
    const buttons = [];
    // resolve 를 먼저 호출해야 onClose 의 resolve(null) 보다 우선합니다.
    if (!o.viewOnly) buttons.push({ id: 'select-confirm', label: o.confirmLabel || '확인', onClick: (h) => { resolve([...selected]); h.close(); } });
    if (o.viewOnly || o.cancellable) buttons.push({ label: o.viewOnly ? '닫기' : '취소', kind: 'secondary', onClick: (h) => { resolve(null); h.close(); } });
    handle = CB.ui.modal.open({
      title: o.title, sub: o.subtitle, el: wrapEl, buttons,
      dismissable: !!(o.viewOnly || o.cancellable),
      onClose: () => resolve(null),
    });
    update();
  });

  CB.ui.viewPile = (title, insts, battle) => {
    const grid = el('div', { class: 'card-grid view-only' });
    if (!insts.length) grid.appendChild(el('p', { class: 'modal-sub', text: '비어 있습니다.' }));
    for (const inst of insts) grid.appendChild(CB.ui.renderCard(CB.combat.cardView(inst, battle), { size: 'md' }));
    CB.ui.modal.open({ title: `${title} (${insts.length})`, el: grid, dismissable: true, buttons: [{ label: '닫기', kind: 'secondary' }] });
  };

  /* ---------------- 토스트 ---------------- */
  CB.ui.toast = (text, kind = '') => {
    const root = $('toast-root');
    const t = el('div', { class: `toast ${kind}`, text });
    root.appendChild(t);
    while (root.children.length > 3) root.firstChild.remove();
    setTimeout(() => t.remove(), 2300);
  };

  /* ---------------- HUD ---------------- */
  let lastHud = { hp: null, gold: null };
  CB.ui.hud = {
    render(run) {
      if (!run) return;
      const battle = CB.ui.battle && CB.ui.battle.current && CB.ui.battle.current();
      const hp = battle && !battle.finished ? battle.player.hp : run.player.hp;
      const maxHp = battle && !battle.finished ? battle.player.maxHp : run.player.maxHp;
      $('hud-hp-text').textContent = `${hp}/${maxHp}`;
      $('hud-gold-text').textContent = run.player.gold;
      if (lastHud.gold !== null && lastHud.gold !== run.player.gold) bump($('hud-gold'));
      if (lastHud.hp !== null && lastHud.hp !== hp) bump($('hud-hp'));
      lastHud = { hp, gold: run.player.gold };
      const nodeLabel = run.act <= 3 ? `<b>${run.act}막</b> · ${ACT_NAMES[run.act] || ''} · ${run.floor}층` : '';
      $('hud-floor').innerHTML = nodeLabel;
      $('hud-deck-count').textContent = run.deck.length;

      // 물약
      const pots = $('hud-potions');
      pots.innerHTML = '';
      run.potions.forEach((id, slot) => {
        const def = id && CB.data.potions[id];
        const btn = el('button', { class: `potion-slot${def ? ' filled' : ''}`, 'aria-label': def ? def.name : '빈 물약 슬롯' });
        if (def) {
          btn.innerHTML = CB.art.potion(def.color, def.shape);
          CB.ui.tooltip.bind(btn, () => CB.ui.potionHTML(id), { side: 'bottom' });
          btn.addEventListener('click', () => onPotionClick(run, slot));
        }
        pots.appendChild(btn);
      });

      // 유물
      const relics = $('hud-relics');
      relics.innerHTML = '';
      for (const id of run.relics) {
        const def = CB.data.relics[id];
        if (!def) continue;
        const node = el('div', { class: `relic-icon${def.rarity === 'boss' ? ' boss' : ''}`, dataset: { relic: id }, text: def.icon });
        const counter = battle ? CB.combat.relicCounter(battle, id) : null;
        if (counter !== null && counter !== undefined) node.appendChild(el('span', { class: 'relic-counter', text: String(counter) }));
        CB.ui.tooltip.bind(node, () => CB.ui.relicHTML(id), { side: 'bottom' });
        relics.appendChild(node);
      }
      $('hud-mute').textContent = CB.audio && CB.audio.isMuted() ? '🔇' : '🔊';
    },
    flashRelic(id) {
      const node = document.querySelector(`.relic-icon[data-relic="${id}"]`);
      if (!node) return;
      node.classList.remove('pulse');
      void node.offsetWidth;
      node.classList.add('pulse');
    },
  };
  function bump(node) {
    node.classList.remove('bump');
    void node.offsetWidth;
    node.classList.add('bump');
  }

  function onPotionClick(run, slot) {
    const id = run.potions[slot];
    if (!id) return;
    sfx('click');
    if (CB.ui.battle && CB.ui.battle.isActive()) {
      CB.ui.battle.usePotionFlow(slot);
      return;
    }
    const def = CB.data.potions[id];
    CB.ui.modal.open({
      title: def.name,
      className: 'small',
      html: `<div style="display:flex;gap:14px;align-items:center;justify-content:center"><div style="width:64px;height:64px">${CB.art.potion(def.color, def.shape)}</div><p>${U.escapeHtml(def.desc)}<br><span class="tt-sub">물약은 전투 중에만 사용할 수 있습니다.</span></p></div>`,
      dismissable: true,
      buttons: [
        { label: '버리기', kind: 'danger', onClick: (h) => { CB.run.discardPotion(run, slot); CB.save.saveRun(run); CB.ui.hud.render(run); h.close(); } },
        { label: '닫기', kind: 'secondary' },
      ],
    });
  }

  // HUD 버튼
  document.addEventListener('DOMContentLoaded', () => {
    $('hud-deck').addEventListener('click', () => {
      const run = CB.ui.flow && CB.ui.flow.run;
      if (!run) return;
      sfx('click');
      CB.ui.selectCards({ title: '내 덱', subtitle: `${run.deck.length}장`, cards: run.deck, viewOnly: true });
    });
    $('hud-map').addEventListener('click', () => {
      const run = CB.ui.flow && CB.ui.flow.run;
      if (!run || CB.ui.currentScreen === 'map') return;
      sfx('click');
      CB.ui.map.peek(run);
    });
    $('hud-mute').addEventListener('click', () => {
      if (!CB.audio) return;
      CB.audio.init();
      const settings = CB.save.loadSettings();
      settings.muted = !CB.audio.isMuted();
      CB.save.saveSettings(settings);
      CB.audio.setMuted(settings.muted);
      $('hud-mute').textContent = settings.muted ? '🔇' : '🔊';
    });
    $('hud-settings').addEventListener('click', () => { sfx('click'); CB.ui.flow.openSettings(); });
  });

  CB.ui.esc = U.escapeHtml;
})();

</script>
  <script>/* js/ui/map.js */
'use strict';

/* =========================================================
 * 지도 화면 — 세로 스크롤 분기 지도
 * ========================================================= */
(() => {
  const el = CB.util.el;
  const NODE_NAMES = { combat: '전투', elite: '정예', rest: '휴식처', shop: '상점', event: '미지의 장소', treasure: '보물', boss: '보스' };
  const NODE_DESC = {
    combat: '평범한 적과 싸웁니다.',
    elite: '강력한 적이 지키고 있습니다. 유물을 얻을 수 있습니다.',
    rest: '체력을 회복하거나 카드를 강화합니다.',
    shop: '골드로 카드·유물·물약을 삽니다.',
    event: '무슨 일이 일어날지 모릅니다.',
    treasure: '보물 상자가 놓여 있습니다.',
    boss: '이 막의 주인이 기다립니다.',
  };
  const ROW_H = 92;

  function build(run, { interactive, onSelect }) {
    const map = run.map;
    const rows = map.rows.length;
    const height = (rows + 1) * ROW_H + 190;
    const avail = new Set(interactive ? CB.run.availableNodes(run).map((n) => n.id) : []);
    const visitedPath = new Set();
    CB.run.allNodes(run).forEach((n) => { if (n.visited) visitedPath.add(n.id); });

    const scroller = el('div', { class: 'map-scroller' });
    const canvas = el('div', { class: 'map-canvas', style: { height: `${height}px` } });
    scroller.appendChild(canvas);

    const pos = (node) => {
      if (node.type === 'boss') return { x: 50, y: 70 };
      return { x: node.x * 100, y: height - 90 - node.row * ROW_H };
    };

    // 연결선
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'map-lines');
    svg.setAttribute('viewBox', `0 0 100 ${height}`);
    svg.setAttribute('preserveAspectRatio', 'none');
    for (const node of CB.run.allNodes(run)) {
      for (const nextId of node.next) {
        const next = CB.run.findNode(run, nextId);
        if (!next) continue;
        const a = pos(node);
        const b = pos(next);
        const path = document.createElementNS(svgNS, 'path');
        const midY = (a.y + b.y) / 2;
        path.setAttribute('d', `M${a.x} ${a.y} C${a.x} ${midY} ${b.x} ${midY} ${b.x} ${b.y}`);
        let cls = 'map-line';
        if (node.visited && next.visited) cls += ' walked';
        else if (node.id === run.currentNodeId && avail.has(next.id)) cls += ' open';
        path.setAttribute('class', cls);
        path.setAttribute('vector-effect', 'non-scaling-stroke');
        svg.appendChild(path);
      }
    }
    canvas.appendChild(svg);

    // 칸
    for (const node of CB.run.allNodes(run)) {
      const p = pos(node);
      const classes = ['map-node', `type-${node.type}`];
      if (node.visited) classes.push('visited');
      if (node.id === run.currentNodeId) classes.push('current');
      if (avail.has(node.id)) classes.push('available');
      else if (!node.visited) classes.push('locked');
      const btn = el('button', {
        class: classes.join(' '),
        style: { left: `${p.x}%`, top: `${p.y}px` },
        'aria-label': NODE_NAMES[node.type],
        html: CB.art.mapNode(node.type),
      });
      if (node.type === 'boss') {
        const bossId = (node.enemies || [])[0];
        const def = CB.data.enemies[bossId];
        btn.innerHTML = `<div class="boss-portrait">${CB.art.enemy(bossId)}</div><div class="boss-label">${def ? CB.ui.esc(def.name) : '보스'}</div>`;
      }
      CB.ui.tooltip.bind(btn, () => {
        let extra = '';
        if (node.type === 'boss') {
          const def = CB.data.enemies[(node.enemies || [])[0]];
          if (def) extra = `<p><b>${CB.ui.esc(def.name)}</b></p>`;
        }
        return `<span class="tt-title">${NODE_NAMES[node.type]}</span><p>${NODE_DESC[node.type]}</p>${extra}`;
      });
      if (avail.has(node.id) && onSelect) {
        btn.addEventListener('click', () => onSelect(node.id));
        btn.addEventListener('mouseenter', () => CB.ui.sfx('hover'));
      }
      canvas.appendChild(btn);
      if (node.id === run.currentNodeId) {
        canvas.appendChild(el('div', { class: 'map-you', style: { left: `${p.x}%`, top: `${p.y}px` }, html: '<span>📍</span>' }));
      }
    }
    return { scroller, canvas, height, pos };
  }

  function legend() {
    const box = el('div', { class: 'map-legend panel' });
    box.appendChild(el('div', { class: 'legend-title', text: '범례' }));
    for (const type of ['combat', 'elite', 'event', 'rest', 'shop', 'treasure']) {
      box.appendChild(el('div', { class: 'legend-row', html: `<span class="legend-icon">${CB.art.mapNode(type)}</span>${NODE_NAMES[type]}` }));
    }
    return box;
  }

  function scrollToCurrent(scroller, run, built) {
    const cur = run.currentNodeId ? CB.run.findNode(run, run.currentNodeId) : null;
    const y = cur ? built.pos(cur).y : built.height;
    requestAnimationFrame(() => {
      scroller.scrollTop = Math.max(0, y - scroller.clientHeight * 0.62);
    });
  }

  CB.ui.map = {
    NODE_NAMES,
    render(container, run, opts = {}) {
      container.innerHTML = '';
      const wrap = el('div', { class: 'map-screen' });
      const header = el('div', { class: 'map-header' }, [
        el('div', { class: 'map-act', text: `${run.act}막` }),
        el('div', { class: 'map-act-name title-ornament', text: CB.ui.ACT_NAMES[run.act] || '' }),
        el('div', { class: 'map-hint', text: opts.interactive ? '빛나는 칸을 골라 나아가세요' : '' }),
      ]);
      const built = build(run, opts);
      wrap.appendChild(header);
      wrap.appendChild(built.scroller);
      wrap.appendChild(legend());
      container.appendChild(wrap);
      scrollToCurrent(built.scroller, run, built);
    },
    peek(run) {
      const built = build(run, { interactive: false });
      built.scroller.classList.add('peek');
      const h = CB.ui.modal.open({ title: `${run.act}막 · ${CB.ui.ACT_NAMES[run.act] || ''}`, el: built.scroller, dismissable: true, className: 'map-modal', buttons: [{ label: '닫기', kind: 'secondary' }] });
      scrollToCurrent(built.scroller, run, built);
      return h;
    },
  };
})();

</script>
  <script>/* js/ui/screens.js */
'use strict';

/* =========================================================
 * 게임 흐름 — 타이틀, 지도, 칸 진입, 보상, 상점, 휴식, 이벤트, 보물, 결과, 설정, 도움말
 * ========================================================= */
(() => {
  const U = CB.util;
  const el = U.el;
  const $ = (id) => document.getElementById(id);
  const sfx = (n) => CB.ui.sfx(n);
  const esc = U.escapeHtml;
  const save = () => { if (flow.run && !flow.run.over) CB.save.saveRun(flow.run); };
  const music = (t) => CB.audio && CB.audio.music(t);
  const RARITY_NAMES = { common: '일반', uncommon: '고급', rare: '희귀', shop: '상점', boss: '보스', event: '이벤트', starter: '시작' };

  const flow = {
    run: null,

    boot() {
      flow.showTitle();
    },

    /* ================= 타이틀 ================= */
    showTitle() {
      flow.run = null;
      const root = $('screen-title');
      root.innerHTML = '';
      const hasSave = CB.save.hasRun();
      const embers = el('div', { class: 'title-embers' });
      for (let i = 0; i < 24; i++) {
        embers.appendChild(el('span', { style: { left: `${Math.random() * 100}%`, animationDelay: `${-Math.random() * 12}s`, animationDuration: `${8 + Math.random() * 8}s` } }));
      }
      const menu = el('div', { class: 'title-menu' }, [
        el('button', { class: 'btn big', text: hasSave ? '새 원정' : '원정 시작', onclick: () => { sfx('click'); flow.newGame(); } }),
        hasSave ? el('button', { class: 'btn big secondary', text: '이어하기', onclick: () => { sfx('click'); flow.continueGame(); } }) : null,
        el('div', { class: 'title-row' }, [
          el('button', { class: 'btn secondary', text: '도움말', onclick: () => { sfx('click'); flow.openHelp(); } }),
          el('button', { class: 'btn secondary', text: '기록', onclick: () => { sfx('click'); flow.openHistory(); } }),
          el('button', { class: 'btn secondary', text: '설정', onclick: () => { sfx('click'); flow.openSettings(); } }),
        ]),
      ]);
      root.appendChild(el('div', { class: 'title-screen' }, [
        embers,
        el('div', { class: 'title-logo', html: CB.art.logo() }),
        el('div', { class: 'title-hero', html: CB.art.hero() }),
        menu,
        el('div', { class: 'title-foot', text: '덱을 쌓고, 길을 고르고, 심연의 끝까지.' }),
      ]));
      CB.ui.showScreen('title');
      music('title');
    },

    newGame() {
      const start = () => {
        CB.save.clearRun();
        flow.run = CB.run.newRun();
        save();
        flow.goMap(true);
      };
      if (CB.save.hasRun()) {
        CB.ui.modal.open({
          title: '새 원정', className: 'small',
          html: '<p style="text-align:center">진행 중인 원정이 사라집니다. 새로 시작할까요?</p>',
          buttons: [{ label: '새로 시작', kind: 'danger', onClick: (h) => { h.close(); start(); } }, { label: '취소', kind: 'secondary' }],
          dismissable: true,
        });
      } else start();
    },

    continueGame() {
      const run = CB.save.loadRun();
      if (!run) { CB.ui.toast('저장된 원정이 없습니다.', 'error'); flow.showTitle(); return; }
      flow.run = run;
      if (run.current && run.current.data) flow.resume();
      else flow.goMap();
    },

    resume() {
      const cur = flow.run.current;
      const data = cur.data;
      if (cur.stage === 'reward') { flow.showReward(cur.rewardsKind || data.kind || 'normal'); return; }
      if (cur.eventCombat) { flow.startCombat(cur.eventCombat, true); return; }
      flow.dispatch(data);
    },

    /* ================= 지도 ================= */
    goMap(intro = false) {
      const run = flow.run;
      save();
      CB.ui.showScreen('map');
      music('map');
      CB.ui.map.render($('screen-map'), run, { interactive: true, onSelect: (id) => flow.enterNode(id) });
      if (intro && CB.fx) CB.fx.banner(`${run.act}막`, { kind: 'act', sub: CB.ui.ACT_NAMES[run.act], duration: 1700 });
    },

    enterNode(nodeId) {
      if (flow.busy) return;
      flow.busy = true;
      setTimeout(() => { flow.busy = false; }, 400);
      sfx('mapStep');
      const data = CB.run.enterNode(flow.run, nodeId);
      if (!data) return;
      save();
      flow.dispatch(data);
    },

    dispatch(data) {
      switch (data.type) {
        case 'combat': case 'elite': case 'boss': flow.startCombat(data); break;
        case 'shop': flow.showShop(data.shop); break;
        case 'rest': flow.showRest(); break;
        case 'event': flow.showEvent(data.eventId); break;
        case 'treasure': flow.showTreasure(data); break;
        default: flow.finishNode();
      }
    },

    async startCombat(data, fromEvent = false) {
      const run = flow.run;
      if (run.current) {
        run.current.stage = 'battle';
        if (fromEvent || (run.current.type === 'event')) run.current.eventCombat = { enemies: data.enemies, kind: data.kind };
      }
      save();
      const result = await CB.ui.battle.start(run, { enemies: data.enemies, kind: data.kind });
      if (result === 'lost') { flow.gameOver(); return; }
      if (run.current) {
        run.current.stage = 'reward';
        run.current.eventCombat = null;
      }
      save();
      flow.showReward(data.kind);
    },

    finishNode() {
      const run = flow.run;
      const res = CB.run.completeNode(run);
      save();
      if (res.victory) { flow.victory(); return; }
      if (res.actComplete) {
        flow.goMap(true);
        CB.ui.toast('막을 돌파했습니다! 체력을 회복했습니다.', 'good');
        return;
      }
      flow.goMap();
    },

    /* ================= 보상 ================= */
    showReward(kind) {
      const run = flow.run;
      const cur = run.current || (run.current = { stage: 'reward', data: { kind } });
      cur.stage = 'reward';
      const rw = CB.run.rewards(run, kind);
      cur.claimed = cur.claimed || {};
      save();
      const root = $('screen-reward');
      root.innerHTML = '';
      const list = el('div', { class: 'reward-list' });
      const panel = el('div', { class: 'reward-panel panel' }, [
        el('h2', { class: 'title-ornament', text: kind === 'boss' ? '보스 격파!' : kind === 'elite' ? '정예 격파!' : '승리!' }),
        el('p', { class: 'reward-sub', text: '전리품을 챙기세요' }),
        list,
      ]);
      const item = (key, icon, label, onTake, extraClass = '') => {
        if (cur.claimed[key]) return;
        const row = el('button', { class: `reward-item ${extraClass}`, html: `<span class="reward-icon">${icon}</span><span class="reward-label">${label}</span>` });
        row.addEventListener('click', () => {
          if (onTake(row) !== false) {
            cur.claimed[key] = true;
            save();
            row.classList.add('taken');
            setTimeout(() => row.remove(), 260);
            CB.ui.hud.render(run);
          }
        });
        list.appendChild(row);
        return row;
      };

      if (rw.gold) {
        item('gold', '💰', `골드 ${rw.gold}`, (row) => {
          CB.run.addGold(run, rw.gold);
          sfx('gold');
          const c = CB.fx.centerOf(row);
          CB.fx.burst(c.x, c.y, 'gold');
        });
      }
      if (rw.potion) {
        const def = CB.data.potions[rw.potion];
        const row = item('potion', `<span class="reward-svg">${CB.art.potion(def.color, def.shape)}</span>`, esc(def.name), () => {
          if (!CB.run.addPotion(run, rw.potion)) { CB.ui.toast('물약 슬롯이 가득 찼습니다.', 'error'); sfx('error'); return false; }
          sfx('potion');
          return true;
        });
        if (row) CB.ui.tooltip.bind(row, () => CB.ui.potionHTML(rw.potion), { side: 'right' });
      }
      if (rw.relic) {
        const def = CB.data.relics[rw.relic];
        const row = item('relic', `<span class="reward-relic">${def.icon}</span>`, `${esc(def.name)} <small>${RARITY_NAMES[def.rarity] || ''} 유물</small>`, () => {
          flow.takeRelic(rw.relic);
        });
        if (row) CB.ui.tooltip.bind(row, () => CB.ui.relicHTML(rw.relic), { side: 'right' });
      }
      if (rw.relicChoices && rw.relicChoices.length) {
        item('bossRelic', '👑', '보스 유물 선택', () => { flow.chooseBossRelic(rw.relicChoices, () => { cur.claimed.bossRelic = true; save(); CB.ui.hud.render(run); refreshRewardButtons(); }); return false; }, 'special');
      }
      if (rw.cards && rw.cards.length) {
        item('card', '🃏', '카드 한 장 추가', () => { flow.chooseCard(rw.cards, () => { cur.claimed.card = true; save(); CB.ui.hud.render(run); refreshRewardButtons(); }); return false; }, 'special');
      }
      const proceed = el('button', { class: 'btn big', text: '계속하기 ➜', onclick: () => { sfx('click'); flow.finishNode(); } });
      panel.appendChild(el('div', { class: 'reward-actions' }, [proceed]));
      root.appendChild(el('div', { class: 'reward-screen' }, [panel]));
      function refreshRewardButtons() {
        if (cur.claimed.card) list.querySelectorAll('.reward-item').forEach((n) => { if (n.textContent.includes('카드 한 장')) n.remove(); });
        if (cur.claimed.bossRelic) list.querySelectorAll('.reward-item').forEach((n) => { if (n.textContent.includes('보스 유물')) n.remove(); });
      }
      CB.ui.showScreen('reward');
      music('map');
    },

    takeRelic(id, done) {
      const run = flow.run;
      const res = CB.run.addRelic(run, id);
      sfx('relic');
      CB.ui.hud.render(run);
      setTimeout(() => CB.ui.hud.flashRelic(id), 50);
      const def = CB.data.relics[id];
      CB.ui.toast(`${def.icon} ${def.name} 획득!`, 'good');
      (res.messages || []).forEach((m) => CB.ui.toast(m));
      save();
      flow.processFollowUps(res.followUps || [], () => { if (done) done(); });
    },

    chooseCard(ids, done) {
      const run = flow.run;
      const grid = el('div', { class: 'card-grid reward-cards' });
      let handle;
      ids.forEach((id, i) => {
        const node = CB.ui.cardFromId(id, false, { size: 'lg', hoverable: true });
        node.style.animationDelay = `${i * 90}ms`;
        node.classList.add('deal-in');
        node.addEventListener('click', () => {
          CB.run.addCard(run, id);
          sfx('select');
          handle.close();
          CB.ui.toast(`🃏 ${CB.data.cards[id].name} 추가!`, 'good');
          done();
        });
        node.addEventListener('mouseenter', () => sfx('hover'));
        grid.appendChild(node);
      });
      handle = CB.ui.modal.open({
        title: '카드 선택', sub: '덱에 추가할 카드를 한 장 고르세요.', el: grid, dismissable: true,
        buttons: [{ label: '건너뛰기', kind: 'secondary', onClick: (h) => { h.close(); done(); } }],
      });
    },

    chooseBossRelic(ids, done) {
      const box = el('div', { class: 'boss-relics' });
      let handle;
      for (const id of ids) {
        const def = CB.data.relics[id];
        const node = el('button', { class: 'boss-relic panel', html: `<div class="br-icon">${def.icon}</div><div class="br-name">${esc(def.name)}</div><div class="br-desc">${esc(def.desc)}</div>` });
        node.addEventListener('click', () => { handle.close(); flow.takeRelic(id, done); });
        box.appendChild(node);
      }
      handle = CB.ui.modal.open({ title: '보스 유물', sub: '강력하지만 대가가 따르는 유물 하나를 고르세요.', el: box, dismissable: true, buttons: [{ label: '건너뛰기', kind: 'secondary', onClick: (h) => { h.close(); done(); } }] });
    },

    /* ================= 후속 처리 (카드 제거/강화/전투) ================= */
    async processFollowUps(list, done) {
      const run = flow.run;
      for (const f of list) {
        if (f.type === 'removeCard') {
          const removable = run.deck;
          if (!removable.length) continue;
          const n = Math.min(f.count, removable.length);
          const picked = await CB.ui.selectCards({ title: '카드 제거', subtitle: `덱에서 제거할 카드 ${n}장을 고르세요.`, cards: removable, min: n, max: n, confirmLabel: '제거' });
          (picked || []).forEach((uid) => CB.run.removeCard(run, uid));
          if (picked && picked.length) { sfx('exhaust'); CB.ui.toast(`카드 ${picked.length}장을 제거했습니다.`); }
        } else if (f.type === 'upgradeCard') {
          for (let i = 0; i < f.count; i++) {
            const upgradable = run.deck.filter((c) => CB.run.canUpgrade(c));
            if (!upgradable.length) break;
            const picked = await CB.ui.selectCards({ title: '카드 강화', subtitle: f.count > 1 ? `${i + 1} / ${f.count}` : '', cards: upgradable, preview: 'upgrade', confirmLabel: '강화' });
            if (picked && picked[0]) { CB.run.upgradeCard(run, picked[0]); sfx('upgrade'); }
          }
        } else if (f.type === 'combat') {
          flow.pendingAfterCombat = done;
          save();
          await flow.startCombat({ enemies: f.enemies, kind: f.kind }, true);
          return; // 보상 화면에서 finishNode 로 이어짐
        }
        save();
        CB.ui.hud.render(run);
      }
      if (done) done();
    },

    /* ================= 상점 ================= */
    showShop(shop) {
      const run = flow.run;
      const root = $('screen-shop');
      root.innerHTML = '';
      music('shop');
      const render = () => {
        root.innerHTML = '';
        const cards = el('div', { class: 'shop-cards' });
        shop.cards.forEach((item, i) => {
          const slot = el('div', { class: `shop-slot${item.sold ? ' sold' : ''}` });
          if (!item.sold) {
            const node = CB.ui.cardFromId(item.id, false, { size: 'md', hoverable: true });
            slot.appendChild(node);
            slot.appendChild(priceTag(item.price));
            node.addEventListener('click', () => buy('cards', i));
          } else slot.appendChild(el('div', { class: 'sold-mark', text: '판매 완료' }));
          cards.appendChild(slot);
        });
        const relics = el('div', { class: 'shop-relics' });
        shop.relics.forEach((item, i) => {
          const def = CB.data.relics[item.id];
          const slot = el('button', { class: `shop-item${item.sold ? ' sold' : ''}`, html: item.sold ? '<div class="sold-mark">판매 완료</div>' : `<div class="shop-relic-icon">${def.icon}</div><div class="shop-item-name">${esc(def.name)}</div>` });
          if (!item.sold) {
            slot.appendChild(priceTag(item.price));
            CB.ui.tooltip.bind(slot, () => CB.ui.relicHTML(item.id));
            slot.addEventListener('click', () => buy('relics', i));
          }
          relics.appendChild(slot);
        });
        const potions = el('div', { class: 'shop-potions' });
        shop.potions.forEach((item, i) => {
          const def = CB.data.potions[item.id];
          const slot = el('button', { class: `shop-item${item.sold ? ' sold' : ''}`, html: item.sold ? '<div class="sold-mark">판매 완료</div>' : `<div class="shop-potion-icon">${CB.art.potion(def.color, def.shape)}</div><div class="shop-item-name">${esc(def.name)}</div>` });
          if (!item.sold) {
            slot.appendChild(priceTag(item.price));
            CB.ui.tooltip.bind(slot, () => CB.ui.potionHTML(item.id));
            slot.addEventListener('click', () => buy('potions', i));
          }
          potions.appendChild(slot);
        });
        const remove = el('button', { class: `shop-item shop-remove${shop.removeUsed ? ' sold' : ''}`, html: shop.removeUsed ? '<div class="sold-mark">사용 완료</div>' : '<div class="shop-relic-icon">✂️</div><div class="shop-item-name">카드 제거</div>' });
        if (!shop.removeUsed) {
          remove.appendChild(priceTag(shop.removeCost));
          CB.ui.tooltip.bind(remove, '<span class="tt-title">카드 제거</span><p>덱에서 카드 1장을 영구히 제거합니다. 사용할 때마다 가격이 오릅니다.</p>');
          remove.addEventListener('click', async () => {
            if (run.player.gold < shop.removeCost) { sfx('error'); CB.ui.toast('골드가 부족합니다.', 'error'); return; }
            const picked = await CB.ui.selectCards({ title: '카드 제거', subtitle: `${shop.removeCost} 골드`, cards: run.deck, cancellable: true, confirmLabel: '제거' });
            if (!picked || !picked[0]) return;
            const res = CB.run.shopRemove(run, shop, picked[0]);
            if (!res.ok) { CB.ui.toast(res.reason, 'error'); return; }
            sfx('shopBuy');
            save();
            CB.ui.hud.render(run);
            render();
          });
        }
        root.appendChild(el('div', { class: 'shop-screen' }, [
          el('div', { class: 'shop-header' }, [
            el('div', { class: 'merchant', html: CB.art.eventScene('stranger') }),
            el('div', { class: 'merchant-talk panel', html: '<b>떠돌이 상인</b><p>"어서 오시오, 원정대 양반. 쓸 만한 물건이 많다오."</p>' }),
          ]),
          el('div', { class: 'shop-section panel' }, [el('h3', { text: '카드' }), cards]),
          el('div', { class: 'shop-row' }, [
            el('div', { class: 'shop-section panel' }, [el('h3', { text: '유물' }), relics]),
            el('div', { class: 'shop-section panel' }, [el('h3', { text: '물약' }), potions]),
            el('div', { class: 'shop-section panel' }, [el('h3', { text: '서비스' }), remove]),
          ]),
          el('div', { class: 'shop-leave' }, [el('button', { class: 'btn big', text: '상점 떠나기 ➜', onclick: () => { sfx('click'); flow.finishNode(); } })]),
        ]));
      };
      const priceTag = (price) => el('div', { class: `price${run.player.gold < price ? ' expensive' : ''}`, html: `💰 ${price}` });
      const buy = (section, i) => {
        const res = CB.run.buy(run, shop, section, i);
        if (!res.ok) { sfx('error'); CB.ui.toast(res.reason, 'error'); return; }
        sfx('shopBuy');
        if (section === 'relics') {
          const id = shop.relics[i].id;
          setTimeout(() => CB.ui.hud.flashRelic(id), 60);
          flow.processFollowUps(res.followUps || [], () => { save(); CB.ui.hud.render(run); render(); });
        }
        save();
        CB.ui.hud.render(run);
        render();
      };
      render();
      CB.ui.showScreen('shop');
    },

    /* ================= 휴식 ================= */
    showRest() {
      const run = flow.run;
      const root = $('screen-rest');
      root.innerHTML = '';
      music('rest');
      const cur = run.current || {};
      const options = el('div', { class: 'rest-options' });
      const done = (msg) => {
        cur.restDone = msg;
        save();
        options.innerHTML = '';
        options.appendChild(el('div', { class: 'rest-result panel', text: msg }));
        options.appendChild(el('button', { class: 'btn big', text: '계속하기 ➜', onclick: () => { sfx('click'); flow.finishNode(); } }));
      };
      for (const opt of CB.run.restOptions(run)) {
        const btn = el('button', { class: 'rest-option panel', html: `<div class="rest-icon">${opt.icon}</div><div class="rest-label">${opt.label}</div><div class="rest-desc">${esc(opt.desc)}</div>` });
        if (opt.disabled) btn.disabled = true;
        btn.addEventListener('click', async () => {
          if (opt.id === 'heal') {
            const healed = CB.run.restHeal(run);
            sfx('heal');
            const c = CB.fx.centerOf($('hud-hp'));
            CB.fx.burst(c.x, c.y + 20, 'heal');
            CB.ui.hud.render(run);
            done(`모닥불 곁에서 푹 쉬었습니다. 체력 +${healed}`);
          } else {
            const picked = await CB.ui.selectCards({ title: '단련', subtitle: '강화할 카드를 고르세요.', cards: run.deck.filter((c) => CB.run.canUpgrade(c)), preview: 'upgrade', cancellable: true, confirmLabel: '강화' });
            if (!picked || !picked[0]) return;
            CB.run.upgradeCard(run, picked[0]);
            sfx('upgrade');
            const inst = run.deck.find((c) => c.uid === picked[0]);
            done(`「${CB.combat.cardDef(inst).name}」 카드를 단련했습니다.`);
          }
        });
        options.appendChild(btn);
      }
      root.appendChild(el('div', { class: 'rest-screen' }, [
        el('h2', { class: 'title-ornament', text: '휴식처' }),
        el('div', { class: 'campfire', html: '<div class="logs"></div><div class="flame f1"></div><div class="flame f2"></div><div class="flame f3"></div><div class="glow"></div>' }),
        el('div', { class: 'rest-hero', html: CB.art.hero() }),
        options,
      ]));
      if (cur.restDone) done(cur.restDone);
      CB.ui.showScreen('rest');
    },

    /* ================= 이벤트 ================= */
    showEvent(eventId) {
      const run = flow.run;
      const ev = CB.data.events[eventId];
      if (!ev) { flow.finishNode(); return; }
      const cur = run.current || {};
      const root = $('screen-event');
      root.innerHTML = '';
      music('event');
      const textBox = el('div', { class: 'event-text', text: ev.text });
      const choices = el('div', { class: 'event-choices' });
      const showOutcome = (outcome) => {
        choices.innerHTML = '';
        textBox.innerHTML = `<p>${esc(outcome.text || '')}</p>${(outcome.messages || []).map((m) => `<div class="event-msg">${esc(m)}</div>`).join('')}`;
        const pending = cur.followUps || [];
        const hasCombat = pending.some((f) => f.type === 'combat');
        const cont = el('button', { class: `btn big${hasCombat ? ' danger' : ''}`, text: hasCombat ? '⚔️ 맞서 싸운다' : '계속하기 ➜' });
        choices.appendChild(cont);
        const runFollow = () => {
          cur.followUps = [];
          save();
          flow.processFollowUps(pending, () => { save(); CB.ui.hud.render(run); });
        };
        cont.addEventListener('click', () => {
          sfx('click');
          if (hasCombat) runFollow();
          else flow.finishNode();
        });
        if (!hasCombat && pending.length) setTimeout(runFollow, 350);
      };
      ev.choices.forEach((choice, i) => {
        const check = CB.run.canChoose(run, eventId, i);
        const btn = el('button', {
          class: 'event-choice',
          html: `<span class="choice-label">${esc(choice.label)}</span><span class="choice-preview">${esc(choice.preview || '')}</span>${check.ok ? '' : `<span class="choice-req">${esc(check.reason)}</span>`}`,
        });
        if (!check.ok) btn.disabled = true;
        btn.addEventListener('click', () => {
          sfx('select');
          const res = CB.run.resolveEvent(run, eventId, i);
          cur.stage = 'eventResolved';
          cur.outcome = { text: res.text, messages: res.messages };
          cur.followUps = res.followUps;
          save();
          CB.ui.hud.render(run);
          showOutcome(cur.outcome);
        });
        btn.addEventListener('mouseenter', () => sfx('hover'));
        choices.appendChild(btn);
      });
      root.appendChild(el('div', { class: 'event-screen' }, [
        el('div', { class: 'event-card panel' }, [
          el('div', { class: 'event-scene', html: CB.art.eventScene(ev.scene) }),
          el('h2', { class: 'event-title title-ornament', text: ev.name }),
          textBox,
          choices,
        ]),
      ]));
      if (cur.stage === 'eventResolved' && cur.outcome) showOutcome(cur.outcome);
      CB.ui.showScreen('event');
    },

    /* ================= 보물 ================= */
    showTreasure(data) {
      const run = flow.run;
      const cur = run.current || {};
      const root = $('screen-treasure');
      root.innerHTML = '';
      music('event');
      const chest = el('button', { class: `chest${cur.opened ? ' open' : ''}`, html: '<div class="chest-glow"></div><div class="chest-lid"></div><div class="chest-body"><div class="chest-lock"></div></div>' });
      const loot = el('div', { class: 'treasure-loot' });
      const showLoot = () => {
        loot.innerHTML = '';
        const def = data.relicId && CB.data.relics[data.relicId];
        if (def) {
          const r = el('div', { class: 'loot-item panel', html: `<span class="reward-relic">${def.icon}</span><span><b>${esc(def.name)}</b><br><small>${esc(def.desc)}</small></span>` });
          loot.appendChild(r);
        }
        loot.appendChild(el('div', { class: 'loot-item panel', html: `<span class="reward-relic">💰</span><span><b>골드 ${data.gold}</b></span>` }));
        loot.appendChild(el('button', { class: 'btn big', text: '계속하기 ➜', onclick: () => { sfx('click'); flow.finishNode(); } }));
      };
      chest.addEventListener('click', () => {
        if (cur.opened) return;
        cur.opened = true;
        chest.classList.add('open');
        root.querySelector('.treasure-hint').textContent = '';
        sfx('relic');
        const c = CB.fx.centerOf(chest);
        CB.fx.burst(c.x, c.y, 'gold');
        CB.fx.burst(c.x, c.y - 30, 'buff');
        CB.run.addGold(run, data.gold);
        if (data.relicId) flow.takeRelic(data.relicId);
        save();
        CB.ui.hud.render(run);
        setTimeout(showLoot, 450);
      });
      root.appendChild(el('div', { class: 'treasure-screen' }, [
        el('h2', { class: 'title-ornament', text: '보물 상자' }),
        el('p', { class: 'treasure-hint', text: cur.opened ? '' : '상자를 눌러 여세요' }),
        chest,
        loot,
      ]));
      if (cur.opened) showLoot();
      CB.ui.showScreen('treasure');
    },

    /* ================= 결과 ================= */
    showEnd(victory) {
      const run = flow.run;
      run.over = true;
      run.victory = victory;
      const entry = CB.save.recordResult(run);
      CB.save.clearRun();
      const root = $('screen-gameover');
      root.innerHTML = '';
      const stats = el('div', { class: 'end-stats' });
      for (const [k, v] of CB.run.summary(run)) stats.appendChild(el('div', { class: 'end-stat', html: `<span>${k}</span><b>${esc(v)}</b>` }));
      const history = CB.save.getHistory();
      const hist = el('ol', { class: 'end-history' });
      history.slice(0, 5).forEach((h) => {
        const me = h.date === entry.date && h.score === entry.score && h.seed === entry.seed;
        hist.appendChild(el('li', { class: me ? 'me' : '', html: `<b>${h.score}</b>점 · ${h.victory ? '🏆 정복' : `${h.act}막 ${h.floor}층`} · <small>${h.date}</small>` }));
      });
      root.appendChild(el('div', { class: `end-screen ${victory ? 'victory' : 'defeat'}` }, [
        el('div', { class: 'end-art', html: victory ? CB.art.hero() : CB.art.enemy(lastKiller() || 'shade') }),
        el('div', { class: 'end-panel panel' }, [
          el('h1', { class: 'end-title', text: victory ? '원정 성공!' : '원정 실패' }),
          el('p', { class: 'end-sub', text: victory ? '태고의 용을 쓰러뜨리고 심연의 끝에 닿았습니다.' : '당신의 여정은 여기서 끝났습니다. 하지만 원정대의 이야기는 계속됩니다.' }),
          el('div', { class: 'end-score', html: `점수 <b>${entry.score}</b>` }),
          stats,
          el('h3', { text: '최고 기록' }),
          hist,
          el('div', { class: 'end-buttons' }, [
            el('button', { class: 'btn big', text: '다시 도전', onclick: () => { sfx('click'); flow.run = null; flow.newGame(); } }),
            el('button', { class: 'btn secondary', text: '타이틀로', onclick: () => { sfx('click'); flow.showTitle(); } }),
          ]),
        ]),
      ]));
      CB.ui.showScreen('gameover');
      music(victory ? 'victory' : 'defeat');
      function lastKiller() {
        const cur = run.current && run.current.data;
        return cur && cur.enemies ? cur.enemies[0] : null;
      }
    },
    gameOver() { flow.showEnd(false); },
    victory() { flow.showEnd(true); },

    /* ================= 설정/도움말/기록 ================= */
    applySettings(s) {
      if (CB.audio) {
        CB.audio.setVolume({ master: s.master, sfx: s.sfx, music: s.music });
        CB.audio.setMuted(s.muted);
      }
      if (CB.fx) CB.fx.setOptions({ shake: s.shake, speed: s.fast ? 2 : 1 });
      const mute = $('hud-mute');
      if (mute) mute.textContent = s.muted ? '🔇' : '🔊';
    },

    openSettings() {
      const s = CB.save.loadSettings();
      const box = el('div', { class: 'settings' });
      const commit = () => { CB.save.saveSettings(s); flow.applySettings(s); };
      const slider = (key, label) => {
        const input = el('input', { type: 'range', min: '0', max: '100', value: String(Math.round(s[key] * 100)) });
        input.addEventListener('input', () => { s[key] = Number(input.value) / 100; commit(); });
        input.addEventListener('change', () => sfx('click'));
        box.appendChild(el('div', { class: 'settings-row' }, [el('label', { text: label }), input]));
      };
      const toggle = (key, label) => {
        const t = el('button', { class: `toggle${s[key] ? ' on' : ''}`, 'aria-label': label });
        t.addEventListener('click', () => { s[key] = !s[key]; t.classList.toggle('on', s[key]); commit(); sfx('click'); });
        box.appendChild(el('div', { class: 'settings-row' }, [el('label', { text: label }), t]));
      };
      slider('master', '전체 음량');
      slider('sfx', '효과음');
      slider('music', '배경음악');
      toggle('muted', '음소거');
      toggle('shake', '화면 흔들림');
      toggle('fast', '빠른 연출');
      const buttons = [{ label: '닫기', kind: 'secondary' }];
      if (flow.run && CB.ui.currentScreen !== 'title') {
        buttons.unshift({
          label: '저장하고 타이틀로', onClick: (h) => {
            h.close();
            if (CB.ui.battle && CB.ui.battle.isActive()) CB.ui.battle.abort();
            save();
            flow.showTitle();
          },
        });
      }
      CB.ui.modal.open({ title: '설정', el: box, dismissable: true, className: 'small', buttons });
    },

    openHelp() {
      const kws = Object.entries(CB.data.keywords).map(([, k]) => `<div class="glossary-item"><b>${k.icon} ${k.name}</b><span>${esc(k.desc.replace(/\s*\(\{value\}턴\)/g, '').replace(/\{value\}/g, 'X'))}</span></div>`).join('');
      CB.ui.modal.open({
        title: '도움말',
        dismissable: true,
        html: `
          <div class="help">
            <h3>목표</h3>
            <p>세 개의 막을 지나 마지막 보스 <b>태고의 용</b>을 쓰러뜨리세요. 체력이 0이 되면 원정은 끝납니다.</p>
            <h3>지도</h3>
            <p>아래에서 위로 길을 골라 나아갑니다. 전투 ⚔️, 정예 😈, 미지의 장소 ❓, 휴식처 🔥, 상점 💰, 보물 상자 🎁가 있습니다.</p>
            <h3>전투</h3>
            <p>매 턴 에너지 3을 얻고 카드 5장을 뽑습니다. 카드를 <b>위로 끌어 올리거나</b> 클릭해서 사용하세요. 공격 카드는 적에게 끌어다 놓으면 대상을 고를 수 있습니다.
            적의 머리 위 아이콘은 <b>다음 행동</b>입니다. 공격이 예고되면 방어도로 대비하세요. 턴이 끝나면 남은 손패는 버려집니다.</p>
            <h3>단축키</h3>
            <p><b>1~9</b> 카드 선택 · <b>←/→</b> 대상 변경 · <b>Enter</b> 사용 · <b>E</b> 턴 종료 · <b>Esc</b> 취소</p>
            <h3>성장</h3>
            <p>승리하면 골드와 카드 보상을 얻습니다. 휴식처에서 카드를 <b>강화</b>하고, 상점에서 카드를 <b>제거</b>해 덱을 날카롭게 다듬으세요. 유물은 영구적인 효과를, 물약은 한 번 쓰는 강력한 효과를 줍니다.</p>
            <h3>용어</h3>
            <div class="glossary">${kws}</div>
          </div>`,
        buttons: [{ label: '닫기', kind: 'secondary' }],
      });
    },

    openHistory() {
      const list = CB.save.getHistory();
      const html = list.length
        ? `<ol class="end-history big">${list.map((h) => `<li><b>${h.score}</b>점 · ${h.victory ? '🏆 정복' : `${h.act}막 ${h.floor}층`} · 처치 ${h.kills} · <small>${h.date}</small></li>`).join('')}</ol>`
        : '<p style="text-align:center;color:var(--muted)">아직 기록이 없습니다. 첫 원정을 떠나 보세요!</p>';
      CB.ui.modal.open({ title: '기록', html, dismissable: true, className: 'small', buttons: [{ label: '닫기', kind: 'secondary' }] });
    },
  };

  CB.ui.flow = flow;
})();

</script>
  <script>/* js/ui/battle.js */
'use strict';

/* =========================================================
 * 전투 화면 — 엔진 이벤트를 받아 연출하고, 카드 드래그/클릭/키보드 입력을 처리합니다.
 * ========================================================= */
CB.ui.battle = (() => {
  const C = CB.combat;
  const U = CB.util;
  const el = U.el;
  const $ = (id) => document.getElementById(id);
  const sfx = (n) => CB.audio && CB.audio.play(n);
  const fx = () => CB.fx;
  const wait = (ms) => (CB.fx ? CB.fx.wait(ms) : U.sleep(ms));

  let battle = null;
  let run = null;
  let active = false;
  let locked = true;
  let resolveBattle = null;
  const dom = {};
  let unitEls = {};
  let disp = {};
  let shownHand = [];
  const cardEls = new Map();
  let piles = { draw: 0, discard: 0, exhaust: 0 };
  let hoverIndex = null;
  let selected = null; // { uid }
  let targeting = null; // { kind: 'card'|'potion', uid?, slot? }
  let aimUid = null; // 키보드로 고른 대상
  let drag = null;
  let pending = null; // 방금 낸 카드의 날아가는 요소
  let pointer = { x: 0, y: 0 };
  let lastHoverSfx = 0;

  /* ---------------- 생성 ---------------- */
  function build() {
    const root = $('screen-battle');
    root.innerHTML = '';
    dom.turn = el('div', { class: 'battle-turn' });
    dom.hero = el('div', { class: 'side hero-side' });
    dom.enemies = el('div', { class: 'side enemy-side' });
    dom.field = el('div', { class: 'battlefield' }, [dom.hero, dom.enemies]);
    dom.energy = el('div', { class: 'energy-orb', html: '<div class="energy-core"></div><span class="energy-value">3/3</span>' });
    dom.energyValue = dom.energy.querySelector('.energy-value');
    CB.ui.tooltip.bind(dom.energy, '<span class="tt-title">⚡ 에너지</span><p>카드를 낼 때 소모합니다. 매 턴 다시 채워집니다.</p>');
    dom.draw = pileButton('draw', '뽑을 카드', '🂠');
    dom.discard = pileButton('discard', '버린 카드', '🗑️');
    dom.exhaust = pileButton('exhaust', '소멸', '🔥');
    dom.hand = el('div', { class: 'hand' });
    dom.endTurn = el('button', { class: 'end-turn', html: '<span>턴 종료</span><small>E</small>' });
    dom.endTurn.addEventListener('click', () => endTurn());
    dom.playZone = el('div', { class: 'play-zone', text: '여기에 놓아 사용' });
    dom.bottom = el('div', { class: 'battle-bottom' }, [
      el('div', { class: 'bottom-left' }, [dom.energy, dom.draw]),
      dom.hand,
      el('div', { class: 'bottom-right' }, [dom.endTurn, el('div', { class: 'pile-row' }, [dom.discard, dom.exhaust])]),
    ]);
    const svgNS = 'http://www.w3.org/2000/svg';
    dom.arrow = document.createElementNS(svgNS, 'svg');
    dom.arrow.setAttribute('class', 'target-arrow hidden');
    dom.arrow.innerHTML = `
      <defs><marker id="arrow-head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
      <path class="arrow-path" d="" marker-end="url(#arrow-head)"/>`;
    dom.arrowPath = dom.arrow.querySelector('.arrow-path');
    dom.root = el('div', { class: 'battle' }, [dom.turn, dom.field, dom.playZone, dom.bottom]);
    root.appendChild(dom.root);
    document.body.appendChild(dom.arrow);
    dom.field.addEventListener('click', (e) => {
      if (e.target.closest('.unit')) return;
      onFieldClick();
    });
    resize();
  }

  function pileButton(kind, label, icon) {
    const b = el('button', { class: `pile pile-${kind}`, html: `<span class="pile-icon">${icon}</span><span class="pile-count">0</span>` });
    CB.ui.tooltip.bind(b, `<span class="tt-title">${label} 더미</span><p>클릭해서 확인합니다.</p>`);
    b.addEventListener('click', () => {
      if (!battle) return;
      sfx('click');
      if (kind === 'draw') {
        const sorted = battle.drawPile.slice().sort((a, b2) => C.cardDef(a).name.localeCompare(C.cardDef(b2).name, 'ko'));
        CB.ui.viewPile('뽑을 카드 더미 (순서 무작위)', sorted, battle);
      } else if (kind === 'discard') CB.ui.viewPile('버린 카드 더미', battle.discardPile, battle);
      else CB.ui.viewPile('소멸한 카드', battle.exhaustPile, battle);
    });
    return b;
  }

  function makeUnitEl(unit) {
    const isPlayer = unit.side === 'player';
    const root = el('div', { class: `unit ${isPlayer ? 'unit-player' : 'unit-enemy'} size-${unit.size} rank-${unit.rank}`, dataset: { uid: unit.uid } });
    const intent = isPlayer ? null : el('div', { class: 'intent' });
    const art = el('div', { class: 'unit-art', html: isPlayer ? CB.art.hero() : CB.art.enemy(unit.art) });
    const hpFill = el('div', { class: 'hp-fill' });
    const hpGhost = el('div', { class: 'hp-ghost' });
    const hpText = el('div', { class: 'hp-text' });
    const blockBadge = el('div', { class: 'block-badge hidden', html: '<span>0</span>' });
    const bar = el('div', { class: 'hp-bar' }, [hpGhost, hpFill, hpText]);
    const bars = el('div', { class: 'unit-bars' }, [blockBadge, bar]);
    const name = el('div', { class: 'unit-name', html: `${U.escapeHtml(unit.name)}${unit.rank === 'boss' ? ' <span class="tag boss">보스</span>' : unit.rank === 'elite' ? ' <span class="tag elite">정예</span>' : ''}` });
    const statuses = el('div', { class: 'statuses' });
    if (intent) root.appendChild(intent);
    root.append(art, bars, name, statuses);
    if (!isPlayer) {
      root.addEventListener('click', (e) => { e.stopPropagation(); onUnitClick(unit.uid); });
      root.addEventListener('mouseenter', () => { if (targeting || drag) setHoverTarget(unit.uid); });
      root.addEventListener('mouseleave', () => { if (aimUid === unit.uid && !targeting) setHoverTarget(null); });
      CB.ui.tooltip.bind(intent, () => {
        const iv = C.intentView(battle, unit.uid);
        return iv ? `<span class="tt-title">${U.escapeHtml(iv.moveName)}</span><p>${U.escapeHtml(iv.text)}</p>` : '';
      });
    }
    const refs = { root, intent, art, hpFill, hpGhost, hpText, blockBadge, statuses, name };
    unitEls[unit.uid] = refs;
    return refs;
  }

  /* ---------------- 렌더링 ---------------- */
  const unitOf = (uid) => C.getUnit(battle, uid);

  function renderBars(uid) {
    const u = unitOf(uid);
    const r = unitEls[uid];
    if (!u || !r) return;
    const d = disp[uid] || { hp: u.hp, block: u.block };
    const pct = Math.max(0, Math.min(100, (d.hp / u.maxHp) * 100));
    r.hpFill.style.width = `${pct}%`;
    r.hpGhost.style.width = `${pct}%`;
    r.hpText.textContent = `${d.hp}/${u.maxHp}`;
    r.root.classList.toggle('has-block', d.block > 0);
    r.blockBadge.classList.toggle('hidden', d.block <= 0);
    r.blockBadge.querySelector('span').textContent = d.block;
  }

  function renderStatuses(uid, popId) {
    const u = unitOf(uid);
    const r = unitEls[uid];
    if (!u || !r) return;
    r.statuses.innerHTML = '';
    for (const s of C.statusList(u)) {
      const node = el('div', { class: `status ${s.kind}${s.id === popId ? ' pop' : ''}`, html: `<span class="s-icon">${s.icon}</span><span class="s-val">${s.id === 'fortress' ? '' : s.value}</span>` });
      CB.ui.tooltip.bind(node, `<span class="tt-title">${s.icon} ${s.name}</span><p>${U.escapeHtml(s.desc)}</p>`);
      r.statuses.appendChild(node);
    }
  }

  function renderIntent(uid) {
    const r = unitEls[uid];
    const u = unitOf(uid);
    if (!r || !r.intent || !u) return;
    if (!u.alive || battle.phase === 'won') { r.intent.innerHTML = ''; return; }
    const iv = C.intentView(battle, uid);
    if (!iv) { r.intent.innerHTML = ''; return; }
    const icons = iv.kinds.slice(0, 2).map((k) => `<span class="intent-icon-wrap k-${k}">${CB.art.intent(k)}</span>`).join('');
    const num = iv.damage != null ? `<span class="intent-num">${iv.damage}${iv.times > 1 ? `<small>×${iv.times}</small>` : ''}</span>` : '';
    r.intent.innerHTML = `${icons}${num}`;
    r.intent.classList.toggle('danger', iv.damage != null && iv.damage * Math.max(1, iv.times) >= 15);
  }

  function renderUnits() {
    if (!unitEls.player) dom.hero.appendChild(makeUnitEl(battle.player).root);
    for (const e of battle.enemies) {
      if (!unitEls[e.uid]) dom.enemies.appendChild(makeUnitEl(e).root);
      unitEls[e.uid].root.classList.toggle('dead', !e.alive && !unitEls[e.uid].root.classList.contains('dying'));
    }
    for (const uid of Object.keys(unitEls)) {
      renderBars(uid);
      renderStatuses(uid);
      renderIntent(uid);
    }
    dom.enemies.dataset.count = String(C.livingEnemies(battle).length);
  }

  function renderPiles() {
    dom.draw.querySelector('.pile-count').textContent = piles.draw;
    dom.discard.querySelector('.pile-count').textContent = piles.discard;
    dom.exhaust.querySelector('.pile-count').textContent = piles.exhaust;
    dom.exhaust.classList.toggle('empty', piles.exhaust === 0);
  }

  function renderEnergy(pulse) {
    dom.energyValue.textContent = `${battle.energy}/${battle.maxEnergy}`;
    dom.energy.classList.toggle('empty', battle.energy <= 0);
    if (pulse) {
      dom.energy.classList.remove('pulse');
      void dom.energy.offsetWidth;
      dom.energy.classList.add('pulse');
    }
  }

  function renderControls() {
    const canAct = active && !locked && battle.phase === 'player';
    dom.endTurn.disabled = !canAct;
    const anyPlayable = battle.hand.some((c, i) => C.canPlay(battle, i).ok);
    dom.endTurn.classList.toggle('glow', canAct && !anyPlayable);
    dom.turn.textContent = `${battle.turn}턴`;
    dom.root.classList.toggle('locked', !canAct);
  }

  /* ---------------- 손패 ---------------- */
  function cardSize() {
    if (window.innerWidth <= 520) return 'xs';
    return window.innerWidth < 760 || window.innerHeight < 700 ? 'sm' : 'md';
  }

  function findInst(uid) {
    return battle.hand.find((c) => c.uid === uid)
      || battle.drawPile.find((c) => c.uid === uid)
      || battle.discardPile.find((c) => c.uid === uid)
      || battle.exhaustPile.find((c) => c.uid === uid)
      || battle.powersPlayed.find((c) => c.uid === uid);
  }

  function ensureCardEl(inst) {
    const view = C.cardView(inst, battle);
    const fresh = CB.ui.renderCard(view, { size: cardSize(), tooltip: false });
    let node = cardEls.get(inst.uid);
    if (node) {
      node.className = `${fresh.className} hand-card`;
      node.innerHTML = fresh.innerHTML;
    } else {
      node = fresh;
      node.classList.add('hand-card');
      node.addEventListener('pointerdown', (e) => onCardPointerDown(e, inst.uid));
      node.addEventListener('pointerenter', () => onCardHover(inst.uid, true));
      node.addEventListener('pointerleave', () => onCardHover(inst.uid, false));
      node.addEventListener('contextmenu', (e) => { e.preventDefault(); cancelAll(); });
      CB.ui.tooltip.bind(node, () => {
        const i = battle.hand.findIndex((c) => c.uid === inst.uid);
        const v = i >= 0 ? C.cardView(battle.hand[i], battle) : view;
        return CB.ui.keywordHTML(v.keywords);
      }, { side: 'top', delay: 300 });
      dom.hand.appendChild(node);
      cardEls.set(inst.uid, node);
    }
    if (selected && selected.uid === inst.uid) node.classList.add('selected');
    return node;
  }

  function renderHand() {
    for (const [uid, node] of cardEls) {
      if (!shownHand.includes(uid)) { node.remove(); cardEls.delete(uid); }
    }
    for (const uid of shownHand) {
      const inst = findInst(uid);
      if (inst) ensureCardEl(inst);
    }
    layoutHand();
  }

  function layoutHand() {
    const n = shownHand.length;
    if (!n) return;
    const handW = dom.hand.clientWidth || 600;
    const sample = cardEls.get(shownHand[0]);
    const cardW = sample ? sample.offsetWidth : 150;
    const spread = n > 1 ? Math.min(cardW * 0.86, (handW - cardW) / (n - 1)) : 0;
    const mid = (n - 1) / 2;
    shownHand.forEach((uid, i) => {
      const node = cardEls.get(uid);
      if (!node || node === (drag && drag.node && drag.active ? drag.node : null)) return;
      const off = i - mid;
      let x = off * spread;
      let y = off * off * (n > 6 ? 1.6 : 2.6);
      let rot = off * Math.min(4.5, 24 / n);
      let scale = 1;
      let z = i + 1;
      const isSel = selected && selected.uid === uid;
      if (isSel) { y = -70; rot = 0; scale = 1.12; z = 200; }
      else if (hoverIndex !== null && !selected) {
        if (i === hoverIndex) { y = -54; rot = 0; scale = 1.16; z = 200; }
        else x += (i < hoverIndex ? -1 : 1) * Math.min(34, cardW * 0.22);
      }
      node.style.marginLeft = `${-cardW / 2}px`;
      node.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${scale})`;
      node.style.zIndex = String(z);
    });
  }

  function onCardHover(uid, on) {
    if (drag && drag.active) return;
    const i = shownHand.indexOf(uid);
    hoverIndex = on ? i : (hoverIndex === i ? null : hoverIndex);
    if (on && !locked && performance.now() - lastHoverSfx > 60) { sfx('hover'); lastHoverSfx = performance.now(); }
    layoutHand();
  }

  /* 카드를 화면 위 고정 레이어로 떼어 내어 날립니다. */
  function detachCard(uid) {
    const node = cardEls.get(uid);
    if (!node) return null;
    cardEls.delete(uid);
    const r = node.getBoundingClientRect();
    const w = node.offsetWidth;
    const h = node.offsetHeight;
    node.classList.add('flying-card');
    node.classList.remove('selected');
    document.body.appendChild(node);
    node.style.transition = 'none';
    node.style.marginLeft = '0';
    node.style.left = '0px';
    node.style.top = '0px';
    node.style.zIndex = '950';
    node._w = w;
    node._h = h;
    placeFlying(node, r.left + r.width / 2, r.top + r.height / 2, 1, 0);
    void node.offsetWidth;
    return node;
  }

  function placeFlying(node, x, y, scale, rot = 0) {
    node.style.transform = `translate(${(x - node._w / 2).toFixed(1)}px, ${(y - node._h / 2).toFixed(1)}px) rotate(${rot}deg) scale(${scale})`;
  }

  function flyTo(node, x, y, scale, ms, opacity = 1, rot = 0) {
    node.style.transition = `transform ${ms / fx().speed()}ms cubic-bezier(.3,.7,.3,1), opacity ${ms / fx().speed()}ms ease`;
    placeFlying(node, x, y, scale, rot);
    node.style.opacity = String(opacity);
  }

  function pileCenter(kind) {
    return fx().centerOf({ draw: dom.draw, discard: dom.discard, exhaust: dom.exhaust }[kind]);
  }

  async function animateCardAway(node, mode) {
    if (!node) return;
    if (mode === 'exhaust') {
      node.classList.add('burning');
      const c = fx().centerOf(node);
      fx().burst(c.x, c.y, 'fire');
      sfx('exhaust');
      setTimeout(() => node.remove(), 600 / fx().speed());
    } else if (mode === 'power') {
      const r = node.getBoundingClientRect();
      flyTo(node, r.left + r.width / 2, r.top - 60, 1.15, 380, 0);
      fx().burst(r.left + r.width / 2, r.top + r.height / 2, 'magic');
      sfx('buff');
      setTimeout(() => node.remove(), 420 / fx().speed());
    } else {
      const p = pileCenter('discard');
      flyTo(node, p.x, p.y, 0.18, 320, 0.3, 40);
      setTimeout(() => node.remove(), 340 / fx().speed());
    }
  }

  /* ---------------- 동기화 ---------------- */
  function syncAll() {
    if (!battle) return;
    disp = {};
    for (const u of [battle.player, ...battle.enemies]) disp[u.uid] = { hp: u.hp, block: u.block };
    shownHand = battle.hand.map((c) => c.uid);
    piles = { draw: battle.drawPile.length, discard: battle.discardPile.length, exhaust: battle.exhaustPile.length };
    renderUnits();
    renderHand();
    renderPiles();
    renderEnergy();
    renderControls();
    CB.ui.hud.render(run);
  }

  /* ---------------- 이벤트 연출 ---------------- */
  async function playEvents(events) {
    for (const ev of events) {
      if (!active) return;
      try {
        await animateEvent(ev);
      } catch (e) {
        console.warn('연출 오류', ev, e);
      }
    }
    syncAll();
  }

  function unitCenter(uid) {
    const r = unitEls[uid];
    if (!r) return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    return fx().centerOf(r.art);
  }

  function lunge(uid) {
    const r = unitEls[uid];
    if (!r) return;
    const cls = uid === 'player' ? 'lunge-right' : 'lunge-left';
    r.root.classList.remove(cls);
    void r.root.offsetWidth;
    r.root.classList.add(cls);
    setTimeout(() => r.root.classList.remove(cls), 420);
  }

  function hitReact(uid) {
    const r = unitEls[uid];
    if (!r) return;
    r.root.classList.remove('hit');
    void r.root.offsetWidth;
    r.root.classList.add('hit');
    fx().flash(r.art, '#ff5a4a');
  }

  async function animateEvent(ev) {
    const F = fx();
    switch (ev.type) {
      case 'turnStart':
        if (ev.side === 'player') {
          sfx('turnStart');
          renderControls();
          F.banner('내 턴', { kind: 'player', sub: `${ev.turn}턴`, duration: 900 });
          await wait(420);
        } else {
          F.banner('적의 턴', { kind: 'enemy', duration: 900 });
          await wait(520);
        }
        return;
      case 'draw': {
        const inst = findInst(ev.cardUid);
        if (!inst) return;
        shownHand.push(ev.cardUid);
        piles.draw = Math.max(0, piles.draw - 1);
        renderPiles();
        const node = ensureCardEl(inst);
        const handR = dom.hand.getBoundingClientRect();
        const p = pileCenter('draw');
        const nx = handR.left + handR.width / 2;
        const ny = handR.bottom - node.offsetHeight / 2;
        node.style.transition = 'none';
        node.style.transform = `translate(${p.x - nx}px, ${p.y - ny}px) rotate(-25deg) scale(.25)`;
        node.style.opacity = '0';
        void node.offsetWidth;
        node.style.transition = '';
        node.style.opacity = '1';
        layoutHand();
        sfx('cardDraw');
        await wait(85);
        return;
      }
      case 'shuffle': {
        sfx('shuffle');
        piles.draw = ev.count;
        piles.discard = 0;
        renderPiles();
        const p = pileCenter('draw');
        F.floatText(p.x, p.y - 40, '덱 섞기', 'info');
        await wait(260);
        return;
      }
      case 'cardPlayed':
        if (ev.cardType === 'attack') lunge('player');
        return;
      case 'discard':
      case 'exhaust':
      case 'powerPlayed': {
        const kind = ev.type === 'discard' ? 'discard' : ev.type === 'exhaust' ? 'exhaust' : 'power';
        if (pending && pending.uid === ev.cardUid) {
          const node = pending.node;
          pending = null;
          await animateCardAway(node, kind);
        } else if (shownHand.includes(ev.cardUid)) {
          shownHand = shownHand.filter((u) => u !== ev.cardUid);
          const node = detachCard(ev.cardUid);
          layoutHand();
          animateCardAway(node, kind);
          await wait(45);
        }
        if (kind === 'discard') piles.discard += 1;
        if (kind === 'exhaust') piles.exhaust += 1;
        renderPiles();
        return;
      }
      case 'cardAdded': {
        const def = CB.data.cards[ev.cardId];
        const where = ev.to === 'hand' ? null : ev.to === 'drawPile' ? 'draw' : 'discard';
        if (ev.to === 'hand') {
          shownHand.push(ev.cardUid);
          renderHand();
        } else {
          piles[where] += 1;
          renderPiles();
          const p = pileCenter(where);
          F.floatText(p.x, p.y - 46, `+${def ? def.name : '카드'}`, 'debuff');
        }
        sfx('debuff');
        await wait(220);
        return;
      }
      case 'cardTrigger': {
        const node = cardEls.get(ev.cardUid);
        if (node) {
          node.classList.add('triggered');
          setTimeout(() => node.classList.remove('triggered'), 500);
        }
        await wait(200);
        return;
      }
      case 'energy':
        battle && renderEnergy(true);
        if (ev.delta > 0) sfx('energy');
        return;
      case 'damage': {
        const tgt = ev.targetUid;
        const c = unitCenter(tgt);
        const before = disp[tgt] ? disp[tgt].block : 0;
        if (ev.sourceUid !== 'player' && unitEls[ev.sourceUid]) {
          lunge(ev.sourceUid);
          sfx('enemyAttack');
          await wait(140);
        } else if (ev.isAttack) {
          sfx(ev.heavy ? 'heavyAttack' : 'attack');
          F.slash(c.x, c.y, { heavy: ev.heavy, angle: -0.7 + Math.random() * 0.4 });
        } else {
          sfx('attack');
          F.burst(c.x, c.y, 'fire');
        }
        disp[tgt] = { hp: ev.hp, block: ev.block };
        renderBars(tgt);
        if (ev.blocked > 0) {
          if (ev.hpLoss === 0) {
            sfx('blockHit');
            F.floatText(c.x, c.y - 30, '막음', 'block');
          }
          F.burst(c.x, c.y, before > 0 && ev.block === 0 ? 'shatter' : 'block');
        }
        if (ev.hpLoss > 0) {
          F.floatText(c.x, c.y - 24, `-${ev.hpLoss}`, ev.heavy ? 'crit' : 'damage');
          F.burst(c.x, c.y, ev.heavy ? 'crit' : 'hit');
          hitReact(tgt);
          if (tgt === 'player') F.shake(Math.min(2.6, 0.7 + ev.hpLoss / 9));
          else F.shake(ev.heavy ? 1.3 : 0.45);
        }
        await wait(ev.sourceUid === 'player' ? 170 : 300);
        return;
      }
      case 'block': {
        const tgt = ev.targetUid;
        disp[tgt] = { hp: disp[tgt] ? disp[tgt].hp : unitOf(tgt).hp, block: ev.block };
        renderBars(tgt);
        if (ev.reset || ev.amount <= 0) return;
        const c = unitCenter(tgt);
        sfx('block');
        F.burst(c.x, c.y, 'block');
        F.floatText(c.x, c.y - 10, `+${ev.amount}`, 'block');
        const r = unitEls[tgt];
        if (r) { r.blockBadge.classList.remove('gain'); void r.blockBadge.offsetWidth; r.blockBadge.classList.add('gain'); }
        await wait(140);
        return;
      }
      case 'heal': {
        const tgt = ev.targetUid;
        disp[tgt] = { hp: ev.hp, block: disp[tgt] ? disp[tgt].block : 0 };
        renderBars(tgt);
        const c = unitCenter(tgt);
        sfx('heal');
        F.burst(c.x, c.y, 'heal');
        F.floatText(c.x, c.y - 20, `+${ev.amount}`, 'heal');
        await wait(170);
        return;
      }
      case 'hpLoss': {
        const tgt = ev.targetUid;
        disp[tgt] = { hp: ev.hp, block: disp[tgt] ? disp[tgt].block : 0 };
        renderBars(tgt);
        const c = unitCenter(tgt);
        if (ev.reason === 'poison') { sfx('poison'); F.burst(c.x, c.y, 'poison'); F.floatText(c.x, c.y - 20, `-${ev.amount}`, 'poison'); }
        else if (ev.reason === 'thorns') { sfx('attack'); F.burst(c.x, c.y, 'hit', { count: 8 }); F.floatText(c.x, c.y - 20, `-${ev.amount}`, 'damage'); }
        else { sfx('debuff'); F.floatText(c.x, c.y - 20, `-${ev.amount}`, 'damage'); }
        hitReact(tgt);
        if (tgt === 'player') F.shake(0.6);
        await wait(220);
        return;
      }
      case 'status': {
        const tgt = ev.targetUid;
        renderStatuses(tgt, ev.status);
        const k = CB.data.keywords[ev.status];
        const c = unitCenter(tgt);
        if (ev.negated) {
          F.floatText(c.x, c.y - 50, '무효!', 'info');
          F.burst(c.x, c.y, 'magic');
          sfx('block');
          await wait(220);
          return;
        }
        if (ev.delta > 0 && k) {
          const isDebuff = k.kind === 'debuff';
          F.floatText(c.x + (Math.random() - 0.5) * 40, c.y - 56, `${k.name} ${ev.status === 'fortress' ? '' : `+${ev.delta}`}`.trim(), isDebuff ? 'debuff' : 'buff');
          F.burst(c.x, c.y, isDebuff ? 'debuff' : 'buff');
          sfx(isDebuff ? 'debuff' : 'buff');
          await wait(180);
        } else if (ev.delta < 0 && (ev.status === 'strength' || ev.status === 'dexterity') && k) {
          F.floatText(c.x, c.y - 56, `${k.name} ${ev.delta}`, 'debuff');
          sfx('debuff');
          await wait(160);
        }
        return;
      }
      case 'enemyAct': {
        const r = unitEls[ev.uid];
        if (!r) return;
        r.root.classList.add('acting');
        setTimeout(() => r.root.classList.remove('acting'), 700);
        const c = fx().centerOf(r.art);
        F.floatText(c.x, c.y - 90, ev.moveName, 'info');
        await wait(260);
        return;
      }
      case 'intent':
        renderIntent(ev.uid);
        return;
      case 'summon': {
        const u = unitOf(ev.uid);
        if (!u) return;
        disp[u.uid] = { hp: u.hp, block: u.block };
        const r = makeUnitEl(u);
        r.root.classList.add('summoning');
        dom.enemies.appendChild(r.root);
        renderBars(u.uid);
        renderStatuses(u.uid);
        renderIntent(u.uid);
        dom.enemies.dataset.count = String(C.livingEnemies(battle).length);
        resize();
        await wait(60);
        const c = unitCenter(u.uid);
        F.burst(c.x, c.y, 'magic');
        sfx('buff');
        await wait(320);
        return;
      }
      case 'phaseShift': {
        F.screenFlash('rgba(255,40,30,.35)');
        F.shake(2.2);
        sfx('bossRoar');
        const r = unitEls[ev.uid];
        if (r) r.root.classList.add('enraged');
        await F.banner(ev.text, { kind: 'boss', duration: 1700 });
        return;
      }
      case 'death': {
        const r = unitEls[ev.uid];
        if (!r) return;
        const c = fx().centerOf(r.art);
        r.root.classList.add('dying');
        if (r.intent) r.intent.innerHTML = '';
        F.burst(c.x, c.y, 'death');
        sfx('death');
        setTimeout(() => { r.root.classList.add('dead'); resize(); }, 700 / F.speed());
        await wait(380);
        return;
      }
      case 'relic':
        CB.ui.hud.flashRelic(ev.relicId);
        sfx('select');
        await wait(150);
        return;
      case 'potion':
        sfx('potion');
        CB.ui.hud.render(run);
        await wait(160);
        return;
      case 'gold': {
        sfx('gold');
        const c = fx().centerOf($('hud-gold'));
        F.floatText(c.x, c.y + 30, `+${ev.amount}`, 'gold');
        CB.ui.hud.render(run);
        return;
      }
      case 'upgradeHand': {
        sfx('upgrade');
        renderHand();
        const c = fx().centerOf(dom.hand);
        F.burst(c.x, c.y, 'buff');
        await wait(240);
        return;
      }
      case 'error':
        CB.ui.toast(ev.text, 'error');
        sfx('error');
        return;
      default:
    }
  }

  /* ---------------- 행동 ---------------- */
  async function afterAction() {
    if (!active) return;
    if (C.result(battle)) {
      await endBattle();
      return;
    }
    locked = false;
    syncAll();
  }

  async function playCard(uid, targetUid) {
    if (locked || !active) return;
    const index = battle.hand.findIndex((c) => c.uid === uid);
    if (index < 0) return;
    const check = C.canPlay(battle, index);
    if (!check.ok) { rejectCard(uid, check.reason); return; }
    const def = C.cardDef(battle.hand[index]);
    if (def.target === 'enemy' && !targetUid) {
      const living = C.livingEnemies(battle);
      if (living.length === 1) targetUid = living[0].uid;
      else { CB.ui.toast('대상을 선택하세요.'); return; }
    }
    locked = true;
    clearSelection();
    hoverIndex = null;
    CB.ui.tooltip.hide();
    const node = detachCard(uid);
