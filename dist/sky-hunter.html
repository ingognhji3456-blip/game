  <script>/* js/sprites/mech.js */
'use strict';

/* =========================================================
 * 픽셀 그림 — 기계 보스 "강철 요새 타이탄"
 *  titan       : 몸통. 프레임 = 모습×2 + 깜빡임
 *                모습 0 완전 무장 · 1 장갑 붕괴(앞 장갑이 떨어지고 주포 칸이 드러남)
 *                     2 내부 노출(왼쪽 날개 끝이 뜯기고 구멍·배관, 등 뒤 격납고 열림) · 3 폭주(뼈대만 남고 코어가 녹아내림)
 *  turret      : 1단계 포탑 (프레임 = 포신 방향)      turretWreck : 부서진 포탑
 *  cannon      : 2단계부터 나오는 주포 (프레임 = 포신 방향)
 *  pod         : 3단계부터 나오는 미사일 포드 (프레임 = 뚜껑 열림 정도)
 *  wallgun     : 벽에서 나오는 레이저포 (프레임 i = 오른쪽에서 시계 방향 i×22.5°)
 *  emissile    : 쫓아오는 적 미사일 (프레임 i = 위에서 시계 방향 i×45°)
 *  scrap       : 떨어져 나가는 쇳조각
 * 무기 자리(픽셀, 그림 가운데 기준): 코어 (0,0) · 주포 (0,26) · 포탑 (±50,12) · 발사구 (±28,22) · 배기구 (±40,-10) · 포드 (±18,-24) · 신호기 (0,-35)
 * ========================================================= */

(() => {
  const k = '#0e1220';
  const M = '#010203';
  const STEEL = ['#1e2638', '#3a4660', '#5e6e8c', '#8e9ebc'];
  const HI = '#c8d4e8';
  const DARK = '#141826';
  const RIB = '#3a4660';
  const TAU = Math.PI * 2;

  function shade(P, cx, cy, rx, ry, cols, marker) {
    const mk = marker || M;
    for (let y = 0; y < P.h; y++) {
      for (let x = 0; x < P.w; x++) {
        if (P.get(x, y) !== mk) continue;
        const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry;
        const v = -(nx * 0.55 + ny * 0.8) * 0.7 + (1 - Math.min(1, nx * nx + ny * ny)) * 0.35;
        P.set(x, y, v > 0.45 ? cols[3] : v > 0 ? cols[2] : v > -0.42 ? cols[1] : cols[0]);
      }
    }
  }
  const ring = (P, cx, cy, r0, r1, c) => {
    for (let y = Math.floor(cy - r1 - 1); y <= cy + r1 + 1; y++) {
      for (let x = Math.floor(cx - r1 - 1); x <= cx + r1 + 1; x++) {
        const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
        if (d >= r0 && d <= r1) P.set(x, y, c);
      }
    }
  };
  /** 다각형 모양으로 지우기 (뜯겨 나간 자리) */
  const cut = (P, pts) => P.poly(pts, '#ff00fe');
  const finishCut = (P) => P.replace('#ff00fe', null);
  /** 쇳조각 들쭉날쭉한 구멍 */
  function hole(P, cx, cy, r, seed, fire, f) {
    for (let a = 0; a < 18; a++) {
      const ang = (a / 18) * TAU;
      const rr = r * (0.75 + 0.35 * Math.abs(Math.sin(seed * 3.7 + a * 1.9)));
      P.line(cx, cy, cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr, DARK);
    }
    P.line(cx - r * 0.6, cy - r * 0.2, cx + r * 0.6, cy + r * 0.3, '#c88a1a');
    P.line(cx - r * 0.3, cy + r * 0.5, cx + r * 0.4, cy - r * 0.5, seed % 2 ? '#e8384f' : '#3a86f0');
    if (fire) {
      const fl = f ? ['#ffd84a', '#ff8a2a'] : ['#ff8a2a', '#e8384f'];
      P.set(cx, cy - 1, fl[0]); P.set(cx + 1, cy - 2 - f, fl[1]); P.set(cx - 1, cy - 1 - f, fl[1]);
    }
  }
  /** 뼈대 (철골) */
  function girders(P, x0, y0, x1, y1) {
    for (let x = x0; x <= x1; x += 8) P.line(x, y0, x, y1, RIB);
    P.line(x0, y0, x1, y0, RIB);
    P.line(x0, y1, x1, y1, RIB);
    for (let x = x0; x + 8 <= x1; x += 8) { P.line(x, y0, x + 8, y1, '#2a3248'); }
  }

  /* =========================================================
   * 몸통
   * ========================================================= */
  SH.pix.paint('titan', 156, 96, 8, (P, f) => {
    const look = f >> 1, blink = f & 1;
    const CX = 78, CY = 48;
    const fireCols = blink ? ['#fff4a8', '#ffd84a', '#ff8a2a'] : ['#ffd84a', '#ff8a2a', '#e8384f'];

    // 뒤 엔진 불꽃 (위쪽)
    const red = look === 3;
    for (const [ex, on] of [[CX - 26, look < 3], [CX, true], [CX + 26, look < 2]]) {
      if (!on) continue;
      const len = 4 + blink * 3;
      for (let i = 0; i < len; i++) {
        const w = i < 2 ? 3 : i < len - 2 ? 2 : 1;
        P.rect(ex - Math.floor(w / 2), 7 - i, w, 1, red ? (i < 2 ? '#fff4a8' : '#ff8a2a') : i < 2 ? '#ffffff' : i < 4 ? '#8fd4ff' : '#3a86f0');
      }
    }

    // ---- 겉모양 (날개 + 본체) ----
    for (const s of [-1, 1]) {
      const X = (x) => CX + s * x;
      P.poly([X(30), 26, X(66), 40, X(76), 54, X(70), 68, X(52), 72, X(32), 66], M);
    }
    P.poly([CX - 40, 14, CX - 18, 6, CX + 18, 6, CX + 40, 14, CX + 48, 36, CX + 44, 62, CX + 28, 78, CX, 86, CX - 28, 78, CX - 44, 62, CX - 48, 36], M);
    // 뜯겨 나간 날개
    if (look >= 2) cut(P, [CX - 80, 30, CX - 58, 40, CX - 62, 50, CX - 56, 58, CX - 68, 72, CX - 80, 72]);
    if (look >= 3) cut(P, [CX + 80, 50, CX + 66, 56, CX + 70, 62, CX + 60, 74, CX + 80, 74]);
    finishCut(P);
    shade(P, CX, 40, 78, 44, STEEL);

    // 엔진 받침
    for (const ex of [CX - 26, CX, CX + 26]) { P.rect(ex - 3, 7, 7, 5, '#2a3248'); P.rect(ex - 2, 8, 5, 1, '#5e6e8c'); }
    // 판 이음새 · 리벳
    for (const [x0, y0, x1, y1] of [[CX - 40, 14, CX - 30, 56], [CX + 40, 14, CX + 30, 56], [CX - 48, 36, CX - 30, 36], [CX + 48, 36, CX + 30, 36]]) P.line(x0, y0, x1, y1, STEEL[0]);
    for (const s of [-1, 1]) {
      P.line(CX + s * 32, 32, CX + s * 64, 46, STEEL[0]);
      for (const [rx, ry] of [[36, 20], [44, 26], [56, 60], [70, 56], [40, 52]]) if (P.get(CX + s * rx, ry)) P.set(CX + s * rx, ry, HI);
    }

    // ---- 앞 장갑 / 주포 칸 ----
    if (look === 0) {
      // 앞 장갑판 + 닫힌 주포 덮개
      P.poly([CX - 26, 64, CX + 26, 64, CX + 22, 80, CX, 86, CX - 22, 80], '#3a4660');
      P.poly([CX - 26, 64, CX + 26, 64, CX + 24, 68, CX - 24, 68], '#5e6e8c');
      P.rect(CX - 9, 70, 19, 9, '#1e2638');
      for (let x = CX - 8; x <= CX + 9; x++) P.set(x, 74, Math.floor((x + 300) / 2) % 2 ? '#ffd84a' : '#1e2638');
      P.rect(CX - 1, 70, 2, 9, '#5e6e8c');
      // 경고 줄무늬
      for (let x = CX - 22; x <= CX + 22; x++) {
        const y = 80 + Math.round(-Math.abs(x - CX) * 0.25) + 2;
        const c = Math.floor((x + 300) / 3) % 2 ? '#ffd84a' : '#1b1230';
        P.set(x, y, c); P.set(x, y - 1, c);
      }
    } else {
      // 앞 장갑이 떨어져 나가 들쭉날쭉한 가장자리 + 안쪽 뼈대 + 주포 칸
      const edge = [CX - 30, 60, CX - 24, 66, CX - 27, 72, CX - 18, 76, CX - 20, 82, CX - 8, 84, CX, 88, CX + 9, 83, CX + 19, 84, CX + 18, 76, CX + 27, 71, CX + 24, 65, CX + 30, 60];
      P.poly(edge, DARK);
      girders(P, CX - 22, 64, CX + 22, 80);
      P.rect(CX - 10, 68, 21, 14, '#0a0d18');
      ring(P, CX, 74, 7, 9, '#2a3248');
      // 떨어진 장갑 잔해 자국
      for (const [x, y] of [[CX - 30, 60], [CX + 30, 60], [CX - 20, 82], [CX + 19, 84]]) { P.set(x, y, HI); P.set(x + 1, y + 1, '#5e6e8c'); }
      // 그을음
      for (const [x, y] of [[CX - 34, 58], [CX + 33, 57], [CX - 12, 60], [CX + 14, 61]]) if (P.get(x, y)) { P.set(x, y, STEEL[0]); P.set(x + 1, y, STEEL[0]); }
    }

    // ---- 함교 · 신호기 ----
    P.rect(CX - 10, 16, 21, 10, '#2a3248');
    P.rect(CX - 9, 17, 19, 2, '#5e6e8c');
    for (let i = 0; i < 4; i++) P.rect(CX - 8 + i * 5, 20, 3, 3, (i + blink) % 4 === 0 ? '#fff4a8' : red ? '#ff5a5a' : '#8fd4ff');
    P.rect(CX - 1, 9, 3, 8, '#5e6e8c');
    P.rect(CX - 3, 11, 7, 2, '#3a4660');

    // ---- 포탑 자리 ----
    for (const s of [-1, 1]) {
      const tx = CX + s * 50, ty = 60;
      if (look === 0) {
        ring(P, tx, ty, 9.5, 12.5, '#1e2638');
        P.circle(tx, ty, 9.5, '#2a3248');
      } else if (!(look >= 2 && s < 0)) {
        hole(P, tx, ty, 8, s + 3, true, blink);
        P.line(tx - 9, ty - 4, tx - 4, ty - 9, HI);
        P.line(tx + 6, ty + 5, tx + 10, ty + 2, '#5e6e8c');
      }
    }

    // ---- 플라스마 발사구 / 배기구 ----
    for (const s of [-1, 1]) {
      const ex = CX + s * 28, ey = 70;
      const vx = CX + s * 40, vy = 38;
      if (look <= 1) {
        P.circle(ex, ey, 5, '#1e2638');
        P.circle(ex, ey, 3.6, blink ? '#c9a8ff' : '#8850e0');
        P.set(ex - 1, ey - 1, '#ffffff');
        P.rect(vx - 5, vy - 3, 11, 7, '#1e2638');
        for (let i = 0; i < 4; i++) P.rect(vx - 4, vy - 2 + i * 2 - (i > 1 ? 1 : 0), 9, 1, '#5e6e8c');
      } else {
        if (!(look >= 2 && s < 0 && ex < CX - 56)) hole(P, ex, ey, 5, s + 7, true, blink);
        hole(P, vx, vy, 5, s + 11, look >= 3, blink);
      }
    }

    // ---- 등 뒤 격납고 (미사일 포드 자리) ----
    for (const s of [-1, 1]) {
      const px = CX + s * 18, py = 24;
      if (look <= 1) {
        P.rect(px - 7, py - 5, 15, 11, '#3a4660');
        P.rect(px - 7, py - 5, 15, 1, '#5e6e8c');
        P.line(px - 7, py, px + 7, py, '#1e2638');
      } else {
        P.rect(px - 8, py - 6, 17, 13, DARK);
        P.rect(px - 9, py - 7, 3, 2, '#5e6e8c'); // 날아간 뚜껑 경첩
        P.rect(px + 7, py - 7, 3, 2, '#5e6e8c');
      }
    }

    // ---- 내부 노출 · 폭주: 구멍, 배관, 뼈대 ----
    if (look >= 2) {
      for (const [hx, hy, r, sd] of [[CX - 36, 28, 5, 1], [CX + 30, 22, 4, 2], [CX + 42, 50, 5, 3], [CX - 14, 54, 3.5, 4]]) hole(P, hx, hy, r, sd, true, blink);
      // 뜯긴 날개 끝의 철골
      girders(P, CX - 60, 42, CX - 50, 60);
      P.line(CX - 58, 40, CX - 66, 46, HI);
    }
    if (look >= 3) {
      // 넓게 벗겨진 판 → 철골 사이로 바닥이 보임
      for (const [x0, y0, x1, y1] of [[CX - 44, 30, CX - 30, 46], [CX + 28, 28, CX + 44, 44], [CX - 24, 34, CX - 14, 44]]) {
        P.rect(x0, y0, x1 - x0, y1 - y0, '#ff00fe');
        finishCut(P);
        girders(P, x0, y0, x1, y1);
      }
      girders(P, CX + 56, 54, CX + 64, 66);
      for (const [x, y] of [[CX - 40, 44], [CX + 36, 30], [CX + 60, 52], [CX - 20, 70]]) {
        P.set(x, y, fireCols[0]); P.set(x, y - 1, fireCols[1]); P.set(x + 1, y - 2 - blink, fireCols[2]);
      }
    }

    // ---- 코어 ----
    ring(P, CX, CY, 14, 18, '#1e2638');
    ring(P, CX, CY, 16.5, 18, '#5e6e8c');
    if (look === 0) {
      P.circle(CX, CY, 14, '#3a4660');
      for (let y = CY - 14; y <= CY + 14; y++) for (let x = CX - 14; x <= CX + 14; x++) {
        if (P.get(x, y) !== '#3a4660') continue;
        if (Math.abs(x - CX) <= 1) P.set(x, y, '#1e2638');
        else if (((x - y + 400) >> 2) % 2 === 0 && Math.hypot(x - CX, y - CY) > 10) P.set(x, y, '#ffd84a');
        else if (x < CX && y < CY) P.set(x, y, '#5e6e8c');
      }
      P.rect(CX - 3, CY - 2, 7, 5, '#1e2638');
      P.rect(CX - 2, CY - 1, 5, 3, blink ? '#e8384f' : '#8e1c3a');
    } else {
      const cols = look === 1 ? ['#1c3f9a', '#3a86f0', '#8fd4ff', '#ffffff'] : look === 2 ? ['#b8501c', '#ff8a2a', '#ffd84a', '#ffffff'] : ['#8e1c3a', '#e8384f', '#ff9a8a', '#ffffff'];
      const r = 13 + blink;
      P.circle(CX, CY, r, cols[0]);
      P.circle(CX - 1, CY - 1, r - 3, cols[1]);
      P.circle(CX - 2, CY - 2, r - 7, cols[2]);
      P.circle(CX - 3, CY - 3, 2.4, cols[3]);
      if (look === 3) {
        // 코어에서 뻗어 나가는 붉은 금
        for (let a = 0; a < 6; a++) {
          const ang = (a / 6) * TAU + 0.4;
          P.line(CX + Math.cos(ang) * 17, CY + Math.sin(ang) * 17, CX + Math.cos(ang) * (24 + (a % 2) * 6), CY + Math.sin(ang) * (24 + (a % 2) * 6), blink ? '#ff5a3a' : '#c4202e');
        }
      }
    }

    // ---- 불빛 ----
    if (red) {
      for (const [lx, ly] of [[CX - 44, 38], [CX + 44, 38], [CX - 26, 12], [CX + 26, 12]]) {
        if (!P.get(lx, ly)) continue;
        P.rect(lx - 1, ly - 1, 3, 3, blink ? '#ff3030' : '#6a0a14');
        if (blink) P.set(lx, ly, '#ffffff');
      }
    } else {
      if (P.get(CX - 46, 38)) P.set(CX - 46, 38, blink ? '#45c44a' : '#23703a');
      P.set(CX + 46, 38, blink ? '#e8384f' : '#8e1c3a');
    }
    P.outline(k);
  });

  /* =========================================================
   * 포탑 (프레임 0 = 오른쪽 아래 끝 … 8 = 왼쪽 아래 끝)
   * ========================================================= */
  const angFrame = (ang, lo, hi, n) => Math.max(0, Math.min(n - 1, Math.round(((ang - lo) / (hi - lo)) * (n - 1))));
  SH.turretFrame = (ang) => angFrame(ang, 0.25, Math.PI - 0.25, 9);
  SH.cannonFrame = (ang) => angFrame(ang, 0.2, Math.PI - 0.2, 13);
  SH.wallgunFrame = (ang) => ((Math.round(ang / (TAU / 16)) % 16) + 16) % 16;

  function barrel(P, cx, cy, ang, len, half, cols) {
    const ux = Math.cos(ang), uy = Math.sin(ang), px = -uy, py = ux;
    P.poly([cx + px * half, cy + py * half, cx + ux * len + px * half, cy + uy * len + py * half, cx + ux * len - px * half, cy + uy * len - py * half, cx - px * half, cy - py * half], cols[0]);
    P.poly([cx + px * half, cy + py * half, cx + ux * len + px * half, cy + uy * len + py * half, cx + ux * len + px * (half - 2), cy + uy * len + py * (half - 2), cx + px * (half - 2), cy + py * (half - 2)], cols[1]);
    const m = half + 1;

(() => {
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const bay = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;

  /** 폭발 한 장: u = 0(시작) → 1(끝) */
  function boom(P, size, u) {
    const c = (size - 1) / 2;
    const R = size * 0.48;
    const r = R * (0.35 + Math.min(1, u * 1.8) * 0.65);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const d = Math.hypot(x - c, y - c) / r;
        if (d > 1) continue;
        const noise = bay(x, y);
        if (u < 0.12) { P.set(x, y, d < 0.7 ? '#ffffff' : '#fff4a8'); continue; }
        if (u > 0.5 && noise < (u - 0.5) * 2.2 + d * 0.25) continue; // 흩어지며 사라짐
        let col;
        const heat = 1 - d - u * 0.9 + noise * 0.25;
        if (u > 0.62) col = heat > 0.05 ? '#ff5a1a' : d > 0.6 ? '#3a2e3e' : '#5a4a5a';
        else if (heat > 0.55) col = '#ffffff';
        else if (heat > 0.32) col = '#fff4a8';
        else if (heat > 0.1) col = '#ffd84a';
        else if (heat > -0.15) col = '#ff8a2a';
        else col = '#c42a1a';
        P.set(x, y, col);
      }
    }
  }

  <script>/* js/fx.js */
'use strict';

/* =========================================================
 * 하늘 사냥꾼 — 픽셀 효과
 * 폭발 애니메이션, 파편, 픽셀 원(충격파), 떠오르는 글자, 화면 흔들림·번쩍임.
 * 게임 이벤트(logic 좌표)를 받아 화면 픽셀 좌표(절반)로 저장합니다.
 * ========================================================= */

SH.fx = (() => {
  const K = 0.5; // logic → 픽셀
  const MAX = 900;
  const parts = [];
  const state = { shake: 0, flash: 0, flashColor: '#ffffff', shakeOn: true };
  let hitThrottle = 0;
  let gemThrottle = 0;
  const R = Math.random;
  const add = (p) => { if (parts.length < MAX) parts.push(p); return p; };

  /* ---------------- 만들기 ---------------- */
  function anim(name, x, y, fps, delay) {
    const inf = SH.pix.info(name);
    if (!inf) return null;
    return add({ t: 'anim', name, x, y, fps, n: inf.n, age: -(delay || 0), life: inf.n / fps });
  }
  function debris(x, y, n, colors, speed, life) {
    for (let i = 0; i < n; i++) {
      const a = R() * Math.PI * 2, s = speed * (0.35 + R() * 0.8);
      add({ t: 'px', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, age: 0, life: life * (0.6 + R() * 0.7), color: colors[i % colors.length], size: R() < 0.3 ? 2 : 1, drag: 2.6 });
    }
  }
  function ring(x, y, r0, r1, life, color, thick) {
    add({ t: 'ring', x, y, r0, r1, life, age: 0, color, thick: thick || 1 });
  }
  function text(x, y, str, color, scale, life) {
    add({ t: 'text', x, y, x0: x, y0: y, str, color: color || '#ffffff', scale: scale || 1, life: life || 1, age: 0, vy: -22 });
  }
  function explosion(x, y, r, color, big) {
    if (big) {
      anim('boomBig', x, y, 16);
      for (let i = 0; i < 3; i++) anim('boom', x + (R() - 0.5) * r * 1.4, y + (R() - 0.5) * r * 1.4, 18, 0.05 + i * 0.07);
      debris(x, y, 18, [color, '#fff4a8', '#ff8a2a', '#ffffff'], 120, 0.7);
      ring(x, y, 3, r * 2.2, 0.35, '#fff4a8', 1);
    } else {
      anim('boom', x, y, 22);
      debris(x, y, 7, [color, '#fff4a8', '#ffffff'], 80, 0.45);
    }
  }
  /** 떨어져 나가는 쇳조각 (튀어 올랐다가 떨어지며 돔) */
  function chunks(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (R() - 0.5) * 2.6, s = 50 + R() * 90;
      add({ t: 'chunk', x: x + (R() - 0.5) * 50, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, age: 0, life: 1.4 + R() * 0.6, spin: R() * 4, drag: 0.6 });
    }
  }
  function shake(v) { if (state.shakeOn) state.shake = Math.max(state.shake, v); }
  function flash(a, c) { state.flash = Math.max(state.flash, a); state.flashColor = c || '#ffffff'; }

  /* ---------------- 게임 이벤트 ---------------- */
  function onEvent(type, d) {
    const x = d && d.x != null ? d.x * K : 0, y = d && d.y != null ? d.y * K : 0;
    switch (type) {
      case 'hit':
        if (hitThrottle > 0) return;
        hitThrottle = 0.03;
        anim(d.armor ? 'pop' : 'hitSpark', x, y, 30);
        return;
      case 'partDestroyed':
        explosion(x, y, 14, '#ff8a2a', true);
        for (let i = 0; i < 4; i++) anim('boomBig', x + (R() - 0.5) * 24, y + (R() - 0.5) * 20, 14, i * 0.08);
        text(x, y - 18, '포탑 파괴!', '#ffd84a', 1, 1.4);
        flash(0.3, '#fff4c8');
        shake(6);
        return;
      case 'missileDown':
        anim('boom', x, y, 24);
        debris(x, y, 5, ['#e8384f', '#ffd84a', '#ffffff'], 70, 0.35);
        return;
      case 'laserFire':
        shake(d.big ? 7 : 3);
        return;
      case 'muzzle':
        anim(d.big ? 'boom' : 'hitSpark', x, y, d.big ? 28 : 34);
        return;
      case 'gunDown':
        explosion(x, y, 10, '#c9a8ff', true);
        text(x, y - 14, '파괴!', '#c9a8ff');
        shake(4);
        return;
      case 'partBreak':
        explosion(x, y, 10, '#ff8a2a', true);
        chunks(x, y, 6);
        shake(5);
        return;
      case 'armorFall':
        chunks(x, y + 20, 18);
        flash(0.5, '#fff4c8');
        shake(9);
        return;
      case 'kill':
        explosion(x, y, d.r * K, d.color || '#ffd84a', d.heavy);
        shake(d.heavy ? 3 : 1);
        return;
      case 'bossBoom':
        explosion(x, y, 12, '#ff8a2a', R() < 0.4);
        debris(x, y, 3, ['#5e6e8c', '#8e9ebc'], 90, 0.6);
        shake(2.5);
        return;
      case 'bossDie':
        for (let i = 0; i < 4; i++) ring(x, y, 4, 170, 0.5 + i * 0.2, i % 2 ? '#ffd84a' : '#ffffff', 2);
        explosion(x, y, 34, '#ffd84a', true);
        for (let i = 0; i < 12; i++) anim('boomBig', x + (R() - 0.5) * 120, y + (R() - 0.5) * 60, 14, i * 0.06);
        debris(x, y, 50, ['#ffffff', '#fff4a8', '#ffd84a', '#ff8a2a', '#8e9ebc'], 240, 1.1);
        flash(0.85);
        shake(10);
        return;
      case 'bossDefeated':
        text(x, y + 20, '격파!', '#ffd84a', 2, 2);
        return;
      case 'bossPhase':
        ring(x, y, 8, 120, 0.5, '#ff7aa8', 2);
        flash(0.25, '#ffc4dc');
        shake(4);
        return;
      case 'playerDie':
        explosion(x, y, 14, '#8fd4ff', true);
        ring(x, y, 4, 90, 0.6, '#c4e4ff', 2);
        flash(0.35, '#ff8a8a');
        shake(6);
        return;
      case 'bomb':
        for (let i = 0; i < 3; i++) ring(x, y, 6, 240 + i * 40, 0.7 + i * 0.22, i === 1 ? '#ffd84a' : '#ffffff', 3 - i);
        debris(x, y, 40, ['#ffd84a', '#fff4a8', '#ff8a2a', '#ffffff'], 260, 0.9);
        flash(0.55, '#fff4c8');
        shake(6);
        return;
      case 'shieldBreak':
        ring(x, y, 8, 55, 0.4, '#8fd4ff', 2);
        debris(x, y, 12, ['#e0f7ff', '#8fd4ff'], 120, 0.4);
        text(x, y - 16, '방패 깨짐!', '#8fd4ff');
        shake(3);
        return;
      case 'power': {
        const w = SH.WEAPONS[d.weapon];
        ring(x, y, 4, 30, 0.35, w.light, 1);
        if (d.maxed) text(x, y - 14, '+5000', '#ffd84a');
        else if (d.level >= SH.MAX_POWER) text(x, y - 14, '파워 최대!', w.light);
        else text(x, y - 14, d.changed ? `${WNAME[d.weapon]} ${d.level}단계` : '파워 업!', w.light);
        return;
      }
      case 'item':
        ring(x, y, 4, 26, 0.3, '#ffffff', 1);
        text(x, y - 14, d.kind === 'bomb' ? '폭탄 +1' : '방패!', d.kind === 'bomb' ? '#ffd84a' : '#8fd4ff');
        return;
      case 'extend':
        text(x, y - 16, '비행기 +1', '#ff7aa8', 1, 1.4);
        ring(x, y, 4, 40, 0.5, '#ff7aa8', 2);
        return;
      case 'gem':
        if (gemThrottle > 0 && !d.big) return;
        gemThrottle = 0.06;
        anim('hitSpark', x, y, 30);
        return;
      case 'cancel': {
        const pts = d.pts;
        const step = Math.max(2, Math.floor(pts.length / 120) * 2);
        for (let i = 0; i < pts.length; i += step) anim('pop', pts[i] * K, pts[i + 1] * K, 24, R() * 0.08);
        return;
      }
      case 'split':
        ring(x, y, 2, 12, 0.2, '#ffffff', 1);
        return;
      default:
    }
  }
  const WNAME = { spread: '확산탄', laser: '레이저', homing: '유도탄' };

  /* ---------------- 진행 ---------------- */
  function update(dt) {
    if (hitThrottle > 0) hitThrottle -= dt;
    if (gemThrottle > 0) gemThrottle -= dt;
    state.shake = state.shake > 0.3 ? state.shake * Math.pow(0.015, dt) : 0;
    state.flash = Math.max(0, state.flash - dt * 2);
    let j = 0;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      p.age += dt;
      if (p.age >= p.life) continue;
      if (p.t === 'px' || p.t === 'chunk') {
        const k = Math.max(0, 1 - p.drag * dt);
        p.vx *= k;
        p.vy = p.vy * k + (p.t === 'chunk' ? 160 : 40) * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      } else if (p.t === 'text') p.y += p.vy * dt * (p.age < 0.4 ? 1 : 0.2);
      parts[j++] = p;
    }
    parts.length = j;
  }

  /** 픽셀 원 (중점 원 알고리즘) */
  function pixelCircle(ctx, cx, cy, r, color, thick) {
    ctx.fillStyle = color;
    cx = Math.round(cx); cy = Math.round(cy);
    for (let t = 0; t < thick; t++) {
      const rr = Math.round(r) - t;
      if (rr <= 0) break;
      let x = rr, y = 0, err = 1 - rr;
      while (x >= y) {
        ctx.fillRect(cx + x, cy + y, 1, 1); ctx.fillRect(cx + y, cy + x, 1, 1);
        ctx.fillRect(cx - y, cy + x, 1, 1); ctx.fillRect(cx - x, cy + y, 1, 1);
        ctx.fillRect(cx - x, cy - y, 1, 1); ctx.fillRect(cx - y, cy - x, 1, 1);
        ctx.fillRect(cx + y, cy - x, 1, 1); ctx.fillRect(cx + x, cy - y, 1, 1);
        y++;
        if (err < 0) err += 2 * y + 1;
        else { x--; err += 2 * (y - x) + 1; }
      }
    }
  }

  function draw(ctx) {
    for (const p of parts) {
      if (p.age < 0) continue;
      const u = p.age / p.life;
      if (p.t === 'anim') {
        SH.pix.draw(ctx, p.name, p.x, p.y, { frame: Math.min(p.n - 1, Math.floor(p.age * p.fps)) });
      } else if (p.t === 'chunk') {
        if (u > 0.8 && (Math.floor(p.age * 30) & 1)) continue;
        SH.pix.draw(ctx, 'scrap', p.x, p.y, { frame: Math.floor(p.age * 10 + p.spin) });
      } else if (p.t === 'px') {
        if (u > 0.7 && (Math.floor(p.age * 30) & 1)) continue; // 꺼질 때 깜빡
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
      } else if (p.t === 'ring') {
        const r = p.r0 + (p.r1 - p.r0) * (1 - (1 - u) * (1 - u));
        if (u > 0.75 && (Math.floor(p.age * 30) & 1)) continue;
        pixelCircle(ctx, p.x, p.y, r, p.color, p.thick);
      }
    }
  }

  /** 떠오르는 글자는 화면(가로)에 똑바로. map: 세계 픽셀 → 화면 픽셀 */
  function drawText(ctx, map) {
    for (const p of parts) {
      if (p.t !== 'text' || p.age < 0) continue;
      const u = p.age / p.life;
      if (u > 0.75 && (Math.floor(p.age * 20) & 1)) continue;
      // 세계에서 위로 떠오르던 값(vy)을 화면에서도 위로: 처음 위치에서 떠오른 만큼 화면 y 를 줄임
      const [X, Y] = map(p.x0 != null ? p.x0 : p.x, p.y0 != null ? p.y0 : p.y);
      const rise = p.y0 != null ? p.y0 - p.y : 0;
      SH.pix.text(ctx, p.str, X, Y - rise, { color: p.color, align: 'center', scale: p.scale });
    }
  }

  function clear() {
    parts.length = 0;
    state.shake = 0;
    state.flash = 0;
  }

  return { onEvent, update, draw, drawText, text, ring, anim, debris, chunks, pixelCircle, state, clear, WNAME };
})();

  <script>/* js/render.js */
'use strict';

/* =========================================================
 * 하늘 사냥꾼 — 픽셀 화면 그리기 (가로 480×270)
 *
 * 모든 것을 480×270 픽셀 버퍼(SH.render.ctx)에 그린 다음 present() 로
 * 번짐 없이(최근접) 화면 캔버스에 크게 늘려 옮깁니다. (1080p 화면에서 꼭 4배)
 * 게임 좌표(960×540)는 절반으로 줄여 픽셀 좌표가 됩니다.
 * 보스는 위, 나는 아래에서 위로 쏘는 그대로이고, 화면만 가로로 넓습니다.
 *
 * 무대: 기계 요새 내부 (철판 바닥 · 양쪽 벽의 배관·조명·포문)
 * 보스: 몸통 그림 위에 무기(포탑·주포·포드)를 따로 그려 움직이고,
 *       조준 중에는 조준선, 충전 중에는 빛이 모이는 모습, 쏘면 총구 섬광이 보입니다.
 * ========================================================= */

SH.render = (() => {
  const PW = 480, PH = 270, K = 0.5;
  const TH = 400; // 바닥 무늬 한 장의 높이 (위아래가 이어짐)
  const WALL = 18; // 양쪽 벽 두께(픽셀)
  const MENU_Y = Math.round((PH - 225) / 2); // 메뉴는 가운데 225 높이 기준으로 그림
  let view = null, vctx = null, buf = null, ctx = null;
  const bg = { kind: null, tile: null, scroll: 0, t: 0, fade: 0, girders: [] };
  let notice = null;
  let bossLag = 1;
  const title = { t: 0 };
  const R = Math.random;
  const TAU = Math.PI * 2;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
  const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];

  function init(canvas) {
    view = canvas;
    vctx = view.getContext('2d');
    buf = document.createElement('canvas');
    buf.width = PW;
    buf.height = PH;
    ctx = buf.getContext('2d');
    ctx.imageSmoothingEnabled = false;
  }

  function resize(devW, devH, cssW, cssH) {
    view.width = devW;
    view.height = devH;
    view.style.width = cssW + 'px';
    view.style.height = cssH + 'px';
  }

  function present() {
    vctx.imageSmoothingEnabled = false;
    vctx.drawImage(buf, 0, 0, view.width, view.height);
  }

  /** 메뉴의 위치 이동을 무시하고 화면 전체 기준으로 그리기 */
  function absolute(fn) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    fn();
    ctx.restore();
  }

  /* ---------------- 픽셀 도우미 ---------------- */
  function canvasFrom(w, h, fn) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const x = c.getContext('2d');
    const img = x.createImageData(w, h);
    fn(img.data, w, h);
    x.putImageData(img, 0, 0);
    return c;
  }
  const hex = (h) => SH.pix.rgba(h);
  function put(d, w, x, y, c) {
    if (x < 0 || x >= w || y < 0) return;
    const o = (y * w + x) * 4;
    d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = c[3];
  }
  function overlay(w, h, fn, color) {
    const c = hex(color);
    return canvasFrom(w, h, (d) => {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (bayer(x, y) < fn(x, y)) put(d, w, x, y, c);
    });
  }
  let dimOverlay = null, dimLight = null, vignette = null;
  function getOverlays() {
    if (dimOverlay) return;
    dimOverlay = overlay(PW, PH, () => 0.62, '#0c0820');
    dimLight = overlay(PW, PH, () => 0.4, '#0c0820');
    vignette = overlay(PW, PH, (x, y) => {
      const dx = (x - PW / 2) / (PW * 0.55), dy = (y - PH * 0.55) / (PH * 0.62);
      return Math.max(0, Math.hypot(dx, dy) - 0.82) * 1.4;
    }, '#05060c');
  }

  /* =========================================================
   * 무대: 기계 요새 내부 (위아래가 이어지는 바닥·벽 한 장, 480×400)
   * ========================================================= */
  function hangarTile() {
    const C = {
      plate: hex('#2a3040'), plate2: hex('#30374a'), seam: hex('#161a26'), seamHi: hex('#3e465c'), rivet: hex('#566078'),
      grateHi: hex('#323a50'), glow: hex('#3a1a18'), glow2: hex('#5a2418'),
      line: hex('#8a7a2a'), trench: hex('#10131c'), cable1: hex('#a02a3a'), cable2: hex('#2a5aa0'), cable3: hex('#c88a1a'),
      wall: hex('#3a4258'), wallHi: hex('#56607a'), wallDk: hex('#232838'), pipe: hex('#6e7a96'), pipeHi: hex('#a8b4cc'),
      brass: hex('#9a7030'), brassHi: hex('#d0a050'), hazY: hex('#c8a020'), hazK: hex('#141824'), shadow: hex('#0e1018'),
      hatch: hex('#1a1e2a'),
    };
    return canvasFrom(PW, TH, (d, w, h) => {
      // 바닥 철판 (40×40)
      for (let y = 0; y < h; y++) {
        for (let x = WALL; x < w - WALL; x++) {
          const px = (x - WALL + 2) % 40, py = y % 40;
          const cell = Math.floor((x - WALL + 2) / 40) + Math.floor(y / 40) * 7;
          let c = cell % 3 === 0 ? C.plate2 : C.plate;
          if (px === 0 || py === 0) c = C.seam;
          else if (px === 39 || py === 39) c = C.seamHi;
          else if ((px === 3 || px === 36) && (py === 3 || py === 36)) c = C.rivet;
          else if (bayer(x, y) < 0.03) c = C.seam;
          put(d, w, x, y, c);
        }
      }
      // 격자 창 (아래에서 희미한 불빛)
      for (const [gx, gy] of [[1, 1], [3, 4], [0, 7], [8, 2], [6, 8], [10, 5]]) {
        const x0 = WALL + gx * 40 + 4, y0 = gy * 40 + 8;
        for (let y = 0; y < 24; y++) for (let x = 0; x < 28; x++) {
          put(d, w, x0 + x, (y0 + y) % h, y % 3 === 0 ? C.grateHi : (bayer(x, y) < 0.35 ? C.glow2 : C.glow));
        }
      }
      // 안내선 (점선)
      for (const lx of [158, 320]) for (let y = 0; y < h; y++) if (y % 16 < 9) { put(d, w, lx, y, C.line); put(d, w, lx + 1, y, C.line); }
      // 케이블 도랑
      for (const tx of [WALL + 8, w - WALL - 13]) {
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < 6; x++) put(d, w, tx + x, y, C.trench);
          put(d, w, tx + 1, y, C.cable1);
          put(d, w, tx + 3, y, C.cable2);
          if (y % 50 < 25) put(d, w, tx + 4, y, C.cable3);
        }
      }
      // 벽 + 벽과 바닥 경계의 경고 줄무늬
      for (const side of [0, 1]) {
        const x0 = side ? w - WALL : 0;
        for (let y = 0; y < h; y++) {
          for (let i = 0; i < WALL; i++) {
            const x = x0 + i;
            const inner = side ? i : WALL - 1 - i; // 0 = 바닥 쪽
            let c = C.wall;
            if (inner === 0) c = C.shadow;
            else if (inner === 1 || inner === 2) c = ((y + (side ? 0 : 3)) >> 2) % 2 ? C.hazY : C.hazK;
            else if (inner === WALL - 1) c = C.wallDk;
            else if (inner >= 4 && inner <= 6) c = inner === 5 ? C.pipeHi : C.pipe;
            else if (inner >= 9 && inner <= 11) c = inner === 10 ? C.brassHi : C.brass;
            else if (inner === 13 || inner === 15) c = y % 20 === 0 ? C.wallHi : C.wall;
            else if (bayer(x, y) < 0.08) c = C.wallDk;
            if (y % 60 === 0 && inner >= 4 && inner <= 11) c = C.wallDk;
            put(d, w, x, y, c);
          }
        }
        // 포문 (벽 레이저포가 숨는 곳)
        for (const hy of [40, 240]) {
          for (let y = 0; y < 26; y++) for (let i = 3; i < WALL - 1; i++) {
            const x = x0 + (side ? i : WALL - 1 - i);
            const edge = y === 0 || y === 25 || i === 3 || i === WALL - 2;
            put(d, w, x, hy + y, edge ? (((y + i) >> 1) % 2 ? C.hazY : C.hazK) : C.hatch);
          }
        }
      }
    });
  }

  function setBg(kind) {
    if (bg.kind === kind) return;
    if (bg.kind) bg.fade = 1;
    bg.kind = kind;
    bg.scroll = 0;
    getOverlays();
    bg.tile = hangarTile();
    bg.girders = [{ y: 40 }, { y: 200 }];
  }

  function updateBg(dt) {
    bg.t += dt;
    bg.scroll = (bg.scroll + dt * 24) % TH;
    for (const gd of bg.girders) {
      gd.y += dt * 24;
      if (gd.y > PH + 20) gd.y -= PH + 60;
    }
    if (bg.fade > 0) bg.fade = Math.max(0, bg.fade - dt * 1.5);
  }

  /** 벽 조명 (깜빡임 · 폭주 땐 붉은 경광등) */
  function drawLamps(alarm) {
    const t = bg.t;
    for (let i = 0; i < 4; i++) {
      const y = Math.floor((i * 100 + 70 + bg.scroll) % TH);
      if (y > PH + 6) continue;
      for (const x of [WALL - 8, PW - WALL + 6]) {
        const on = alarm ? Math.floor(t * 4 + i) % 2 === 0 : Math.floor(t * 0.7 + i * 1.3) % 7 !== 0;
        ctx.fillStyle = '#1a1e2a';
        ctx.fillRect(x - 1, y - 1, 4, 6);
        ctx.fillStyle = on ? (alarm ? '#ff3030' : '#ffd84a') : '#5a4a20';
        ctx.fillRect(x, y, 2, 4);
        if (on) {
          ctx.fillStyle = alarm ? '#4a1418' : '#343846';
          const dir = x < PW / 2 ? 1 : -1;
          for (let k = 0; k < 6; k++) for (let j = -2; j <= 6; j++) {
            const px = x + dir * (4 + k), py = y + j;
            if (((px + py) & 3) === 0 && Math.abs(j - 2) < 5 - k * 0.6) ctx.fillRect(px, py, 1, 1);
          }
        }
      }
    }
  }

  /** 들보 (머리 위를 지나가는 철골) */
  function drawGirders() {
    for (const gd of bg.girders) {
      const y = Math.round(gd.y);
      ctx.fillStyle = '#0e1018';
      for (let x = WALL; x < PW - WALL; x++) if (((x + y) & 1) === 0) { ctx.fillRect(x, y + 6, 1, 1); ctx.fillRect(x, y + 8, 1, 1); }
      ctx.fillStyle = '#1e2432';
      ctx.fillRect(0, y, PW, 5);
      ctx.fillStyle = '#3a4258';
      ctx.fillRect(0, y, PW, 1);
      ctx.fillStyle = '#141824';
      for (let x = 4; x < PW; x += 12) { ctx.fillRect(x, y + 1, 1, 3); ctx.fillRect(x + 6, y + 2, 1, 1); }
    }
  }

  function drawBg(alarm) {
    const y = Math.floor(bg.scroll);
    ctx.drawImage(bg.tile, 0, y - TH);
    ctx.drawImage(bg.tile, 0, y);
    drawLamps(alarm);
    drawGirders();
    ctx.drawImage(vignette, 0, 0);
  }

  /* =========================================================
   * 글자·창 (HUD 와 메뉴가 씀)
   * ========================================================= */
  const T = (str, x, y, o) => SH.pix.text(ctx, str, x, y, o);

  /** 9칸 창 (frame 그림을 잘라 늘림) */
  function win(x, y, w, h, o) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    const img = SH.pix.has('frame') ? SH.pix.get('frame', 0) : null;
    if (!img) {
      ctx.fillStyle = '#1b1230'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = o && o.hot ? '#ffd84a' : '#c9a8ff'; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
      ctx.fillStyle = '#1e1840'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
      return;
    }
    const c = 4, m = 4;
    const iw = img.width - c * 2;
    ctx.drawImage(img, 0, 0, c, c, x, y, c, c);
    ctx.drawImage(img, c + iw, 0, c, c, x + w - c, y, c, c);
    ctx.drawImage(img, 0, c + iw, c, c, x, y + h - c, c, c);
    ctx.drawImage(img, c + iw, c + iw, c, c, x + w - c, y + h - c, c, c);
    ctx.drawImage(img, c, 0, m, c, x + c, y, w - c * 2, c);
    ctx.drawImage(img, c, c + iw, m, c, x + c, y + h - c, w - c * 2, c);
    ctx.drawImage(img, 0, c, c, m, x, y + c, c, h - c * 2);
    ctx.drawImage(img, c + iw, c, c, m, x + w - c, y + c, c, h - c * 2);
    ctx.drawImage(img, c, c, m, m, x + c, y + c, w - c * 2, h - c * 2);
    if (o && o.hot) {
      ctx.fillStyle = '#ffd84a';
      ctx.fillRect(x + 2, y + 1, w - 4, 1);
      ctx.fillRect(x + 2, y + h - 2, w - 4, 1);
      ctx.fillRect(x + 1, y + 2, 1, h - 4);
      ctx.fillRect(x + w - 2, y + 2, 1, h - 4);
    }
  }

  function dim(light) {
    getOverlays();
    absolute(() => ctx.drawImage(light ? dimLight : dimOverlay, 0, 0));
  }
  function dimBand(y, h) {
    getOverlays();
    ctx.drawImage(dimOverlay, 0, y, PW, h, 0, y, PW, h);
  }

  /** 줄무늬 띠 (경고) */
  function hazard(y, t) {
    ctx.fillStyle = '#1b1230';
    ctx.fillRect(0, y, PW, 9);
    ctx.fillStyle = '#ffd84a';
    const off = Math.floor(t * 30) % 12;
    for (let x = -12; x < PW + 12; x += 12) for (let j = 0; j < 7; j++) ctx.fillRect(x + off + j, y + 1 + j, 5, 1);
  }

  /** 그림 그리기 (그림이 없으면 대신 네모) */
  function spr(name, x, y, o, fb) {
    if (SH.pix.draw(ctx, name, x, y, o)) return;
    ctx.fillStyle = (o && o.flash) ? '#fff' : fb || '#ff00ff';
    const s = (o && o.fbs) || 8;
    ctx.fillRect(Math.round(x - s / 2), Math.round(y - s / 2), s, s);
  }

  /* =========================================================
   * 무기의 조준 · 충전 표시
   * ========================================================= */
  /** 조준선: 총구에서 겨눈 방향으로 점선. 충전 중이면 더 촘촘하고 밝게 */
  function sightLine(mx, my, ang, charging, t, color) {
    const ux = Math.cos(ang), uy = Math.sin(ang);
    const step = charging ? 2 : 4;
    const off = Math.floor(t * 40) % step;
    ctx.fillStyle = color || (charging && Math.floor(t * 16) % 2 ? '#ffd0d0' : '#ff3b4e');
    for (let d = 3 + off; d < 600; d += step) {
      const x = Math.round(mx + ux * d), y = Math.round(my + uy * d);
      if (x < -2 || x > PW + 2 || y < -2 || y > PH + 2) break;
      ctx.fillRect(x, y, 1, 1);
    }
  }
  /** 충전: 둘레에서 빛 알갱이가 총구로 빨려 들고, 총구 빛이 커짐 */
  function chargeGlow(mx, my, u, t, cols, big) {
    const n = big ? 14 : 8;
    const R0 = big ? 30 : 15;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + t * 3 + i;
      const phase = (t * 1.6 + i / n) % 1;
      const r = R0 * (1 - phase) * (0.5 + 0.5 * (1 - u * 0.5));
      ctx.fillStyle = cols[i % cols.length];
      ctx.fillRect(Math.round(mx + Math.cos(a) * r), Math.round(my + Math.sin(a) * r), phase > 0.7 ? 2 : 1, phase > 0.7 ? 2 : 1);
    }
    const rr = (big ? 3 : 1.5) + u * (big ? 7 : 3.5) + (Math.floor(t * 20) & 1);
    SH.fx.pixelCircle(ctx, mx, my, rr + 1, cols[0], 1);
    ctx.fillStyle = cols[1];
    ctx.fillRect(Math.round(mx - rr / 2), Math.round(my - rr / 2), Math.round(rr), Math.round(rr));
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(mx - 1), Math.round(my - 1), 2, 2);
  }
  const CHARGE = {
    red: ['#ff3b4e', '#ffb0a0'], purple: ['#9a4dff', '#e2ccff'], orange: ['#ff8a2a', '#fff4a8'],
  };

  function weaponTell(g, w, mx, my) {
    const t = g.time;
    if (w.state === 'aim' || w.state === 'charge') {
      if (w.kind === 'turret' || w.kind === 'cannon' || w.kind === 'gun') sightLine(mx, my, w.ang, w.state === 'charge', t);
    }
    if (w.state !== 'charge') return;
    const u = w.charge;
    if (w.kind === 'cannon') chargeGlow(mx, my, u, t, CHARGE.red, w.big);
    else if (w.kind === 'turret') chargeGlow(mx, my, u, t, CHARGE.orange, false);
    else if (w.kind === 'gun') chargeGlow(mx, my, u, t, CHARGE.red, false);
    else if (w.kind === 'emitter') {
      // 플라스마 구체가 자라남
      const r = 1 + u * 5 + (Math.floor(t * 18) & 1);
      ctx.fillStyle = '#44257e';
      ctx.fillRect(Math.round(mx - r - 1), Math.round(my - r - 1), Math.round(r * 2 + 2), Math.round(r * 2 + 2));
      SH.fx.pixelCircle(ctx, mx, my, r, '#c9a8ff', 2);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(mx - 1), Math.round(my - 1), 2, 2);
      chargeGlow(mx, my, u, t, CHARGE.purple, false);
    } else if (w.kind === 'vent') {
      if (R() < 0.35) SH.fx.anim('puff', mx + (R() - 0.5) * 8, my - 2, 12);
      ctx.fillStyle = Math.floor(t * 12) & 1 ? '#8fd4ff' : '#3a86f0';
      ctx.fillRect(Math.round(mx - 4), Math.round(my - 1), 9, 2);
    } else if (w.kind === 'core') {
      SH.fx.pixelCircle(ctx, mx, my, 15 + u * 6 + (Math.floor(t * 20) & 1), g.bossPhase.berserk ? '#ff5a5a' : '#e2ccff', 1);
      chargeGlow(mx, my, u, t, g.bossPhase.berserk ? CHARGE.red : CHARGE.purple, false);
    } else if (w.kind === 'antenna') {
      // 신호: 퍼지는 고리
      const k = (t * 3) % 1;
      SH.fx.pixelCircle(ctx, mx, my, 3 + k * 16, Math.floor(t * 12) & 1 ? '#ff3b4e' : '#ffd84a', 1);
      ctx.fillStyle = '#ff3b4e';
      ctx.fillRect(Math.round(mx - 1), Math.round(my - 2), 3, 3);
    }
  }

  /* =========================================================
   * 보스: 몸통 + 무기
   * ========================================================= */
  function muzzlePx(g, w) {
    const [x, y] = g.muzzle(w);
    return [x * K, y * K];
  }
  function drawBoss(g) {
    const B = g.boss;
    if (!B) return;
    const bx = B.x * K, by = B.y * K;
    const ph = g.bossPhase;
    let flash = B.flash > 0;
    if (B.state === 'transform' && Math.floor(g.time * 18) % 2) flash = true;
    if (B.state === 'dying') {
      if (Math.floor(g.time * 16) % 2) flash = true;
      if (B.st > 2.8 && Math.floor(g.time * 24) % 2) return;
    }
    const blink = Math.floor(g.time * (ph.berserk ? 8 : 3)) & 1;
    spr('titan', bx, by, { frame: B.look * 2 + blink, flash, fbs: 60 }, '#5e6e8c');

    const pos = (w) => [bx + w.ox * K, by + w.oy * K];
    const Wp = B.w;
    // 1단계 포탑
    for (const n of ['turretL', 'turretR']) {
      const w = Wp[n];
      if (B.look > 0) continue;
      const [x, y] = pos(w);
      if (w.alive) {
        const rx = x - Math.cos(w.ang) * w.recoil * 2, ry = y - Math.sin(w.ang) * w.recoil * 2;
        spr('turret', rx, ry, { frame: SH.turretFrame(w.ang), flash: w.flash > 0 || flash, fbs: 12 }, '#8e9ebc');
        if (B.state === 'fight' && w.hp < w.maxHp) {
          const bw = 16, r = w.hp / w.maxHp;
          ctx.fillStyle = '#0e1220'; ctx.fillRect(Math.round(x - bw / 2) - 1, Math.round(y + 13), bw + 2, 3);
          ctx.fillStyle = r > 0.3 ? '#ffd84a' : '#e8384f'; ctx.fillRect(Math.round(x - bw / 2), Math.round(y + 14), Math.max(1, Math.round(bw * r)), 1);
        }
      } else {
        spr('turretWreck', x, y, { frame: Math.floor(g.time * 6), fbs: 10 }, '#3a4660');
        if (R() < 0.08) SH.fx.anim('puff', x + (R() - 0.5) * 6, y - 4, 10);
      }
    }
    // 미사일 포드 (3단계부터)
    for (const n of ['podL', 'podR']) {
      const w = Wp[n];
      if (!w.alive || B.phase < w.unlock) continue;
      const [x, y] = pos(w);
      const rise = (1 - w.reveal) * 6;
      spr('pod', x, y + rise, { frame: Math.min(3, Math.round(w.open * 3)), flash, alpha: w.reveal < 1 && Math.floor(g.time * 20) % 2 ? 0.5 : 1, fbs: 10 }, '#5e6e8c');
    }
    // 주포 (2단계부터, 안에서 밀려 나옴)
    const c = Wp.cannon;
    if (c.alive && B.phase >= c.unlock) {
      const [x, y] = pos(c);
      const slide = (1 - c.reveal) * -10;
      const rx = x - Math.cos(c.ang) * c.recoil * 3, ry = y + slide - Math.sin(c.ang) * c.recoil * 3;
      spr('cannon', rx, ry, { frame: SH.cannonFrame(c.ang), flash: flash || (c.state === 'cool' && Math.floor(g.time * 10) % 2), fbs: 14 }, '#8e9ebc');
      if (c.state === 'cool' && R() < 0.3) { const [mx, my] = muzzlePx(g, c); SH.fx.anim('puff', mx, my, 12); }
    }
    // 조준 · 충전 표시
    if (B.state === 'fight') {
      for (const w of Object.values(Wp)) {
        if (!w.alive || B.phase < w.unlock || (w.lose != null && B.phase >= w.lose)) continue;
        if (w.state === 'idle' || w.state === 'fire') continue;
        const [mx, my] = muzzlePx(g, w);
        weaponTell(g, w, mx, my);
      }
      // 주포가 쓸어낼 구역
      if (c.sweep && (c.state === 'aim' || c.state === 'charge')) {
        const [mx, my] = muzzlePx(g, c);
        const [a0, a1] = c.sweep;
        const steps = Math.ceil(Math.abs(a1 - a0) / 0.07);
        ctx.fillStyle = Math.floor(g.time * 10) & 1 ? '#ff3b4e' : '#8e1c3a';
        for (let i = 0; i <= steps; i++) {
          const a = a0 + ((a1 - a0) * i) / steps;
          for (let d = 18 + ((i * 3 + Math.floor(g.time * 30)) % 8); d < 560; d += 8) ctx.fillRect(Math.round(mx + Math.cos(a) * d), Math.round(my + Math.sin(a) * d), 1, 1);
        }
      }
    }
    // 1단계 코어 방어막
    if (ph.shield && B.state === 'fight' && Math.floor(g.time * 10) % 3) {
      SH.fx.pixelCircle(ctx, bx, by + g.def.core.oy * K, 20 + (Math.floor(g.time * 6) & 1), '#8fd4ff', 1);
    }
  }

  /* ---------------- 벽 레이저포 ---------------- */
  function lineThick(x0, y0, x1, y1, t) {
    const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      ctx.fillRect(Math.round(SH.lerp(x0, x1, u) - t / 2), Math.round(SH.lerp(y0, y1, u) - t / 2), t, t);
    }
  }
  function drawGuns(g) {
    for (const w of g.guns) {
      const x = w.x * K, y = w.y * K;
      // 벽에서 뻗어 나온 레일 팔
      const ex = w.edge === 'L' || w.edge === 'BL' ? -2 : PW + 2;
      const ey = w.edge === 'BL' || w.edge === 'BR' ? y + 10 : y;
      ctx.fillStyle = '#1a1e2a';
      lineThick(ex, ey, x, y, 4);
      ctx.fillStyle = '#56607a';
      lineThick(ex, ey - 1, x, y - 1, 1);
      ctx.fillStyle = '#c8a020';
      for (let i = 0; i < 3; i++) {
        const u = 0.2 + i * 0.25;
        ctx.fillRect(Math.round(SH.lerp(ex, x, u)), Math.round(SH.lerp(ey, y, u)) - 1, 1, 3);
      }
      spr('wallgun', x - Math.cos(w.ang) * w.recoil * 2, y - Math.sin(w.ang) * w.recoil * 2, { frame: SH.wallgunFrame(w.ang), flash: w.flash > 0, fbs: 10 }, '#6a4aa0');
      if (w.state === 'aim' || w.state === 'charge') {
        const [mx, my] = muzzlePx(g, w);
        weaponTell(g, w, mx, my);
      }
    }
  }

  /* ---------------- 레이저 (총구에서 나감) ---------------- */
  function drawBeams(g) {
    for (const bm of g.beams) {
      const ox = bm.x * K, oy = bm.y * K;
      const ux = Math.cos(bm.ang), uy = Math.sin(bm.ang);
      const grow = Math.min(1, bm.t / 0.08) * Math.min(1, (bm.dur - bm.t) / 0.12);
      const w = Math.max(1, Math.round(bm.width * K * grow));
      const fl = Math.floor(g.time * 30) & 1;
      const gunBeam = bm.src.kind === 'gun';
      const layers = gunBeam
        ? [[w + 2, '#7a2ac0'], [w, fl ? '#c9a8ff' : '#a070ff'], [Math.max(1, w - 3), '#f0e4ff'], [Math.max(1, w - 5), '#ffffff']]
        : [[w + 2, '#e8384f'], [w, fl ? '#ff8a8a' : '#ff6a6a'], [Math.max(1, w - 4), '#ffd0d0'], [Math.max(1, w - 6), '#ffffff']];
      for (const [lw, c] of layers) {
        ctx.fillStyle = c;
        for (let d = 2; d < 600; d += 1) {
          const x = ox + ux * d, y = oy + uy * d;
          if (x < -10 || x > PW + 10 || y < -10 || y > PH + 10) break;
          ctx.fillRect(Math.round(x - lw / 2), Math.round(y - lw / 2), lw, lw);
        }
      }
      SH.pix.draw(ctx, 'boom', ox, oy, { frame: 1 + (Math.floor(g.time * 20) % 2), scale: bm.width > 30 ? 2 : 1 });
    }
  }

  /* =========================================================
   * 나 · 탄 · 아이템
   * ========================================================= */
  function drawPlayerBullets(g) {
    for (const b of g.pb) {
      const x = b.x * K, y = b.y * K;
      if (b.kind === 'spread') spr('shot_spread', x, y, { frame: b.rot < -0.05 ? 1 : b.rot > 0.05 ? 2 : 0, fbs: 3 }, '#ffd84a');
      else if (b.kind === 'homing') spr('shot_homing', x, y, { fbs: 3 }, '#a6f070');
      else if (b.kind === 'laser') spr('shot_laser', x, y, { frame: (b.lv || 1) - 1, fbs: 4 }, '#8fd4ff');
      else if (b.kind === 'missile') {
        const dir = Math.round((((b.rot % TAU) + TAU) % TAU) / (Math.PI / 4)) % 8;
        spr('missile', x, y, { frame: dir, fbs: 4 }, '#45c44a');
      }
    }
  }

  function drawEnemyBullets(g) {
    const f = Math.floor(g.time * 8) & 1;
    for (const b of g.eb) {
      if (b.missile) {
        const dir = Math.round((((b.rot + Math.PI / 2) % TAU) + TAU) % TAU / (Math.PI / 4)) % 8;
        spr('emissile', b.x * K, b.y * K, { frame: dir, fbs: 5 }, '#e8384f');
        if (R() < 0.3) SH.fx.anim('puff', b.x * K - Math.cos(b.rot) * 5, b.y * K - Math.sin(b.rot) * 5, 14);
      } else spr((b.big ? 'big_' : 'orb_') + b.kind, b.x * K, b.y * K, { frame: f, fbs: b.big ? 10 : 5 }, '#ff4f9a');
    }
  }

  function drawItems(g) {
    for (const it of g.items) {
      const x = it.x * K, y = it.y * K;
      const t = it.t;
      switch (it.kind) {
        case 'gem': spr('gem', x, y, { frame: Math.floor(t * 10 + it.x), fbs: 4 }, '#8fd4ff'); break;
        case 'bigGem': spr('bigGem', x, y, { frame: Math.floor(t * 6), fbs: 6 }, '#ffd84a'); break;
        case 'spark': spr('spark', x, y, { frame: Math.floor(t * 16), fbs: 2 }, '#fff4a8'); break;
        case 'power': spr('item_' + it.wtype, x, y, { frame: Math.floor(t * 6), fbs: 10 }, SH.WEAPONS[it.wtype].color); break;
        default: spr('item_' + it.kind, x, y + (Math.floor(t * 4) % 2), { frame: Math.floor(t * 6), fbs: 10 }, '#ffffff');
      }
    }
  }

  function drawPlayer(g) {
    const p = g.player;
    if (p.dead) return;
    const x = p.x * K, y = p.y * K;
    const blink = p.inv > 0 && !p.entering && Math.floor(g.time * 15) % 2 === 0;
    if (!blink) {
      spr('flame', x, y + 15, { frame: Math.floor(g.time * 20), fbs: 3 }, '#8fd4ff');
      spr('player', x, y, { frame: p.bank < -0.35 ? 0 : p.bank > 0.35 ? 2 : 1, fbs: 12 }, '#ffffff');
    }
    if (p.shield > 0 && !(p.shield < 2 && Math.floor(g.time * 10) % 2)) spr('shield', x, y, { frame: Math.floor(g.time * 6), fbs: 1 }, '#8fd4ff');
    if (!p.entering && !p.exiting) {
      const cx = Math.round(x), cy = Math.round(y);
      ctx.fillStyle = '#ff3a7a';
      ctx.fillRect(cx - 1, cy - 1, 3, 3);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx, cy, 1, 1);
    }
  }

  /* =========================================================
   * HUD: 왼쪽 위 점수·목숨·폭탄 · 가운데 위 보스 체력 · 오른쪽 위 무기
   * ========================================================= */
  function drawHud(g, best) {
    T('점수', 22, 6, { color: '#ffd84a', size: 9 });
    T(SH.fmt(g.score), 46, 6, { color: '#ffffff' });
    T('최고', 22, 16, { color: '#ff7aa8', size: 9 });
    T(SH.fmt(Math.max(best, g.score)), 46, 16, { color: '#ffe3ee' });
    const lives = Math.max(0, g.lives);
    if (lives > 5) {
      spr('icon_life', 26, 25, { fbs: 6 }, '#ffffff');
      T('×' + lives, 33, 25, { color: '#ffffff' });
    } else for (let i = 0; i < lives; i++) spr('icon_life', 26 + i * 10, 25, { fbs: 6 }, '#ffffff');
    for (let i = 0; i < g.bombs; i++) spr('icon_bomb', 26 + i * 10, 35, { fbs: 6 }, '#ffd84a');
    const w = SH.WEAPONS[g.weapon];
    T(SH.fx.WNAME[g.weapon], PW - 28, 6, { color: w.light, align: 'right', size: 9 });
    for (let i = 0; i < SH.MAX_POWER; i++) {
      ctx.fillStyle = '#1b1230';
      ctx.fillRect(PW - 59 + i * 6, 12, 5, 4);
      ctx.fillStyle = i < g.power ? w.color : '#3a3058';
      ctx.fillRect(PW - 58 + i * 6, 13, 3, 2);
    }
    if (g.loop > 0) T(`${g.loop + 1}회차`, PW - 28, 24, { color: '#ff9ac2', align: 'right', size: 9 });

    const B = g.boss;
    if (B && B.state !== 'dying') {
      const ph = g.bossPhase;
      const fillIn = B.state === 'enter' ? Math.min(1, B.st / 3) : 1;
      const ratio = Math.max(0, B.hp / B.maxHp) * fillIn;
      bossLag = ratio > bossLag ? ratio : bossLag + (ratio - bossLag) * 0.05;
      const w2 = 190, x = (PW - w2) / 2, y = 3;
      ctx.fillStyle = '#1b1230';
      ctx.fillRect(x, y, w2, 6);
      ctx.fillStyle = '#3a2050';
      ctx.fillRect(x + 1, y + 1, w2 - 2, 4);
      if (ph.shield) {
        ctx.fillStyle = '#5e6e8c';
        ctx.fillRect(x + 1, y + 1, Math.round((w2 - 2) * ratio), 4);
        for (let i = 0; i < w2 - 2; i += 4) { ctx.fillStyle = '#8fd4ff'; ctx.fillRect(x + 1 + i + (Math.floor(g.time * 8) % 4), y + 2, 1, 2); }
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x + 1, y + 1, Math.round((w2 - 2) * bossLag), 4);
        ctx.fillStyle = ph.berserk ? '#ff3030' : '#e8384f';
        ctx.fillRect(x + 1, y + 1, Math.round((w2 - 2) * ratio), 4);
        ctx.fillStyle = '#ff8a9a';
        ctx.fillRect(x + 1, y + 1, Math.round((w2 - 2) * ratio), 1);
      }
      ctx.fillStyle = '#1b1230';
      for (const p of g.def.phases) if (p.until > 0) ctx.fillRect(x + Math.round(w2 * p.until), y, 1, 6);
      // 단계 표시 (■■□□) · 시간
      for (let i = 0; i < g.def.phases.length; i++) {
        ctx.fillStyle = '#1b1230';
        ctx.fillRect(x + w2 + 4 + i * 7, y, 6, 6);
        ctx.fillStyle = i < B.phase ? '#5a5680' : i === B.phase ? (ph.berserk ? '#ff3030' : '#ffd84a') : '#2a2448';
        ctx.fillRect(x + w2 + 5 + i * 7, y + 1, 4, 4);
      }
      if (B.state !== 'enter') T(fmtTime(g.fightT), x + w2 + 34, y + 3, { color: '#ffffff' });
      T(ph.shield ? `${g.def.name} · 방어막` : g.def.name, PW / 2, y + 13, { color: ph.shield ? '#8fd4ff' : ph.berserk ? '#ff5a5a' : '#ff8a8a', align: 'center', size: 9 });
    } else bossLag = 1;
  }

  function fmtTime(sec) {
    const m = Math.floor(sec / 60), r = Math.floor(sec % 60);
    return `${m}:${String(r).padStart(2, '0')}`;
  }

  /* =========================================================
   * 안내 (시작 · 경고 · 클리어 · 짧은 알림)
   * ========================================================= */
  function drawBanners(g) {
    const cy = Math.round(PH * 0.52);
    if (g.phase === 'intro') {
      const u = g.phaseT;
      if (u < 1.95 && !(u > 1.6 && Math.floor(u * 20) % 2)) {
        const slide = Math.max(0, 1 - u / 0.35) * 180;
        dimBand(cy - 30, 60);
        T(g.stage.en, PW / 2 - slide, cy - 12, { color: '#ffd84a', scale: 3, align: 'center', shadow: '#8a3a10' });
        T(g.stage.name, PW / 2 + slide, cy + 14, { color: '#ffffff', align: 'center', size: 12 });
        if (g.loop > 0) T(`${g.loop + 1}회차 · 더 강해진 요새`, PW / 2, cy + 32, { color: '#c9a8ff', align: 'center', size: 10 });
      }
    } else if (g.phase === 'warning') {
      const u = g.phaseT;
      if (u < 2.7) {
        if (Math.floor(u * 6) % 2 === 0) {
          ctx.fillStyle = '#ff1e3c';
          ctx.globalAlpha = 0.18;
          ctx.fillRect(0, 0, PW, PH);
          ctx.globalAlpha = 1;
        }
        hazard(cy - 40, u);
        hazard(cy + 32, -u);
        if (Math.floor(u * 4) % 2 === 0) T('경고!', PW / 2, cy - 16, { color: '#ff3b4e', scale: 3, align: 'center', shadow: '#5a0a1a' });
        T(g.def.title, PW / 2, cy + 6, { color: '#ffd0d6', align: 'center', size: 10 });
        T(g.def.name, PW / 2, cy + 20, { color: '#ffffff', align: 'center', size: 12 });
      }
    } else if (g.phase === 'clear' && g.tally) {
      const u = g.phaseT;
      if (u > 0.6 && u < 5.4) {
        const Tl = g.tally;
        const w = 240, h = 132, x0 = (PW - w) / 2, y0 = cy - h / 2;
        win(x0, y0, w, h);
        T('작전 성공!', PW / 2, y0 + 14, { color: '#ffd84a', scale: 2, align: 'center', shadow: '#8a3a10' });
        const rows = [['격파 보너스', Tl.clearBonus], [`시간 보너스 ${fmtTime(Tl.fightTime)}`, Tl.timeBonus], ['노미스 보너스', Tl.noMiss], ['남은 폭탄', Tl.bombBonus]];
        rows.forEach(([label, v], i) => {
          const show = Math.min(1, Math.max(0, (u - 1.0 - i * 0.45) / 0.4));
          if (show <= 0) return;
          const yy = y0 + 38 + i * 15;
          T(label, x0 + 12, yy, { color: '#e8e0ff', size: 10 });
          T(v ? '+' + SH.fmt(v * show) : '-', x0 + w - 12, yy, { color: v ? '#ffffff' : '#8f86b0', align: 'right' });
        });
        const tot = Math.min(1, Math.max(0, (u - 2.5) / 0.5));
        if (tot > 0) {
          ctx.fillStyle = '#5a5680';
          ctx.fillRect(x0 + 12, y0 + 100, w - 24, 1);
          T('합계', x0 + 12, y0 + 114, { color: '#ffd84a', size: 10 });
          T('+' + SH.fmt(Tl.total * tot), x0 + w - 12, y0 + 114, { color: '#ffd84a', align: 'right' });
        }
      }
    }
    if (notice) {
      const a = notice.t < notice.dur - 0.4 || Math.floor(notice.t * 20) % 2;
      if (a) {
        const ny = 128;
        const pop = Math.min(1, notice.t / 0.15);
        T(notice.title, PW / 2, ny, { color: notice.color, align: 'center', size: notice.ascii ? undefined : (notice.big ? 16 : 11) * (0.7 + 0.3 * pop) });
        if (notice.sub) T(notice.sub, PW / 2, ny + (notice.big ? 18 : 13), { color: '#ffffff', align: 'center', size: 10 });
      }
    }
  }

  function showNotice(title, sub, color, dur, big) {
    notice = { title, sub, color: color || '#ffffff', t: 0, dur: dur || 2, ascii: !/[^\x00-\x7f]/.test(title), big: !!big };
  }

  /* =========================================================
   * 한 장면
   * ========================================================= */
  function drawGame(g, dt, opts) {
    setBg(g.stage.bg);
    updateBg(dt);
    if (notice && dt > 0) {
      notice.t += dt;
      if (notice.t >= notice.dur) notice = null;
    }
    const ph = g.bossPhase;
    const alarm = !!(ph && ph.berserk && g.boss && g.boss.state !== 'dying');
    const st = SH.fx.state;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.save();
    if (st.shake > 0.5) ctx.translate(Math.round((R() - 0.5) * st.shake), Math.round((R() - 0.5) * st.shake));
    drawBg(alarm);
    drawBoss(g);
    drawGuns(g);
    drawPlayerBullets(g);
    drawItems(g);
    drawPlayer(g);
    SH.fx.draw(ctx);
    drawBeams(g);
    drawEnemyBullets(g);
    ctx.restore();

    if (alarm && Math.floor(g.time * 3) % 2) {
      ctx.globalAlpha = 0.1;
      ctx.fillStyle = '#ff1e3c';
      ctx.fillRect(0, 0, PW, PH);
      ctx.globalAlpha = 1;
    }
    if (g.bombT > 0 && Math.floor(g.time * 12) % 2) {
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = '#ffd84a';
      ctx.fillRect(0, 0, PW, PH);
      ctx.globalAlpha = 1;
    }
    if (st.flash > 0.02) {
      ctx.globalAlpha = Math.min(0.85, st.flash);
      ctx.fillStyle = st.flashColor;
      ctx.fillRect(0, 0, PW, PH);
      ctx.globalAlpha = 1;
    }
    if (bg.fade > 0) {
      ctx.globalAlpha = bg.fade;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, PW, PH);
      ctx.globalAlpha = 1;
    }
    SH.fx.drawText(ctx, (x, y) => [x, y]);
    if (!opts || !opts.noHud) drawHud(g, (opts && opts.best) || 0);
    if (!opts || !opts.frozen) drawBanners(g);
    ctx.restore();
  }

  /** 타이틀 배경: 요새 안, 오른쪽에 강철 요새가 버티고 왼쪽 아래에서 비행기가 맞서 날아감 */
  function drawTitle(dt, noBoss) {
    title.t += dt;
    absolute(() => {
      setBg('hangar');
      updateBg(dt);
      drawBg(false);
      const t = title.t;
      if (!noBoss) {
        const bx = 404 + Math.sin(t * 0.4) * 5, by = 176 + Math.sin(t * 0.9) * 3;
        SH.pix.draw(ctx, 'titan', bx, by, { frame: Math.floor(t * 3) & 1 });
        for (const s2 of [-1, 1]) SH.pix.draw(ctx, 'turret', bx + s2 * 50, by + 12, { frame: 4 + Math.round(Math.sin(t * 0.7 + s2) * 2) });
      }
      const px = 88 + Math.sin(t * 0.8) * 34, py = 226 + Math.sin(t * 1.3) * 3;
      const bank = Math.cos(t * 0.8);
      SH.pix.draw(ctx, 'flame', px, py + 15, { frame: Math.floor(t * 20) });
      SH.pix.draw(ctx, 'player', px, py, { frame: bank > 0.5 ? 2 : bank < -0.5 ? 0 : 1 });
      SH.fx.update(dt);
      SH.fx.draw(ctx);
      SH.fx.drawText(ctx, (x, y) => [x, y]);
    });
  }

  function reset() {
    notice = null;
    bossLag = 1;
  }

  return {
    PW, PH, SW: PW, SH: PH, K, MENU_Y, init, resize, present, drawGame, drawTitle, showNotice, reset, win, dim, T, spr, hazard, fmtTime,
    get ctx() { return ctx; },
  };
})();

  <script>/* js/audio.js */
'use strict';

/* =========================================================
 * 하늘 사냥꾼 — 소리 (WebAudio 로 효과음과 배경음악을 실시간 합성. 소리 파일 없음)
 *   SH.audio.unlock()     첫 터치/키 입력 때 불러 소리를 켬
 *   SH.audio.sfx(name)    효과음
 *   SH.audio.music(name)  배경음악 ('title' 'stage1' 'stage2' 'stage3' 'boss' 'ending' 'none')
 * ========================================================= */

SH.audio = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
  const vol = { sfx: 0.8, music: 0.6 };
  let muted = false;
  const last = {};
  let wanted = 'none';
  let track = null; // { name, gain, step, next, def, mel }
  let timer = null;

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function unlock() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { ctx = null; return; }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 10;
    comp.ratio.value = 5;
    comp.attack.value = 0.003;
    comp.release.value = 0.2;
    master = ctx.createGain();
    sfxBus = ctx.createGain();
    musicBus = ctx.createGain();
    sfxBus.connect(master);
    musicBus.connect(master);
    master.connect(comp);
    comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    apply();
    document.addEventListener('visibilitychange', () => {
      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else ctx.resume();
    });
    timer = setInterval(schedule, 25);
    const w = wanted;
    wanted = 'none';
    music(w);
  }

  function apply() {
    if (!ctx) return;
    const now = ctx.currentTime;
    master.gain.setTargetAtTime(muted ? 0 : 0.9, now, 0.05);
    sfxBus.gain.setTargetAtTime(vol.sfx, now, 0.05);
    musicBus.gain.setTargetAtTime(vol.music * 0.5, now, 0.05);
  }
  function setVolume(v) {
    if (typeof v.sfx === 'number') vol.sfx = Math.max(0, Math.min(1, v.sfx));
    if (typeof v.music === 'number') vol.music = Math.max(0, Math.min(1, v.music));
    apply();
  }
  function setMuted(m) { muted = !!m; apply(); }

  /* ---------------- 합성 도우미 ---------------- */
  function tone(o) {
    const t = (o.t != null ? o.t : ctx.currentTime) + (o.delay || 0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + (o.slide || o.dur));
    const peak = o.v != null ? o.v : 0.2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + (o.a || 0.004));
    if (o.hold) g.gain.setValueAtTime(peak, t + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    let node = osc;
    if (o.lp) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = o.lp;
      osc.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(o.dest || sfxBus);
    osc.start(t);
    osc.stop(t + o.dur + 0.05);
  }
  function noise(o) {
    const t = (o.t != null ? o.t : ctx.currentTime) + (o.delay || 0);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    src.playbackRate.value = o.rate || 1;
    const f = ctx.createBiquadFilter();
    f.type = o.ft || 'lowpass';
    f.frequency.setValueAtTime(o.f || 1200, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.f2), t + o.dur);
    f.Q.value = o.q || 0.8;
    const g = ctx.createGain();
    const peak = o.v != null ? o.v : 0.2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + (o.a || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.dest || sfxBus);
    src.start(t, Math.random() * 0.5);
    src.stop(t + o.dur + 0.05);
  }
  function throttle(name, gap) {
    const now = ctx.currentTime;
    if (last[name] && now - last[name] < gap) return false;
    last[name] = now;
    return true;
  }

  /* ---------------- 효과음 ---------------- */
  const SFX = {
    shoot_spread() { if (throttle('shot', 0.085)) tone({ f: 1250, f2: 520, dur: 0.05, v: 0.028, type: 'square', lp: 3200 }); },
    shoot_laser() { if (throttle('shot', 0.085)) tone({ f: 1900, f2: 1100, dur: 0.05, v: 0.024, type: 'sawtooth', lp: 4200 }); },
    shoot_homing() { if (throttle('shot', 0.085)) tone({ f: 1050, f2: 600, dur: 0.05, v: 0.026, type: 'triangle' }); },
    missile() { if (throttle('missile', 0.2)) noise({ ft: 'bandpass', f: 2400, f2: 900, dur: 0.12, v: 0.05, q: 2 }); },
    hit() { if (throttle('hit', 0.05)) noise({ ft: 'bandpass', f: 3200, dur: 0.03, v: 0.04, q: 3 }); },
    kill() {
      if (!throttle('kill', 0.03)) return;
      noise({ f: 2200, f2: 160, dur: 0.28, v: 0.22 });
      tone({ f: 240, f2: 60, dur: 0.14, v: 0.08, type: 'square', lp: 900 });
    },
    heavy() {
      noise({ f: 1600, f2: 90, dur: 0.6, v: 0.32 });
      tone({ f: 120, f2: 35, dur: 0.4, v: 0.25, type: 'sine' });
    },
    bossBoom() { if (throttle('bb', 0.08)) noise({ f: 1500, f2: 120, dur: 0.35, v: 0.22 }); },
    bossDie() {
      noise({ f: 2400, f2: 60, dur: 1.8, v: 0.45, a: 0.01 });
      tone({ f: 90, f2: 28, dur: 1.4, v: 0.4, type: 'sine' });
      tone({ f: 180, f2: 40, dur: 0.9, v: 0.12, type: 'square', lp: 700 });
    },
    playerDie() {
      tone({ f: 700, f2: 70, dur: 0.7, v: 0.16, type: 'sawtooth', lp: 2200 });
      noise({ f: 1800, f2: 100, dur: 0.8, v: 0.3 });
    },
    bomb() {
      noise({ f: 400, f2: 4000, dur: 0.35, v: 0.2, a: 0.25 });
      noise({ f: 3000, f2: 80, dur: 1.4, v: 0.4, delay: 0.25 });
      tone({ f: 110, f2: 30, dur: 1.2, v: 0.35, type: 'sine', delay: 0.25 });
    },
    power() { [0, 4, 7, 12, 16].forEach((n, i) => tone({ f: mtof(72 + n), dur: 0.09, v: 0.07, delay: i * 0.045, type: 'square', lp: 4000 })); },
    item() { [0, 7].forEach((n, i) => tone({ f: mtof(79 + n), dur: 0.08, v: 0.07, delay: i * 0.06, type: 'triangle' })); },
    extend() { [0, 4, 7, 12, 7, 12, 16].forEach((n, i) => tone({ f: mtof(76 + n), dur: 0.1, v: 0.08, delay: i * 0.07, type: 'square', lp: 5000 })); },
    gem() { if (throttle('gem', 0.04)) tone({ f: 1700 + Math.random() * 500, dur: 0.05, v: 0.03, type: 'sine' }); },
    spark() { if (throttle('spark', 0.035)) tone({ f: 2300 + Math.random() * 600, dur: 0.03, v: 0.018, type: 'sine' }); },
    shield() {
      noise({ ft: 'highpass', f: 3000, dur: 0.3, v: 0.12 });
      tone({ f: 1500, f2: 400, dur: 0.3, v: 0.06, type: 'triangle' });
    },
    warning() {
      for (let i = 0; i < 4; i++) {
        tone({ f: 880, dur: 0.26, v: 0.09, delay: i * 0.6, type: 'square', lp: 2500, hold: 0.2 });
        tone({ f: 660, dur: 0.26, v: 0.09, delay: i * 0.6 + 0.3, type: 'square', lp: 2500, hold: 0.2 });
      }
    },
    phase() {
      noise({ f: 300, f2: 3000, dur: 0.5, v: 0.15, a: 0.3 });
      tone({ f: 200, f2: 800, dur: 0.5, v: 0.06, type: 'sawtooth', lp: 1800 });
    },
    clear() {
      const seq = [[72, 0], [76, 0.12], [79, 0.24], [84, 0.36], [79, 0.6], [84, 0.72]];
      seq.forEach(([n, d]) => {
        tone({ f: mtof(n), dur: 0.2, v: 0.08, delay: d, type: 'square', lp: 4000 });
        tone({ f: mtof(n - 12), dur: 0.2, v: 0.06, delay: d, type: 'triangle' });
      });
    },
    gameOver() { [67, 63, 60, 55].forEach((n, i) => tone({ f: mtof(n), dur: 0.38, v: 0.08, delay: i * 0.32, type: 'triangle', hold: 0.25 })); },
    click() { tone({ f: 880, f2: 1300, dur: 0.06, v: 0.06, type: 'triangle' }); },
    armor() { if (throttle('armor', 0.07)) tone({ f: 2600, f2: 1800, dur: 0.04, v: 0.03, type: 'square', lp: 5000 }); },
    laserWarn() {
      tone({ f: 300, f2: 1400, dur: 0.9, v: 0.06, type: 'sawtooth', lp: 2400, a: 0.4 });
      for (let i = 0; i < 4; i++) tone({ f: 1200, dur: 0.06, v: 0.05, delay: i * 0.22, type: 'square' });
    },
    laserFire() {
      noise({ ft: 'bandpass', f: 900, dur: 1.2, v: 0.22, q: 0.6, a: 0.02 });
      tone({ f: 110, f2: 70, dur: 1.2, v: 0.2, type: 'sawtooth', lp: 900 });
    },
    enemyMissile() { if (throttle('em', 0.25)) noise({ ft: 'bandpass', f: 1400, f2: 500, dur: 0.25, v: 0.07, q: 1.5 }); },
    missileDown() { if (throttle('md', 0.04)) { noise({ f: 2400, f2: 300, dur: 0.18, v: 0.12 }); tone({ f: 900, f2: 300, dur: 0.1, v: 0.04, type: 'square' }); } },
    charge() { if (throttle('charge', 0.15)) tone({ f: 220, f2: 1500, dur: 0.6, v: 0.05, type: 'sawtooth', lp: 2200, a: 0.3 }); },
    bigCharge() {
      tone({ f: 80, f2: 900, dur: 2.0, v: 0.12, type: 'sawtooth', lp: 1800, a: 1.2 });
      noise({ ft: 'bandpass', f: 400, f2: 2400, dur: 2.0, v: 0.08, q: 2, a: 1.0 });
    },
    call() { [0, 0.16, 0.32].forEach((d) => tone({ f: 1320, dur: 0.08, v: 0.06, delay: d, type: 'square' })); },
    gunIn() { if (throttle('gunIn', 0.12)) { noise({ ft: 'bandpass', f: 700, f2: 300, dur: 0.35, v: 0.12, q: 3 }); tone({ f: 160, f2: 90, dur: 0.25, v: 0.08, type: 'square', lp: 800 }); } },
    hatch() { noise({ ft: 'bandpass', f: 500, f2: 1600, dur: 0.4, v: 0.12, q: 2 }); tone({ f: 300, f2: 600, dur: 0.3, v: 0.05, type: 'square', lp: 1200 }); },
    muzzle() { if (throttle('muzzle', 0.06)) tone({ f: 620, f2: 180, dur: 0.08, v: 0.05, type: 'square', lp: 2000 }); },
    gunDown() { noise({ f: 2200, f2: 120, dur: 0.5, v: 0.28 }); tone({ f: 500, f2: 80, dur: 0.3, v: 0.1, type: 'square', lp: 1500 }); },
    armorFall() {
      noise({ f: 1200, f2: 60, dur: 1.4, v: 0.4 });
      for (let i = 0; i < 5; i++) tone({ f: 300 + i * 90, f2: 80, dur: 0.18, v: 0.08, delay: 0.1 + i * 0.12, type: 'square', lp: 900 });
    },
    part() {
      noise({ f: 2000, f2: 80, dur: 1.0, v: 0.38 });
      tone({ f: 140, f2: 30, dur: 0.8, v: 0.3, type: 'sine' });
    },
  };

  function sfx(name) {
    if (!ctx || muted || ctx.state !== 'running') return;
    const f = SFX[name];
    if (f) f();
  }

  /* ---------------- 배경음악 (간단한 칩튠 시퀀서) ----------------
   * chords: [근음 midi, 'M'|'m'] 한 마디씩. bass/kick/snare/hat: 16칸 패턴 */
  const TRACKS = {
    title: { bpm: 100, chords: [[60, 'M'], [57, 'm'], [53, 'M'], [55, 'M']], bass: '1...5...1...5...', kick: 'x.......x.......', snare: '................', hat: '..x...x...x...x.', lead: 0.55, seed: 3, arpOct: 1 },
    stage1: { bpm: 132, chords: [[53, 'M'], [60, 'M'], [62, 'm'], [58, 'M']], bass: '1.1.5.1.1.1.5.8.', kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', lead: 0.75, seed: 11, arpOct: 1 },
    stage2: { bpm: 140, chords: [[50, 'm'], [58, 'M'], [53, 'M'], [60, 'M']], bass: '1..11..15..51..8', kick: 'x..x..x...x..x..', snare: '....x.......x...', hat: 'xxx.xxx.xxx.xxx.', lead: 0.7, seed: 23, arpOct: 1 },
    stage3: { bpm: 150, chords: [[52, 'm'], [53, 'M'], [52, 'm'], [50, 'M']], bass: '1.1.1.1.1.1.5.5.', kick: 'x...x...x...x.x.', snare: '....x.......x...', hat: 'x.xxx.xxx.xxx.xx', lead: 0.8, seed: 37, arpOct: 1 },
    boss: { bpm: 162, chords: [[57, 'm'], [53, 'M'], [55, 'M'], [52, 'm']], bass: '1111111155558888', kick: 'x.x.x.x.x.x.x.x.', snare: '....x.......x..x', hat: 'xxxxxxxxxxxxxxxx', lead: 0.85, seed: 51, arpOct: 1 },
    ending: { bpm: 96, chords: [[60, 'M'], [53, 'M'], [55, 'M'], [60, 'M']], bass: '1.......5.......', kick: 'x.......x.......', snare: '........x.......', hat: '....x.......x...', lead: 0.5, seed: 7, arpOct: 2 },
  };

  function makeMelody(def) {
    const rng = SH.rng(def.seed);
    const bars = [];
    for (let v = 0; v < 2; v++) {
      for (const [root, q] of def.chords) {
        const tones = q === 'M' ? [0, 4, 7, 12] : [0, 3, 7, 12];
        const scale = q === 'M' ? [0, 2, 4, 5, 7, 9, 11, 12] : [0, 2, 3, 5, 7, 8, 10, 12];
        const bar = [];
        for (let s = 0; s < 8; s++) {
          const strong = s % 2 === 0;
          if (rng() > def.lead && !strong) { bar.push(null); continue; }
          if (s > 0 && rng() < 0.22) { bar.push('-'); continue; } // 이어서 길게
          const pool = strong ? tones : scale;
          bar.push(root + 12 + pool[Math.floor(rng() * pool.length)]);
        }
        bars.push(bar);
      }
    }
    return bars;
  }

  function music(name) {
    if (wanted === name && (track || name === 'none')) return;
    wanted = name;
    if (!ctx) return;
    if (track) {
      const g = track.gain;
      g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.15);
      setTimeout(() => g.disconnect(), 800);
      track = null;
    }
    const def = TRACKS[name];
    if (!def) return;
    const gain = ctx.createGain();
    gain.gain.value = 1;
    gain.connect(musicBus);
    track = { name, def, gain, step: 0, next: ctx.currentTime + 0.08, mel: def.mel || (def.mel = makeMelody(def)) };
  }

  function schedule() {
    if (!ctx || !track || ctx.state !== 'running') return;
    const T = track, d = T.def;
    const stepDur = 60 / d.bpm / 4;
    while (T.next < ctx.currentTime + 0.14) {
      playStep(T, T.step, T.next, stepDur);
      T.next += stepDur;
      T.step += 1;
    }
  }

  function playStep(T, step, t, sd) {
    const d = T.def;
    const s16 = step % 16;
    const bar = Math.floor(step / 16);
    const [root, q] = d.chords[bar % d.chords.length];
    const dest = T.gain;
    const third = q === 'M' ? 4 : 3;
    // 드럼
    if (d.kick[s16] === 'x') {
      tone({ t, f: 150, f2: 40, slide: 0.12, dur: 0.18, v: 0.5, type: 'sine', dest });
    }
    if (d.snare[s16] === 'x') {
      noise({ t, ft: 'bandpass', f: 1800, dur: 0.14, v: 0.22, q: 0.7, dest });
      tone({ t, f: 220, f2: 140, dur: 0.08, v: 0.08, type: 'triangle', dest });
    }
    if (d.hat[s16] === 'x') noise({ t, ft: 'highpass', f: 7000, dur: 0.035, v: s16 % 4 === 0 ? 0.08 : 0.05, dest });
    // 베이스
    const bc = d.bass[s16];
    if (bc !== '.') {
      const n = root - 24 + (bc === '5' ? 7 : bc === '8' ? 12 : 0);
      tone({ t, f: mtof(n), dur: sd * 1.8, v: 0.2, type: 'sawtooth', lp: 600, dest });
    }
    // 아르페지오
    const arp = [0, third, 7, 12, 7, third, 0, 7][s16 % 8];
    tone({ t, f: mtof(root + 12 * d.arpOct + arp), dur: sd * 0.9, v: 0.035, type: 'square', lp: 2600, dest });
    // 멜로디 (8분음표)
    if (s16 % 2 === 0) {
      const mbar = T.mel[bar % T.mel.length];
      const i = s16 / 2;
      const n = mbar[i];
      if (typeof n === 'number') {
        let len = 1;
        while (i + len < 8 && mbar[i + len] === '-') len++;
        tone({ t, f: mtof(n), dur: sd * 2 * len * 0.95, v: 0.07, type: 'square', lp: 3400, a: 0.01, hold: sd * 2 * len * 0.6, dest });
        tone({ t, f: mtof(n) * 1.004, dur: sd * 2 * len * 0.95, v: 0.03, type: 'triangle', dest });
      }
    }
  }

  return { unlock, sfx, music, setVolume, setMuted, get muted() { return muted; } };
})();

  <script>/* js/input.js */
'use strict';

/* =========================================================
 * 하늘 사냥꾼 — 플레이 중 입력
 *  · 키보드가 기본. 휴대폰 터치는 화면을 끌면 비행기가 손가락 움직임만큼 따라 움직임
 *    (마우스로는 움직이지 않음). 끄는 중에 두 번째 손가락으로 톡 치면 폭탄.
 *  · 키보드: 방향키/WASD 이동, Shift 정밀 이동, X·Space·B 폭탄, Esc·P 일시정지
 * 메뉴 입력은 SH.ui 가, 둘 사이 나눠 주기는 main.js 가 합니다.
 * ========================================================= */

SH.input = (() => {
  const { W, H, clamp } = SH;
  const keys = new Set();
  const drag = { id: null, fx: 0, fy: 0, sx: 0, sy: 0, px: 0, py: 0, anchor: -1 };
  let sens = 1.3;
  let bombQueued = false;
  let scale = () => 1; // 화면 CSS 픽셀 / 게임 논리 좌표

  const MOVE_KEYS = {
    ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1],
    KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, -1], KeyS: [0, 1],
  };

  function setScale(fn) { scale = fn; }

  function dragDown(e) {
    if (drag.id === null) {
      drag.id = e.pointerId;
      drag.fx = drag.sx = e.clientX;
      drag.fy = drag.sy = e.clientY;
      drag.anchor = -1;
    } else if (e.pointerType === 'touch') {
      bombQueued = true;
    }
  }
  function dragMove(e) {
    if (e.pointerId !== drag.id) return false;
    drag.fx = e.clientX;
    drag.fy = e.clientY;
    return true;
  }
  function dragUp(e) {
    if (e.pointerId === drag.id) drag.id = null;
  }

  /** 플레이 중 키. 일시정지 키면 'pause' 를 돌려줌 */
  function keyDown(e) {
    keys.add(e.code);
    if (e.repeat) return null;
    if (e.code === 'KeyX' || e.code === 'Space' || e.code === 'KeyB') bombQueued = true;
    if (e.code === 'Escape' || e.code === 'KeyP') return 'pause';
    return null;
  }
  function keyUp(e) { keys.delete(e.code); }
  const isGameKey = (code) => !!MOVE_KEYS[code] || code === 'Space';

  function releaseAll() {
    keys.clear();
    drag.id = null;
  }

  /** 매 틱 게임 입력 채우기 */
  function apply(g) {
    const inp = g.input;
    let ax = 0, ay = 0;
    for (const code of keys) {
      const m = MOVE_KEYS[code];
      if (m) { ax += m[0]; ay += m[1]; }
    }
    inp.ax = clamp(ax, -1, 1);
    inp.ay = clamp(ay, -1, 1);
    inp.focus = keys.has('ShiftLeft') || keys.has('ShiftRight');

    const p = g.player;
    if (drag.id !== null && !p.dead && !p.entering && !p.exiting) {
      if (drag.anchor !== p.anchor) {
        drag.anchor = p.anchor;
        drag.sx = drag.fx;
        drag.sy = drag.fy;
        drag.px = p.x;
        drag.py = p.y;
      }
      const s = scale() || 1;
      const tx = drag.px + ((drag.fx - drag.sx) / s) * sens;
      const ty = drag.py + ((drag.fy - drag.sy) / s) * sens;
      const cx = clamp(tx, 46, W - 46), cy = clamp(ty, 50, H - 26);
      // 벽에 닿으면 기준점을 옮겨, 반대로 움직일 때 바로 반응하게
      if (cx !== tx) { drag.px = cx; drag.sx = drag.fx; }
      if (cy !== ty) { drag.py = cy; drag.sy = drag.fy; }
      inp.tx = cx;
      inp.ty = cy;
    } else {
      inp.tx = null;
      inp.ty = null;
      if (drag.id !== null) drag.anchor = -1;
    }
    if (bombQueued) {
      bombQueued = false;
      inp.bomb = true;
    }
  }

  function queueBomb() { bombQueued = true; }
  function setSensitivity(v) { sens = v; }

  return { setScale, dragDown, dragMove, dragUp, keyDown, keyUp, isGameKey, releaseAll, apply, queueBomb, setSensitivity };
})();
