  <script>/* js/render.js */
'use strict';

/* =========================================================
 * 하늘 사냥꾼 — 픽셀 화면 그리기
 *
 * 모든 것을 225×400 픽셀 버퍼(SH.render.ctx)에 그린 다음 present() 로
 * 번짐 없이(최근접) 화면 캔버스에 크게 늘려 옮깁니다.
 * 게임 좌표(450×800)는 절반으로 줄여 픽셀 좌표가 됩니다.
 * ========================================================= */

SH.render = (() => {
  const PW = 225, PH = 400, K = 0.5;
  let view = null, vctx = null, buf = null, ctx = null;
  const bg = { kind: null, props: [], tiles: null, scroll: 0, embers: [], rain: [], bolt: 0, boltX: 0, nextBolt: 5, fade: 0, t: 0 };
  let notice = null;
  let bossLag = 1;
  const title = { t: 0, mobs: [] };
  const R = Math.random;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
  const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];

  function init(canvas) {
    view = canvas;
    vctx = view.getContext('2d');
    buf = document.createElement('canvas');
    buf.width = PW;
    buf.height = PH;
    ctx = buf.getContext('2d');
    ctx.imageSmoothingEnabled = false;
  }

  function resize(devW, devH, cssW, cssH) {
    view.width = devW;
    view.height = devH;
    view.style.width = cssW + 'px';
    view.style.height = cssH + 'px';
  }

  function present() {
    vctx.imageSmoothingEnabled = false;
    vctx.drawImage(buf, 0, 0, view.width, view.height);
  }

  /* ---------------- 픽셀 도우미 ---------------- */
  function canvasFrom(w, h, fn) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const x = c.getContext('2d');
    const img = x.createImageData(w, h);
    fn(img.data, w, h);
    x.putImageData(img, 0, 0);
    return c;
  }
  const hex = (h) => SH.pix.rgba(h);
  function put(d, w, x, y, c) {
    const o = (y * w + x) * 4;
    d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = c[3];
  }
  /** 0..1 값을 색 단계로 (단계 사이를 바이어 디더링) */
  function ramp(cols, v, x, y) {
    const n = cols.length - 1;
    const f = Math.max(0, Math.min(0.9999, v)) * n;
    const i = Math.floor(f);
    return bayer(x, y) < f - i ? cols[Math.min(n, i + 1)] : cols[i];
  }
  const TAU = Math.PI * 2;

  /* =========================================================
   * 배경
   * ========================================================= */
  function skyTile() {
    const cols = ['#3672d8', '#4589e6', '#5aa0ef', '#71b6f5', '#8ccaf8', '#a9dcfa', '#c8ecfc'].map(hex);
    return canvasFrom(PW, PH, (d, w, h) => {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) put(d, w, x, y, ramp(cols, y / h, x, y));
    });
  }

  function seaTile() {
    const base = ['#0f3468', '#14457f', '#1a5696', '#2167aa'].map(hex);
    const crest = hex('#7fbcec'), white = hex('#d8f2ff'), shadow = hex('#0f3468');
    return canvasFrom(PW, PH, (d, w, h) => {
      for (let y = 0; y < h; y++) {
        const v = (y / h) * TAU;
        for (let x = 0; x < w; x++) {
          const n = 0.5 + 0.22 * Math.sin(x * 0.045 + v * 2) + 0.16 * Math.sin(x * 0.11 - v * 3 + 1.3) + 0.1 * Math.sin(x * 0.23 + v * 5);
          put(d, w, x, y, ramp(base, n, x, y));
        }
      }
      // 물결
      for (let i = 0; i < 150; i++) {
        const x0 = Math.floor(R() * w), y0 = Math.floor(R() * h), len = 3 + Math.floor(R() * 5);
        for (let k = 0; k < len; k++) {
          const x = (x0 + k) % w;
          const yy = (y0 + (k === 0 || k === len - 1 ? 1 : 0)) % h;
          put(d, w, x, yy, k === 1 ? white : crest);
          put(d, w, x, (yy + 1) % h, shadow);
        }
      }
    });
  }

  function lavaTiles() {
    const rock = ['#170810', '#221018', '#2e1620', '#3a1e26'].map(hex);
    const glow = hex('#4a1410');
    const L = ['#8a1c0e', '#d23a16', '#ff6a1a', '#ffa62a', '#ffe58a'].map(hex);
    const rivers = [[42, 18, 1, 0.3, 8], [132, 26, 2, 2.1, 10], [200, 14, 1, 4.2, 6]];
    const make = (shift) => canvasFrom(PW, PH, (d, w, h) => {
      for (let y = 0; y < h; y++) {
        const v = (y / h) * TAU;
        for (let x = 0; x < w; x++) {
          const n = 0.45 + 0.2 * Math.sin(x * 0.07 + v * 3) + 0.18 * Math.sin(x * 0.19 - v * 4 + 2) + 0.12 * Math.sin(x * 0.41 + v * 7);
          put(d, w, x, y, ramp(rock, n, x, y));
        }
        for (const [x0, amp, k, ph, wd] of rivers) {
          const cx = x0 + Math.sin(v * k + ph) * amp + Math.sin(v * (k + 2)) * 5;
          const half = wd / 2 + Math.sin(v * 5 + ph) * 1.5;
          for (let x = Math.floor(cx - half - 4); x <= Math.ceil(cx + half + 4); x++) {
            if (x < 0 || x >= w) continue;
            const dist = Math.abs(x + 0.5 - cx) / half;
            if (dist > 1) {
              if (dist < 1 + 4 / half && bayer(x, y) < 0.55) put(d, w, x, y, glow);
              continue;
            }
            const lvl = Math.min(4, Math.floor((1 - dist) * 5 + ((shift + y * 0.25) % 1 > 0.5 && dist < 0.4 ? 1 : 0)));
            put(d, w, x, y, L[Math.max(0, lvl)]);
          }
        }
      }
      // 갈라진 틈
      const crack = hex('#ff5a1a'), crackD = hex('#6a1a10');
      const rnd = SH.rng(99);
      for (let i = 0; i < 30; i++) {
        let x = rnd() * w, y = rnd() * h;
        for (let s = 0; s < 9; s++) {
          const xi = Math.floor(x) % w, yi = Math.floor(y) % h;
          put(d, w, (xi + w) % w, yi, s % 3 === 1 ? crack : crackD);
          x += (rnd() - 0.5) * 3;
          y += 1 + rnd();
        }
      }
    });
    return [make(0), make(0.5)];
  }

  function overlay(fn, color) {
    const c = hex(color);
    return canvasFrom(PW, PH, (d, w, h) => {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (bayer(x, y) < fn(x, y)) put(d, w, x, y, c);
    });
  }
  let stormOverlay = null, lavaOverlay = null, dimOverlay = null, dimLight = null;
  function getOverlays() {
    if (!stormOverlay) {
      stormOverlay = overlay((x, y) => Math.max(0, 0.7 - y / 140), '#081430');
      lavaOverlay = overlay((x, y) => {
        const dx = (x - PW / 2) / (PW / 2), dy = (y - PH * 0.55) / (PH * 0.6);
        return Math.max(0, Math.hypot(dx, dy) - 0.75) * 1.6;
      }, '#0a0306');
      dimOverlay = overlay(() => 0.62, '#0c0820');
      dimLight = overlay(() => 0.4, '#0c0820');
    }
  }

  function prop(name, layer, sp, top) {
    const inf = SH.pix.info(name) || { w: 40, h: 20 };
    return { name, layer, sp, x: 10 + R() * (PW - 20), y: top ? -inf.h - R() * 160 : R() * PH, h: inf.h };
  }

  function setBg(kind) {
    if (bg.kind === kind) return;
    if (bg.kind) bg.fade = 1;
    bg.kind = kind;
    bg.props = [];
    bg.scroll = 0;
    getOverlays();
    if (kind === 'sky') {
      bg.tiles = [skyTile()];
      bg.props.push(prop('island', 0, 12, false), prop('island', 0, 12, true));
      for (const [n, l, s] of [['cloud3', 1, 20], ['cloud1', 1, 20], ['cloud3', 1, 20], ['cloud0', 2, 42], ['cloud2', 2, 42], ['cloud1', 2, 42]]) bg.props.push(prop(n, l, s, false));
    } else if (kind === 'sea') {
      bg.tiles = [seaTile()];
      bg.props.push(prop('rock', 0, 35, false), prop('rock', 0, 35, true));
      bg.rain = [];
      for (let i = 0; i < 45; i++) bg.rain.push({ x: R() * (PW + 60), y: R() * PH, s: 230 + R() * 120 });
    } else if (kind === 'lava') {
      bg.tiles = lavaTiles();
      bg.embers = [];
      for (let i = 0; i < 40; i++) bg.embers.push({ x: R() * PW, y: R() * PH, s: 14 + R() * 30, ph: R() * TAU });
    }
  }

  function updateBg(dt, slow) {
    const k = slow ? 0.6 : 1;
    bg.t += dt;
    const sp = bg.kind === 'sea' ? 35 : 28;
    bg.scroll = (bg.scroll + dt * sp * k) % PH;
    for (const p of bg.props) {
      p.y += p.sp * dt * k;
      if (p.y - p.h / 2 > PH) {
        p.y = -p.h / 2 - R() * 140;
        p.x = 10 + R() * (PW - 20);
      }
    }
    if (bg.kind === 'sea') {
      for (const r of bg.rain) {
        r.y += r.s * dt;
        r.x -= r.s * 0.3 * dt;
        if (r.y > PH + 4) { r.y = -4; r.x = R() * (PW + 60); }
      }
      bg.nextBolt -= dt;
      if (bg.nextBolt <= 0) { bg.bolt = 1; bg.boltX = 20 + R() * (PW - 40); bg.nextBolt = (slow ? 3 : 6) + R() * 5; }
      bg.bolt = Math.max(0, bg.bolt - dt * 3);
    } else if (bg.kind === 'lava') {
      for (const e of bg.embers) {
        e.y -= e.s * dt;
        e.ph += dt * 3;
        if (e.y < -2) { e.y = PH + 2; e.x = R() * PW; }
      }
    }
    if (bg.fade > 0) bg.fade = Math.max(0, bg.fade - dt * 1.5);
  }

  function drawBg() {
    if (bg.kind === 'sky') {
      ctx.drawImage(bg.tiles[0], 0, 0);
      for (let layer = 0; layer < 3; layer++) for (const p of bg.props) if (p.layer === layer) SH.pix.draw(ctx, p.name, p.x, p.y);
      return;
    }
    const tile = bg.tiles[bg.kind === 'lava' ? Math.floor(bg.t * 3) % 2 : 0];
    const y = Math.floor(bg.scroll);
    ctx.drawImage(tile, 0, y - PH);
    ctx.drawImage(tile, 0, y);
    for (const p of bg.props) SH.pix.draw(ctx, p.name, p.x, p.y);
    if (bg.kind === 'sea') {
      ctx.drawImage(stormOverlay, 0, 0);
      ctx.fillStyle = '#9cc4f0';
      for (const r of bg.rain) {
        const x = Math.round(r.x), yy = Math.round(r.y);
        ctx.fillRect(x, yy, 1, 1);
        ctx.fillRect(x - 1, yy + 1, 1, 1);
        ctx.fillRect(x - 1, yy + 2, 1, 1);
      }
      if (bg.bolt > 0.5) {
        ctx.fillStyle = '#fff8c0';
        let x = bg.boltX;
        for (let yy = 0; yy < 90; yy += 3) {
          ctx.fillRect(Math.round(x), yy, 2, 3);
          x += (R() - 0.5) * 6;
        }
      }
    } else {
      ctx.drawImage(lavaOverlay, 0, 0);
      for (const e of bg.embers) {
        ctx.fillStyle = Math.sin(e.ph) > 0 ? '#ffb02e' : '#ff6a1a';
        ctx.fillRect(Math.round(e.x + Math.sin(e.ph) * 2), Math.round(e.y), 1, 1);
      }
    }
  }

  /* =========================================================
   * 글자·창
   * ========================================================= */
  const T = (str, x, y, o) => SH.pix.text(ctx, str, x, y, o);

  /** 9칸 창 (frame 그림을 잘라 늘림) */
  function win(x, y, w, h, o) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    const img = SH.pix.has('frame') ? SH.pix.get('frame', 0) : null;
    if (!img) {
      ctx.fillStyle = '#1b1230'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = o && o.hot ? '#ffd84a' : '#c9a8ff'; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
      ctx.fillStyle = '#1e1840'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
      return;
    }
    const c = 4, m = 4;
    const iw = img.width - c * 2;
    ctx.drawImage(img, 0, 0, c, c, x, y, c, c);
    ctx.drawImage(img, c + iw, 0, c, c, x + w - c, y, c, c);
    ctx.drawImage(img, 0, c + iw, c, c, x, y + h - c, c, c);
    ctx.drawImage(img, c + iw, c + iw, c, c, x + w - c, y + h - c, c, c);
    ctx.drawImage(img, c, 0, m, c, x + c, y, w - c * 2, c);
    ctx.drawImage(img, c, c + iw, m, c, x + c, y + h - c, w - c * 2, c);
    ctx.drawImage(img, 0, c, c, m, x, y + c, c, h - c * 2);
    ctx.drawImage(img, c + iw, c, c, m, x + w - c, y + c, c, h - c * 2);
    ctx.drawImage(img, c, c, m, m, x + c, y + c, w - c * 2, h - c * 2);
    if (o && o.hot) {
      ctx.fillStyle = '#ffd84a';
      ctx.fillRect(x + 2, y + 1, w - 4, 1);
      ctx.fillRect(x + 2, y + h - 2, w - 4, 1);
      ctx.fillRect(x + 1, y + 2, 1, h - 4);
      ctx.fillRect(x + w - 2, y + 2, 1, h - 4);
    }
  }

  function dim(light) {
    getOverlays();
    ctx.drawImage(light ? dimLight : dimOverlay, 0, 0);
  }

  /** 줄무늬 띠 (경고) */
  function hazard(y, t) {
    ctx.fillStyle = '#1b1230';
    ctx.fillRect(0, y, PW, 9);
    ctx.fillStyle = '#ffd84a';
    const off = Math.floor(t * 30) % 12;
    for (let x = -12; x < PW + 12; x += 12) {
      for (let j = 0; j < 7; j++) ctx.fillRect(x + off + j, y + 1 + j, 5, 1);
    }
  }

  /** 그림이 없으면 대신 네모 */
  function spr(name, x, y, o, fb) {
    if (SH.pix.draw(ctx, name, x, y, o)) return;
    ctx.fillStyle = (o && o.flash) ? '#fff' : fb || '#ff00ff';
    const s = (o && o.fbs) || 8;
    ctx.fillRect(Math.round(x - s / 2), Math.round(y - s / 2), s, s);
  }

  /* =========================================================
   * 게임 물체
   * ========================================================= */
  /* 기계 보스: 몸통(모습별) + 포탑 + 코어 방어막 */
  function drawBoss(g) {
    const e = g.boss;
    if (!e) return;
    const x = e.x * K, y = e.y * K;
    const ph = g.bossPhase;
    let flash = e.flash > 0;
    if (e.inv > 0 && Math.floor(g.time * 20) % 2) flash = true;
    if (e.state === 'dying') {
      if (Math.floor(g.time * 16) % 2) flash = true;
      if (e.st > 2.8 && Math.floor(g.time * 24) % 2) return;
    }
    const blink = Math.floor(g.time * (ph.berserk ? 8 : 3)) & 1;
    spr('titan', x, y, { frame: ph.look * 2 + blink, flash, fbs: 60 }, '#5e6e8c');
    for (const p of Object.values(e.parts)) {
      const px = x + p.ox * K, py = y + p.oy * K;
      if (p.alive) {
        spr('turret', px, py, { frame: SH.turretFrame ? SH.turretFrame(p.ang) : 4, flash: p.flash > 0 || flash, fbs: 12 }, '#8e9ebc');
        if (e.state === 'fight' && p.hp < p.maxHp) {
          const w = 16, r = p.hp / p.maxHp;
          ctx.fillStyle = '#0e1220'; ctx.fillRect(Math.round(px - w / 2) - 1, Math.round(py + 13), w + 2, 3);
          ctx.fillStyle = r > 0.3 ? '#ffd84a' : '#e8384f'; ctx.fillRect(Math.round(px - w / 2), Math.round(py + 14), Math.max(1, Math.round(w * r)), 1);
        }
      } else {
        spr('turretWreck', px, py, { frame: Math.floor(g.time * 6), fbs: 10 }, '#3a4660');
        if (Math.random() < 0.08) SH.fx.anim('puff', px + (Math.random() - 0.5) * 6, py - 4, 10);
      }
    }
    // 코어 방어막
    if (ph.shield && e.state === 'fight' && Math.floor(g.time * 10) % 3) {
      SH.fx.pixelCircle(ctx, x, y + g.def.core.oy * K, 21 + (Math.floor(g.time * 6) & 1), '#8fd4ff', 1);
    }
  }

  /* 레이저: 경고(위험 구역 점선) → 광선 */
  function drawBeams(g) {
    for (const bm of g.beams) {
      const ox = bm.x * K, oy = bm.y * K;
      if (!bm.on) {
        const blink = Math.floor(bm.t * 12) & 1;
        const lo = Math.min(bm.a0, bm.a1), hi = Math.max(bm.a0, bm.a1);
        const steps = Math.max(2, Math.ceil((hi - lo) / 0.06));
        ctx.fillStyle = blink ? '#ff3b4e' : '#ffb0a0';
        for (let i = 0; i <= steps; i++) {
          const a = lo + ((hi - lo) * i) / steps;
          const ux = Math.cos(a), uy = Math.sin(a);
          for (let d = 14 + ((i * 3 + Math.floor(bm.t * 30)) % 6); d < 460; d += 6) ctx.fillRect(Math.round(ox + ux * d), Math.round(oy + uy * d), 1, 1);
        }
        // 시작 방향은 굵게
        const ux = Math.cos(bm.a0), uy = Math.sin(bm.a0);
        ctx.fillStyle = '#ff3b4e';
        for (let d = 10; d < 460; d += 2) ctx.fillRect(Math.round(ox + ux * d), Math.round(oy + uy * d), 1, 1);
        if (blink) SH.pix.text(ctx, '!', ox, oy + 12, { color: '#ffd84a', scale: 2, align: 'center' });
      } else {
        const ux = Math.cos(bm.ang), uy = Math.sin(bm.ang);
        const w = Math.max(3, Math.round(bm.width * K));
        const fl = Math.floor(g.time * 30) & 1;
        const layers = [[w + 2, '#e8384f'], [w, fl ? '#ff8a8a' : '#ff6a6a'], [Math.max(1, w - 4), '#ffd0d0'], [Math.max(1, w - 6), '#ffffff']];
        for (const [lw, c] of layers) {
          ctx.fillStyle = c;
          for (let d = 4; d < 470; d += 1) ctx.fillRect(Math.round(ox + ux * d - lw / 2), Math.round(oy + uy * d - lw / 2), lw, lw);
        }
        SH.pix.draw(ctx, 'boom', ox, oy, { frame: 1 + (Math.floor(g.time * 20) % 2) });
      }
    }
  }

  function drawPlayerBullets(g) {
    for (const b of g.pb) {
      const x = b.x * K, y = b.y * K;
      if (b.kind === 'spread') spr('shot_spread', x, y, { frame: b.rot < -0.05 ? 1 : b.rot > 0.05 ? 2 : 0, fbs: 3 }, '#ffd84a');
      else if (b.kind === 'homing') spr('shot_homing', x, y, { fbs: 3 }, '#a6f070');
      else if (b.kind === 'laser') spr('shot_laser', x, y, { frame: (b.lv || 1) - 1, fbs: 4 }, '#8fd4ff');
      else if (b.kind === 'missile') {
        const dir = Math.round((((b.rot % TAU) + TAU) % TAU) / (Math.PI / 4)) % 8;
        spr('missile', x, y, { frame: dir, fbs: 4 }, '#45c44a');
      }
    }
  }

  function drawEnemyBullets(g) {
    const f = Math.floor(g.time * 8) & 1;
    for (const b of g.eb) {
      if (b.missile) {
        const dir = Math.round((((b.rot + Math.PI / 2) % TAU) + TAU) % TAU / (Math.PI / 4)) % 8;
        spr('emissile', b.x * K, b.y * K, { frame: dir, fbs: 5 }, '#e8384f');
        if (Math.random() < 0.3) SH.fx.anim('puff', b.x * K - Math.cos(b.rot) * 5, b.y * K - Math.sin(b.rot) * 5, 14);
      } else spr((b.big ? 'big_' : 'orb_') + b.kind, b.x * K, b.y * K, { frame: f, fbs: b.big ? 10 : 5 }, '#ff4f9a');
    }
  }

  function drawItems(g) {
    for (const it of g.items) {
      const x = it.x * K, y = it.y * K;
      const t = it.t;
      switch (it.kind) {
        case 'gem': spr('gem', x, y, { frame: Math.floor(t * 10 + it.x), fbs: 4 }, '#8fd4ff'); break;
        case 'bigGem': spr('bigGem', x, y, { frame: Math.floor(t * 6), fbs: 6 }, '#ffd84a'); break;
        case 'spark': spr('spark', x, y, { frame: Math.floor(t * 16), fbs: 2 }, '#fff4a8'); break;
        case 'power': spr('item_' + it.wtype, x, y, { frame: Math.floor(t * 6), fbs: 10 }, SH.WEAPONS[it.wtype].color); break;
        default: spr('item_' + it.kind, x, y + (Math.floor(t * 4) % 2), { frame: Math.floor(t * 6), fbs: 10 }, '#ffffff');
      }
    }
  }

  function drawPlayer(g) {
    const p = g.player;
    if (p.dead) return;
    const x = p.x * K, y = p.y * K;
    const blink = p.inv > 0 && !p.entering && Math.floor(g.time * 15) % 2 === 0;
    if (!blink) {
      spr('flame', x, y + 15, { frame: Math.floor(g.time * 20), fbs: 3 }, '#8fd4ff');
      spr('player', x, y, { frame: p.bank < -0.35 ? 0 : p.bank > 0.35 ? 2 : 1, fbs: 12 }, '#ffffff');
    }
    if (p.shield > 0 && !(p.shield < 2 && Math.floor(g.time * 10) % 2)) spr('shield', x, y, { frame: Math.floor(g.time * 6), fbs: 1 }, '#8fd4ff');
    if (!p.entering && !p.exiting) {
      const cx = Math.round(x), cy = Math.round(y);
      ctx.fillStyle = '#ff3a7a';
      ctx.fillRect(cx - 1, cy - 1, 3, 3);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx, cy, 1, 1);
    }
  }

  /* =========================================================
   * HUD
   * ========================================================= */
  function drawHud(g, best) {
    T('SCORE', 4, 5, { color: '#ffd84a' });
    T(SH.fmt(g.score), 4, 15, { color: '#ffffff' });
    T('HI', 98, 5, { color: '#ff7aa8' });
    T(SH.fmt(Math.max(best, g.score)), 98, 15, { color: '#ffe3ee' });
    const lives = Math.max(0, g.lives);
    if (lives > 5) {
      spr('icon_life', 8, 28, { fbs: 6 }, '#ffffff');
      T('×' + lives, 15, 28, { color: '#ffffff' });
    } else for (let i = 0; i < lives; i++) spr('icon_life', 8 + i * 10, 28, { fbs: 6 }, '#ffffff');
    for (let i = 0; i < g.bombs; i++) spr('icon_bomb', 70 + i * 10, 28, { fbs: 6 }, '#ffd84a');
    const w = SH.WEAPONS[g.weapon];
    T(SH.fx.WNAME[g.weapon], 136, 28, { color: w.light });
    for (let i = 0; i < SH.MAX_POWER; i++) {
      ctx.fillStyle = '#1b1230';
      ctx.fillRect(136 + i * 6, 34, 5, 4);
      ctx.fillStyle = i < g.power ? w.color : '#3a3058';
      ctx.fillRect(137 + i * 6, 35, 3, 2);
    }
    if (g.loop > 0) T(`LOOP ${g.loop + 1}`, 168, 15, { color: '#ff9ac2' });

    const e = g.boss;
    if (e && e.state !== 'dying') {
      const ph = g.bossPhase;
      const fillIn = e.state === 'enter' ? Math.min(1, e.st / 3) : 1;
      const ratio = Math.max(0, e.hp / e.maxHp) * fillIn;
      bossLag = ratio > bossLag ? ratio : bossLag + (ratio - bossLag) * 0.05;
      const x = 4, y = 50, w2 = PW - 8;
      T(g.def.name, x, y - 5, { color: ph.berserk ? '#ff5a5a' : '#ff8a8a', size: 10 });
      if (e.state === 'fight') T(fmtTime(g.fightT), PW - 4, y - 5, { color: '#ffffff', align: 'right' });
      ctx.fillStyle = '#1b1230';
      ctx.fillRect(x, y, w2, 6);
      ctx.fillStyle = '#3a2050';
      ctx.fillRect(x + 1, y + 1, w2 - 2, 4);
      if (ph.shield) {
        ctx.fillStyle = '#5e6e8c';
        ctx.fillRect(x + 1, y + 1, Math.round((w2 - 2) * ratio), 4);
        for (let i = 0; i < w2 - 2; i += 4) { ctx.fillStyle = '#8fd4ff'; ctx.fillRect(x + 1 + i + (Math.floor(g.time * 8) % 4), y + 2, 1, 2); }
        T('SHIELD', PW / 2, y + 12, { color: '#8fd4ff', align: 'center' });
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x + 1, y + 1, Math.round((w2 - 2) * bossLag), 4);
        ctx.fillStyle = ph.berserk ? '#ff3030' : '#e8384f';
        ctx.fillRect(x + 1, y + 1, Math.round((w2 - 2) * ratio), 4);
        ctx.fillStyle = '#ff8a9a';
        ctx.fillRect(x + 1, y + 1, Math.round((w2 - 2) * ratio), 1);
      }
      ctx.fillStyle = '#1b1230';
      for (const p of g.def.phases) if (p.until > 0) ctx.fillRect(x + Math.round(w2 * p.until), y, 1, 6);
    } else bossLag = 1;
  }

  function fmtTime(sec) {
    const m = Math.floor(sec / 60), r = Math.floor(sec % 60);
    return `${m}:${String(r).padStart(2, '0')}`;
  }

  /* =========================================================
   * 안내 (스테이지 시작 · 경고 · 클리어 · 짧은 알림)
   * ========================================================= */
  function drawBanners(g) {
    if (g.phase === 'intro') {
      const u = g.phaseT;
      if (u < 1.95 && !(u > 1.6 && Math.floor(u * 20) % 2)) {
        const slide = Math.max(0, 1 - u / 0.35) * 120;
        dimBand(PH * 0.36 - 26, 56);
        T(g.stage.en, PW / 2 - slide, PH * 0.36 - 10, { color: '#ffd84a', scale: 3, align: 'center', shadow: '#8a3a10' });
        T(g.stage.name, PW / 2 + slide, PH * 0.36 + 16, { color: '#ffffff', align: 'center', size: 12 });
        if (g.loop > 0) T(`LOOP ${g.loop + 1}`, PW / 2, PH * 0.36 + 38, { color: '#c9a8ff', align: 'center' });
      }
    } else if (g.phase === 'warning') {
      const u = g.phaseT;
      if (u < 2.7) {
        if (Math.floor(u * 6) % 2 === 0) {
          ctx.fillStyle = '#ff1e3c';
          ctx.globalAlpha = 0.18;
          ctx.fillRect(0, 0, PW, PH);
          ctx.globalAlpha = 1;
        }
        const y = Math.round(PH * 0.4);
        hazard(y - 36, u);
        hazard(y + 28, -u);
        if (Math.floor(u * 4) % 2 === 0) T('WARNING', PW / 2, y - 14, { color: '#ff3b4e', scale: 3, align: 'center', shadow: '#5a0a1a' });
        const boss = g.def;
        if (boss) {
          T(boss.title, PW / 2, y + 6, { color: '#ffd0d6', align: 'center', size: 10 });
          T(boss.name, PW / 2, y + 19, { color: '#ffffff', align: 'center', size: 12 });
        }
      }
    } else if (g.phase === 'clear' && g.tally) {
      const u = g.phaseT;
      if (u > 0.6 && u < 5.4) {
        const Tl = g.tally;
        const x0 = 18, y0 = 108, w = PW - 36, h = 130;
        win(x0, y0, w, h);
        T('MISSION CLEAR!', PW / 2, y0 + 14, { color: '#ffd84a', scale: 2, align: 'center', shadow: '#8a3a10' });
        const rows = [['격파 보너스', Tl.clearBonus], [`시간 보너스 ${fmtTime(Tl.fightTime)}`, Tl.timeBonus], ['노미스 보너스', Tl.noMiss], ['남은 폭탄', Tl.bombBonus]];
        rows.forEach(([label, v], i) => {
          const show = Math.min(1, Math.max(0, (u - 1.0 - i * 0.45) / 0.4));
          if (show <= 0) return;
          const yy = y0 + 38 + i * 15;
          T(label, x0 + 10, yy, { color: '#e8e0ff', size: 10 });
          T(v ? '+' + SH.fmt(v * show) : '-', x0 + w - 10, yy, { color: v ? '#ffffff' : '#8f86b0', align: 'right' });
        });
        const tot = Math.min(1, Math.max(0, (u - 2.5) / 0.5));
        if (tot > 0) {
          ctx.fillStyle = '#5a5680';
          ctx.fillRect(x0 + 10, y0 + 100, w - 20, 1);
          T('TOTAL', x0 + 10, y0 + 113, { color: '#ffd84a' });
          T('+' + SH.fmt(Tl.total * tot), x0 + w - 10, y0 + 113, { color: '#ffd84a', align: 'right' });
        }
      }
    }
    if (notice) {
      const a = notice.t < notice.dur - 0.4 || Math.floor(notice.t * 20) % 2;
      if (a) {
        const ny = 166;
        T(notice.title, PW / 2, ny + 9, { color: notice.color, align: 'center', size: notice.ascii ? undefined : 11 });
        if (notice.sub) T(notice.sub, PW / 2, ny + 22, { color: '#ffffff', align: 'center', size: 10 });
      }
    }
  }

  function dimBand(y, h) {
    getOverlays();
    ctx.drawImage(dimOverlay, 0, y, PW, h, 0, y, PW, h);
  }

  function showNotice(title, sub, color, dur) {
    notice = { title, sub, color: color || '#ffffff', t: 0, dur: dur || 2, ascii: !/[^\x00-\x7f]/.test(title) };
  }

  /* =========================================================
   * 한 장면
   * ========================================================= */
  function drawGame(g, dt, opts) {
    setBg(g.stage.bg);
    updateBg(dt, g.phase === 'boss' || g.phase === 'warning');
    if (notice && dt > 0) {
      notice.t += dt;
      if (notice.t >= notice.dur) notice = null;
    }
    const st = SH.fx.state;
    ctx.save();
    if (st.shake > 0.5) ctx.translate(Math.round((R() - 0.5) * st.shake), Math.round((R() - 0.5) * st.shake));
    drawBg();
    if (bg.kind === 'sea' && bg.bolt > 0.6) {
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#e8f0ff';
      ctx.fillRect(0, 0, PW, PH);
      ctx.globalAlpha = 1;
    }
    drawBoss(g);
    drawPlayerBullets(g);
    drawItems(g);
    drawPlayer(g);
    SH.fx.draw(ctx);
    drawBeams(g);
    drawEnemyBullets(g);
    ctx.restore();

    const ph = g.bossPhase;
    if (ph && ph.berserk && g.boss && g.boss.state === 'fight' && Math.floor(g.time * 3) % 2) {
      ctx.globalAlpha = 0.1;
      ctx.fillStyle = '#ff1e3c';
      ctx.fillRect(0, 0, PW, PH);
      ctx.globalAlpha = 1;
    }

    if (g.bombT > 0 && Math.floor(g.time * 12) % 2) {
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = '#ffd84a';
      ctx.fillRect(0, 0, PW, PH);
      ctx.globalAlpha = 1;
    }
    if (st.flash > 0.02) {
      ctx.globalAlpha = Math.min(0.85, st.flash);
      ctx.fillStyle = st.flashColor;
      ctx.fillRect(0, 0, PW, PH);
      ctx.globalAlpha = 1;
    }
    if (bg.fade > 0) {
      ctx.globalAlpha = bg.fade;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, PW, PH);
      ctx.globalAlpha = 1;
    }
    if (!opts || !opts.noHud) drawHud(g, (opts && opts.best) || 0);
    if (!opts || !opts.frozen) drawBanners(g);
  }

  /** 타이틀 배경: 하늘이 흐르고, 강철 요새가 버티고 있고, 비행기가 맞서 날아감 */
  function drawTitle(dt, noBoss) {
    title.t += dt;
    setBg('sky');
    updateBg(dt, false);
    drawBg();
    const t = title.t;
    if (!noBoss) {
      const bx = PW / 2 + Math.sin(t * 0.4) * 10, by = 290 + Math.sin(t * 0.9) * 3;
      SH.pix.draw(ctx, 'titan', bx, by, { frame: Math.floor(t * 3) & 1 });
      for (const s2 of [-1, 1]) SH.pix.draw(ctx, 'turret', bx + s2 * 48, by + 13, { frame: 4 + Math.round(Math.sin(t * 0.7 + s2) * 2) });
    }
    const px = PW / 2 + Math.sin(t * 0.8) * 34, py = PH * 0.9 + Math.sin(t * 1.3) * 3;
    const bank = Math.cos(t * 0.8);
    SH.pix.draw(ctx, 'flame', px, py + 15, { frame: Math.floor(t * 20) });
    SH.pix.draw(ctx, 'player', px, py, { frame: bank > 0.5 ? 2 : bank < -0.5 ? 0 : 1 });
    SH.fx.update(dt);
    SH.fx.draw(ctx);
  }

  function reset() {
    notice = null;
    bossLag = 1;
  }

  return {
    PW, PH, K, init, resize, present, drawGame, drawTitle, showNotice, reset, win, dim, T, spr, hazard, fmtTime,
    get ctx() { return ctx; },
  };
})();

  <script>/* js/audio.js */
'use strict';

/* =========================================================
 * 하늘 사냥꾼 — 소리 (WebAudio 로 효과음과 배경음악을 실시간 합성. 소리 파일 없음)
 *   SH.audio.unlock()     첫 터치/키 입력 때 불러 소리를 켬
 *   SH.audio.sfx(name)    효과음
 *   SH.audio.music(name)  배경음악 ('title' 'stage1' 'stage2' 'stage3' 'boss' 'ending' 'none')
 * ========================================================= */

SH.audio = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
  const vol = { sfx: 0.8, music: 0.6 };
  let muted = false;
  const last = {};
  let wanted = 'none';
  let track = null; // { name, gain, step, next, def, mel }
  let timer = null;

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function unlock() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { ctx = null; return; }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 10;
    comp.ratio.value = 5;
    comp.attack.value = 0.003;
    comp.release.value = 0.2;
    master = ctx.createGain();
    sfxBus = ctx.createGain();
    musicBus = ctx.createGain();
    sfxBus.connect(master);
    musicBus.connect(master);
    master.connect(comp);
    comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    apply();
    document.addEventListener('visibilitychange', () => {
      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else ctx.resume();
    });
    timer = setInterval(schedule, 25);
    const w = wanted;
    wanted = 'none';
    music(w);
  }

  function apply() {
    if (!ctx) return;
    const now = ctx.currentTime;
    master.gain.setTargetAtTime(muted ? 0 : 0.9, now, 0.05);
    sfxBus.gain.setTargetAtTime(vol.sfx, now, 0.05);
    musicBus.gain.setTargetAtTime(vol.music * 0.5, now, 0.05);
  }
  function setVolume(v) {
    if (typeof v.sfx === 'number') vol.sfx = Math.max(0, Math.min(1, v.sfx));
    if (typeof v.music === 'number') vol.music = Math.max(0, Math.min(1, v.music));
    apply();
  }
  function setMuted(m) { muted = !!m; apply(); }

  /* ---------------- 합성 도우미 ---------------- */
  function tone(o) {
    const t = (o.t != null ? o.t : ctx.currentTime) + (o.delay || 0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + (o.slide || o.dur));
    const peak = o.v != null ? o.v : 0.2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + (o.a || 0.004));
    if (o.hold) g.gain.setValueAtTime(peak, t + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    let node = osc;
    if (o.lp) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = o.lp;
      osc.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(o.dest || sfxBus);
    osc.start(t);
    osc.stop(t + o.dur + 0.05);
  }
  function noise(o) {
    const t = (o.t != null ? o.t : ctx.currentTime) + (o.delay || 0);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    src.playbackRate.value = o.rate || 1;
    const f = ctx.createBiquadFilter();
    f.type = o.ft || 'lowpass';
    f.frequency.setValueAtTime(o.f || 1200, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.f2), t + o.dur);
    f.Q.value = o.q || 0.8;
    const g = ctx.createGain();
    const peak = o.v != null ? o.v : 0.2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + (o.a || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.dest || sfxBus);
    src.start(t, Math.random() * 0.5);
    src.stop(t + o.dur + 0.05);
  }
  function throttle(name, gap) {
    const now = ctx.currentTime;
    if (last[name] && now - last[name] < gap) return false;
    last[name] = now;
    return true;
  }

  /* ---------------- 효과음 ---------------- */
  const SFX = {
    shoot_spread() { if (throttle('shot', 0.085)) tone({ f: 1250, f2: 520, dur: 0.05, v: 0.028, type: 'square', lp: 3200 }); },
    shoot_laser() { if (throttle('shot', 0.085)) tone({ f: 1900, f2: 1100, dur: 0.05, v: 0.024, type: 'sawtooth', lp: 4200 }); },
    shoot_homing() { if (throttle('shot', 0.085)) tone({ f: 1050, f2: 600, dur: 0.05, v: 0.026, type: 'triangle' }); },
    missile() { if (throttle('missile', 0.2)) noise({ ft: 'bandpass', f: 2400, f2: 900, dur: 0.12, v: 0.05, q: 2 }); },
    hit() { if (throttle('hit', 0.05)) noise({ ft: 'bandpass', f: 3200, dur: 0.03, v: 0.04, q: 3 }); },
    kill() {
      if (!throttle('kill', 0.03)) return;
      noise({ f: 2200, f2: 160, dur: 0.28, v: 0.22 });
      tone({ f: 240, f2: 60, dur: 0.14, v: 0.08, type: 'square', lp: 900 });
    },
    heavy() {
      noise({ f: 1600, f2: 90, dur: 0.6, v: 0.32 });
      tone({ f: 120, f2: 35, dur: 0.4, v: 0.25, type: 'sine' });
    },
    bossBoom() { if (throttle('bb', 0.08)) noise({ f: 1500, f2: 120, dur: 0.35, v: 0.22 }); },
    bossDie() {
      noise({ f: 2400, f2: 60, dur: 1.8, v: 0.45, a: 0.01 });
      tone({ f: 90, f2: 28, dur: 1.4, v: 0.4, type: 'sine' });
      tone({ f: 180, f2: 40, dur: 0.9, v: 0.12, type: 'square', lp: 700 });
    },
    playerDie() {
      tone({ f: 700, f2: 70, dur: 0.7, v: 0.16, type: 'sawtooth', lp: 2200 });
      noise({ f: 1800, f2: 100, dur: 0.8, v: 0.3 });
    },
    bomb() {
      noise({ f: 400, f2: 4000, dur: 0.35, v: 0.2, a: 0.25 });
      noise({ f: 3000, f2: 80, dur: 1.4, v: 0.4, delay: 0.25 });
      tone({ f: 110, f2: 30, dur: 1.2, v: 0.35, type: 'sine', delay: 0.25 });
    },
    power() { [0, 4, 7, 12, 16].forEach((n, i) => tone({ f: mtof(72 + n), dur: 0.09, v: 0.07, delay: i * 0.045, type: 'square', lp: 4000 })); },
    item() { [0, 7].forEach((n, i) => tone({ f: mtof(79 + n), dur: 0.08, v: 0.07, delay: i * 0.06, type: 'triangle' })); },
    extend() { [0, 4, 7, 12, 7, 12, 16].forEach((n, i) => tone({ f: mtof(76 + n), dur: 0.1, v: 0.08, delay: i * 0.07, type: 'square', lp: 5000 })); },
    gem() { if (throttle('gem', 0.04)) tone({ f: 1700 + Math.random() * 500, dur: 0.05, v: 0.03, type: 'sine' }); },
    spark() { if (throttle('spark', 0.035)) tone({ f: 2300 + Math.random() * 600, dur: 0.03, v: 0.018, type: 'sine' }); },
    shield() {
      noise({ ft: 'highpass', f: 3000, dur: 0.3, v: 0.12 });
      tone({ f: 1500, f2: 400, dur: 0.3, v: 0.06, type: 'triangle' });
    },
    warning() {
      for (let i = 0; i < 4; i++) {
        tone({ f: 880, dur: 0.26, v: 0.09, delay: i * 0.6, type: 'square', lp: 2500, hold: 0.2 });
        tone({ f: 660, dur: 0.26, v: 0.09, delay: i * 0.6 + 0.3, type: 'square', lp: 2500, hold: 0.2 });
      }
    },
    phase() {
      noise({ f: 300, f2: 3000, dur: 0.5, v: 0.15, a: 0.3 });
      tone({ f: 200, f2: 800, dur: 0.5, v: 0.06, type: 'sawtooth', lp: 1800 });
    },
    clear() {
      const seq = [[72, 0], [76, 0.12], [79, 0.24], [84, 0.36], [79, 0.6], [84, 0.72]];
      seq.forEach(([n, d]) => {
        tone({ f: mtof(n), dur: 0.2, v: 0.08, delay: d, type: 'square', lp: 4000 });
        tone({ f: mtof(n - 12), dur: 0.2, v: 0.06, delay: d, type: 'triangle' });
      });
    },
    gameOver() { [67, 63, 60, 55].forEach((n, i) => tone({ f: mtof(n), dur: 0.38, v: 0.08, delay: i * 0.32, type: 'triangle', hold: 0.25 })); },
    click() { tone({ f: 880, f2: 1300, dur: 0.06, v: 0.06, type: 'triangle' }); },
    armor() { if (throttle('armor', 0.07)) tone({ f: 2600, f2: 1800, dur: 0.04, v: 0.03, type: 'square', lp: 5000 }); },
    laserWarn() {
      tone({ f: 300, f2: 1400, dur: 0.9, v: 0.06, type: 'sawtooth', lp: 2400, a: 0.4 });
      for (let i = 0; i < 4; i++) tone({ f: 1200, dur: 0.06, v: 0.05, delay: i * 0.22, type: 'square' });
    },
    laserFire() {
      noise({ ft: 'bandpass', f: 900, dur: 1.2, v: 0.22, q: 0.6, a: 0.02 });
      tone({ f: 110, f2: 70, dur: 1.2, v: 0.2, type: 'sawtooth', lp: 900 });
    },
    enemyMissile() { if (throttle('em', 0.25)) noise({ ft: 'bandpass', f: 1400, f2: 500, dur: 0.25, v: 0.07, q: 1.5 }); },
    missileDown() { if (throttle('md', 0.04)) { noise({ f: 2400, f2: 300, dur: 0.18, v: 0.12 }); tone({ f: 900, f2: 300, dur: 0.1, v: 0.04, type: 'square' }); } },
    part() {
      noise({ f: 2000, f2: 80, dur: 1.0, v: 0.38 });
      tone({ f: 140, f2: 30, dur: 0.8, v: 0.3, type: 'sine' });
    },
  };

  function sfx(name) {
    if (!ctx || muted || ctx.state !== 'running') return;
    const f = SFX[name];
    if (f) f();
  }

  /* ---------------- 배경음악 (간단한 칩튠 시퀀서) ----------------
   * chords: [근음 midi, 'M'|'m'] 한 마디씩. bass/kick/snare/hat: 16칸 패턴 */
  const TRACKS = {
    title: { bpm: 100, chords: [[60, 'M'], [57, 'm'], [53, 'M'], [55, 'M']], bass: '1...5...1...5...', kick: 'x.......x.......', snare: '................', hat: '..x...x...x...x.', lead: 0.55, seed: 3, arpOct: 1 },
    stage1: { bpm: 132, chords: [[53, 'M'], [60, 'M'], [62, 'm'], [58, 'M']], bass: '1.1.5.1.1.1.5.8.', kick: 'x...x...x...x...', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', lead: 0.75, seed: 11, arpOct: 1 },
    stage2: { bpm: 140, chords: [[50, 'm'], [58, 'M'], [53, 'M'], [60, 'M']], bass: '1..11..15..51..8', kick: 'x..x..x...x..x..', snare: '....x.......x...', hat: 'xxx.xxx.xxx.xxx.', lead: 0.7, seed: 23, arpOct: 1 },
    stage3: { bpm: 150, chords: [[52, 'm'], [53, 'M'], [52, 'm'], [50, 'M']], bass: '1.1.1.1.1.1.5.5.', kick: 'x...x...x...x.x.', snare: '....x.......x...', hat: 'x.xxx.xxx.xxx.xx', lead: 0.8, seed: 37, arpOct: 1 },
    boss: { bpm: 162, chords: [[57, 'm'], [53, 'M'], [55, 'M'], [52, 'm']], bass: '1111111155558888', kick: 'x.x.x.x.x.x.x.x.', snare: '....x.......x..x', hat: 'xxxxxxxxxxxxxxxx', lead: 0.85, seed: 51, arpOct: 1 },
    ending: { bpm: 96, chords: [[60, 'M'], [53, 'M'], [55, 'M'], [60, 'M']], bass: '1.......5.......', kick: 'x.......x.......', snare: '........x.......', hat: '....x.......x...', lead: 0.5, seed: 7, arpOct: 2 },
  };

  function makeMelody(def) {
    const rng = SH.rng(def.seed);
    const bars = [];
    for (let v = 0; v < 2; v++) {
      for (const [root, q] of def.chords) {
        const tones = q === 'M' ? [0, 4, 7, 12] : [0, 3, 7, 12];
        const scale = q === 'M' ? [0, 2, 4, 5, 7, 9, 11, 12] : [0, 2, 3, 5, 7, 8, 10, 12];
        const bar = [];
        for (let s = 0; s < 8; s++) {
          const strong = s % 2 === 0;
          if (rng() > def.lead && !strong) { bar.push(null); continue; }
          if (s > 0 && rng() < 0.22) { bar.push('-'); continue; } // 이어서 길게
          const pool = strong ? tones : scale;
          bar.push(root + 12 + pool[Math.floor(rng() * pool.length)]);
        }
        bars.push(bar);
      }
    }
    return bars;
  }

  function music(name) {
    if (wanted === name && (track || name === 'none')) return;
    wanted = name;
    if (!ctx) return;
    if (track) {
      const g = track.gain;
      g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.15);
      setTimeout(() => g.disconnect(), 800);
      track = null;
    }
    const def = TRACKS[name];
    if (!def) return;
    const gain = ctx.createGain();
    gain.gain.value = 1;
    gain.connect(musicBus);
    track = { name, def, gain, step: 0, next: ctx.currentTime + 0.08, mel: def.mel || (def.mel = makeMelody(def)) };
  }

  function schedule() {
    if (!ctx || !track || ctx.state !== 'running') return;
    const T = track, d = T.def;
    const stepDur = 60 / d.bpm / 4;
    while (T.next < ctx.currentTime + 0.14) {
      playStep(T, T.step, T.next, stepDur);
      T.next += stepDur;
      T.step += 1;
    }
  }

  function playStep(T, step, t, sd) {
    const d = T.def;
    const s16 = step % 16;
    const bar = Math.floor(step / 16);
    const [root, q] = d.chords[bar % d.chords.length];
    const dest = T.gain;
    const third = q === 'M' ? 4 : 3;
    // 드럼
    if (d.kick[s16] === 'x') {
      tone({ t, f: 150, f2: 40, slide: 0.12, dur: 0.18, v: 0.5, type: 'sine', dest });
    }
    if (d.snare[s16] === 'x') {
      noise({ t, ft: 'bandpass', f: 1800, dur: 0.14, v: 0.22, q: 0.7, dest });
      tone({ t, f: 220, f2: 140, dur: 0.08, v: 0.08, type: 'triangle', dest });
    }
    if (d.hat[s16] === 'x') noise({ t, ft: 'highpass', f: 7000, dur: 0.035, v: s16 % 4 === 0 ? 0.08 : 0.05, dest });
    // 베이스
    const bc = d.bass[s16];
    if (bc !== '.') {
      const n = root - 24 + (bc === '5' ? 7 : bc === '8' ? 12 : 0);
      tone({ t, f: mtof(n), dur: sd * 1.8, v: 0.2, type: 'sawtooth', lp: 600, dest });
    }
    // 아르페지오
    const arp = [0, third, 7, 12, 7, third, 0, 7][s16 % 8];
    tone({ t, f: mtof(root + 12 * d.arpOct + arp), dur: sd * 0.9, v: 0.035, type: 'square', lp: 2600, dest });
    // 멜로디 (8분음표)
    if (s16 % 2 === 0) {
      const mbar = T.mel[bar % T.mel.length];
      const i = s16 / 2;
      const n = mbar[i];
      if (typeof n === 'number') {
        let len = 1;
        while (i + len < 8 && mbar[i + len] === '-') len++;
        tone({ t, f: mtof(n), dur: sd * 2 * len * 0.95, v: 0.07, type: 'square', lp: 3400, a: 0.01, hold: sd * 2 * len * 0.6, dest });
        tone({ t, f: mtof(n) * 1.004, dur: sd * 2 * len * 0.95, v: 0.03, type: 'triangle', dest });
      }
    }
  }

  return { unlock, sfx, music, setVolume, setMuted, get muted() { return muted; } };
})();

  <script>/* js/input.js */
'use strict';

/* =========================================================
 * 하늘 사냥꾼 — 플레이 중 입력
 *  · 터치/마우스: 화면 아무 데나 대고 끌면 비행기가 손가락 움직임만큼 따라 움직임
 *    (손가락에 비행기가 가려지지 않음). 끄는 중에 두 번째 손가락으로 톡 치면 폭탄.
 *  · 키보드: 방향키/WASD 이동, Shift 정밀 이동, X·Space·B 폭탄, Esc·P 일시정지
 * 메뉴 입력은 SH.ui 가, 둘 사이 나눠 주기는 main.js 가 합니다.
 * ========================================================= */

SH.input = (() => {
  const { W, H, clamp } = SH;
  const keys = new Set();
  const drag = { id: null, fx: 0, fy: 0, sx: 0, sy: 0, px: 0, py: 0, anchor: -1 };
  let sens = 1.3;
  let bombQueued = false;
  let scale = () => 1; // 화면 CSS 픽셀 / 게임 논리 좌표

  const MOVE_KEYS = {
    ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1],
    KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, -1], KeyS: [0, 1],
  };

  function setScale(fn) { scale = fn; }

  function dragDown(e) {
    if (drag.id === null) {
      drag.id = e.pointerId;
      drag.fx = drag.sx = e.clientX;
      drag.fy = drag.sy = e.clientY;
      drag.anchor = -1;
    } else if (e.pointerType === 'touch') {
      bombQueued = true;
    }
  }
  function dragMove(e) {
    if (e.pointerId !== drag.id) return false;
    drag.fx = e.clientX;
    drag.fy = e.clientY;
    return true;
  }
  function dragUp(e) {
    if (e.pointerId === drag.id) drag.id = null;
  }

  /** 플레이 중 키. 일시정지 키면 'pause' 를 돌려줌 */
  function keyDown(e) {
    keys.add(e.code);
    if (e.repeat) return null;
    if (e.code === 'KeyX' || e.code === 'Space' || e.code === 'KeyB') bombQueued = true;
    if (e.code === 'Escape' || e.code === 'KeyP') return 'pause';
    return null;
  }
  function keyUp(e) { keys.delete(e.code); }
  const isGameKey = (code) => !!MOVE_KEYS[code] || code === 'Space';

  function releaseAll() {
    keys.clear();
    drag.id = null;
  }

  /** 매 틱 게임 입력 채우기 */
  function apply(g) {
    const inp = g.input;
    let ax = 0, ay = 0;
    for (const code of keys) {
      const m = MOVE_KEYS[code];
      if (m) { ax += m[0]; ay += m[1]; }
    }
    inp.ax = clamp(ax, -1, 1);
    inp.ay = clamp(ay, -1, 1);
    inp.focus = keys.has('ShiftLeft') || keys.has('ShiftRight');

    const p = g.player;
    if (drag.id !== null && !p.dead && !p.entering && !p.exiting) {
      if (drag.anchor !== p.anchor) {
        drag.anchor = p.anchor;
        drag.sx = drag.fx;
        drag.sy = drag.fy;
        drag.px = p.x;
        drag.py = p.y;
      }
      const s = scale() || 1;
      const tx = drag.px + ((drag.fx - drag.sx) / s) * sens;
      const ty = drag.py + ((drag.fy - drag.sy) / s) * sens;
      const cx = clamp(tx, 16, W - 16), cy = clamp(ty, 50, H - 26);
      // 벽에 닿으면 기준점을 옮겨, 반대로 움직일 때 바로 반응하게
      if (cx !== tx) { drag.px = cx; drag.sx = drag.fx; }
      if (cy !== ty) { drag.py = cy; drag.sy = drag.fy; }
      inp.tx = cx;
      inp.ty = cy;
    } else {
      inp.tx = null;
      inp.ty = null;
      if (drag.id !== null) drag.anchor = -1;
    }
    if (bombQueued) {
      bombQueued = false;
      inp.bomb = true;
    }
  }

  function queueBomb() { bombQueued = true; }
  function setSensitivity(v) { sens = v; }

  return { setScale, dragDown, dragMove, dragUp, keyDown, keyUp, isGameKey, releaseAll, apply, queueBomb, setSensitivity };
})();

  <script>/* js/ui.js */
'use strict';

/* =========================================================
 * 하늘 사냥꾼 — 저장 + 게임 화면 안의 메뉴 (모두 픽셀로 캔버스에 그림)
 *
 * 화면(screen): title help settings ranking | pause | over results | ending
 *               null 이면 게임 플레이 중
 * 버튼은 매 프레임 그리면서 등록하고(즉시 모드), 터치/클릭/키보드로 고릅니다.
 * ========================================================= */

SH.save = (() => {
  const KEY = 'skyHunter.v2';
  const DEFAULT = { best: 0, bestStage: 0, cleared: 0, ranks: [], settings: { sfx: 0.8, music: 0.6, shake: true, vibrate: true, sens: 1.3 } };
  function load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { d = null; }
    const out = JSON.parse(JSON.stringify(DEFAULT));
    if (d && typeof d === 'object') {
      for (const k of ['best', 'bestStage', 'cleared']) if (typeof d[k] === 'number') out[k] = d[k];
      if (Array.isArray(d.ranks)) out.ranks = d.ranks.filter((r) => r && typeof r.score === 'number').slice(0, 5);
      if (d.settings) Object.assign(out.settings, d.settings);
    }
    return out;
  }
  function store(d) {
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* 저장 불가 */ }
  }
  /** 순위표에 넣고 몇 등인지 (순위 밖이면 -1) */
  function addRank(d, entry) {
    d.ranks.push(entry);
    d.ranks.sort((a, b) => b.score - a.score);
    d.ranks = d.ranks.slice(0, 5);
    return d.ranks.indexOf(entry);
  }
  return { load, store, addRank };
})();

SH.ui = (() => {
  const R = () => SH.render;
  const PW = 225, PH = 400;
  let screen = 'title';
  let settingsBack = 'title';
  let t = 0;
  const btns = [];
  let focus = 0;
  let pressed = -1;
  let act = {};
  let data = null;
  let touch = false;
  let keyNav = false;
  let over = { count: 10, last: 10 };
  let result = null; // { score, rank, isNew, stage, kills, cleared }
  let ending = { t: 0 };
  const sens = [[1, '보통'], [1.3, '빠르게'], [1.6, '아주 빠르게']];

  function go(s) {
    screen = s;
    t = 0;
    focus = 0;
    pressed = -1;
  }

  /* ---------------- 버튼 ---------------- */
  function button(label, x, y, w, h, onAct, o) {
    const i = btns.length;
    btns.push({ x, y, w, h, act: onAct, side: o && o.side });
    const isFocus = i === focus;
    const down = i === pressed;
    R().win(x, y + (down ? 1 : 0), w, h, { hot: isFocus });
    const blinkOff = o && o.blink && Math.floor(t * 2.5) % 2;
    R().T(label, x + w / 2, y + h / 2 + (down ? 1 : 0), {
      color: blinkOff ? '#ff8a2a' : isFocus ? '#ffd84a' : '#ffffff', align: 'center', size: (o && o.size) || 11, scale: (o && o.scale) || 1,
    });
    if (isFocus && (keyNav || (o && o.cursor))) R().spr('cursor', x - 6, y + h / 2, { frame: Math.floor(t * 4) }, '#ffd84a');
  }

  /** 버튼 목록을 세로로 */
  function column(items, x, y, w, h, gap) {
    items.forEach(([label, fn, o], i) => button(label, x, y + i * (h + gap), w, h, fn, o));
  }

  /* ---------------- 화면들 ---------------- */
  function drawTitle(dt) {
    R().drawTitle(dt);
    const T = R().T;
    if (!SH.pix.draw(R().ctx, 'logo', PW / 2, 74)) T('하늘 사냥꾼', PW / 2, 74, { color: '#ffd84a', size: 24, align: 'center', shadow: '#8a3a10' });
    T('SKY HUNTER', PW / 2, 106, { color: '#ffffff', align: 'center', shadow: '#1c3f9a' });
    T('VS IRON TITAN', PW / 2, 118, { color: '#ffd84a', align: 'center', shadow: '#8a3a10' });
    for (let i = 0; i < 5; i++) {
      const sx = [24, 196, 40, 182, 112][i], sy = [40, 52, 118, 124, 22][i];
      SH.pix.draw(R().ctx, 'star', sx, sy, { frame: Math.floor(t * 3 + i) });
    }
    button(touch ? 'TOUCH START' : 'PRESS START', 50, 146, 125, 28, () => act.start(), { cursor: true, blink: true });
    button('조작법', 14, 184, 62, 20, () => go('help'));
    button('설정', 81, 184, 62, 20, () => { settingsBack = 'title'; go('settings'); });
    button('랭킹', 148, 184, 62, 20, () => go('ranking'));
    if (data.best) T(`HI ${SH.fmt(data.best)}`, PW / 2, 222, { color: '#ffe3ee', align: 'center' });
    T(touch ? '화면을 끌어서 이동 · 자동 발사' : '방향키 이동 · X 폭탄 · 자동 발사', PW / 2, 390, { color: '#ffffff', align: 'center', size: 10 });
  }

  function drawHelp(dt) {
    R().drawTitle(dt);
    R().dim(true);
    const T = R().T, x = 8, y = 18, w = PW - 16, h = 362;
    R().win(x, y, w, h);
    T('HOW TO PLAY', PW / 2, y + 12, { color: '#ffd84a', scale: 2, align: 'center', shadow: '#8a3a10' });
    let yy = y + 32;
    const line = (s, c, ind) => { T(s, x + 10 + (ind || 0), yy, { color: c || '#e8e0ff', size: 10 }); yy += 13; };
    line(touch ? '이동: 화면 아무 데나 대고 끌기' : '이동: 방향키 / WASD (Shift 천천히)', '#ffffff');
    line(touch ? '(PC: 방향키 / WASD)' : '(마우스로 끌어도 돼요)', '#b5aed6', 8);
    line('공격: 총은 자동으로 쏴요', '#ffffff');
    line(touch ? '폭탄: 오른쪽 아래 버튼, 두 손가락 톡' : '폭탄: X 또는 스페이스', '#ffffff');
    line('비행기 가운데 빨간 점에 맞으면 한 대!', '#ff9ac2');
    yy += 6;
    T('ITEMS', x + 10, yy, { color: '#ffd84a' });
    yy += 14;
    const item = (spriteName, s, frameName) => {
      SH.pix.draw(R().ctx, spriteName, x + 18, yy, { frame: Math.floor(t * 6) });
      if (frameName) SH.pix.draw(R().ctx, frameName, x + 32, yy, { frame: Math.floor(t * 6) });
      T(s, x + (frameName ? 44 : 32), yy, { color: '#e8e0ff', size: 10 });
      yy += 17;
    };
    SH.pix.draw(R().ctx, 'item_spread', x + 18, yy, { frame: Math.floor(t * 6) });
    SH.pix.draw(R().ctx, 'item_laser', x + 32, yy, { frame: Math.floor(t * 6) });
    SH.pix.draw(R().ctx, 'item_homing', x + 46, yy, { frame: Math.floor(t * 6) });
    T('파워업! 색 = 무기', x + 58, yy, { color: '#e8e0ff', size: 10 });
    yy += 15;
    T('주황 확산탄 · 파랑 레이저 · 초록 유도탄', x + 12, yy, { color: '#b5aed6', size: 10 });
    yy += 17;
    item('item_bomb', '폭탄 +1 (탄을 모두 지움)');
    item('item_life', '비행기 +1');
    item('item_shield', '한 번 막아 주는 방패');
    item('gem', '보석: 점수! 점수가 쌓이면 1UP');
    yy += 2;
    T('TIPS', x + 10, yy, { color: '#ffd84a' });
    yy += 14;
    line('먼저 양쪽 포탑을 부숴야 코어가 열려요');
    line('빨간 점선 = 레이저가 지나갈 곳!');
    line('빨간 미사일은 쏴서 터뜨릴 수 있어요');
    line('포탑 파괴·단계 변화 때 파워 아이템!');
    button('뒤로', PW / 2 - 40, y + h - 28, 80, 20, () => go('title'), { cursor: true });
  }

  function settingRow(label, value, y, dec, inc) {
    const x = 20, w = PW - 40, h = 22;
    const i = btns.length;
    button('', x, y, w, h, inc, { side: { dec, inc } });
    const T = R().T;
    T(label, x + 10, y + 11, { color: i === focus ? '#ffd84a' : '#ffffff', size: 11 });
    T('◀', x + w - 82, y + 11, { color: '#c9a8ff' });
    T(value, x + w - 46, y + 11, { color: '#ffffff', align: 'center', size: 10 });
    T('▶', x + w - 14, y + 11, { color: '#c9a8ff' });
  }

  function drawSettings(dt, inGame) {
    if (inGame) { act.drawGameFrozen(); R().dim(); } else { R().drawTitle(dt); R().dim(true); }
    const st = data.settings;
    const T = R().T;
    R().win(10, 70, PW - 20, 250);
    T('SETTINGS', PW / 2, 86, { color: '#ffd84a', scale: 2, align: 'center', shadow: '#8a3a10' });
    const pct = (v) => `${Math.round(v * 100)}%`;
    const vol = (k) => [() => { st[k] = Math.max(0, Math.round((st[k] - 0.1) * 10) / 10); act.settings(); SH.audio.sfx('gem'); }, () => { st[k] = Math.min(1, Math.round((st[k] + 0.1) * 10) / 10); act.settings(); SH.audio.sfx('gem'); }];
    const [sd, si] = vol('sfx');
    settingRow('효과음', pct(st.sfx), 104, sd, si);
    const [md, mi] = vol('music');
    settingRow('음악', pct(st.music), 130, md, mi);
    const si2 = Math.max(0, sens.findIndex((s) => s[0] === st.sens));
    const setSens = (d) => () => { st.sens = sens[(si2 + d + sens.length) % sens.length][0]; act.settings(); };
    settingRow('드래그 감도', sens[si2][1], 156, setSens(-1), setSens(1));
    const tog = (k) => () => { st[k] = !st[k]; act.settings(); };
    settingRow('화면 흔들림', st.shake ? 'ON' : 'OFF', 182, tog('shake'), tog('shake'));
    settingRow('진동', st.vibrate ? 'ON' : 'OFF', 208, tog('vibrate'), tog('vibrate'));
    T('◀ ▶ 를 눌러 바꿔요', PW / 2, 244, { color: '#b5aed6', align: 'center', size: 10 });
    button('뒤로', PW / 2 - 40, 284, 80, 22, () => go(settingsBack), { cursor: true });
  }

  function drawRanking(dt) {
    R().drawTitle(dt);
    R().dim(true);
    const T = R().T;
    R().win(14, 70, PW - 28, 230);
    T('HIGH SCORES', PW / 2, 88, { color: '#ffd84a', scale: 2, align: 'center', shadow: '#8a3a10' });
    const names = ['1ST', '2ND', '3RD', '4TH', '5TH'];
    const cols = ['#ffd84a', '#d8d4ec', '#e2aa6c', '#ffffff', '#ffffff'];
    for (let i = 0; i < 5; i++) {
      const r = data.ranks[i];
      const y = 116 + i * 24;
      T(names[i], 30, y, { color: cols[i] });
      if (r) {
        T(SH.fmt(r.score), 140, y, { color: '#ffffff', align: 'right' });
        T(r.cleared ? 'CLEAR' : `${r.pct || 0}%`, PW - 30, y, { color: r.cleared ? '#ffd84a' : '#b5aed6', align: 'right' });
      } else T('- - - - -', 140, y, { color: '#5a5680', align: 'right' });
    }
    button('뒤로', PW / 2 - 40, 268, 80, 22, () => go('title'), { cursor: true });
  }

  function drawPause() {
    act.drawGameFrozen();
    R().dim();
    const T = R().T;
    R().win(42, 110, PW - 84, 170);
    T('PAUSE', PW / 2, 128, { color: '#ffd84a', scale: 2, align: 'center', shadow: '#8a3a10' });
    column([
      ['계속하기', () => act.resume(), { cursor: true }],
      ['설정', () => { settingsBack = 'pause'; go('settings'); }],
      ['처음부터', () => act.start()],
      ['타이틀로', () => act.toTitle()],
    ], 62, 146, PW - 124, 22, 6);
  }

  function drawOver(dt) {
    act.drawGameFrozen();
    R().dim(true);
    const T = R().T;
    T('GAME OVER', PW / 2, 110, { color: '#ff3b4e', scale: 3, align: 'center', shadow: '#5a0a1a' });
    over.count -= dt;
    const n = Math.max(0, Math.ceil(over.count));
    if (n !== over.last) { over.last = n; SH.audio.sfx('click'); }
    if (over.count <= 0) { finish(); return; }
    T('CONTINUE?', PW / 2, 160, { color: '#ffffff', scale: 2, align: 'center' });
    T(String(n), PW / 2, 206, { color: '#ffd84a', scale: 5, align: 'center', shadow: '#8a3a10' });
    button('이어하기', 30, 250, 78, 24, () => act.continueGame(), { cursor: true });
    button('그만하기', PW - 108, 250, 78, 24, () => finish());
    T('이어하면 지금 자리에서 다시! (점수 유지)', PW / 2, 290, { color: '#d8d4ec', align: 'center', size: 10 });
  }

  function finish() {
    result = act.record(false);
    go('results');
  }

  function drawResults(dt, title) {
    if (title) { R().drawTitle(dt); R().dim(true); } else { act.drawGameFrozen(); R().dim(); }
    const T = R().T;
    const r = result || { score: 0 };
    R().win(16, 80, PW - 32, 220);
    T(title ? 'CONGRATULATIONS!' : 'RESULT', PW / 2, 98, { color: '#ffd84a', scale: title ? 1 : 2, align: 'center', shadow: '#8a3a10' });
    const rows = [
      ['SCORE', SH.fmt(r.score), '#ffffff'],
      ['HI SCORE', SH.fmt(data.best), '#ffe3ee'],
      ['DAMAGE', r.cleared ? 'CLEAR!' : `${r.pct || 0}%`, '#ffffff'],
      ['MISSILES', SH.fmt(r.missiles || 0), '#ffffff'],
    ];
    rows.forEach(([k, v, c], i) => {
      T(k, 32, 122 + i * 16, { color: '#c9a8ff' });
      T(v, PW - 32, 122 + i * 16, { color: c, align: 'right' });
    });
    if (r.rank >= 0 && Math.floor(t * 3) % 2 === 0) T(r.isNew ? 'NEW RECORD!' : `RANK IN ${['1ST', '2ND', '3RD', '4TH', '5TH'][r.rank]}!`, PW / 2, 196, { color: '#ff7aa8', align: 'center', scale: r.isNew ? 2 : 1 });
    column([
      ['다시 하기', () => act.start(), { cursor: true }],
      ['타이틀로', () => act.toTitle()],
    ], 54, 218, PW - 108, 22, 8);
  }

  function drawEnding(dt) {
    ending.t += dt;
    R().drawTitle(dt, true);
    const T = R().T;
    if (Math.random() < dt * 3) {
      const x = 20 + Math.random() * (PW - 40), y = 30 + Math.random() * 150;
      SH.fx.anim('boomBig', x, y, 14);
      SH.fx.ring(x, y, 2, 30 + Math.random() * 20, 0.6, ['#ffd84a', '#ff7aa8', '#8fd4ff', '#a6f070'][Math.floor(Math.random() * 4)], 1);
      SH.audio.sfx('bossBoom');
    }
    const e = ending.t;
    T('CONGRATULATIONS!', PW / 2, 44, { color: '#ffd84a', scale: 2, align: 'center', shadow: '#8a3a10' });
    if (e > 0.8) T('강철 요새 타이탄을 무너뜨렸다!', PW / 2, 72, { color: '#ffffff', align: 'center', size: 12 });
    if (e > 1.6) T('하늘에 다시 평화가 찾아왔어요.', PW / 2, 90, { color: '#e8e0ff', align: 'center', size: 10 });
    if (e > 2.4) T('…하지만 더 단단해진 요새가 다시 오는데?', PW / 2, 104, { color: '#ff9ac2', align: 'center', size: 10 });
    if (e > 3) {
      const r = result || { score: 0 };
      R().win(24, 122, PW - 48, 86);
      const g = act.game();
      const rows = [['SCORE', SH.fmt(r.score)], ['TIME', fmtTime(g ? g.stats.time : 0)], ['DEATHS', String(g ? g.stats.deaths : 0)], ['CONTINUE', String(g ? g.continues : 0)]];
      rows.forEach(([k, v], i) => {
        T(k, 38, 136 + i * 16, { color: '#c9a8ff' });
        T(v, PW - 38, 136 + i * 16, { color: '#ffffff', align: 'right' });
      });
      if (r.isNew && Math.floor(t * 3) % 2 === 0) T('NEW RECORD!', PW / 2, 220, { color: '#ff7aa8', align: 'center', scale: 2 });
      column([
        [`LOOP ${g ? g.loop + 2 : 2} 도전!`, () => act.nextLoop(), { cursor: true }],
        ['타이틀로', () => act.toTitle()],
      ], 54, 238, PW - 108, 22, 8);
    }
  }

  function fmtTime(s) {
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return `${m}:${String(r).padStart(2, '0')}`;
  }

  /* ---------------- 게임 중 버튼 (일시정지 · 폭탄) ---------------- */
  const playBtn = { pause: { x: 204, y: 1, w: 20, h: 20 }, bomb: { x: 186, y: 362, w: 36, h: 36 } };
  let bombDown = 0, pauseDown = 0;
  function drawPlayButtons(g, dt) {
    if (bombDown > 0) bombDown -= dt;
    if (pauseDown > 0) pauseDown -= dt;
    R().spr('btn_pause', 214, 11, { frame: pauseDown > 0 ? 1 : 0, fbs: 14 }, '#3a3058');
    if (touch) {
      const b = playBtn.bomb;
      R().spr('btn_bomb', b.x + b.w / 2, b.y + b.h / 2, { frame: bombDown > 0 ? 1 : 0, fbs: 26, alpha: g.bombs > 0 ? 1 : 0.45 }, '#ff8a2a');
      R().T(String(g.bombs), b.x + b.w - 2, b.y + b.h - 4, { color: g.bombs ? '#ffd84a' : '#9a96b8', align: 'center' });
    }
  }
  const inside = (r, x, y, pad) => x >= r.x - pad && x <= r.x + r.w + pad && y >= r.y - pad && y <= r.y + r.h + pad;
  /** 게임 중 터치가 버튼 위면 처리하고 true */
  function playHit(x, y) {
    if (inside(playBtn.pause, x, y, 4)) { pauseDown = 0.15; act.pause(); return true; }
    if (touch && inside(playBtn.bomb, x, y, 6)) { bombDown = 0.15; act.bomb(); return true; }
    return false;
  }

  /* ---------------- 그리기 진입점 ---------------- */
  function draw(dt) {
    t += dt;
    btns.length = 0;
    switch (screen) {
      case 'title': drawTitle(dt); break;
      case 'help': drawHelp(dt); break;
      case 'settings': drawSettings(dt, settingsBack === 'pause'); break;
      case 'ranking': drawRanking(dt); break;
      case 'pause': drawPause(); break;
      case 'over': drawOver(dt); break;
      case 'results': drawResults(dt, false); break;
      case 'ending': drawEnding(dt); break;
      default:
    }
    if (focus >= btns.length) focus = Math.max(0, btns.length - 1);
  }

  /* ---------------- 입력 ---------------- */
  function hitIndex(x, y) {
    for (let i = btns.length - 1; i >= 0; i--) if (inside(btns[i], x, y, 2)) return i;
    return -1;
  }
  function pointerDown(x, y, isTouch) {
    if (isTouch) touch = true;
    keyNav = false;
    const i = hitIndex(x, y);
    pressed = i;
    if (i >= 0) focus = i;
  }
  function pointerUp(x, y) {
    const i = hitIndex(x, y);
    const p = pressed;
    pressed = -1;
    if (i < 0 || i !== p) return;
    const b = btns[i];
    SH.audio.sfx('click');
    if (b.side) {
      // 왼쪽(이름) 누르면 다음 값, ◀ 쪽이면 줄이기, ▶ 쪽이면 늘리기
      const rel = (x - b.x) / b.w;
      if (rel >= 0.45 && rel < 0.75) b.side.dec();
      else b.side.inc();
      return;
    }
    b.act();
  }
  function key(code) {
    keyNav = true;
    const n = btns.length;
    if (!n) return;
    if (code === 'ArrowUp' || code === 'KeyW') { focus = (focus - 1 + n) % n; SH.audio.sfx('click'); }
    else if (code === 'ArrowDown' || code === 'KeyS') { focus = (focus + 1) % n; SH.audio.sfx('click'); }
    else if (code === 'ArrowLeft' || code === 'KeyA') {
      const b = btns[focus];
      if (b && b.side) { b.side.dec(); SH.audio.sfx('click'); } else { focus = (focus - 1 + n) % n; SH.audio.sfx('click'); }
    } else if (code === 'ArrowRight' || code === 'KeyD') {
      const b = btns[focus];
      if (b && b.side) { b.side.inc(); SH.audio.sfx('click'); } else { focus = (focus + 1) % n; SH.audio.sfx('click'); }
    } else if (code === 'Enter' || code === 'Space' || code === 'KeyZ') {
      const b = btns[focus];
      if (b) { SH.audio.sfx('click'); b.act(); }
    } else if (code === 'Escape') {
      if (screen === 'help' || screen === 'ranking') go('title');
      else if (screen === 'settings') go(settingsBack);
      else if (screen === 'pause') act.resume();
    }
  }

  function init(actions, save) {
    act = actions;
    data = save;
    touch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  }

  return {
    init, draw, go, key, pointerDown, pointerUp, playHit, drawPlayButtons,
    get screen() { return screen; },
    set touch(v) { touch = v; },
    showOver() { over = { count: 10, last: 10 }; go('over'); },
    showEnding(r) { result = r; ending = { t: 0 }; go('ending'); },
    setResult(r) { result = r; },
  };
})();

</script>
  <script>/* js/main.js */
'use strict';

/* =========================================================
 * 하늘 사냥꾼 — 시작점
 * 화면 맞추기(픽셀이 고르게 보이도록 정수배 확대), 입력 나눠 주기, 게임 루프, 이벤트 → 소리·효과
 * ========================================================= */

(() => {
  const { W, DT } = SH;
  const PW = 225, PH = 400;
  const $ = (id) => document.getElementById(id);
  const S = { game: null, save: null, scale: 1, rect: null, last: 0, acc: 0 };

  /* ---------------- 화면 크기: 225×400 픽셀을 되도록 정수배로 ---------------- */
  function layout() {
    const app = $('app');
    const cs = getComputedStyle(app);
    const aw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const dpr = window.devicePixelRatio || 1;
    const fit = Math.min((aw * dpr) / PW, (ah * dpr) / PH);
    // 정수배가 화면을 충분히 채우면 정수배(가장 또렷), 아니면 그대로
    const k = Math.floor(fit) >= 1 && Math.floor(fit) / fit >= 0.82 ? Math.floor(fit) : fit;
    const devW = Math.max(PW, Math.round(PW * k)), devH = Math.max(PH, Math.round(PH * k));
    const cssW = devW / dpr, cssH = devH / dpr;
    SH.render.resize(devW, devH, cssW, cssH);
    S.scale = cssW / W; // CSS 픽셀 / 게임 논리 좌표
  }

  /** 화면 좌표 → 버퍼 픽셀 좌표 */
  function toPx(e) {
    const r = $('cv').getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * PW, y: ((e.clientY - r.top) / r.height) * PH };
  }

  /* ---------------- 설정 ---------------- */
  function applySettings() {
    const st = S.save.settings;
    SH.audio.setVolume({ sfx: st.sfx, music: st.music });
    SH.fx.state.shakeOn = !!st.shake;
    SH.input.setSensitivity(st.sens);
    SH.save.store(S.save);
  }
  function vibrate(ms) {
    if (S.save.settings.vibrate && navigator.vibrate) {
      try { navigator.vibrate(ms); } catch (e) { /* 무시 */ }
    }
  }

  /* ---------------- 게임 이벤트 → 소리·효과·안내 ---------------- */
  const SOUND = {
    missile: 'missile', bossBoom: 'bossBoom', bossDie: 'bossDie', playerDie: 'playerDie', bomb: 'bomb',
    power: 'power', item: 'item', extend: 'extend', gem: 'gem', spark: 'spark', shieldBreak: 'shield',
    warning: 'warning', bossPhase: 'phase', stageClear: 'clear', partDestroyed: 'part', laserWarn: 'laserWarn',
    laserFire: 'laserFire', enemyMissile: 'enemyMissile', missileDown: 'missileDown',
  };
  function onEvent(type, d) {
    SH.fx.onEvent(type, d);
    if (SOUND[type]) SH.audio.sfx(SOUND[type]);
    switch (type) {
      case 'shoot': SH.audio.sfx('shoot_' + d.weapon); break;
      case 'hit': SH.audio.sfx(d.armor ? 'armor' : 'hit'); break;
      case 'stageStart': SH.render.reset(); SH.audio.music('stage1'); break;
      case 'warning': SH.audio.music('none'); break;
      case 'bossAppear': SH.audio.music('boss'); break;
      case 'bossReady': SH.render.showNotice('포탑을 부숴라!', '코어는 방어막으로 덮여 있다', '#ffd84a', 2.4); break;
      case 'bossPhase':
        SH.render.showNotice(d.name, d.berserk ? '모든 공격이 빨라진다!' : '파워 아이템을 챙기자!', d.berserk ? '#ff5a5a' : '#ffd84a', 2.4);
        vibrate(80);
        break;
      case 'partDestroyed': vibrate(120); break;
      case 'stageClear': SH.audio.music('none'); record(true, true); break;
      case 'playerDie': vibrate(220); break;
      case 'bomb': vibrate(60); break;
      case 'bossDie': vibrate(400); break;
      case 'extend': if (d.score && S.game && S.game.phase !== 'clear') SH.render.showNotice('1UP!', '점수 보너스 - 비행기 +1', '#ff7aa8', 1.8); break;
      case 'gameOver':
        SH.audio.sfx('gameOver');
        SH.audio.music('none');
        setTimeout(() => {
          if (!S.game || S.game.over !== 'gameover') return;
          SH.input.releaseAll();
          SH.ui.showOver();
        }, 900);
        break;
      case 'win':
        SH.audio.music('ending');
        S.save.cleared += 1;
        SH.ui.showEnding(record(true));
        break;
      default:
    }
  }

  /** 보스를 얼마나 부쉈는지 (%) */
  function progress(g) {
    if (!g) return 0;
    if (g.phase === 'clear' || g.over === 'win') return 100;
    const e = g.boss;
    if (!e) return 0;
    let total = e.maxHp, dealt = e.maxHp - e.hp;
    for (const p of Object.values(e.parts)) { total += p.maxHp; dealt += p.maxHp - Math.max(0, p.hp); }
    return Math.min(99, Math.floor((dealt / total) * 100));
  }

  /** 점수 기록 (순위표·최고 점수). 결과 요약을 돌려줌 */
  let recorded = null;
  function record(cleared, peek) {
    const g = S.game;
    if (!g) return { score: 0, rank: -1 };
    if (recorded && recorded.game === g && recorded.score === g.score) return recorded.result;
    const isNew = g.score > S.save.best;
    if (isNew) S.save.best = g.score;
    const pct = progress(g);
    let rank = -1;
    if (!peek && g.score > 0) rank = SH.save.addRank(S.save, { score: g.score, stage: 0, pct, cleared: !!cleared });
    SH.save.store(S.save);
    const result = { score: g.score, rank, isNew: isNew && g.score > 0, cleared: !!cleared, pct, missiles: g.stats.missiles, kills: g.stats.missiles };
    if (!peek) recorded = { game: g, score: g.score, result };
    return result;
  }

  /* ---------------- 진행 ---------------- */
  const act = {
    start() {
      SH.audio.unlock();
      SH.fx.clear();
      SH.render.reset();
      recorded = null;
      S.game = new SH.Game({ emit: onEvent });
      S.acc = 0;
      SH.input.releaseAll();
      SH.ui.go(null);
    },
    pause() {
      if (SH.ui.screen !== null || !S.game || S.game.over) return;
      SH.input.releaseAll();
      SH.ui.go('pause');
    },
    resume() {
      if (!S.game) return;
      S.acc = 0;
      SH.ui.go(null);
    },
    toTitle() {
      if (S.game && !S.game.over) record(false);
      S.game = null;
      SH.fx.clear();
      SH.ui.go('title');
      SH.audio.music('title');
    },
    continueGame() {
      if (!S.game) return;
      S.game.continueGame();
      S.acc = 0;
      SH.ui.go(null);
      SH.audio.music('boss');
    },
    nextLoop() {
      if (!S.game) return;
      recorded = null;
      S.game.nextLoop();
      S.acc = 0;
      SH.ui.go(null);
    },
    record: (cleared) => record(cleared),
    bomb: () => SH.input.queueBomb(),
    settings: applySettings,
    game: () => S.game,
    drawGameFrozen() { if (S.game) SH.render.drawGame(S.game, 0, { best: S.save.best, frozen: true }); },
  };

  /* ---------------- 입력 나눠 주기 ---------------- */
  const playing = () => SH.ui.screen === null && S.game && !S.game.over;
  function onDown(e) {
    SH.audio.unlock();
    const p = toPx(e);
    const touch = e.pointerType === 'touch';
    if (touch) SH.ui.touch = true;
    e.preventDefault();
    if (playing()) {
      if (SH.ui.playHit(p.x, p.y)) return;
      SH.input.dragDown(e);
    } else SH.ui.pointerDown(p.x, p.y, touch);
  }
  function onMove(e) {
    if (SH.input.dragMove(e)) e.preventDefault();
  }
  function onUp(e) {
    SH.input.dragUp(e);
    if (!playing()) {
      const p = toPx(e);
      SH.ui.pointerUp(p.x, p.y);
    }
  }
  function onKey(e) {
    SH.audio.unlock();
    if (SH.input.isGameKey(e.code) || e.code === 'Enter') e.preventDefault();
    if (playing()) {
      if (SH.input.keyDown(e) === 'pause') act.pause();
    } else if (!e.repeat) SH.ui.key(e.code);
  }

  /* ---------------- 루프 ---------------- */
  function tick(now) {
    requestAnimationFrame(tick);
    let dt = (now - S.last) / 1000;
    S.last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.1) dt = 0.1;
    const g = S.game;
    if (playing()) {
      S.acc += dt;
      let steps = 0;
      while (S.acc >= DT && steps < 6) {
        SH.input.apply(g);
        g.update(DT);
        SH.fx.update(DT);
        S.acc -= DT;
        steps++;
        if (g.over) break;
      }
      if (steps === 6) S.acc = 0;
      SH.render.drawGame(g, dt, { best: S.save.best });
      SH.ui.drawPlayButtons(g, dt);
    } else if (g && SH.ui.screen === null) {
      // 게임 오버 직후 메뉴가 뜨기 전 잠깐
      SH.fx.update(dt);
      SH.render.drawGame(g, 0, { best: S.save.best });
    } else {
      if (g && (SH.ui.screen === 'over' || SH.ui.screen === 'results')) SH.fx.update(dt);
      SH.ui.draw(dt);
    }
    SH.render.present();
  }

  /* ---------------- 시작 ---------------- */
  function boot() {
    S.save = SH.save.load();
    SH.render.init($('cv'));
    SH.input.setScale(() => S.scale);
    layout();
    window.addEventListener('resize', layout);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
    window.addEventListener('orientationchange', () => setTimeout(layout, 200));

    const app = $('app');
    app.addEventListener('pointerdown', onDown, { passive: false });
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', (e) => SH.input.dragUp(e));
    app.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('keydown', onKey);
    window.addEventListener('keyup', (e) => SH.input.keyUp(e));
    window.addEventListener('blur', () => { SH.input.releaseAll(); act.pause(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) act.pause(); });

    SH.ui.init(act, S.save);
    applySettings();
    SH.audio.music('title');
    SH.pix.preload();
    S.last = performance.now();
    requestAnimationFrame(tick);

    if (/[?&]debug\b/.test(location.search)) {
      SH.debug = {
        start: () => act.start(),
        god: () => { if (S.game) S.game.god = !S.game.god; return S.game && S.game.god; },
        power: (n, w) => { if (S.game) { S.game.power = n || 5; if (w) S.game.weapon = w; } },
        skip: (sec) => { const g = S.game; if (!g) return; for (let i = 0; i < sec * 60; i++) { g.update(DT); SH.fx.update(DT); } },
        phase: (n) => { const g = S.game; if (!g || !g.boss) return; while (g.boss && g.boss.phase < n) { if (g.boss.phase === 0) for (const p of Object.values(g.boss.parts)) { p.hp = 1; g._damagePart(p, 5); } else { g.boss.inv = 0; g._damageCore(g.boss.maxHp * 0.34); } } },
        state: () => S,
      };
      console.log('[하늘 사냥꾼] 디버그: SH.debug.start() · god() · power(5,"laser") · skip(초) · phase(0~3)');
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
