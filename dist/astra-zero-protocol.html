          ` : '<p class="muted">아직 만나지 못한 개체입니다.</p>'}
        </div>
      </div>`);
  }

  /* ───────── 기억 기록 ───────── */
  let memSel = null;
  function memories(sel) {
    const s = G().save;
    const list = (D().story || {}).memories || [];
    if (sel !== undefined) memSel = sel;
    const m = list.find((x) => x.id === memSel && s.memories.includes(x.id));
    show('memories', `
      ${topbar('기억 기록', `회수한 기억 ${s.memories.length} / ${list.length}`)}
      <div class="mem">
        <div class="mem-list panel">
          ${list.map((x, i) => {
            const got = s.memories.includes(x.id);
            const second = list.filter((y) => y.chapter === x.chapter).indexOf(x) === 1;
            const ch = D().chapters[x.chapter - 1];
            return `<button class="mem-item ${got ? 'got' : ''} ${memSel === x.id ? 'sel' : ''}" ${got ? '' : 'disabled'} data-act="sel-mem" data-id="${x.id}">
              <span class="no">${String(i + 1).padStart(2, '0')}</span>
              <b>${got ? esc(x.title) : '봉인된 기억'}</b>
              <small>${got ? `${x.chapter}장 · ${esc(ch.name)}` : second ? `${x.chapter}장 도전 과제: ${esc(ch.challenge.desc)}` : `${x.chapter}장 작전 구역에서 회수`}</small>
            </button>`;
          }).join('')}
        </div>
        <div class="mem-read panel">
          ${m ? `<div class="mem-title">${esc(m.title)}</div><p class="mem-text">${esc(m.text)}</p>` : '<p class="muted">기억을 골라 다시 떠올려 보세요.</p>'}
        </div>
      </div>`);
  }

  /* ───────── 전투 기록 ───────── */
  function records() {
    const s = G().save;
    const B = D().bosses;
    const order = D().bossOrder;
    let total = 0;
    let all = true;
    for (const id of order) {
      const r = (s.records[id] || [])[0];
      if (r) total += r.time; else all = false;
    }
    const endings = (D().story || {}).endings || {};
    show('records', `
      ${topbar('전투 기록 · 클리어 시간 랭킹', '보스별 상위 5개 기록 (이 기기에 저장)')}
      <div class="rec">
        <div class="rec-sum panel">
          <div><span>보스 최고 기록 합계</span><b>${all ? U.fmtTime(total) : `${U.fmtTime(total)} <small>(미완)</small>`}</b></div>
          <div><span>총 플레이 시간</span><b>${U.fmtDuration(s.playTime)}</b></div>
          <div><span>첫 엔딩까지</span><b>${s.firstClearTime ? U.fmtDuration(s.firstClearTime) : '—'}</b></div>
          <div><span>기억 파편</span><b>${s.memories.length} / 20</b></div>
          <div class="endings"><span>엔딩</span>${['dawn', 'stars', 'eternal'].map((id) => `<em class="${s.endings.includes(id) ? 'got' : ''}">${s.endings.includes(id) ? esc((endings[id] || {}).title || id) : '???'}</em>`).join('')}</div>
        </div>
        <div class="rec-grid">
          ${order.map((id, i) => {
            const list = s.records[id] || [];
            const seen = s.codex[id] && s.codex[id].seen;
            return `<div class="rec-card panel">
              <div class="rc-head"><span>${String(i + 1).padStart(2, '0')}</span><b>${seen ? esc(B[id].name) : '???'}</b><small>목표 ${U.fmtTime(P().parTime(B[id].chapter))}</small></div>
              ${list.length ? `<table class="rank-table"><tr><th>#</th><th>기록</th><th>랭크</th><th>난이도</th><th>날짜</th></tr>${list.map((r, k) => `<tr><td>${k + 1}</td><td>${U.fmtTime(r.time)}</td><td class="r${r.rank}">${r.rank}</td><td>${esc((D().difficulties[r.diff] || {}).name || '')}</td><td>${new Date(r.date).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}</td></tr>`).join('')}</table>` : '<p class="muted">기록 없음</p>'}
            </div>`;
          }).join('')}
        </div>
      </div>`);
  }

  /* ───────── 설정 ───────── */
  function settings(from) {
    const st = G().settings;
    const s = G().save;
    const slider = (key, label) => `<label class="set-row"><span>${label}</span><input type="range" min="0" max="100" value="${Math.round(st[key] * 100)}" data-set="${key}"><b>${Math.round(st[key] * 100)}</b></label>`;
    const toggle = (key, label) => `<label class="set-row"><span>${label}</span><input type="checkbox" ${st[key] ? 'checked' : ''} data-set="${key}"></label>`;
    show('settings', `
      <div class="panel narrow settings">
        <h2>설정</h2>
        <div class="set-group"><h3>소리</h3>
          ${slider('master', '전체 음량')}${slider('music', '배경음악')}${slider('sfx', '효과음')}${toggle('muted', '음소거')}
        </div>
        <div class="set-group"><h3>화면</h3>
          ${toggle('shake', '화면 흔들림')}${toggle('flashes', '번쩍임 효과')}${toggle('damageNumbers', '피해 숫자 표시')}
          <label class="set-row"><span>대사 속도</span><select data-set="textSpeed">
            ${[[0.6, '느림'], [1, '보통'], [1.6, '빠름'], [3, '매우 빠름']].map(([v, n]) => `<option value="${v}" ${Number(st.textSpeed) === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        </div>
        <div class="set-group"><h3>조작</h3>
          <label class="set-row"><span>터치 조작 버튼</span><select data-set="touch">
            ${[['auto', '자동 (터치하면 표시)'], ['on', '항상 표시'], ['off', '끄기']].map(([v, n]) => `<option value="${v}" ${st.touch === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
          ${toggle('autoAim', '자동 조준 (가까운 적을 향해 공격)')}
        </div>
        ${s ? `<div class="set-group"><h3>게임</h3>
          <label class="set-row"><span>난이도</span><select data-set="difficulty">
            ${Object.entries(D().difficulties).map(([id, d]) => `<option value="${id}" ${s.difficulty === id ? 'selected' : ''}>${d.name}</option>`).join('')}</select></label>
          <div class="set-row"><span>저장 데이터</span><button class="btn small danger" data-act="reset-save">초기화</button></div>
        </div>` : ''}
        <div class="row center"><button class="btn primary" data-act="${from === 'title' ? 'title' : from === 'pause' ? 'pause-back' : 'hub'}">확인</button></div>
      </div>`);
  }

  /* ───────── 결과 ───────── */
  function results(r) {
    show('results', `
      <div class="res-wrap">
        <div class="res-left">
          <div class="res-label">${r.boss ? 'MISSION COMPLETE' : 'AREA CLEAR'}</div>
          <div class="res-title">${esc(r.title)}</div>
          ${r.rank ? `<div class="res-rank r${r.rank}">${r.rank}<small>RANK</small></div>` : ''}
          ${r.newBest ? '<div class="res-best">NEW RECORD!</div>' : ''}
          ${r.place ? `<div class="res-place">이 보스 기록 ${r.place}위</div>` : ''}
        </div>
        <div class="res-right panel">
          <ul class="res-stats">
            <li><span>클리어 시간</span><b>${U.fmtTime(r.time)}</b>${r.par ? `<small>목표 ${U.fmtTime(r.par)}</small>` : ''}</li>
            <li><span>받은 피해</span><b>${Math.round(r.damageTaken).toLocaleString()}</b><small>피격 ${r.hitsTaken}회</small></li>
            <li><span>ZERO FRAME</span><b>${r.zeroFrames}회</b></li>
            <li><span>브레이크</span><b>${r.breaks}회</b></li>
            <li><span>최대 콤보</span><b>${r.maxCombo}</b></li>
            <li><span>약점 공격</span><b>${r.weakHits}회</b></li>
          </ul>
          <div class="res-gain">
            <div><span>EXP</span><b>+${Math.round(r.exp).toLocaleString()}</b></div>
            <div><span>크레딧</span><b>◈ +${Math.round(r.credits).toLocaleString()}</b></div>
          </div>
          ${r.levelUp ? `<div class="res-lvup">LEVEL UP!  Lv.${r.level} <small>SP +${r.levelUp}</small></div>` : ''}
          ${r.challenge != null ? `<div class="res-ch ${r.challenge ? 'ok' : ''}"><span>도전 과제</span><b>${esc(r.challengeDesc)}</b><em>${r.challenge ? '달성' : '미달성'}</em></div>` : ''}
          ${(r.rewards || []).length ? `<ul class="res-rewards">${r.rewards.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
          ${(r.memories || []).map((m) => `<div class="res-mem">❖ 기억 파편 「${esc(m)}」 회수</div>`).join('')}
          <div class="row right"><button class="btn primary big" data-act="results-next">계속 ▶</button></div>
        </div>
      </div>`);
  }

  function defeat(info) {
    const tips = [
      '공격이 닿기 직전에 회피하면 ZERO FRAME 이 발동합니다.',
      '보스의 노란 브레이크 게이지는 강공격과 약점 공격으로 빨리 깎입니다.',
      '"분석"(Z) 명령은 약점과 공격 방향을 보여 줍니다.',
      '작전 터미널에서 무기를 강화하거나 모듈을 바꿔 보세요.',
      '체력이 부족하면 스킬 트리의 "나노 수복"이나 "위상 방벽"을 고려하세요.',
      '어렵다면 설정에서 난이도를 "스토리"로 낮출 수 있습니다.',
    ];
    show('defeat', `
      <div class="panel narrow defeat">
        <div class="def-title">MISSION FAILED</div>
        <p class="def-sub">${esc(info.title)} — 작전 실패</p>
        <p class="tip">TIP · ${esc(U.pick(tips))}</p>
        <div class="row center">
          <button class="btn primary big" data-act="retry">다시 도전</button>
          <button class="btn" data-act="defeat-hub">작전 터미널로</button>
        </div>
      </div>`);
  }

  function credits(endingId, isNew) {
    const e = ((D().story || {}).endings || {})[endingId] || { title: endingId };
    const s = G().save;
    show('credits', `
      <div class="credits">
        <div class="cr-ending">ENDING — ${esc(e.title)}</div>
        ${isNew ? '<div class="cr-new">새로운 엔딩을 기록했습니다</div>' : ''}
        <div class="cr-roll">
          <h1>ASTRA : ZERO PROTOCOL</h1>
          <p>아스트라 : 제로 프로토콜</p>
          <h3>원작 기획</h3><p>ASTRA : ZERO PROTOCOL 게임 기획 요약</p>
          <h3>주요 인물</h3><p>카이온 · 리아 · 제로 · 아스트라</p>
          <h3>보스</h3><p>${D().bossOrder.map((id) => esc(D().bosses[id].name)).join(' · ')}</p>
          <h3>엔딩 수집</h3><p>${s.endings.length} / 3</p>
          <h3>플레이 시간</h3><p>${U.fmtDuration(s.playTime)}</p>
          <p class="cr-last">지금, 그 여정이 시작됩니다.</p>
        </div>
        <div class="row center"><button class="btn primary" data-act="credits-done">작전 터미널로</button></div>
      </div>`);
  }

  /* ───────── 오버레이: 일시정지 / 확인 / 토스트 / 연출 ───────── */
  let overlay = null;
  function ensureOverlay() {
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.className = 'overlay hidden';
    host.parentNode.appendChild(overlay);
    overlay.addEventListener('click', onClick);
    overlay.addEventListener('input', onInput);
    overlay.addEventListener('change', onInput);
    return overlay;
  }
  function pause(info) {
    const o = ensureOverlay();
    o.className = 'overlay pause';
    o.innerHTML = `
      <div class="panel narrow">
        <h2>일시정지</h2>
        <p class="muted">${esc(info.title || '')}</p>
        <div class="col">
          <button class="btn primary big" data-act="resume">계속하기</button>
          <button class="btn" data-act="pause-retry">처음부터 다시</button>
          <button class="btn" data-act="pause-settings">설정</button>
          <button class="btn" data-act="pause-howto">조작법</button>
          <button class="btn ghost" data-act="pause-quit">작전 포기 (터미널로)</button>
        </div>
      </div>`;
  }
  function pauseSettings() {
    const o = ensureOverlay();
    const st = G().settings;
    const slider = (key, label) => `<label class="set-row"><span>${label}</span><input type="range" min="0" max="100" value="${Math.round(st[key] * 100)}" data-set="${key}"><b>${Math.round(st[key] * 100)}</b></label>`;
    const toggle = (key, label) => `<label class="set-row"><span>${label}</span><input type="checkbox" ${st[key] ? 'checked' : ''} data-set="${key}"></label>`;
    o.innerHTML = `<div class="panel narrow settings"><h2>설정</h2>
      ${slider('master', '전체 음량')}${slider('music', '배경음악')}${slider('sfx', '효과음')}${toggle('muted', '음소거')}
      ${toggle('shake', '화면 흔들림')}${toggle('flashes', '번쩍임 효과')}${toggle('damageNumbers', '피해 숫자 표시')}${toggle('autoAim', '자동 조준')}
      <div class="row center"><button class="btn primary" data-act="pause-back">돌아가기</button></div></div>`;
  }
  function pauseHowto() {
    const o = ensureOverlay();
    o.innerHTML = `<div class="panel narrow"><h2>조작법</h2>
      <p><kbd>WASD</kbd> 이동 · <kbd>J</kbd> 공격 · <kbd>K</kbd> 강공격 · <kbd>Space</kbd> 회피<br>
      <kbd>U</kbd><kbd>I</kbd><kbd>O</kbd> 스킬 · <kbd>L</kbd> 궁극기 · <kbd>F</kbd> 연계 · <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd> 전술 명령</p>
      <p class="muted">공격이 닿기 직전에 회피 → ZERO FRAME → 바로 공격하면 반격.<br>노란 게이지를 깎아 BREAK → 연계 공격(F)이 공짜.</p>
      <div class="row center"><button class="btn primary" data-act="pause-back">돌아가기</button></div></div>`;
  }
  function hideOverlay() {
    if (overlay) { overlay.className = 'overlay hidden'; overlay.innerHTML = ''; }
  }

  let confirmCb = null;
  function confirm(msg, cb, okLabel) {
    const o = ensureOverlay();
    confirmCb = cb;
    o.className = 'overlay';
    o.innerHTML = `<div class="panel narrow"><p class="confirm-msg">${esc(msg)}</p>
      <div class="row center"><button class="btn danger" data-act="confirm-ok">${esc(okLabel || '확인')}</button><button class="btn" data-act="confirm-no">취소</button></div></div>`;
  }

  let toastEl = null;
  function toast(msg, kind) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toasts';
      host.parentNode.appendChild(toastEl);
    }
    const t = document.createElement('div');
    t.className = 'toast ' + (kind || '');
    t.textContent = msg;
    toastEl.appendChild(t);
    setTimeout(() => t.classList.add('out'), 2600);
    setTimeout(() => t.remove(), 3200);
  }

  /** 챕터 카드 / 보스 등장 — Promise */
  let cardEl = null;
  function card(kind, data) {
    if (!cardEl) {
      cardEl = document.createElement('div');
      cardEl.className = 'cardfx hidden';
      host.parentNode.appendChild(cardEl);
    }
    return new Promise((resolve) => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        cardEl.className = 'cardfx hidden';
        cardEl.innerHTML = '';
        cardEl.onclick = null;
        resolve();
      };
      if (kind === 'chapter') {
        cardEl.className = 'cardfx chapter';
        cardEl.innerHTML = `
          <div class="cc-line"></div>
          <div class="cc-no">CHAPTER ${data.id}</div>
          <div class="cc-name">${esc(data.name)}</div>
          <div class="cc-sum">${esc(data.summary || '')}</div>`;
        if (AZ.audio) AZ.audio.sfx('skill', { pitch: 0.7, vol: 0.6 });
        setTimeout(finish, 3000);
      } else {
        const b = D().bosses[data.bossId];
        cardEl.className = 'cardfx boss';
        cardEl.style.setProperty('--bc', b.color);
        cardEl.innerHTML = `
          <div class="bi-stripes top"><span>WARNING · WARNING · WARNING · WARNING · WARNING · WARNING · WARNING ·</span></div>
          <div class="bi-art"><img src="${D().assets['boss_' + data.bossId]}" alt=""><div class="scan"></div></div>
          <div class="bi-text"><small>${String(b.chapter).padStart(2, '0')} · TARGET</small><b>${esc(b.name)}</b><span>${esc(b.title)}</span></div>
          <div class="bi-stripes bottom"><span>· HOSTILE · HOSTILE · HOSTILE · HOSTILE · HOSTILE · HOSTILE · HOSTILE</span></div>`;
        if (AZ.audio) { AZ.audio.sfx('alarm', { vol: 0.6 }); AZ.audio.duck(0.6, 2.4); setTimeout(() => AZ.audio.sfx('roar', { vol: 0.7 }), 500); }
        setTimeout(finish, 2700);
      }
      cardEl.onclick = finish;
    });
  }

  /* ───────── 입력 처리 ───────── */
  function onInput(e) {
    const t = e.target;
    const key = t.dataset && t.dataset.set;
    if (!key) return;
    const st = G().settings;
    if (t.type === 'range') {
      st[key] = Number(t.value) / 100;
      const b = t.parentNode.querySelector('b');
      if (b) b.textContent = t.value;
    } else if (t.type === 'checkbox') st[key] = t.checked;
    else if (key === 'textSpeed') st[key] = Number(t.value);
    else if (key === 'difficulty') {
      if (G().save) { G().save.difficulty = t.value; G().persist(); }
      return;
    } else st[key] = t.value;
    G().applySettings();
    if (e.type === 'change' && t.type === 'range') sfx('ui');
  }

  function onClick(e) {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    const game = G();
    const s = game.save;
    const id = b.dataset.id;
    const big = ['sortie', 'boss-only', 'start-new', 'continue', 'results-next', 'retry', 'boss-replay', 'learn', 'up-w'];
    sfx(big.includes(act) ? 'uiConfirm' : act === 'hub' || act.endsWith('back') ? 'uiBack' : 'ui');
    switch (act) {
      case 'continue': game.continueGame(); break;
      case 'newgame': newGame(); break;
      case 'start-new': game.newGame(b.dataset.diff); break;
      case 'title': game.toTitle(); break;
      case 'howto': howto('title'); break;
      case 'howto-hub': howto('hub'); break;
      case 'settings-title': settings('title'); break;
      case 'settings': settings('hub'); break;
      case 'hub': hub(); break;
      case 'sel-ch': hub(Number(b.dataset.ch)); break;
      case 'sortie': game.startChapter(Number(b.dataset.ch), false); break;
      case 'boss-only': game.startChapter(Number(b.dataset.ch), true); break;
      case 'loadout': loadout(); break;
      case 'equip-w': P().equipWeapon(s, id); game.persist(); loadout(); break;
      case 'up-w': if (P().upgradeWeapon(s, id)) { game.persist(); sfx('levelup', { vol: 0.5 }); } loadout(); break;
      case 'equip-m': {
        const slot = s.equippedModules.indexOf(null);
        if (slot >= 0) P().equipModule(s, slot, id);
        else { P().equipModule(s, 2, id); toast('슬롯이 가득 차 마지막 슬롯을 교체했습니다.'); }
        game.persist();
        loadout();
        break;
      }
      case 'unequip-m': P().equipModule(s, Number(b.dataset.slot), null); game.persist(); loadout(); break;
      case 'unequip-mid': P().equipModule(s, s.equippedModules.indexOf(id), null); game.persist(); loadout(); break;
      case 'skills': skills(); break;
      case 'sel-skill': skills(id); break;
      case 'learn': {
        const r = P().learn(s, id);
        if (r.ok) { sfx('levelup', { vol: 0.5 }); game.persist(); } else toast(r.why);
        skills(id);
        break;
      }
      case 'equip-s': P().equipSkill(s, Number(b.dataset.slot), id); game.persist(); skills(id); break;
      case 'unequip-s': P().equipSkill(s, Number(b.dataset.slot), null); game.persist(); skills(); break;
      case 'codex': codex(); break;
      case 'sel-codex': codex(id); break;
      case 'boss-replay': game.startBossReplay(id); break;
      case 'memories': memories(); break;
      case 'sel-mem': memories(id); break;
      case 'records': records(); break;
      case 'reset-save':
        confirm('저장 데이터를 모두 지울까요? 되돌릴 수 없습니다.', () => { AZ.save.clear(); game.toTitle(); toast('저장 데이터를 지웠습니다.'); }, '지우기');
        break;
      case 'results-next': game.resultsNext(); break;
      case 'retry': game.retry(); break;
      case 'defeat-hub': game.toHub(); break;
      case 'credits-done': game.toHub(); break;
      case 'resume': game.resume(); break;
      case 'pause-retry': game.retryFromPause(); break;
      case 'pause-settings': pauseSettings(); break;
      case 'pause-howto': pauseHowto(); break;
      case 'pause-back': if (game.paused) pause({ title: game.battleTitle() }); else game.toTitle(); break;
      case 'pause-quit': game.quitBattle(); break;
      case 'confirm-ok': { const cb = confirmCb; confirmCb = null; hideOverlay(); if (cb) cb(); break; }
      case 'confirm-no': confirmCb = null; hideOverlay(); break;
      default: break;
    }
  }

  return {
    init, hide, title, newGame, hub, loadout, skills, codex, memories, records, settings, results, defeat, credits,
    pause, hideOverlay, confirm, toast, card, howto, iconURL,
    get current() { return current; },
  };
})();

</script>
  <script>/* js/main.js */
'use strict';

/* =========================================================
 * ASTRA : ZERO PROTOCOL — 부팅, 게임 루프, 화면 흐름
 * ========================================================= */
window.AZ = window.AZ || {};

AZ.game = (() => {
  const U = AZ.util;
  const VW = 1280;
  const VH = 720;
  let stage = null;
  let canvas = null;
  let g = null;
  let scale = 1;
  let backing = 1;
  let last = 0;
  let time = 0;
  let audioReady = false;

  const game = {
    save: null,
    settings: null,
    W: null,
    paused: false,
    flow: null,
    music: 'none',
  };

  /* ───────── 화면 맞춤 ───────── */
  function safeInsets() {
    const probe = document.getElementById('safe-probe');
    if (!probe) return { l: 0, r: 0, t: 0, b: 0 };
    const cs = getComputedStyle(probe);
    return {
      l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0,
      t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0,
    };
  }
  function resize() {
    const ins = safeInsets();
    const vw = window.innerWidth - ins.l - ins.r;
    const vh = window.innerHeight - ins.t - ins.b;
    scale = Math.max(0.1, Math.min(vw / VW, vh / VH));
    const x = ins.l + (vw - VW * scale) / 2;
    const y = ins.t + (vh - VH * scale) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    const dpr = window.devicePixelRatio || 1;
    backing = Math.min(2, Math.max(0.75, scale * dpr));
    canvas.width = Math.round(VW * backing);
    canvas.height = Math.round(VH * backing);
    if (AZ.gfx.render) AZ.gfx.render.resetCaches();
    document.body.classList.toggle('portrait', window.innerHeight > window.innerWidth * 1.1);
  }
  function toLogical(cx, cy) {
    const r = stage.getBoundingClientRect();
    return { x: (cx - r.left) / scale, y: (cy - r.top) / scale };
  }

  /* ───────── 설정/저장 ───────── */
  function applySettings() {
    const s = game.settings;
    if (AZ.audio) {
      AZ.audio.setVolumes({ master: s.master, music: s.music, sfx: s.sfx });
      AZ.audio.setMuted(!!s.muted);
    }
    AZ.gfx.fx.setSettings({ shake: s.shake, flashes: s.flashes, damageNumbers: s.damageNumbers });
    if (s.touch === 'on') setTouch(true);
    else if (s.touch === 'off') setTouch(false);
    if (game.W) {
      game.W.autoAim = s.autoAim;
      game.W.settingsDamageNumbers = s.damageNumbers;
    }
    AZ.save.storeSettings(s);
  }
  function setTouch(v) {
    AZ.input.setTouch(v);
    AZ.gfx.render.setTouchMode(v);
    document.body.classList.toggle('touch', v);
  }
  function persist() {
    if (game.save) AZ.save.store(game.save);
  }

  function setMusic(id) {
    game.music = id;
    if (audioReady && AZ.audio) AZ.audio.music(id);
  }
  function unlockAudio() {
    if (audioReady || !AZ.audio) return;
    try {
      AZ.audio.init();
      audioReady = true;
      applySettings();
      AZ.audio.music(game.music);
    } catch (e) { /* 소리 없이 계속 */ }
  }

  /* ───────── 기본 흐름 ───────── */
  function toTitle() {
    endBattle();
    game.flow = null;
    AZ.ui.screens.hideOverlay();
    AZ.ui.screens.title();
    setMusic('title');
  }
  function toHub() {
    endBattle();
    if (game.flow && game.flow.abort) game.flow.abort();
    game.flow = null;
    AZ.ui.screens.hideOverlay();
    if (!game.save) return toTitle();
    persist();
    AZ.ui.screens.hub();
    setMusic('hub');
  }
  function continueGame() {
    game.save = AZ.save.load();
    if (!game.save) return toTitle();
    toHub();
  }
  function newGame(diff) {
    game.save = AZ.save.fresh(diff);
    persist();
    startChapter(1, false);
  }

  /* ───────── 전투 ───────── */
  function inBattle() { return !!game.W && !game.paused; }

  function runBattle(cfg) {
    return new Promise((resolve) => {
      const s = game.save;
      const stats = AZ.progress.computeStats(s);
      const party = AZ.progress.partyFor(s, cfg.chapterId);
      const W = AZ.battle.create(Object.assign({ difficulty: s.difficulty, stats, party }, cfg));
      W.autoAim = game.settings.autoAim;
      W.settingsDamageNumbers = game.settings.damageNumbers;
      W._resolve = resolve;
      AZ.gfx.fx.reset();
      AZ.input.clear();
      AZ.ui.screens.hide();
      game.W = W;
      game.paused = false;
      document.body.classList.add('in-battle');
    });
  }
  function finishBattle(outcome) {
    const W = game.W;
    if (!W || W._finished) return;
    W._finished = true;
    const res = W.result || Object.assign({}, W.stats, { outcome, maxHp: W.player.maxHp });
    res.outcome = outcome;
    game.W = null;
    game.paused = false;
    document.body.classList.remove('in-battle');
    AZ.ui.screens.hideOverlay();
    if (W._resolve) W._resolve(res);
  }
  function endBattle() {
    if (game.W) {
      game.W._resolve = null;
      game.W = null;
    }
    game.paused = false;
    document.body.classList.remove('in-battle');
  }
  function pauseBattle() {
    if (!game.W || game.paused || game.W.state !== 'fight' && game.W.state !== 'intro') return;
    game.paused = true;
    AZ.ui.screens.pause({ title: battleTitle() });
    if (AZ.audio) AZ.audio.duck(0.6, 0.3);
  }
  function resume() {
    if (!game.W) return;
    game.paused = false;
    AZ.input.clear();
    AZ.ui.screens.hideOverlay();
  }
  function battleTitle() {
    const W = game.W;
    if (!W) return '';
    return `${W.ch.id}장 ${W.ch.name} — ${W.mode === 'boss' ? AZ.data.bosses[W.cfg.bossId].name : '작전 구역'}`;
  }
  function retryFromPause() { finishBattle('retry'); }
  function quitBattle() {
    AZ.ui.screens.confirm('작전을 포기하고 작전 터미널로 돌아갈까요? (이번 전투의 보상은 없습니다)', () => finishBattle('quit'), '포기');
  }

  /* 실패 화면 → 'retry' | 'hub' */
  function askDefeat(title) {
    return new Promise((resolve) => {
      game.flow.defeatResolve = resolve;
      AZ.ui.screens.defeat({ title });
      setMusic('memory');
    });
  }
  function retry() { if (game.flow && game.flow.defeatResolve) { const r = game.flow.defeatResolve; game.flow.defeatResolve = null; r('retry'); } }
  function resultsNext() { if (game.flow && game.flow.resultsResolve) { const r = game.flow.resultsResolve; game.flow.resultsResolve = null; r(); } }

  function talk(lines, theme, music) {
    if (!lines || !lines.length) return Promise.resolve();
    setMusic(music || 'memory');
    AZ.ui.screens.hide();
    return AZ.ui.dialogue.play(lines, {
      flags: game.save.flags,
      bg: theme,
      onFlag: () => persist(),
    });
  }

  /** 반복 전투 (실패 시 다시) → 결과 or null(포기) */
  async function battleLoop(cfg, title, flowToken) {
    for (;;) {
      if (cfg.mode === 'boss') {
        markSeen(cfg.bossId);
        await AZ.ui.screens.card('boss', { bossId: cfg.bossId });
        if (game.flow !== flowToken) return null;
        setMusic(AZ.data.bosses[cfg.bossId].music);
      } else {
        setMusic(AZ.data.chapters[cfg.chapterId - 1].music);
      }
      const res = await runBattle(cfg);
      if (game.flow !== flowToken) return null;
      if (res.outcome === 'victory') return res;
      if (res.outcome === 'quit') return null;
      if (res.outcome === 'retry') continue;
      const choice = await askDefeat(title);
      if (game.flow !== flowToken) return null;
      if (choice !== 'retry') return null;
    }
  }

  function markSeen(bossId) {
    const s = game.save;
    const cx = s.codex[bossId] || (s.codex[bossId] = { seen: false, defeated: false, clears: 0, best: null });
    cx.seen = true;
    persist();
  }

  function chapterMemories(chId) {
    return ((AZ.data.story || {}).memories || []).filter((m) => m.chapter === chId);
  }

  /** 챕터 진행 */
  async function startChapter(chId, bossOnly) {
    const s = game.save;
    const D = AZ.data;
    const ch = D.chapters[chId - 1];
    const story = (D.story && D.story.chapters && D.story.chapters[chId]) || {};
    const token = { chId, bossOnly };
    game.flow = token;
    AZ.ui.screens.hide();
    AZ.ui.screens.hideOverlay();
    const mems = chapterMemories(chId);
    const gained = { exp: 0, credits: 0, memories: [], time: 0, levelBefore: s.level };
    const dlgMusic = [6, 7, 10].includes(chId) ? 'memory' : 'hub';

    if (!bossOnly) {
      setMusic(dlgMusic);
      await AZ.ui.screens.card('chapter', { id: chId, name: ch.name, summary: (D.story && D.story.chapterSummaries || {})[chId] });
      if (game.flow !== token) return;
      await talk(story.intro, ch.theme, dlgMusic);
      if (game.flow !== token) return;
      const wave = await battleLoop({ chapterId: chId, mode: 'wave', tutorial: chId === 1 }, `${chId}장 작전 구역`, token);
      if (!wave) return toHub();
      gained.exp += wave.exp;
      gained.credits += wave.credits;
      gained.time += wave.time;
      if (mems[0] && AZ.progress.addMemory(s, mems[0].id)) {
        gained.memories.push(mems[0].title);
        AZ.ui.screens.toast(`기억 파편 회수 — 「${mems[0].title}」`, 'mem');
      }
      AZ.progress.addExp(s, wave.exp);
      s.credits += Math.round(wave.credits);
      persist();
      await talk(story.preBoss, ch.theme, dlgMusic);
      if (game.flow !== token) return;
    }

    const res = await battleLoop({ chapterId: chId, mode: 'boss', bossId: ch.boss }, `${chId}장 보스전`, token);
    if (!res) return toHub();
    gained.time += res.time;
    await afterBoss(chId, res, gained, bossOnly, token);
  }

  async function afterBoss(chId, res, gained, bossOnly, token) {
    const s = game.save;
    const D = AZ.data;
    const P = AZ.progress;
    const ch = D.chapters[chId - 1];
    const story = (D.story && D.story.chapters && D.story.chapters[chId]) || {};
    const firstClear = !s.cleared[chId];
    const rec = P.recordBoss(s, ch.boss, chId, res);
    res.score = rec.score;
    const exp = P.bossExp(chId) * (firstClear ? 1 : 0.6) + res.exp;
    const credits = P.bossCredits(chId) * (firstClear ? 1 : 0.6) + res.credits;
    const lvBefore = s.level;
    P.addExp(s, exp);
    s.credits += Math.round(credits);
    const challenge = P.checkChallenge(ch, Object.assign({}, res, { score: rec.score }));
    const mems = chapterMemories(chId);
    const memList = gained.memories.slice();
    if (challenge && mems[1] && P.addMemory(s, mems[1].id)) memList.push(mems[1].title);
    let rewards = [];
    if (!bossOnly) {
      rewards = P.grantChapterRewards(s, chId);
      if (!s.chapterBest[chId] || gained.time < s.chapterBest[chId]) s.chapterBest[chId] = Math.round(gained.time * 100) / 100;
    }
    persist();

    if (!bossOnly) {
      await talk(story.outro, ch.theme, [6, 7, 10].includes(chId) ? 'memory' : 'hub');
      if (game.flow !== token) return;
      persist();
    }

    // 결과 화면
    setMusic('hub');
    await new Promise((resolve) => {
      game.flow.resultsResolve = resolve;
      AZ.ui.screens.results({
        boss: true, title: `${chId}장 ${ch.name} — ${D.bosses[ch.boss].name}`, rank: rec.rank, newBest: rec.newBest, place: rec.place,
        time: res.time, par: P.parTime(chId), damageTaken: res.damageTaken, hitsTaken: res.hitsTaken, zeroFrames: res.zeroFrames,
        breaks: res.breaks, maxCombo: res.maxCombo, weakHits: res.weakHits,
        exp: exp + gained.exp, credits: credits + gained.credits, levelUp: s.level - (gained.levelBefore || lvBefore), level: s.level,
        challenge, challengeDesc: ch.challenge.desc, rewards, memories: memList,
      });
      if (AZ.audio) AZ.audio.sfx('victory');
    });
    if (game.flow !== token) return;

    if (chId === 10 && !bossOnly) return ending(token);
    if (token.returnTo === 'codex') {
      game.flow = null;
      AZ.ui.screens.codex();
      setMusic('hub');
      return;
    }
    toHub();
  }

  /** 보스 도감에서 재도전 */
  async function startBossReplay(bossId) {
    const b = AZ.data.bosses[bossId];
    const token = { chId: b.chapter, bossOnly: true, returnTo: 'codex' };
    game.flow = token;
    const res = await battleLoop({ chapterId: b.chapter, mode: 'boss', bossId }, `보스 재도전 — ${b.name}`, token);
    if (!res) { if (game.flow === token) { game.flow = null; AZ.ui.screens.codex(); setMusic('hub'); } return; }
    await afterBoss(b.chapter, res, { exp: 0, credits: 0, memories: [], time: res.time }, true, token);
  }

  /** 최종 선택 → 엔딩 */
  async function ending(token) {
    const s = game.save;
    const story = AZ.data.story || {};
    const fc = story.finalChoice;
    if (!fc) return toHub();
    const opts = fc.options.filter((o) => !o.require || o.require.every((f) => s.flags[f] === true));
    const temp = Object.assign({}, s.flags);
    setMusic('final');
    await AZ.ui.dialogue.play(fc.prompt.concat([{ choice: '__ending', options: opts.map((o) => ({ text: o.text, value: o.ending })) }]), {
      flags: temp, bg: 'void',
    });
    if (game.flow !== token) return;
    const id = temp.__ending || 'stars';
    const e = (story.endings || {})[id];
    setMusic('ending');
    if (e) await AZ.ui.dialogue.play(e.lines, { flags: s.flags, bg: id === 'dawn' ? 'dawn' : 'void' });
    if (game.flow !== token) return;
    const isNew = !s.endings.includes(id);
    if (isNew) s.endings.push(id);
    if (s.firstClearTime == null) s.firstClearTime = s.playTime;
    persist();
    game.flow = null;
    AZ.ui.screens.credits(id, isNew);
    setMusic('ending');
  }

  /* ───────── 키 ───────── */
  function onKey(a, e) {
    unlockAudio();
    if (AZ.ui.dialogue.active) {
      if (a === 'skill0' || a === 'skill1' || a === 'skill2') { AZ.ui.dialogue.onDigit(Number(a.slice(-1)) + 1); return; }
      if (a === 'ult') { AZ.ui.dialogue.onDigit(4); return; }
      if (AZ.ui.dialogue.onKey(a)) { if (e) e.preventDefault(); }
      return;
    }
    if (game.W) {
      if (a === 'pause') {
        if (game.paused) resume(); else pauseBattle();
      }
      return;
    }
    if (a === 'pause' || a === 'back') {
      const cur = AZ.ui.screens.current;
      if (cur && cur !== 'hub' && cur !== 'title' && cur !== 'results' && cur !== 'defeat' && game.save) AZ.ui.screens.hub();
    }
  }

  /* ───────── 루프 ───────── */
  function drawMenuBackground(dt) {
    g.setTransform(backing, 0, 0, backing, 0, 0);
    const sky = AZ.gfx.render.getSky('void');
    if (sky) {
      const off = (time * 6) % (sky.width - VW);
      g.drawImage(sky, -off * 0.3 - 100, 0);
    } else {
      g.fillStyle = '#05060f';
      g.fillRect(0, 0, VW, VH);
    }
  }

  function tutorialOverlay(W) {
    if (!W.cfg.tutorial || W.stats.time > 30 || AZ.input.touchMode) return;
    const lines = ['이동  W A S D', '공격  J (누르고 있으면 연속)', '강공격  K', '회피  Space — 공격 직전에 피하면 ZERO FRAME', '스킬  U · 궁극기  L · 전술 명령  Z X C'];
    g.save();
    g.globalAlpha = Math.min(1, (30 - W.stats.time) / 3);
    g.fillStyle = 'rgba(4,10,26,0.7)';
    AZ.gfx.fx.roundRect(g, VW / 2 - 230, VH - 196, 460, 132, 12);
    g.fill();
    g.font = '700 15px "Pretendard","Noto Sans KR",sans-serif';
    g.textAlign = 'center';
    g.fillStyle = '#cfe6ff';
    lines.forEach((l, i) => g.fillText(l, VW / 2, VH - 170 + i * 24));
    g.restore();
  }

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000 || 0));
    last = now;
    time += dt;
    try {
      const W = game.W;
      if (W) {
        if (!game.paused) {
          const inp = AZ.input.frame();
          AZ.battle.step(W, dt, inp);
          AZ.gfx.fx.consume(W);
          AZ.gfx.fx.update(dt);
          g.setTransform(backing, 0, 0, backing, 0, 0);
          AZ.gfx.render.drawBattle(g, W, time, dt, inp);
          tutorialOverlay(W);
          if (W.state === 'victory' || W.state === 'defeat') finishBattle(W.state);
        }
      } else if (!AZ.ui.dialogue.active) {
        drawMenuBackground(dt);
      }
      AZ.ui.dialogue.update(dt);
      if (game.save && !game.paused) game.save.playTime += dt;
    } catch (err) {
      console.error(err);
    }
    requestAnimationFrame(frame);
  }

  /* ───────── 부팅 ───────── */
  function boot() {
    stage = document.getElementById('stage');
    canvas = document.getElementById('game');
    g = canvas.getContext('2d');
    game.settings = AZ.save.loadSettings();
    AZ.ui.screens.init(stage);
    AZ.input.init({
      canvas, toLogical,
      onTouchModeChange: (v) => {
        if (game.settings.touch === 'auto') { AZ.gfx.render.setTouchMode(v); document.body.classList.toggle('touch', v); }
      },
    });
    if (game.settings.touch === 'on') setTouch(true);
    const unlock = () => unlockAudio();
    window.addEventListener('pointerdown', unlock, { passive: true });
    window.addEventListener('keydown', unlock);
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { pauseBattle(); persist(); }
    });
    window.addEventListener('beforeunload', persist);
    setInterval(persist, 30000);
    resize();
    applySettings();
    game.save = AZ.save.load();
    // 디버그: ?debug
    if (/[?&]debug/.test(location.search)) installDebug();
    toTitle();
    requestAnimationFrame((t) => { last = t; frame(t); });
  }

  function installDebug() {
    AZ.debug = {
      win: () => { if (game.W) { for (const e of game.W.enemies) if (!e.dead) AZ.battle.killEnemy(game.W, e); if (game.W.mode === 'wave') { game.W.waveIdx = game.W.waves.length - 1; } } },
      boss: (id) => startBossReplay(id),
      level: (n) => { game.save.level = n; game.save.sp += n; persist(); },
      credits: (n) => { game.save.credits += n; persist(); },
      unlockAll: () => { const s = game.save; s.unlockedChapter = 10; for (let i = 1; i <= 10; i++) s.cleared[i] = true; for (const w of AZ.data.weaponOrder) s.weapons[w] = s.weapons[w] || 1; s.modules = Object.keys(AZ.data.modules); persist(); },
      focus: () => { if (game.W) game.W.player.focus = 100; },
      hp: (f) => { if (game.W) game.W.boss.hp = game.W.boss.maxHp * f; },
      W: () => game.W,
    };
  }

  Object.assign(game, {
    boot, persist, applySettings, toTitle, toHub, continueGame, newGame, startChapter, startBossReplay,
    resultsNext, retry, resume, retryFromPause, quitBattle, battleTitle, inBattle, onKey,
  });
  return game;
})();

window.addEventListener('DOMContentLoaded', () => AZ.game.boot());

</script>
</body>
</html>
