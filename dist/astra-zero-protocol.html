  <script>/* js/core/battle.js */
'use strict';

/* =========================================================
 * 전투 월드 — 엔티티, 시간, 피해 판정, 위험 지역(경고 공격), 투사체, 동료
 * DOM 없음. 연출·소리는 W.events 에 쌓아 두면 화면 쪽이 가져갑니다.
 *   이벤트: { type: 'sfx'|'shake'|'text'|'spark'|'slash'|'ring'|'burst'|'banner'|'bark'|'flash'|'beam'|'trail'|'cutin', ... }
 * ========================================================= */
window.AZ = window.AZ || {};

AZ.battle = (() => {
  const U = AZ.util;

  /* ───────────── 생성 ───────────── */

  /**
   * cfg: { chapterId, mode: 'wave'|'boss', bossId?, waves?, difficulty, stats, party: {lia, zero},
   *        arena?: [w,h], memoryId? }
   */
  function create(cfg) {
    const D = AZ.data;
    const P = AZ.progress;
    const ch = D.chapters[cfg.chapterId - 1];
    const diff = D.difficulties[cfg.difficulty] || D.difficulties.normal;
    const [aw, ah] = cfg.arena || ch.arena || [1700, 1100];
    const W = {
      cfg, ch, diff,
      mode: cfg.mode,
      w: aw, h: ah,
      t: 0,
      state: 'intro', stateT: 0,
      events: [],
      enemies: [],
      allies: [],
      hazards: [],
      bullets: [],
      pickups: [],
      boss: null,
      hitstop: 0,
      slow: 1, slowT: 0,
      zero: 0, zeroMax: 0,
      timeStop: 0,
      enemyScale: 1,
      scan: 0,
      allyFocus: 0,
      cmdCd: [0, 0, 0],
      waveIdx: -1, waveDelay: 0,
      chainUsedThisBreak: false,
      ref: { atk: P.refAtk(cfg.chapterId), dmg: P.refDmg(cfg.chapterId) * diff.dmg },
      stats: {
        time: 0, damageTaken: 0, hitsTaken: 0, zeroFrames: 0, breaks: 0, maxCombo: 0,
        weakHits: 0, scans: 0, countered: 0, dmgDealt: 0, kills: 0, exp: 0, credits: 0, byKind: {},
      },
      memoryFound: false,
      result: null,
    };
    W.player = AZ.player.create(W, cfg.stats);
    W.player.x = aw / 2;
    W.player.y = ah * 0.72;
    W.player.facing = -Math.PI / 2;

    if (cfg.party && cfg.party.lia) W.allies.push(makeAlly(W, 'lia'));
    if (cfg.party && cfg.party.zero) W.allies.push(makeAlly(W, 'zero'));

    if (cfg.mode === 'boss') {
      W.boss = AZ.ai.spawnBoss(W, cfg.bossId);
    } else {
      W.waves = cfg.waves || ch.waves;
      W.waveDelay = 0.6;
    }
    return W;
  }

  function makeAlly(W, kind) {
    const s = W.player.stats;
    const a = {
      id: U.nextId(), kind: 'ally', ally: kind, team: 'player',
      x: W.player.x + (kind === 'lia' ? -70 : 70), y: W.player.y + 40, z: kind === 'lia' ? 34 : 0,
      vx: 0, vy: 0, r: kind === 'lia' ? 14 : 20,
      facing: -Math.PI / 2,
      maxHp: Math.round(s.maxHp * (kind === 'lia' ? 0.45 : 0.8) * s.allyHp),
      hp: 0, down: 0, flash: 0, shield: 0, shieldT: 0,
      atkT: 1 + Math.random(), anim: 'idle', animT: 0, dodgeT: 0,
      comboN: 0, moveT: 0,
    };
    a.hp = a.maxHp;
    return a;
  }

  /* ───────────── 이벤트 도우미 ───────────── */
  const ev = (W, e) => { W.events.push(e); };
  const sfx = (W, name, opts) => ev(W, { type: 'sfx', name, opts });
  const text = (W, x, y, str, color, size, extra) =>
    ev(W, Object.assign({ type: 'text', x, y, str, color: color || '#fff', size: size || 22 }, extra || {}));
  const shake = (W, amt) => ev(W, { type: 'shake', amt });
  const bark = (W, group, key) => ev(W, { type: 'bark', group, key });

  /* ───────────── 판정 도우미 ───────────── */
  function inShape(h, x, y, r) {
    switch (h.shape) {
      case 'circle':
        return U.dist2(h.x, h.y, x, y) < (h.r + r) * (h.r + r);
      case 'ring': {
        const d = U.dist(h.x, h.y, x, y);
        return d > h.r0 - r && d < h.r1 + r;
      }
      case 'sector': {
        const d = U.dist(h.x, h.y, x, y);
        if (d > h.r + r) return false;
        if (d < r + 6) return true;
        const tol = Math.asin(Math.min(1, r / d));
        return Math.abs(U.angleDiff(h.ang, U.angleTo(h.x, h.y, x, y))) <= h.arc / 2 + tol;
      }
      case 'line': {
        const ex = h.x + Math.cos(h.ang) * h.len;
        const ey = h.y + Math.sin(h.ang) * h.len;
        return U.segDist2(x, y, h.x, h.y, ex, ey) < (h.w / 2 + r) * (h.w / 2 + r);
      }
      case 'outside':
        return U.dist(h.x, h.y, x, y) > h.r - r;
      case 'all': {
        if (h.safe) {
          for (const s of h.safe) if (U.dist(s.x, s.y, x, y) < s.r - r * 0.5) return false;
        }
        return true;
      }
      default:
        return false;
    }
  }

  /* ───────────── 위험 지역(적의 경고 공격) ───────────── */

  /**
   * 위험 지역을 만듭니다. opts:
   *   warn(경고 시간), life(판정 유지, 기본 0.12), dmg(피해 단위 배율), kb(넉백), tick(지속 판정 간격),
   *   owner, follow(위치 따라감), update(h,W,dt), onActive(h,W), color, noPerfect, safe(안전 지대 목록),
   *   label(경고 글자), pull(끌어당김 세기), silent
   */
  function addHazard(W, shape, geo, opts) {
    const o = opts || {};
    let warn = o.warn != null ? o.warn : 0.8;
    warn *= W.diff.warn;
    if (W.scan > 0) warn *= 1.15;
    const h = Object.assign({
      id: U.nextId(), shape, t: 0, warn, warnMax: warn, life: o.life != null ? o.life : 0.12,
      dmg: o.dmg != null ? o.dmg : 1, kb: o.kb != null ? o.kb : 160, tick: o.tick || 0,
      owner: o.owner || null, follow: o.follow || null, update: o.update || null, onActive: o.onActive || null,
      color: o.color || null, noPerfect: !!o.noPerfect, label: o.label || null, pull: o.pull || 0,
      silent: !!o.silent, hits: new Map(), active: false, done: false, fade: 0, allyDodge: Math.random() < 0.82,
      hitAllies: o.hitAllies !== false, visual: o.visual || null, safe: o.safe || null,
    }, geo);
    W.hazards.push(h);
    return h;
  }

  function updateHazards(W, edt) {
    for (const h of W.hazards) {
      if (h.done) {
        h.fade -= edt;
        continue;
      }
      if (edt <= 0) continue;
      h.t += edt;
      if (h.follow && !h.follow.dead) {
        h.x = h.follow.x + (h.fx || 0);
        h.y = h.follow.y + (h.fy || 0);
      }
      if (h.update) h.update(h, W, edt);
      if (!h.active && h.t >= h.warn) {
        h.active = true;
        h.activeAt = W.t;
        if (h.onActive) h.onActive(h, W);
        if (!h.silent && h.dmg > 0) ev(W, { type: 'hazardHit', h });
      }
      if (h.active) {
        if (h.pull) applyPull(W, h, edt);
        if (h.dmg > 0) hazardHits(W, h);
        if (h.t >= h.warn + h.life) {
          h.done = true;
          h.fade = 0.25;
        }
      }
    }
    W.hazards = W.hazards.filter((h) => !h.done || h.fade > 0);
  }

  function applyPull(W, h, edt) {
    const targets = [W.player, ...W.allies];
    for (const t of targets) {
      if (t.dead || t.down > 0) continue;
      if (t === W.player && t.state === 'dodge') continue;
      const d = U.dist(h.x, h.y, t.x, t.y);
      if (d > (h.pullR || h.r * 2.2) || d < 4) continue;
      const a = U.angleTo(t.x, t.y, h.x, h.y);
      t.x += Math.cos(a) * h.pull * edt;
      t.y += Math.sin(a) * h.pull * edt;
    }
  }

  function hazardHits(W, h) {
    const p = W.player;
    const targets = [p];
    if (h.hitAllies) for (const a of W.allies) targets.push(a);
    for (const t of targets) {
      if (t.dead || t.down > 0) continue;
      const last = h.hits.get(t.id);
      if (last != null && (!h.tick || W.t - last < h.tick)) continue;
      let inside = inShape(h, t.x, t.y, t.r);
      // 회피를 시작한 자리도 판정(막 피한 순간 = 완벽 회피)
      if (!inside && t === p && p.state === 'dodge' && p.dodgeOrigin && p.dodgeT <= p.stats.perfectWindow) {
        inside = inShape(h, p.dodgeOrigin.x, p.dodgeOrigin.y, t.r);
      }
      if (!inside) continue;
      h.hits.set(t.id, W.t);
      const src = h.owner || h;
      hurt(W, t, h.dmg * W.ref.dmg, { x: h.x, y: h.y, kb: h.kb, perfectable: !h.noPerfect, source: src, hazard: h, counterHit: !!h.counterHit });
    }
  }

  /* ───────────── 투사체 ───────────── */

  /** b: { x,y, ang, speed, r, team:'enemy'|'player', dmg(적) | mv,brk(아군), life, homing, color, pierce, air, kind } */
  function addBullet(W, b) {
    const o = Object.assign({
      id: U.nextId(), r: 10, life: 3, t: 0, team: 'enemy', pierce: false, hitSet: new Set(), color: '#ff5470',
      kind: 'orb', homing: 0, delay: 0,
    }, b);
    o.vx = Math.cos(o.ang) * o.speed;
    o.vy = Math.sin(o.ang) * o.speed;
    W.bullets.push(o);
    return o;
  }

  function updateBullets(W, dt, edt) {
    const p = W.player;
    for (const b of W.bullets) {
      const bdt = b.team === 'enemy' ? edt : dt;
      if (bdt <= 0) continue;
      if (b.delay > 0) {
        b.delay -= bdt;
        if (b.follow) { b.x = b.follow.x; b.y = b.follow.y - 20; }
        continue;
      }
      b.t += bdt;
      if (b.homing) {
        const tgt = b.team === 'enemy' ? p : (b.target && !b.target.dead ? b.target : nearestEnemy(W, b.x, b.y, 700));
        if (tgt) {
          const cur = Math.atan2(b.vy, b.vx);
          const want = U.angleTo(b.x, b.y, tgt.x, tgt.y);
          const na = U.turnToward(cur, want, b.homing * bdt);
          const sp = Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(na) * sp;
          b.vy = Math.sin(na) * sp;
        }
      }
      if (b.accel) {
        const sp = Math.hypot(b.vx, b.vy);
        const ns = sp + b.accel * bdt;
        b.vx *= ns / sp;
        b.vy *= ns / sp;
      }
      b.x += b.vx * bdt;
      b.y += b.vy * bdt;
      if (b.t > b.life || b.x < -80 || b.y < -80 || b.x > W.w + 80 || b.y > W.h + 80) {
        b.dead = true;
        continue;
      }
      if (b.team === 'enemy') {
        const targets = [p, ...W.allies];
        for (const t of targets) {
          if (t.dead || t.down > 0 || b.hitSet.has(t.id)) continue;
          let inside = U.dist2(b.x, b.y, t.x, t.y) < (b.r + t.r) * (b.r + t.r);
          if (!inside) continue;
          b.hitSet.add(t.id);
          const res = hurt(W, t, (b.dmg || 1) * W.ref.dmg, { x: b.x - b.vx * 0.05, y: b.y - b.vy * 0.05, kb: b.kb || 90, perfectable: true, source: b.owner || b });
          if (res !== 'evaded' && !b.pierce) { b.dead = true; break; }
        }
      } else {
        for (const e of W.enemies) {
          if (e.dead || e.untargetable || b.hitSet.has(e.id)) continue;
          if (U.dist2(b.x, b.y, e.x, e.y) < (b.r + e.r) * (b.r + e.r)) {
            b.hitSet.add(e.id);
            hitEnemy(W, e, { mv: b.mv, brk: b.brk, x: b.x - b.vx * 0.05, y: b.y - b.vy * 0.05, air: b.air !== false,
              kind: b.kind === 'ally' ? 'ally' : 'proj', crit: b.crit, fx: b.fx || 'spark', color: b.color, allyKind: b.allyKind });
            if (!b.pierce) { b.dead = true; break; }
          }
        }
      }
    }
    W.bullets = W.bullets.filter((b) => !b.dead);
  }

  /* ───────────── 플레이어 쪽이 맞을 때 ───────────── */

  /** 반환: 'evaded' | 'perfect' | 'hit' | 'blocked' */
  function hurt(W, t, amount, o) {
    const p = W.player;
    if (W.state !== 'fight') return 'evaded';
    if (t === p) {
      if (p.state === 'stance') {
        AZ.player.onCounterStance(W, o.source);
        return 'perfect';
      }
      if (p.iframe > 0 || p.state === 'ult') {
        if (o.perfectable && p.state === 'dodge' && p.dodgeT <= p.stats.perfectWindow && !p.perfectUsed) {
          p.perfectUsed = true;
          triggerZeroFrame(W, 'dodge');
          return 'perfect';
        }
        if (p.state === 'dodge' && Math.random() < 0.5) text(W, p.x, p.y - 50, 'MISS', '#9ad0ff', 16);
        return 'evaded';
      }
    }
    if (t.kind === 'ally' && (t.down > 0 || t.dead)) return 'evaded';
    let dmg = amount * (0.92 + Math.random() * 0.16);
    if (t === p) dmg *= 1 - p.stats.dmgReduce;
    // 방벽
    if (t.shield > 0) {
      const absorbed = Math.min(t.shield, dmg);
      t.shield -= absorbed;
      dmg -= absorbed;
      if (absorbed > 0) ev(W, { type: 'spark', x: t.x, y: t.y, z: 30, color: '#7ce8ff', n: 6 });
      if (dmg <= 0) {
        sfx(W, 'shield', { vol: 0.5 });
        text(W, t.x, t.y - 46, '방벽', '#7ce8ff', 16);
        return 'blocked';
      }
    }
    dmg = Math.max(1, Math.round(dmg));
    t.hp -= dmg;
    t.flash = 0.18;
    // 넉백
    const a = U.angleTo(o.x, o.y, t.x, t.y);
    const kb = o.kb || 100;
    if (t === p) {
      W.stats.damageTaken += dmg;
      W.stats.hitsTaken += 1;
      if (o.source && o.source.kind === 'boss' && o.source.bossId === 'zero' && o.counterHit) W.stats.countered += 1;
      AZ.player.onHurt(W, dmg, a, kb);
      text(W, t.x, t.y - 56, String(dmg), '#ff5470', 24, { hurt: true });
      shake(W, Math.min(14, 5 + dmg / W.ref.dmg * 4));
      ev(W, { type: 'flash', color: 'rgba(255,40,70,0.22)', t: 0.18 });
      W.hitstop = Math.max(W.hitstop, 0.05);
      sfx(W, 'hurt');
      if (t.hp <= 0) {
        t.hp = 0;
        AZ.player.onDeath(W);
      } else if (t.hp < t.maxHp * 0.3 && !p.lowHpBarked) {
        p.lowHpBarked = true;
        bark(W, 'lia', 'lowHp');
      }
    } else {
      t.vx += Math.cos(a) * kb * 0.6;
      t.vy += Math.sin(a) * kb * 0.6;
      text(W, t.x, t.y - 50, String(dmg), '#ff9aa8', 16);
      if (t.hp <= 0) {
        t.hp = 0;
        t.down = t.ally === 'lia' ? 12 : 15;
        text(W, t.x, t.y - 70, t.ally === 'lia' ? '리아 다운 — 재기동 중' : '제로 다운', '#ffb35c', 18);
        bark(W, 'lia', 'allyDown');
        sfx(W, 'glitch');
      }
    }
    return 'hit';
  }

  /* ───────────── ZERO FRAME ───────────── */
  function triggerZeroFrame(W, cause) {
    const p = W.player;
    const dur = p.stats.zeroDur;
    W.zero = dur;
    W.zeroMax = dur;
    W.stats.zeroFrames += 1;
    p.counterReady = 1.4;
    AZ.player.gainFocus(W, 25);
    p.chain = Math.min(100, p.chain + 20);
    sfx(W, 'perfect');
    sfx(W, 'zeroFrame');
    ev(W, { type: 'banner', kind: 'zero', text: 'ZERO FRAME', sub: '적의 시간이 느려진다 — 약점 노출!' });
    ev(W, { type: 'flash', color: 'rgba(120,220,255,0.5)', t: 0.25 });
    ev(W, { type: 'ring', x: p.x, y: p.y, r0: 10, r1: 260, color: '#9ae6ff', t: 0.5 });
    W.hitstop = Math.max(W.hitstop, 0.08);
    if (W.stats.zeroFrames === 1 || Math.random() < 0.35) bark(W, 'lia', 'zeroFrame');
    if (p.stats.afterimage && p.dodgeOrigin && cause === 'dodge') {
      const o = p.dodgeOrigin;
      ev(W, { type: 'burst', x: o.x, y: o.y, z: 20, r: 140, color: '#b0f0ff' });
      sfx(W, 'explosion', { vol: 0.6 });
      for (const e of W.enemies) {
        if (e.dead || e.untargetable) continue;
        if (U.dist(o.x, o.y, e.x, e.y) < 140 + e.r) {
          hitEnemy(W, e, { mv: 3.0, brk: 12, x: o.x, y: o.y, air: true, kind: 'skill', fx: 'burst' });
        }
      }
    }
  }

  /* ───────────── 적이 맞을 때 ───────────── */

  /** 약점/방패 판정 */
  function hitAngleInfo(W, e, ax, ay) {
    const def = e.def || {};
    const res = { weak: false, shielded: false };
    if (W.zero > 0 || e.broken || e.exposed > 0) { res.weak = true; return res; }
    const rel = Math.abs(U.angleDiff(e.facing, U.angleTo(e.x, e.y, ax, ay)));
    const weak = def.weak || {};
    if (weak.back && !weak.exposedOnly && rel > Math.PI - weak.back / 2) res.weak = true;
    if (def.shield && rel < def.shield / 2 && !e.shieldDown) res.shielded = true;
    return res;
  }

  /**
   * o: { mv, brk, x, y (공격이 온 위치), air, kind:'melee'|'proj'|'skill'|'ally'|'ult', crit(강제), fx, color, noCombo }
   * 반환: { dmg, weak, crit, shielded } 또는 null(빗나감)
   */
  function hitEnemy(W, e, o) {
    const p = W.player;
    const s = p.stats;
    if (e.dead || e.untargetable) return null;
    if (e.airborne && !o.air) {
      if (!e.missT || W.t - e.missT > 0.6) {
        e.missT = W.t;
        text(W, e.x, e.y - e.r - (e.z || 0) - 20, '닿지 않음', '#9ab0c8', 15);
      }
      return null;
    }
    // 세라의 환영: 한 대 맞으면 사라짐
    if (e.clone) {
      e.hp = 0;
      killEnemy(W, e);
      ev(W, { type: 'burst', x: e.x, y: e.y, z: (e.z || 0) + 24, r: 60, color: '#d8c8ff' });
      sfx(W, 'glitch', { vol: 0.5 });
      return { dmg: 0, weak: false, crit: false, shielded: false };
    }
    const info = hitAngleInfo(W, e, o.x, o.y);
    const isAlly = o.kind === 'ally';
    let dmg = s.atk * (o.mv || 1);
    if (isAlly) dmg *= s.allyMul * (W.allyFocus > 0 ? 1.4 : 1);
    let crit = false;
    if (!isAlly) {
      crit = !!o.crit || Math.random() < s.crit;
      if (p.blinkCrit > 0 && o.kind !== 'proj') { crit = true; p.blinkCrit = 0; dmg *= 1.5; }
      if (crit) dmg *= s.critDmg;
      // 콤보 보너스
      const comboBonus = Math.min(p.combo, 30) * 0.005 + (s.comboAmp ? Math.min(p.combo, 50) / 50 * s.comboAmp : 0);
      dmg *= 1 + comboBonus + (s.comboMaster && p.combo >= 30 ? 0.15 : 0);
      if (s.lastStand && p.hp < p.maxHp * 0.35) dmg *= 1.25;
    }
    if (info.weak) dmg *= s.weakMul + (W.scan > 0 ? 0.25 : 0);
    if (e.broken) dmg *= 1.5;
    if (W.zero > 0) dmg *= 1.2;
    if (o.kind === 'ult') dmg *= s.ultMul;
    if (e.def && e.def.armorMul && !info.weak) dmg *= e.def.armorMul;
    if (info.shielded) dmg *= 0.15;
    if (e.dmgTakenMul) dmg *= e.dmgTakenMul;
    dmg *= 0.95 + Math.random() * 0.1;
    dmg = Math.max(1, Math.round(dmg));

    e.hp -= dmg;
    e.flash = 0.12;
    W.stats.dmgDealt += dmg;
    W.stats.byKind[o.kind || 'melee'] = (W.stats.byKind[o.kind || 'melee'] || 0) + dmg;
    if (info.weak && !isAlly) W.stats.weakHits += 1;

    // 브레이크
    let brk = (o.brk || 0) * s.breakMul;
    if (info.weak) brk *= 1.5;
    if (info.shielded) brk *= o.kind === 'melee' && o.mv >= 2 ? 0.6 : 0.2;
    if (isAlly && W.allyFocus > 0) brk *= 2;
    if (e.airborne && (o.kind === 'proj' || o.kind === 'ally')) brk *= 1.5;
    if (e.kind === 'boss') damageBreak(W, e, brk);
    else if (!e.broken && brk > 0) {
      e.stagger = (e.stagger || 0) + brk;
      if (e.stagger >= e.maxHp / Math.max(1, W.ref.atk) * 3 && !e.superArmor) {
        e.stagger = 0;
        e.stun = 0.5;
        e.brain.gen = null;
        cancelOwnedWarnings(W, e);
      }
    }

    // 플레이어 쪽 보상
    if (!isAlly && !o.noCombo && o.kind !== 'ult') {
      p.combo += 1;
      p.comboT = 2.6;
      if (p.combo > W.stats.maxCombo) W.stats.maxCombo = p.combo;
      AZ.player.gainFocus(W, o.kind === 'melee' ? (o.mv >= 2 ? 2.6 : 1.1) : 0.7);
      p.chain = Math.min(100, p.chain + (o.kind === 'melee' ? 1.2 : 0.6));
      if (s.lifesteal > 0) p.hp = Math.min(p.maxHp, p.hp + dmg * s.lifesteal);
    }

    // 연출
    const ex = e.x;
    const ey = e.y;
    const color = info.shielded ? '#ffe066' : info.weak ? '#7cf7ff' : crit ? '#ffe066' : '#ffffff';
    const label = info.shielded ? '방어됨' : null;
    if (W.settingsDamageNumbers !== false) {
      text(W, ex + U.rand(-14, 14), ey - e.r - (e.z || 0) - 16, String(dmg), color, crit ? 30 : info.weak ? 26 : 20,
        { crit, weak: info.weak, ally: isAlly });
    }
    if (label) text(W, ex, ey - e.r - (e.z || 0) - 44, label, '#ffe066', 15);
    else if (info.weak && (!e.weakTextT || W.t - e.weakTextT > 1.2)) {
      e.weakTextT = W.t;
      text(W, ex, ey - e.r - (e.z || 0) - 46, 'WEAK', '#7cf7ff', 16, { tag: true });
    }
    ev(W, { type: 'spark', x: ex + (o.x - ex) * Math.min(0.8, e.r / Math.max(1, Math.hypot(o.x - ex, o.y - ey))), y: ey + (o.y - ey) * Math.min(0.8, e.r / Math.max(1, Math.hypot(o.x - ex, o.y - ey))), z: (e.z || 0) + Math.min(60, e.r * 0.9 + 10), color: o.color || (info.weak ? '#7cf7ff' : '#cfefff'), n: crit ? 14 : 8, big: o.mv >= 2 });
    if (info.shielded) sfx(W, 'clang', { vol: 0.6 });
    else sfx(W, info.weak ? 'hitWeak' : crit ? 'crit' : 'hit', { vol: isAlly ? 0.35 : 0.7, pitch: 0.9 + Math.random() * 0.2 });
    if (o.mv >= 2 && !isAlly) {
      W.hitstop = Math.max(W.hitstop, o.kind === 'ult' ? 0.04 : 0.07);
      shake(W, 6);
    } else if (!isAlly) {
      W.hitstop = Math.max(W.hitstop, 0.025);
    }
    // 넉백(작은 적)
    if (e.kind !== 'boss' && !e.superArmor) {
      const a = U.angleTo(o.x, o.y, e.x, e.y);
      const kb = o.mv >= 2 ? 260 : 90;
      e.vx += Math.cos(a) * kb;
      e.vy += Math.sin(a) * kb;
    }

    if (e.kind === 'boss') AZ.ai.onBossDamaged(W, e, dmg, o);
    if (e.hp <= 0) killEnemy(W, e);
    return { dmg, weak: info.weak, crit, shielded: info.shielded };
  }

  function damageBreak(W, e, amount) {
    if (e.broken || e.dead || amount <= 0) return;
    e.brk -= amount;
    e.brkIdle = 0;
    if (e.brk <= 0) breakBoss(W, e);
  }

  function breakBoss(W, e) {
    e.brk = 0;
    e.broken = true;
    e.breakT = 6;
    e.brain.gen = null;
    e.dash = null;
    W.stats.breaks += 1;
    W.chainUsedThisBreak = false;
    cancelOwnedWarnings(W, e);
    AZ.player.gainFocus(W, 8);
    sfx(W, 'break');
    shake(W, 12);
    W.hitstop = Math.max(W.hitstop, 0.12);
    ev(W, { type: 'banner', kind: 'break', text: 'BREAK!', sub: W.allies.some((a) => a.down <= 0) ? '연계 공격 가능 — [F]' : '방어 붕괴 — 받는 피해 증가' });
    ev(W, { type: 'burst', x: e.x, y: e.y, z: (e.z || 0) + e.r * 0.8, r: e.r * 2.4, color: '#ffe066' });
    ev(W, { type: 'flash', color: 'rgba(255,230,120,0.35)', t: 0.2 });
    bark(W, e.bossId, 'broken');
    if (Math.random() < 0.6) bark(W, 'lia', 'break');
    AZ.ai.onBossBroken(W, e);
  }

  function cancelOwnedWarnings(W, e) {
    for (const h of W.hazards) {
      if (h.owner === e && !h.active && !h.done && !h.keepOnBreak) {
        h.done = true;
        h.fade = 0.2;
      }
    }
  }

  function killEnemy(W, e) {
    if (e.dead) return;
    e.dead = true;
    e.hp = 0;
    e.deadT = 0;
    cancelOwnedWarnings(W, e);
    if (e.kind === 'boss') {
      AZ.ai.onBossDeath(W, e);
      return;
    }
    if (!e.def.clone) {
      W.stats.kills += 1;
      W.stats.exp += e.def.exp * (1 + 0.25 * (W.cfg.chapterId - 1));
      W.stats.credits += e.def.credits * (1 + 0.2 * (W.cfg.chapterId - 1));
      ev(W, { type: 'burst', x: e.x, y: e.y, z: (e.z || 0) + 20, r: e.r * 2.2, color: e.def.color });
      sfx(W, 'explosion', { vol: 0.45, pitch: 1.2 });
      if (Math.random() < 0.12) W.pickups.push({ kind: 'heal', x: e.x, y: e.y, t: 0 });
    }
  }

  /* ───────────── 주변 탐색 ───────────── */
  function nearestEnemy(W, x, y, maxD) {
    let best = null;
    let bd = maxD != null ? maxD * maxD : Infinity;
    for (const e of W.enemies) {
      if (e.dead || e.untargetable || e.clone) continue;
      const d = U.dist2(x, y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }
  function livingEnemies(W) {
    return W.enemies.filter((e) => !e.dead);
  }

  /* ───────────── 동료 AI ───────────── */
  function updateAllies(W, dt) {
    const p = W.player;
    for (const a of W.allies) {
      a.flash = Math.max(0, a.flash - dt);
      a.animT += dt;
      if (a.shieldT > 0) { a.shieldT -= dt; if (a.shieldT <= 0) a.shield = 0; }
      if (a.down > 0) {
        a.down -= dt;
        if (a.down <= 0) {
          a.hp = Math.round(a.maxHp * 0.5);
          text(W, a.x, a.y - 60, a.ally === 'lia' ? '리아 재기동' : '제로 복귀', '#7cf7d4', 18);
          sfx(W, 'heal', { vol: 0.5 });
        }
        continue;
      }
      // 위험 지역 피하기
      let avoid = null;
      for (const h of W.hazards) {
        if (h.done || h.active || !h.hitAllies || !h.allyDodge || h.dmg <= 0) continue;
        if (inShape(h, a.x, a.y, a.r + 12)) { avoid = h; break; }
      }
      let tx;
      let ty;
      let speed;
      const tgt = p.target && !p.target.dead && !p.target.untargetable ? p.target : nearestEnemy(W, a.x, a.y, 900);
      if (avoid) {
        let ang;
        if (avoid.shape === 'line') ang = avoid.ang + Math.PI / 2 * (U.angleDiff(avoid.ang, U.angleTo(avoid.x, avoid.y, a.x, a.y)) > 0 ? 1 : -1);
        else if (avoid.shape === 'outside') ang = U.angleTo(a.x, a.y, avoid.x, avoid.y);
        else ang = U.angleTo(avoid.x, avoid.y, a.x, a.y);
        tx = a.x + Math.cos(ang) * 200;
        ty = a.y + Math.sin(ang) * 200;
        speed = 420;
      } else if (a.ally === 'lia') {
        const side = p.facing + Math.PI * 0.75;
        tx = p.x + Math.cos(side) * 70;
        ty = p.y + Math.sin(side) * 70;
        speed = 300;
      } else {
        // 제로: 대상에게 붙어서 베기
        if (tgt) {
          const d = U.dist(a.x, a.y, tgt.x, tgt.y);
          const want = tgt.r + 40;
          const ang = U.angleTo(tgt.x, tgt.y, a.x, a.y) + Math.sin(W.t * 0.7 + a.id) * 0.6;
          tx = tgt.x + Math.cos(ang) * want;
          ty = tgt.y + Math.sin(ang) * want;
          speed = d > 250 ? 420 : 260;
        } else {
          tx = p.x + 60;
          ty = p.y + 30;
          speed = 260;
        }
      }
      const d = U.dist(a.x, a.y, tx, ty);
      const acting = (a.anim === 'cast' || a.anim === 'attack') && a.animT < 0.3;
      if (d > 6) {
        const ang = U.angleTo(a.x, a.y, tx, ty);
        const step = Math.min(d, speed * dt * (d < 60 ? d / 60 : 1));
        a.x += Math.cos(ang) * step;
        a.y += Math.sin(ang) * step;
        if (!acting) a.anim = 'move';
      } else if (!acting) a.anim = 'idle';
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      a.vx *= Math.pow(0.02, dt);
      a.vy *= Math.pow(0.02, dt);
      clampToArena(W, a);
      if (tgt) a.facing = U.angleTo(a.x, a.y, tgt.x, tgt.y);

      // 공격
      a.atkT -= dt * (W.allyFocus > 0 ? 1.5 : 1);
      if (tgt && a.atkT <= 0 && W.state === 'fight') {
        if (a.ally === 'lia') {
          a.atkT = 1.1;
          a.anim = 'cast';
          a.animT = 0;
          addBullet(W, { x: a.x, y: a.y - a.z, ang: U.angleTo(a.x, a.y, tgt.x, tgt.y), speed: 900, r: 8, team: 'player',
            mv: 0.32, brk: 1, life: 1.2, color: '#9ae6ff', kind: 'ally', allyKind: 'lia', homing: 3, target: tgt, air: true });
          sfx(W, 'shot', { vol: 0.25, pitch: 1.4 });
        } else if (U.dist(a.x, a.y, tgt.x, tgt.y) < tgt.r + 70 && !tgt.airborne) {
          a.comboN = (a.comboN + 1) % 4;
          a.atkT = a.comboN === 3 ? 1.1 : 0.42;
          a.anim = 'attack';
          a.animT = 0;
          hitEnemy(W, tgt, { mv: a.comboN === 3 ? 0.7 : 0.3, brk: a.comboN === 3 ? 5 : 2, x: a.x, y: a.y, kind: 'ally', air: false, color: '#ff6b8a' });
          ev(W, { type: 'slash', x: a.x, y: a.y, ang: a.facing, range: 80, arc: 2.2, fx: a.comboN % 2 ? 'slashL' : 'slashR', color: '#ff3355', ally: true });
        } else {
          a.atkT = 0.2;
        }
      }
    }
  }

  function clampToArena(W, e) {
    const m = e.r + 10;
    e.x = U.clamp(e.x, m, W.w - m);
    e.y = U.clamp(e.y, m, W.h - m);
  }

  /** 겹친 몸 밀어내기 */
  function separate(W) {
    const p = W.player;
    const bodies = W.enemies.filter((e) => !e.dead && !e.untargetable && !e.airborne && !e.ghost);
    for (const e of bodies) {
      if (p.dead) break;
      if (p.state === 'dodge' || p.state === 'ult') continue;
      const d = U.dist(p.x, p.y, e.x, e.y);
      const min = p.r + e.r;
      if (d < min && d > 0.01) {
        const push = (min - d);
        const a = U.angleTo(e.x, e.y, p.x, p.y);
        const share = e.kind === 'boss' || e.superArmor ? 1 : 0.5;
        p.x += Math.cos(a) * push * share;
        p.y += Math.sin(a) * push * share;
        if (share < 1) {
          e.x -= Math.cos(a) * push * 0.5;
          e.y -= Math.sin(a) * push * 0.5;
        }
      }
    }
    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        const a = bodies[i];
        const b = bodies[j];
        const d = U.dist(a.x, a.y, b.x, b.y);
        const min = a.r + b.r;
        if (d < min && d > 0.01) {
          const push = (min - d) / 2;
          const ang = U.angleTo(b.x, b.y, a.x, a.y);
          const wa = a.kind === 'boss' ? 0 : 1;
          const wb = b.kind === 'boss' ? 0 : 1;
          a.x += Math.cos(ang) * push * wa * (wb ? 1 : 2);
          a.y += Math.sin(ang) * push * wa * (wb ? 1 : 2);
          b.x -= Math.cos(ang) * push * wb * (wa ? 1 : 2);
          b.y -= Math.sin(ang) * push * wb * (wa ? 1 : 2);
        }
      }
    }
    clampToArena(W, p);
    for (const e of bodies) clampToArena(W, e);
  }

  /* ───────────── 웨이브 ───────────── */
  function updateWaves(W, dt) {
    if (W.mode !== 'wave' || W.state !== 'fight') return;
    const alive = W.enemies.some((e) => !e.dead && !e.def.clone);
    if (alive) return;
    if (W.waveIdx >= W.waves.length - 1) {
      // 모든 웨이브 끝 → 기억 파편 등장
      if (!W.memorySpawned) {
        W.memorySpawned = true;
        W.pickups.push({ kind: 'memory', x: W.w / 2, y: W.h / 2, t: 0 });
        ev(W, { type: 'banner', kind: 'info', text: 'AREA CLEAR', sub: '기억 파편 반응 — 회수하세요' });
        sfx(W, 'victory', { vol: 0.5 });
      }
      return;
    }
    W.waveDelay -= dt;
    if (W.waveDelay > 0) return;
    W.waveIdx += 1;
    W.waveDelay = 1.2;
    const wave = W.waves[W.waveIdx];
    let n = 0;
    for (const [type, count] of wave) {
      for (let i = 0; i < count; i++) {
        const side = n % 4;
        let x;
        let y;
        if (side === 0) { x = U.rand(120, W.w - 120); y = 90; } else if (side === 1) { x = W.w - 90; y = U.rand(120, W.h - 120); } else if (side === 2) { x = U.rand(120, W.w - 120); y = W.h - 90; } else { x = 90; y = U.rand(120, W.h - 120); }
        // 플레이어 바로 옆에 나오지 않게
        if (U.dist(x, y, W.player.x, W.player.y) < 300) { x = W.w - x; y = W.h - y; }
        AZ.ai.spawnMinion(W, type, x, y, { delay: 0.2 + n * 0.12 });
        n += 1;
      }
    }
    ev(W, { type: 'banner', kind: 'wave', text: `WAVE ${W.waveIdx + 1} / ${W.waves.length}`, sub: '' });
    sfx(W, 'alarm', { vol: 0.5 });
  }

  function updatePickups(W, dt) {
    const p = W.player;
    for (const k of W.pickups) {
      k.t += dt;
      if (k.taken) continue;
      const d = U.dist(p.x, p.y, k.x, k.y);
      // 가까우면 끌려옴
      if (d < 160 && k.kind === 'heal') {
        const a = U.angleTo(k.x, k.y, p.x, p.y);
        k.x += Math.cos(a) * 300 * dt;
        k.y += Math.sin(a) * 300 * dt;
      }
      if (d < p.r + 26) {
        k.taken = true;
        if (k.kind === 'heal') {
          const amt = Math.round(p.maxHp * 0.12);
          p.hp = Math.min(p.maxHp, p.hp + amt);
          text(W, p.x, p.y - 60, `+${amt}`, '#7cf7a0', 20);
          sfx(W, 'heal', { vol: 0.6 });
        } else if (k.kind === 'memory') {
          W.memoryFound = true;
          sfx(W, 'pickup');
          ev(W, { type: 'flash', color: 'rgba(200,230,255,0.6)', t: 0.4 });
          ev(W, { type: 'banner', kind: 'memory', text: '기억 파편 회수', sub: '' });
          endBattle(W, 'victory', 1.4);
        }
      }
    }
    W.pickups = W.pickups.filter((k) => !k.taken && k.t < 30);
  }

  function endBattle(W, outcome, delay) {
    if (W.ending) return;
    W.ending = { outcome, t: delay || 0 };
  }

  /** 히트스톱 동안 눌린 버튼을 다음 프레임으로 넘김 */
  function mergeInput(a, b) {
    if (!b) return a || null;
    if (!a) return Object.assign({}, b, { skills: (b.skills || []).slice(), cmds: (b.cmds || []).slice() });
    const out = Object.assign({}, b);
    for (const k of ['attack', 'heavy', 'dodge', 'ult', 'chain']) out[k] = !!(a[k] || b[k]);
    out.skills = [0, 1, 2].map((i) => !!((a.skills && a.skills[i]) || (b.skills && b.skills[i])));
    out.cmds = [0, 1, 2].map((i) => !!((a.cmds && a.cmds[i]) || (b.cmds && b.cmds[i])));
    return out;
  }

  /* ───────────── 메인 스텝 ───────────── */
  function step(W, realDt, input) {
    const dtCap = Math.min(realDt, 1 / 30);
    W.stateT += dtCap;
    if (W.state === 'done') return;

    if (W.state === 'intro') {
      if (W.stateT >= (W.mode === 'boss' ? 1.4 : 0.8)) {
        W.state = 'fight';
        W.stateT = 0;
        ev(W, { type: 'banner', kind: 'start', text: W.mode === 'boss' ? 'ENGAGE' : 'MISSION START', sub: '' });
        if (W.boss) bark(W, W.boss.bossId, 'start');
      }
    }

    if (W.hitstop > 0) {
      W.hitstop -= dtCap;
      W.pendingInput = mergeInput(W.pendingInput, input);
      return;
    }
    if (W.pendingInput) {
      input = mergeInput(W.pendingInput, input);
      W.pendingInput = null;
    }
    // 느린 화면(처치 연출)
    if (W.slowT > 0) {
      W.slowT -= dtCap;
      if (W.slowT <= 0) W.slow = 1;
    }
    const dt = dtCap * W.slow;
    W.t += dt;
    if (W.state === 'fight' && !W.ending) W.stats.time += dt;

    if (W.zero > 0) {
      W.zero -= dt;
      if (W.zero <= 0) { W.zero = 0; ev(W, { type: 'zeroEnd' }); }
    }
    if (W.timeStop > 0) W.timeStop -= dt;
    W.enemyScale = W.timeStop > 0 ? 0 : W.zero > 0 ? 0.25 : 1;
    const edt = dt * W.enemyScale;
    if (W.scan > 0) W.scan -= dt;
    if (W.allyFocus > 0) W.allyFocus -= dt;
    for (let i = 0; i < 3; i++) if (W.cmdCd[i] > 0) W.cmdCd[i] -= dt;

    const controllable = W.state === 'fight' && !W.ending;
    AZ.player.update(W, dt, controllable ? input : null);
    if (W.state === 'fight' || W.state === 'intro') {
      updateAllies(W, dt);
    }
    AZ.ai.update(W, dt, edt);
    updateHazards(W, edt);
    updateBullets(W, dt, edt);
    separate(W);
    updateWaves(W, dt);
    updatePickups(W, dt);

    if (W.ending) {
      W.ending.t -= dtCap;
      if (W.ending.t <= 0) {
        W.state = W.ending.outcome;
        W.stateT = 0;
        W.result = Object.assign({}, W.stats, { outcome: W.ending.outcome, maxHp: W.player.maxHp, memoryFound: W.memoryFound });
      }
    }
  }

  return {
    create, step, addHazard, addBullet, hurt, hitEnemy, damageBreak, breakBoss, triggerZeroFrame,
    killEnemy, nearestEnemy, livingEnemies, inShape, clampToArena, endBattle, cancelOwnedWarnings,
    ev, sfx, text, shake, bark, hitAngleInfo,
  };
})();

</script>
  <script>/* js/core/player.js */
'use strict';

/* =========================================================
 * 플레이어(카이온) — 이동, 콤보, 강공격, 회피(완벽 회피 → ZERO FRAME), 반격,
 * 스킬 3개, 궁극기, 연계 공격, 전술 명령
 * 입력(프레임마다): { mx, my, attack, heavy, dodge, skills:[b,b,b], ult, chain, cmds:[b,b,b], aim }
 *   (attack 등은 "이번 프레임에 눌렀는가")
 * ========================================================= */
window.AZ = window.AZ || {};

AZ.player = (() => {
  const U = AZ.util;
  const B = () => AZ.battle;

  const MOVE_SPEED = 270;
  const DODGE_TIME = 0.34;
  const DODGE_SPEED = 760;
  const MAX_DODGE = 3;
  const DODGE_REGEN = 0.85;
  const BUFFER = 0.28;

  function create(W, stats) {
    return {
      id: U.nextId(), kind: 'player', team: 'player',
      x: 0, y: 0, z: 0, r: 18, vx: 0, vy: 0,
      stats, maxHp: stats.maxHp, hp: stats.maxHp, facing: -Math.PI / 2,
      state: 'idle', st: null, comboIdx: 0, comboWin: 0,
      iframe: 0, dodgeT: 0, dodgeCharges: MAX_DODGE, dodgeRegen: 0, perfectUsed: false, dodgeOrigin: null, dodgeDir: 0,
      cds: [0, 0, 0], cdMax: [1, 1, 1], locks: [0, 0, 0],
      focus: Math.min(100, stats.startFocus || 0), chain: 0, combo: 0, comboT: 0,
      shield: 0, shieldT: 0, regen: null, haste: 0, blinkCrit: 0, counterReady: 0,
      kbx: 0, kby: 0, hurtT: 0, flash: 0, target: null,
      buf: { attack: 0, heavy: 0, dodge: 0 },
      anim: 'idle', animT: 0, runT: 0, sched: [], dead: false, deadT: 0,
      lowHpBarked: false, msgT: 0,
    };
  }

  /* ── 도우미 ── */
  function later(p, delay, fn) { p.sched.push({ t: delay, fn }); }

  function gainFocus(W, amt) {
    const p = W.player;
    const before = p.focus;
    p.focus = Math.min(100, p.focus + amt * p.stats.focusMul);
    if (before < 100 && p.focus >= 100) {
      B().text(W, p.x, p.y - 80, '궁극기 준비 완료', '#ffe066', 18);
      B().sfx(W, 'charge', { vol: 0.5, pitch: 1.4 });
    }
  }

  function msg(W, str, color) {
    const p = W.player;
    if (W.t - p.msgT < 0.7) return;
    p.msgT = W.t;
    B().text(W, p.x, p.y - 74, str, color || '#9ab0c8', 15);
  }

  function inputAngle(inp) {
    if (!inp) return null;
    const m = Math.hypot(inp.mx, inp.my);
    return m > 0.2 ? Math.atan2(inp.my, inp.mx) : null;
  }

  /** 공격 방향 대상 고르기 */
  function pickTarget(W, p, dir, maxD) {
    let best = null;
    let bestScore = Infinity;
    for (const e of W.enemies) {
      if (e.dead || e.untargetable) continue;
      const d = U.dist(p.x, p.y, e.x, e.y) - e.r;
      if (d > maxD) continue;
      let score = d;
      if (dir != null) score += Math.abs(U.angleDiff(dir, U.angleTo(p.x, p.y, e.x, e.y))) * 240;
      if (e.clone && W.scan > 0) score += 400;
      if (score < bestScore) { bestScore = score; best = e; }
    }
    return best;
  }

  function aimAt(W, p, inp, maxD) {
    const dir = inp && inp.aim != null ? inp.aim : inputAngle(inp);
    const auto = W.autoAim !== false || dir == null;
    const t = auto ? pickTarget(W, p, dir, maxD || 480) : null;
    if (t) {
      p.target = t;
      p.facing = U.angleTo(p.x, p.y, t.x, t.y);
    } else if (dir != null) {
      p.facing = dir;
    }
  }

  function atkSpeed(p) { return p.haste > 0 ? 1.4 : 1; }

  /* ── 공격 ── */
  function startAttack(W, p, inp, heavy, chained) {
    const wpn = p.stats.weapon;
    let step;
    let idx = 0;
    if (heavy) {
      step = wpn.heavy;
      p.comboIdx = 0;
    } else {
      idx = p.comboWin > 0 || chained ? p.comboIdx : 0;
      if (idx >= wpn.combo.length) idx = 0;
      step = wpn.combo[idx];
      p.comboIdx = idx + 1;
    }
    const ranged = !!(step.proj || step.beam);
    aimAt(W, p, inp, ranged ? 950 : 420);
    p.state = 'attack';
    p.st = { step, t: 0, hitIdx: 0, heavy, idx, lungeLeft: step.lunge || 0, hits: step.hits || [step.hit] };
    p.anim = heavy ? 'heavy' : 'attack';
    p.animT = 0;
    p.buf.attack = 0;
    p.buf.heavy = 0;
    if (heavy) B().sfx(W, 'charge', { vol: 0.35, pitch: 1.6 });
  }

  function updateAttack(W, p, dt, inp) {
    const st = p.st;
    const step = st.step;
    const sp = atkSpeed(p);
    st.t += dt * sp;
    const firstHit = st.hits[0];
    // 내딛기
    if (st.t <= firstHit + 0.02 && st.lungeLeft !== 0) {
      const portion = Math.min(1, (dt * sp) / Math.max(0.05, firstHit));
      let mv = (step.lunge || 0) * portion;
      if (mv > 0 && p.target && !p.target.dead) {
        const gap = U.dist(p.x, p.y, p.target.x, p.target.y) - p.target.r - p.r - 14;
        mv = Math.max(0, Math.min(mv, gap));
        p.facing = U.angleTo(p.x, p.y, p.target.x, p.target.y);
      }
      p.x += Math.cos(p.facing) * mv;
      p.y += Math.sin(p.facing) * mv;
      st.lungeLeft -= mv;
    }
    // 판정
    while (st.hitIdx < st.hits.length && st.t >= st.hits[st.hitIdx]) {
      performHit(W, p, step, st);
      st.hitIdx += 1;
    }
    const lastHit = st.hits[st.hits.length - 1];
    const cancelOK = st.t >= lastHit + 0.05;
    const chainOK = st.t >= Math.max(lastHit + 0.05, step.dur * 0.78);
    if (cancelOK) {
      const wpn = p.stats.weapon;
      if (p.counterReady > 0 && (p.buf.attack > 0 || p.buf.heavy > 0)) return doCounter(W, p);
      if (tryActions(W, p, inp, true)) return;
      if (chainOK) {
        if (p.buf.heavy > 0 && !st.heavy) return startAttack(W, p, inp, true);
        if (p.buf.attack > 0 && !st.heavy && p.comboIdx < wpn.combo.length) return startAttack(W, p, inp, false, true);
      }
    }
    if (st.t >= step.dur) {
      p.state = 'idle';
      p.st = null;
      p.comboWin = st.heavy ? 0 : p.stats.weapon.comboWindow;
      if (p.comboIdx >= p.stats.weapon.combo.length) p.comboWin = 0;
    }
  }

  function performHit(W, p, step, st) {
    const b = B();
    const color = p.stats.weapon.color;
    if (step.proj) {
      const pr = step.proj;
      const n = pr.count || 1;
      for (let i = 0; i < n; i++) {
        const a = p.facing + (n > 1 ? (i - (n - 1) / 2) * pr.spread : 0);
        b.addBullet(W, { x: p.x + Math.cos(a) * 26, y: p.y + Math.sin(a) * 26, ang: a, speed: pr.speed, r: pr.r, life: pr.life,
          team: 'player', mv: step.mv, brk: step.brk, color, kind: 'shot', air: true, pierce: !!pr.pierce });
      }
      b.ev(W, { type: 'muzzle', x: p.x + Math.cos(p.facing) * 30, y: p.y + Math.sin(p.facing) * 30, ang: p.facing, color });
      b.sfx(W, 'shot', { vol: 0.5 });
      if (step.lunge) { p.x += Math.cos(p.facing) * step.lunge; p.y += Math.sin(p.facing) * step.lunge; }
      return;
    }
    if (step.beam) {
      const bm = step.beam;
      const h = { shape: 'line', x: p.x, y: p.y, ang: p.facing, len: bm.len, w: bm.w };
      for (const e of W.enemies) {
        if (e.dead || e.untargetable) continue;
        if (b.inShape(h, e.x, e.y, e.r)) b.hitEnemy(W, e, { mv: step.mv, brk: step.brk, x: p.x, y: p.y, air: true, kind: 'melee', color });
      }
      b.ev(W, { type: 'beam', x: p.x, y: p.y, ang: p.facing, len: bm.len, w: bm.w, color, t: 0.35 });
      b.sfx(W, 'railgun');
      b.shake(W, 7);
      p.x -= Math.cos(p.facing) * 30;
      p.y -= Math.sin(p.facing) * 30;
      return;
    }
    let hitAny = false;
    const full = step.arc >= 6.2;
    for (const e of W.enemies) {
      if (e.dead || e.untargetable) continue;
      const d = U.dist(p.x, p.y, e.x, e.y);
      if (d - e.r > step.range) continue;
      if (!full && d > e.r) {
        const tol = Math.atan2(e.r, d);
        if (Math.abs(U.angleDiff(p.facing, U.angleTo(p.x, p.y, e.x, e.y))) > step.arc / 2 + tol) continue;
      }
      const res = b.hitEnemy(W, e, { mv: step.mv, brk: step.brk, x: p.x, y: p.y, air: !!step.air, kind: 'melee', color });
      if (res) hitAny = true;
    }
    b.ev(W, { type: 'slash', x: p.x, y: p.y, ang: p.facing, range: step.range, arc: step.arc, fx: step.fx, color, heavy: st.heavy || step.mv >= 2 });
    if (!hitAny) b.sfx(W, step.mv >= 2 ? 'slashHeavy' : 'swing', { vol: 0.5, pitch: 0.9 + Math.random() * 0.25 });
    else b.sfx(W, step.mv >= 2 ? 'slashHeavy' : 'slash', { vol: 0.55 });
    if (step.shock) {
      const sx = p.x + Math.cos(p.facing) * 60;
      const sy = p.y + Math.sin(p.facing) * 60;
      for (const e of W.enemies) {
        if (e.dead || e.untargetable) continue;
        if (U.dist(sx, sy, e.x, e.y) < step.shock + e.r) b.hitEnemy(W, e, { mv: step.mv * 0.4, brk: step.brk * 0.4, x: sx, y: sy, kind: 'skill', noCombo: true });
      }
      b.ev(W, { type: 'ring', x: sx, y: sy, r0: 20, r1: step.shock, color, t: 0.4 });
      b.shake(W, 8);
      b.sfx(W, 'stomp', { vol: 0.5 });
    }
  }

  /* ── 반격 (ZERO FRAME 직후 공격) ── */
  function doCounter(W, p) {
    const b = B();
    p.counterReady = 0;
    p.buf.attack = 0;
    p.buf.heavy = 0;
    const t = p.target && !p.target.dead && !p.target.untargetable ? p.target : b.nearestEnemy(W, p.x, p.y, 700);
    if (t) {
      const back = t.facing + Math.PI;
      const ox = p.x;
      const oy = p.y;
      p.x = t.x + Math.cos(back) * (t.r + p.r + 26);
      p.y = t.y + Math.sin(back) * (t.r + p.r + 26);
      b.clampToArena(W, p);
      p.facing = U.angleTo(p.x, p.y, t.x, t.y);
      p.target = t;
      b.ev(W, { type: 'trail', x0: ox, y0: oy, x1: p.x, y1: p.y, color: '#9ae6ff' });
    }
    p.state = 'skill';
    p.st = { t: 0, dur: 0.42, kind: 'counter' };
    p.anim = 'heavy';
    p.animT = 0;
    p.iframe = Math.max(p.iframe, 0.4);
    b.sfx(W, 'counter');
    b.text(W, p.x, p.y - 90, '반격!', '#9ae6ff', 22, { tag: true });
    later(p, 0.1, () => {
      const full = { range: 150, arc: 2.6 };
      for (const e of W.enemies) {
        if (e.dead || e.untargetable) continue;
        const d = U.dist(p.x, p.y, e.x, e.y);
        if (d - e.r > full.range) continue;
        if (d > e.r && Math.abs(U.angleDiff(p.facing, U.angleTo(p.x, p.y, e.x, e.y))) > full.arc / 2 + Math.atan2(e.r, d)) continue;
        b.hitEnemy(W, e, { mv: 3.0, brk: 20, x: p.x, y: p.y, air: true, kind: 'melee', crit: true, color: '#9ae6ff' });
      }
      b.ev(W, { type: 'slash', x: p.x, y: p.y, ang: p.facing, range: 150, arc: 2.6, fx: 'smash', color: '#9ae6ff', heavy: true });
    });
  }

  /* ── 회피 ── */
  function startDodge(W, p, inp) {
    if (p.dodgeCharges < 1) {
      msg(W, '회피 회복 중');
      return false;
    }
    p.dodgeCharges -= 1;
    const dir = inputAngle(inp);
    p.dodgeDir = dir != null ? dir : p.facing + Math.PI;
    if (dir != null) p.facing = dir;
    p.state = 'dodge';
    p.st = null;
    p.dodgeT = 0;
    p.iframe = p.stats.iframe;
    p.perfectUsed = false;
    p.dodgeOrigin = { x: p.x, y: p.y };
    p.anim = 'dodge';
    p.animT = 0;
    p.buf.dodge = 0;
    p.comboWin = 0;
    B().sfx(W, 'dodge', { vol: 0.6 });
    return true;
  }

  function updateDodge(W, p, dt, inp) {
    const speedMul = p.haste > 0 ? 1.15 : 1;
    p.dodgeT += dt;
    const k = p.dodgeT / DODGE_TIME;
    const sp = DODGE_SPEED * speedMul * (k < 0.55 ? 1 : Math.max(0, 1 - (k - 0.55) / 0.45));
    p.x += Math.cos(p.dodgeDir) * sp * dt;
    p.y += Math.sin(p.dodgeDir) * sp * dt;
    if (p.dodgeT > 0.14) {
      if (p.counterReady > 0 && (p.buf.attack > 0 || p.buf.heavy > 0)) return doCounter(W, p);
    }
    if (p.dodgeT >= DODGE_TIME) {
      p.state = 'idle';
      if (p.counterReady > 0 && (p.buf.attack > 0 || p.buf.heavy > 0)) return doCounter(W, p);
    }
  }

  /* ── 스킬 ── */
  function useSkill(W, p, slot, inp) {
    const id = p.stats.skills[slot];
    if (!id) { msg(W, '빈 스킬 슬롯'); return false; }
    if (p.locks[slot] > 0) { msg(W, '권한 회수됨 — 사용 불가', '#ff5470'); return false; }
    if (p.cds[slot] > 0) { msg(W, '재사용 대기 중'); return false; }
    const node = AZ.data.skills.nodes[id];
    const cd = node.cd * p.stats.cdMul;
    const fn = SKILLS[id];
    if (!fn) return false;
    const ok = fn(W, p, inp);
    if (ok === false) return false;
    p.cds[slot] = cd;
    p.cdMax[slot] = cd;
    p.comboWin = 0;
    B().ev(W, { type: 'skillName', name: node.name });
    return true;
  }

  function enterSkillState(p, dur, kind, extra) {
    p.state = 'skill';
    p.st = Object.assign({ t: 0, dur, kind }, extra || {});
    p.anim = kind === 'ray' ? 'dodge' : 'cast';
    p.animT = 0;
  }

  const SKILLS = {
    waveSlash(W, p) {
      const b = B();
      enterSkillState(p, 0.36, 'wave');
      p.iframe = Math.max(p.iframe, 0.2);
      later(p, 0.1, () => {
        for (const e of W.enemies) {
          if (e.dead || e.untargetable) continue;
          if (U.dist(p.x, p.y, e.x, e.y) < 178 + e.r) b.hitEnemy(W, e, { mv: 2.2, brk: 14, x: p.x, y: p.y, kind: 'skill', color: '#ff9ab8' });
        }
        b.ev(W, { type: 'ring', x: p.x, y: p.y, r0: 20, r1: 180, color: '#ff8ab0', t: 0.45, thick: true });
        b.sfx(W, 'wave');
        b.shake(W, 7);
      });
    },
    rayStrike(W, p, inp) {
      const b = B();
      aimAt(W, p, inp, 520);
      let len = 330;
      if (p.target && !p.target.dead) len = Math.min(380, U.dist(p.x, p.y, p.target.x, p.target.y) + p.target.r + 40);
      const sx = p.x;
      const sy = p.y;
      const ang = p.facing;
      enterSkillState(p, 0.3, 'ray', { sx, sy, ang, len });
      p.iframe = Math.max(p.iframe, 0.4);
      b.sfx(W, 'blink');
      later(p, 0.2, () => {
        const h = { shape: 'line', x: sx, y: sy, ang, len, w: 70 };
        for (const e of W.enemies) {
          if (e.dead || e.untargetable) continue;
          if (b.inShape(h, e.x, e.y, e.r)) b.hitEnemy(W, e, { mv: 2.8, brk: 16, x: sx, y: sy, air: true, kind: 'skill', color: '#ffd0e0' });
        }
        b.ev(W, { type: 'beam', x: sx, y: sy, ang, len, w: 26, color: '#ff8ab0', t: 0.3 });
        b.sfx(W, 'slashHeavy');
      });
    },
    astralBlades(W, p, inp) {
      const b = B();
      aimAt(W, p, inp, 800);
      const t = p.target;
      enterSkillState(p, 0.3, 'cast');
      for (let i = 0; i < 6; i++) {
        later(p, i * 0.08, () => {
          const a = p.facing + (i - 2.5) * 0.45 + Math.PI;
          b.addBullet(W, { x: p.x + Math.cos(a) * 40, y: p.y + Math.sin(a) * 40, ang: a, speed: 520, accel: 900, r: 12, life: 2,
            team: 'player', mv: 0.8, brk: 3, color: '#ffd166', kind: 'blade', homing: 9, target: t, air: true, delay: 0.12 });
        });
      }
      b.sfx(W, 'skill');
    },
    barrier(W, p) {
      p.shield = Math.max(p.shield, p.maxHp * 0.3);
      p.shieldT = 8;
      enterSkillState(p, 0.2, 'cast');
      B().sfx(W, 'shield');
      B().ev(W, { type: 'ring', x: p.x, y: p.y, r0: 60, r1: 30, color: '#7ce8ff', t: 0.4 });
    },
    counterStance(W, p) {
      p.state = 'stance';
      p.st = { t: 0, dur: 0.9 };
      p.anim = 'stance';
      p.animT = 0;
      B().sfx(W, 'charge', { vol: 0.5 });
    },
    repair(W, p) {
      p.regen = { perSec: (p.maxHp * 0.25) / 3, t: 3 };
      enterSkillState(p, 0.25, 'cast');
      B().sfx(W, 'heal');
    },
    blink(W, p, inp) {
      const b = B();
      aimAt(W, p, inp, 600);
      const t = p.target && !p.target.dead && !p.target.untargetable ? p.target : null;
      const ox = p.x;
      const oy = p.y;
      if (t) {
        const back = t.facing + Math.PI;
        p.x = t.x + Math.cos(back) * (t.r + p.r + 28);
        p.y = t.y + Math.sin(back) * (t.r + p.r + 28);
        b.clampToArena(W, p);
        p.facing = U.angleTo(p.x, p.y, t.x, t.y);
      } else {
        p.x += Math.cos(p.facing) * 220;
        p.y += Math.sin(p.facing) * 220;
        b.clampToArena(W, p);
      }
      p.blinkCrit = 2;
      p.iframe = Math.max(p.iframe, 0.25);
      enterSkillState(p, 0.12, 'blink');
      b.ev(W, { type: 'trail', x0: ox, y0: oy, x1: p.x, y1: p.y, color: '#c9a4ff' });
      b.sfx(W, 'teleport');
    },
    accel(W, p) {
      p.haste = 7;
      enterSkillState(p, 0.2, 'cast');
      B().sfx(W, 'timeStop', { pitch: 1.6, vol: 0.5 });
      B().ev(W, { type: 'banner', kind: 'skill', text: '시간 가속', sub: '' });
    },
    timeStop(W, p) {
      W.timeStop = W.boss ? 1.8 : 2.5;
      enterSkillState(p, 0.3, 'cast');
      B().sfx(W, 'timeStop');
      B().ev(W, { type: 'flash', color: 'rgba(200,180,255,0.4)', t: 0.3 });
      B().ev(W, { type: 'banner', kind: 'skill', text: '시간 정지', sub: '' });
    },
  };

  function updateSkillState(W, p, dt) {
    const st = p.st;
    st.t += dt;
    if (st.kind === 'ray') {
      const k = Math.min(1, st.t / 0.2);
      const e = U.ease.outCubic(k);
      p.x = st.sx + Math.cos(st.ang) * st.len * e;
      p.y = st.sy + Math.sin(st.ang) * st.len * e;
    }
    if (st.t >= st.dur) {
      p.state = 'idle';
      p.st = null;
    }
  }

  /* ── 반격 자세가 공격을 받았을 때 ── */
  function onCounterStance(W, source) {
    const p = W.player;
    const b = B();
    b.triggerZeroFrame(W, 'stance');
    p.counterReady = 0;
    const t = source && source.kind && !source.dead ? source : (p.target && !p.target.dead ? p.target : b.nearestEnemy(W, p.x, p.y, 600));
    if (t && t.x != null && (t.kind === 'boss' || t.kind === 'enemy')) p.target = t;
    p.state = 'idle';
    p.iframe = Math.max(p.iframe, 0.5);
    p.counterReady = 0.01;
    p.buf.attack = 0.2;
    doCounter(W, p);
    // 반격 자세의 반격은 더 강하다
    later(p, 0.12, () => {
      const tt = p.target;
      if (tt && !tt.dead) b.hitEnemy(W, tt, { mv: 0.5, brk: 5, x: p.x, y: p.y, air: true, kind: 'skill', noCombo: true });
    });
  }

  /* ── 궁극기 ── */
  function startUlt(W, p, inp) {
    const b = B();
    if (p.focus < 100) { msg(W, '집중 게이지 부족'); return false; }
    aimAt(W, p, inp, 900);
    p.focus = 0;
    p.state = 'ult';
    p.st = { t: 0, n: 0, done: false, target: p.target && !p.target.dead ? p.target : b.nearestEnemy(W, p.x, p.y, 900) };
    p.anim = 'cast';
    p.animT = 0;
    p.iframe = 3;
    W.timeStop = Math.max(W.timeStop, 2.6);
    W.stats.ultUsed = (W.stats.ultUsed || 0) + 1;
    b.sfx(W, 'ult');
    b.ev(W, { type: 'cutin', who: 'kai', title: '크로노 디바이드', sub: 'CHRONO DIVIDE' });
    return true;
  }

  function updateUlt(W, p, dt) {
    const b = B();
    const st = p.st;
    st.t += dt;
    const tgt = st.target && !st.target.dead ? st.target : null;
    const cx = tgt ? tgt.x : p.x;
    const cy = tgt ? tgt.y : p.y;
    while (st.n < 7 && st.t >= 0.4 + st.n * 0.15) {
      const a = st.n * 2.3 + 0.5;
      const rr = (tgt ? tgt.r : 30) + 46;
      const ox = p.x;
      const oy = p.y;
      p.x = cx + Math.cos(a) * rr;
      p.y = cy + Math.sin(a) * rr;
      b.clampToArena(W, p);
      p.facing = U.angleTo(p.x, p.y, cx, cy);
      b.ev(W, { type: 'trail', x0: ox, y0: oy, x1: p.x, y1: p.y, color: '#ffe9a0' });
      if (tgt) b.hitEnemy(W, tgt, { mv: 1.6, brk: 3, x: p.x, y: p.y, air: true, kind: 'ult', color: '#ffe066' });
      b.ev(W, { type: 'slash', x: p.x, y: p.y, ang: p.facing, range: 130, arc: 2.4, fx: st.n % 2 ? 'slashL' : 'slashR', color: '#ffe066', heavy: true });
      b.sfx(W, 'slash', { pitch: 1 + st.n * 0.06 });
      st.n += 1;
    }
    if (!st.done && st.t >= 1.65) {
      st.done = true;
      for (const e of W.enemies) {
        if (e.dead || e.untargetable) continue;
        if (U.dist(cx, cy, e.x, e.y) < 300 + e.r) b.hitEnemy(W, e, { mv: 5.0, brk: 40, x: cx, y: cy, air: true, kind: 'ult', color: '#fff3c0' });
      }
      b.ev(W, { type: 'burst', x: cx, y: cy, z: 30, r: 320, color: '#ffe9a0', big: true });
      b.ev(W, { type: 'flash', color: 'rgba(255,245,200,0.7)', t: 0.35 });
      b.sfx(W, 'bigExplosion');
      b.shake(W, 18);
    }
    if (st.t >= 2.1) {
      p.state = 'idle';
      p.st = null;
      p.iframe = 0.4;
      W.timeStop = Math.min(W.timeStop, 0.15);
    }
  }

  /* ── 연계 공격 ── */
  function doChain(W, p) {
    const b = B();
    const allies = W.allies.filter((a) => a.down <= 0);
    if (!allies.length) { msg(W, W.allies.length ? '동료가 다운됨' : '연계할 동료가 없음', '#ffb35c'); return false; }
    const breakChain = W.boss && W.boss.broken && !W.chainUsedThisBreak;
    if (!breakChain && p.chain < 100) { msg(W, '연계 게이지 부족'); return false; }
    if (breakChain) W.chainUsedThisBreak = true;
    else p.chain = 0;
    const t = p.target && !p.target.dead && !p.target.untargetable ? p.target : b.nearestEnemy(W, p.x, p.y, 1200);
    if (!t) return false;
    W.stats.chains = (W.stats.chains || 0) + 1;
    const names = allies.map((a) => (a.ally === 'lia' ? '리아' : '제로'));
    b.ev(W, { type: 'cutin', who: allies[0].ally, who2: allies[1] ? allies[1].ally : null,
      title: allies.length > 1 ? '트리니티 링크' : allies[0].ally === 'lia' ? '오버클럭 캐논' : '적월참', sub: `${names.join(' · ')} 연계 공격` });
    b.sfx(W, 'chain');
    const mult = breakChain ? 1.3 : 1;
    for (const a of allies) {
      if (a.ally === 'lia') {
        b.bark(W, 'lia', 'chain');
        later(p, 0.5, () => {
          if (t.dead) return;
          b.ev(W, { type: 'beam', x: a.x, y: a.y - a.z, ang: U.angleTo(a.x, a.y, t.x, t.y), len: U.dist(a.x, a.y, t.x, t.y) + 40, w: 46, color: '#9ae6ff', t: 0.6 });
          b.hitEnemy(W, t, { mv: 3.2 * mult, brk: 30, x: a.x, y: a.y, air: true, kind: 'ally', color: '#9ae6ff' });
          b.sfx(W, 'beam');
          b.shake(W, 10);
        });
      } else {
        b.bark(W, 'zeroAlly', 'chain');
        for (let i = 0; i < 5; i++) {
          later(p, 0.45 + i * 0.12, () => {
            if (t.dead) return;
            const ang = i * 1.9;
            const ox = a.x;
            const oy = a.y;
            a.x = t.x + Math.cos(ang) * (t.r + 34);
            a.y = t.y + Math.sin(ang) * (t.r + 34);
            a.facing = U.angleTo(a.x, a.y, t.x, t.y);
            b.ev(W, { type: 'trail', x0: ox, y0: oy, x1: a.x, y1: a.y, color: '#ff3355' });
            b.ev(W, { type: 'slash', x: a.x, y: a.y, ang: a.facing, range: 110, arc: 2.4, fx: 'smash', color: '#ff3355', heavy: true });
            b.hitEnemy(W, t, { mv: 1.0 * mult, brk: 7, x: a.x, y: a.y, air: true, kind: 'ally', color: '#ff6b8a' });
          });
        }
      }
    }
    return true;
  }

  /* ── 전술 명령 ── */
  function doCommand(W, p, i) {
    const b = B();
    const cmd = AZ.data.commands[i];
    if (!cmd) return false;
    if (W.cmdCd[i] > 0) { msg(W, `${cmd.name} 재사용 대기 중`); return false; }
    const lia = W.allies.find((a) => a.ally === 'lia' && a.down <= 0);
    const any = W.allies.find((a) => a.down <= 0);
    if (cmd.needs === 'lia' && !lia) { msg(W, '리아가 없어 명령 불가', '#ffb35c'); return false; }
    if (cmd.needs === 'any' && !any) { msg(W, '명령을 받을 동료가 없음', '#ffb35c'); return false; }
    if (p.locks[3] > 0) { msg(W, '권한 회수됨 — 명령 불가', '#ff5470'); return false; }
    W.cmdCd[i] = cmd.cd;
    if (cmd.id === 'scan') {
      W.scan = 12;
      W.stats.scans += 1;
      b.bark(W, 'lia', 'scan');
      b.sfx(W, 'skill', { pitch: 1.3 });
      b.ev(W, { type: 'scan', x: lia.x, y: lia.y });
      b.ev(W, { type: 'banner', kind: 'cmd', text: '전술 분석', sub: '약점 노출 · 공격 예측' });
    } else if (cmd.id === 'cover') {
      const amt = p.maxHp * 0.15;
      p.shield = Math.max(p.shield, 0) + amt;
      p.shieldT = Math.max(p.shieldT, 10);
      for (const a of W.allies) {
        if (a.down > 0) continue;
        a.hp = Math.min(a.maxHp, a.hp + a.maxHp * 0.2);
        a.shield = a.maxHp * 0.2;
        a.shieldT = 10;
      }
      b.sfx(W, 'shield');
      b.ev(W, { type: 'ring', x: p.x, y: p.y, r0: 140, r1: 30, color: '#7ce8ff', t: 0.5 });
      b.ev(W, { type: 'banner', kind: 'cmd', text: '엄호', sub: '파티 방벽 전개' });
    } else if (cmd.id === 'focus') {
      W.allyFocus = 10;
      b.sfx(W, 'charge', { pitch: 1.2 });
      b.ev(W, { type: 'banner', kind: 'cmd', text: '집중 공격', sub: '동료 공격 강화 · 브레이크 2배' });
    }
    return true;
  }

  /* ── 공통 행동 시도 (대기/이동 중, 또는 캔슬 가능한 순간) ── */
  function tryActions(W, p, inp, fromCancel) {
    if (!inp) return false;
    if (p.buf.dodge > 0) return startDodge(W, p, inp) || false;
    for (let i = 0; i < 3; i++) if (inp.skills && inp.skills[i] && useSkill(W, p, i, inp)) return true;
    if (inp.ult && startUlt(W, p, inp)) return true;
    if (inp.chain) doChain(W, p);
    if (!fromCancel) {
      if (p.counterReady > 0 && (p.buf.attack > 0 || p.buf.heavy > 0)) { doCounter(W, p); return true; }
      if (p.buf.heavy > 0) { startAttack(W, p, inp, true); return true; }
      if (p.buf.attack > 0) { startAttack(W, p, inp, false); return true; }
    }
    return false;
  }

  /* ── 피격 / 사망 ── */
  function onHurt(W, dmg, ang, kb) {
    const p = W.player;
    p.combo = 0;
    p.flash = 0.2;
    const armored = p.state === 'attack' && p.st && p.st.step && p.st.step.armor;
    if (armored || p.state === 'ult' || p.state === 'skill') return;
    p.state = 'hurt';
    p.st = null;
    p.hurtT = 0.3;
    p.kbx = Math.cos(ang) * kb * 1.6;
    p.kby = Math.sin(ang) * kb * 1.6;
    p.iframe = Math.max(p.iframe, 0.35);
    p.anim = 'hurt';
    p.animT = 0;
    p.comboWin = 0;
  }

  function onDeath(W) {
    const p = W.player;
    p.dead = true;
    p.state = 'dead';
    p.anim = 'dead';
    p.animT = 0;
    W.slow = 0.35;
    W.slowT = 1.2;
    B().sfx(W, 'defeat');
    B().endBattle(W, 'defeat', 2.2);
  }

  /* ── 매 프레임 ── */
  function update(W, dt, inp) {
    const p = W.player;
    p.animT += dt;
    p.flash = Math.max(0, p.flash - dt);
    if (p.dead) { p.deadT += dt; return; }

    // 예약된 동작
    if (p.sched.length) {
      for (const s of p.sched) s.t -= dt;
      const due = p.sched.filter((s) => s.t <= 0);
      p.sched = p.sched.filter((s) => s.t > 0);
      for (const s of due) s.fn();
    }

    // 타이머
    p.iframe = Math.max(0, p.iframe - dt);
    for (let i = 0; i < 3; i++) {
      if (p.cds[i] > 0) p.cds[i] = Math.max(0, p.cds[i] - dt * (p.haste > 0 ? 1.15 : 1));
    }
    for (let i = 0; i < 4; i++) if (p.locks[i] > 0) p.locks[i] -= dt;
    if (p.shieldT > 0) { p.shieldT -= dt; if (p.shieldT <= 0) p.shield = 0; }
    if (p.haste > 0) p.haste -= dt;
    if (p.blinkCrit > 0) p.blinkCrit -= dt;
    if (p.counterReady > 0) p.counterReady -= dt;
    if (p.comboWin > 0) p.comboWin -= dt;
    if (p.combo > 0) {
      p.comboT -= dt;
      if (p.comboT <= 0) p.combo = 0;
    }
    if (p.regen) {
      p.hp = Math.min(p.maxHp, p.hp + p.regen.perSec * dt);
      p.regen.t -= dt;
      if (p.regen.t <= 0) p.regen = null;
    }
    if (p.dodgeCharges < MAX_DODGE) {
      p.dodgeRegen += dt;
      if (p.dodgeRegen >= DODGE_REGEN) { p.dodgeRegen = 0; p.dodgeCharges += 1; }
    } else p.dodgeRegen = 0;
    if (p.hp > p.maxHp * 0.5) p.lowHpBarked = false;

    // 입력 버퍼
    for (const k of ['attack', 'heavy', 'dodge']) p.buf[k] = Math.max(0, p.buf[k] - dt);
    if (inp) {
      if (inp.attack) p.buf.attack = BUFFER;
      else if (inp.attackHeld && p.buf.attack <= 0) p.buf.attack = 0.06;
      if (inp.heavy) p.buf.heavy = BUFFER;
      if (inp.dodge) p.buf.dodge = BUFFER;
      if (inp.cmds) for (let i = 0; i < 3; i++) if (inp.cmds[i]) doCommand(W, p, i);
    }
    // 대상 유지
    if (p.target && (p.target.dead || p.target.untargetable || U.dist(p.x, p.y, p.target.x, p.target.y) > 900)) p.target = null;
    if (!p.target) p.target = pickTarget(W, p, null, 700);

    // 넉백
    if (p.kbx || p.kby) {
      p.x += p.kbx * dt;
      p.y += p.kby * dt;
      const f = Math.pow(0.0008, dt);
      p.kbx *= f;
      p.kby *= f;
      if (Math.abs(p.kbx) + Math.abs(p.kby) < 5) { p.kbx = 0; p.kby = 0; }
    }

    switch (p.state) {
      case 'idle':
      case 'move': {
        if (tryActions(W, p, inp, false)) break;
        const ang = inputAngle(inp);
        if (ang != null) {
          const m = Math.min(1, Math.hypot(inp.mx, inp.my));
          const sp = MOVE_SPEED * (p.haste > 0 ? 1.35 : 1) * m;
          p.x += Math.cos(ang) * sp * dt;
          p.y += Math.sin(ang) * sp * dt;
          p.facing = U.turnToward(p.facing, ang, 18 * dt);
          p.state = 'move';
          p.runT += dt * m;
          p.anim = 'run';
        } else {
          p.state = 'idle';
          p.anim = 'idle';
        }
        break;
      }
      case 'attack':
        if (inp && p.buf.dodge > 0) {
          if (startDodge(W, p, inp)) break;
        }
        updateAttack(W, p, dt, inp);
        break;
      case 'dodge':
        updateDodge(W, p, dt, inp);
        break;
      case 'skill':
        updateSkillState(W, p, dt);
        break;
      case 'stance':
        p.st.t += dt;
        if (p.st.t >= p.st.dur) { p.state = 'idle'; p.st = null; }
        break;
      case 'hurt':
        p.hurtT -= dt;
        if (p.hurtT <= 0) { p.state = 'idle'; }
        break;
      case 'ult':
        updateUlt(W, p, dt);
        break;
      case 'locked':
        p.st.t -= dt;
        if (p.st.t <= 0) { p.state = 'idle'; p.st = null; }
        break;
      default:
        p.state = 'idle';
    }
    B().clampToArena(W, p);
  }

  return { create, update, onHurt, onDeath, onCounterStance, gainFocus, pickTarget, SKILLS };
})();

</script>
  <script>/* js/core/ai.js */
'use strict';

/* =========================================================
 * 적 행동 — 보스 10종과 일반 적
 * 행동 패턴은 제너레이터: yield 초  (적의 시간 = ZERO FRAME 에 느려짐)
 * 공격은 battle.addHazard 로 "경고 → 판정" 위험 지역을 만들어 표현합니다.
 * ========================================================= */
window.AZ = window.AZ || {};

AZ.ai = (() => {
  const U = AZ.util;
  const B = () => AZ.battle;

  /* ───────────── 생성 ───────────── */
  function baseEntity(W, kind, x, y, r) {
    return {
      id: U.nextId(), kind, team: 'enemy', x, y, z: 0, vx: 0, vy: 0, r,
      facing: Math.PI / 2, flash: 0, stun: 0, exposed: 0, alert: 0, alpha: 1,
      anim: 'idle', animT: 0, brain: { gen: null, wait: 0, rest: 1, last: null, iter: 0 },
      dash: null, dead: false, deadT: 0, untargetable: false, airborne: false, spawnT: 0, parts: {},
    };
  }

  function spawnBoss(W, id) {
    const def = AZ.data.bosses[id];
    const P = AZ.progress;
    const e = baseEntity(W, 'boss', W.w / 2, W.h * (def.big ? 0.4 : 0.3), def.r);
    e.bossId = id;
    e.def = def;
    e.maxHp = Math.round(P.bossHp(W.cfg.chapterId, def.hpMul) * W.diff.hp);
    e.hp = e.maxHp;
    e.brkMax = def.breakMax;
    e.brk = e.brkMax;
    e.brkIdle = 0;
    e.broken = false;
    e.breakT = 0;
    e.phase = 1;
    e.speed = def.speed;
    e.superArmor = true;
    e.timers = {};
    e.brain.rest = 1.2;
    W.enemies.push(e);
    const ai = BOSS_AI[id];
    if (ai && ai.init) ai.init(e, W);
    return e;
  }

  function spawnMinion(W, type, x, y, opts) {
    const def = AZ.data.enemies[type];
    const e = baseEntity(W, 'enemy', x, y, def.r);
    e.type = type;
    e.def = def;
    const scale = 1 + (W.cfg.chapterId - 1) * 0.12;
    e.maxHp = Math.max(1, Math.round(W.ref.atk * def.hp * scale * (0.85 + 0.15 * W.diff.hp)));
    e.hp = e.maxHp;
    e.speed = def.speed * (0.92 + Math.random() * 0.16);
    e.clone = !!def.clone;
    e.z = def.flying ? 26 : 0;
    e.spawnT = (opts && opts.delay) || 0.3;
    e.untargetable = true;
    e.brain.rest = 0.8 + Math.random() * 0.8;
    e.facing = U.angleTo(x, y, W.player.x, W.player.y);
    W.enemies.push(e);
    return e;
  }

  /* ───────────── 패턴 문맥(k) ───────────── */
  function ctx(W, e) {
    const b = B();
    const p = W.player;
    const own = (o, dmgDefault) => {
      const out = Object.assign({ owner: e }, o);
      if (out.dmg == null) out.dmg = dmgDefault != null ? dmgDefault : 1;
      if (e.kind === 'enemy') out.dmg *= e.def.dmg;
      if (out.dmg >= 1.6 && e.kind === 'boss') e.alert = Math.max(e.alert, 0.7);
      return out;
    };
    const k = {
      W, e, p,
      get phase() { return e.phase || 1; },
      ang: () => U.angleTo(e.x, e.y, p.x, p.y),
      dist: () => U.dist(e.x, e.y, p.x, p.y),
      face: (a) => { e.facing = a != null ? a : U.angleTo(e.x, e.y, p.x, p.y); return e.facing; },
      circle: (x, y, r, o) => b.addHazard(W, 'circle', { x, y, r }, own(o)),
      ring: (x, y, r0, r1, o) => b.addHazard(W, 'ring', { x, y, r0, r1 }, own(o)),
      sector: (x, y, r, ang, arc, o) => b.addHazard(W, 'sector', { x, y, r, ang, arc }, own(o)),
      line: (x, y, ang, len, w, o) => b.addHazard(W, 'line', { x, y, ang, len, w }, own(o)),
      outside: (x, y, r, o) => b.addHazard(W, 'outside', { x, y, r }, own(o)),
      all: (safe, o) => b.addHazard(W, 'all', { x: W.w / 2, y: W.h / 2, safe }, own(o)),
      bullet: (o) => b.addBullet(W, Object.assign({ owner: e, team: 'enemy' }, o, { dmg: (o.dmg || 1) * (e.kind === 'enemy' ? e.def.dmg : 1) })),
      dash: (ang, len, time, dmg) => {
        e.dash = { vx: Math.cos(ang) * len / time, vy: Math.sin(ang) * len / time, t: time, dmg: dmg || 0, hit: new Set() };
        e.facing = ang;
      },
      anim: (name) => { e.anim = name; e.animT = 0; },
      sfx: (n, o) => b.sfx(W, n, o),
      shake: (a) => b.shake(W, a),
      banner: (text, sub, kind) => b.ev(W, { type: 'banner', kind: kind || 'warn', text, sub: sub || '' }),
      bark: (group, key) => b.bark(W, group, key),
      text: (str, color) => b.text(W, e.x, e.y - e.r - (e.z || 0) - 40, str, color || '#ff9aa8', 18, { tag: true }),
      near: (r) => ({ x: p.x + U.rand(-r, r), y: p.y + U.rand(-r, r) }),
      clampPt: (x, y, m) => ({ x: U.clamp(x, m || 60, W.w - (m || 60)), y: U.clamp(y, m || 60, W.h - (m || 60)) }),
      minions: () => W.enemies.filter((m) => !m.dead && m.kind === 'enemy').length,
      spawn: (type, x, y) => spawnMinion(W, type, x, y, { delay: 0.5 }),
      ev: (o) => b.ev(W, o),
    };
    return k;
  }

  /* ───────────── 이동 도우미 ───────────── */
  function moveToward(e, tx, ty, speed, dt) {
    const d = U.dist(e.x, e.y, tx, ty);
    if (d < 2) return 0;
    const step = Math.min(d, speed * dt);
    const a = U.angleTo(e.x, e.y, tx, ty);
    e.x += Math.cos(a) * step;
    e.y += Math.sin(a) * step;
    return step;
  }
  function chase(W, e, dt, keep, speedMul) {
    const p = W.player;
    const d = U.dist(e.x, e.y, p.x, p.y);
    const turn = (e.def && e.def.turnRate) || 7;
    e.facing = U.turnToward(e.facing, U.angleTo(e.x, e.y, p.x, p.y), turn * dt);
    if (d > keep) {
      moveToward(e, p.x, p.y, e.speed * (speedMul || 1), dt);
      e.anim = 'move';
    } else e.anim = 'idle';
  }
  function strafe(W, e, dt, keep, speedMul) {
    const p = W.player;
    const d = U.dist(e.x, e.y, p.x, p.y);
    const a = U.angleTo(p.x, p.y, e.x, e.y);
    e.strafeDir = e.strafeDir || (Math.random() < 0.5 ? 1 : -1);
    if (Math.random() < dt * 0.25) e.strafeDir *= -1;
    const na = a + e.strafeDir * 0.9 * dt * (e.speed / Math.max(80, d));
    const tx = p.x + Math.cos(na) * keep;
    const ty = p.y + Math.sin(na) * keep;
    moveToward(e, tx, ty, e.speed * (speedMul || 1) * (Math.abs(d - keep) > 60 ? 1 : 0.5), dt);
    e.facing = U.turnToward(e.facing, U.angleTo(e.x, e.y, p.x, p.y), 8 * dt);
    e.anim = 'move';
  }

  /* ───────────── 공용 업데이트 ───────────── */
  function update(W, dt, edt) {
    for (const e of W.enemies) {
      if (e.dead) {
        e.deadT += dt;
        continue;
      }
      e.animT += edt;
      e.flash = Math.max(0, e.flash - dt);
      if (e.spawnT > 0) {
        e.spawnT -= dt;
        if (e.spawnT <= 0) e.untargetable = false;
        continue;
      }
      if (e.alert > 0) e.alert -= edt;
      if (e.exposed > 0) e.exposed -= edt;
      if (e.stance > 0) e.stance -= edt;
      if (e.kind === 'boss') updateBossTimers(W, e, dt, edt);
      // 넉백 속도
      if (e.vx || e.vy) {
        e.x += e.vx * edt;
        e.y += e.vy * edt;
        const f = Math.pow(0.004, edt);
        e.vx *= f;
        e.vy *= f;
        if (Math.abs(e.vx) + Math.abs(e.vy) < 4) { e.vx = 0; e.vy = 0; }
      }
      if (edt <= 0) continue;
      if (e.broken) {
        e.anim = 'broken';
        continue;
      }
      if (e.stun > 0) {
        e.stun -= edt;
        e.anim = 'hurt';
        continue;
      }
      // 돌진
      if (e.dash) {
        e.x += e.dash.vx * edt;
        e.y += e.dash.vy * edt;
        e.dash.t -= edt;
        if (e.dash.dmg > 0) dashContact(W, e);
        if (e.dash.t <= 0 || e.x < e.r || e.y < e.r || e.x > W.w - e.r || e.y > W.h - e.r) e.dash = null;
        B().clampToArena(W, e);
      }
      runBrain(W, e, dt, edt);
      if (!e.airborne) B().clampToArena(W, e);
      else {
        e.x = U.clamp(e.x, 40, W.w - 40);
        e.y = U.clamp(e.y, 40, W.h - 40);
      }
    }
    // 시체 정리 (보스는 남겨 둠)
    W.enemies = W.enemies.filter((e) => !e.dead || e.kind === 'boss' || e.deadT < 1.2);
  }

  function dashContact(W, e) {
    const targets = [W.player, ...W.allies];
    for (const t of targets) {
      if (t.dead || t.down > 0 || e.dash.hit.has(t.id)) continue;
      if (U.dist(e.x, e.y, t.x, t.y) < e.r + t.r) {
        e.dash.hit.add(t.id);
        B().hurt(W, t, e.dash.dmg * W.ref.dmg * (e.kind === 'enemy' ? e.def.dmg : 1), { x: e.x, y: e.y, kb: 240, perfectable: true, source: e });
      }
    }
  }

  function runBrain(W, e, dt, edt) {
    const ai = e.kind === 'boss' ? BOSS_AI[e.bossId] : MINION_AI[e.def.ai];
    if (!ai) return;
    const br = e.brain;
    if (br.gen) {
      br.wait -= edt;
      let guard = 0;
      while (br.gen && br.wait <= 0 && guard++ < 30) {
        let r;
        try {
          r = br.gen.next();
        } catch (err) {
          if (typeof console !== 'undefined') console.error(err);
          r = { done: true };
        }
        if (r.done) {
          br.gen = null;
          const rest = ai.rest || [0.6, 1.0];
          br.rest = U.rand(rest[0], rest[1]) / (W.diff.aggro || 1) * (e.phase > 1 ? 0.8 : 1);
          e.anim = 'idle';
        } else br.wait += r.value || 0;
      }
      return;
    }
    const k = ctx(W, e);
    if (ai.idle) ai.idle(k, edt);
    br.rest -= edt;
    if (br.rest <= 0 && W.state === 'fight' && !W.player.dead) {
      const opts = ai.moves(k).filter((m) => m[1] > 0 && ai[m[0]]);
      let pickName = U.weighted(opts.map(([n, w]) => [n, n === br.last && opts.length > 1 ? w * 0.25 : w]));
      if (!pickName) { br.rest = 0.5; return; }
      br.last = pickName;
      br.gen = ai[pickName](k);
      br.wait = 0;
    }
  }

  /** 행동을 끊고 다른 패턴으로 */
  function interrupt(W, e, genFn) {
    const k = ctx(W, e);
    e.brain.gen = genFn(k);
    e.brain.wait = 0;
    e.dash = null;
  }

  /* ───────────── 보스 상태 ───────────── */
  function updateBossTimers(W, e, dt, edt) {
    if (e.broken) {
      e.breakT -= edt;
      if (e.breakT <= 0) {
        e.broken = false;
        e.brk = e.brkMax;
        B().text(W, e.x, e.y - e.r - 50, '자세 회복', '#ffb35c', 16);
        const ai = BOSS_AI[e.bossId];
        if (ai.onRecover) interrupt(W, e, ai.onRecover);
      }
      return;
    }
    e.brkIdle += edt;
    if (e.brkIdle > 4 && e.brk < e.brkMax) e.brk = Math.min(e.brkMax, e.brk + e.brkMax * 0.05 * edt);
    // 공중 높이
    const wantZ = e.airborne ? (e.def.airborne ? 130 : 0) : (e.def.flying ? 28 : 0);
    e.z = U.approach(e.z, e.bossId === 'astra' ? 40 : wantZ, 260 * dt);
  }

  function onBossDamaged(W, e, dmg, o) {
    const ai = BOSS_AI[e.bossId];
    // 페이즈 전환
    const th = e.def.phases || [];
    if (e.phase - 1 < th.length && e.hp > 0 && e.hp / e.maxHp <= th[e.phase - 1]) {
      e.phase += 1;
      B().bark(W, e.bossId, 'phase2');
      B().ev(W, { type: 'banner', kind: 'phase', text: `PHASE ${e.phase}`, sub: e.def.name + ' — 출력 상승' });
      if (ai.transition && !e.broken) interrupt(W, e, ai.transition);
    }
    if (ai.onHit) ai.onHit(ctx(W, e), dmg, o);
  }

  function onBossBroken(W, e) {
    const ai = BOSS_AI[e.bossId];
    e.stance = 0;
    if (ai.onBreak) ai.onBreak(ctx(W, e));
  }

  function onBossDeath(W, e) {
    const b = B();
    e.anim = 'dead';
    e.animT = 0;
    W.slow = 0.25;
    W.slowT = 1.6;
    W.zero = 0;
    for (const h of W.hazards) { if (!h.done) { h.done = true; h.fade = 0.3; } }
    W.bullets = W.bullets.filter((bl) => bl.team !== 'enemy');
    for (const m of W.enemies) if (m !== e && !m.dead) b.killEnemy(W, m);
    b.ev(W, { type: 'burst', x: e.x, y: e.y, z: (e.z || 0) + e.r, r: e.r * 4, color: e.def.color, big: true });
    b.ev(W, { type: 'flash', color: 'rgba(255,255,255,0.75)', t: 0.5 });
    b.ev(W, { type: 'bossDown', name: e.def.name });
    b.sfx(W, 'bigExplosion');
    b.shake(W, 22);
    b.bark(W, e.bossId, 'defeat');
    b.endBattle(W, 'victory', 3.0);
  }

  /* ───────────── 보스 행동 ───────────── */
  const BOSS_AI = {};

  /* 1. 스캐빈저 — 폐허의 포식자 */
  BOSS_AI.scavenger = {
    rest: [0.45, 0.9],
    idle(k, dt) { chase(k.W, k.e, dt, 120, k.phase > 1 ? 1.3 : 1); },
    moves(k) {
      const d = k.dist();
      const m = [['claw', d < 230 ? 5 : 1], ['pounce', d > 200 ? 4 : 2], ['toss', 2]];
      if (k.phase > 1) m.push(['burrow', 2.5]);
      return m;
    },
    *claw(k) {
      const e = k.e;
      k.face();
      k.anim('windup');
      k.sector(e.x, e.y, 145, e.facing, 1.9, { warn: 0.55, dmg: 1.0 });
      yield 0.55;
      k.anim('attack');
      k.sfx('slash', { pitch: 0.7 });
      yield 0.22;
      k.face();
      k.anim('windup');
      k.sector(e.x, e.y, 150, e.facing, 2.1, { warn: 0.42, dmg: 1.1 });
      yield 0.42;
      k.anim('attack');
      k.sfx('slash', { pitch: 0.65 });
      yield 0.55;
    },
    *pounce(k) {
      const e = k.e;
      const n = k.phase > 1 ? 3 : 1;
      for (let i = 0; i < n; i++) {
        const ang = k.face();
        const len = Math.min(k.dist() + 130, 540);
        const warn = i === 0 ? 0.72 : 0.5;
        k.anim('windup');
        k.line(e.x, e.y, ang, len, 78, { warn, life: 0.26, dmg: 1.5, kb: 280 });
        yield warn;
        k.anim('dash');
        k.dash(ang, len, 0.26);
        k.sfx('swing', { pitch: 0.6 });
        yield 0.34;
      }
      k.anim('idle');
      yield 0.75;
    },
    *toss(k) {
      k.anim('windup');
      k.sfx('roar', { vol: 0.4, pitch: 1.3 });
      yield 0.3;
      const n = k.phase > 1 ? 8 : 5;
      for (let i = 0; i < n; i++) {
        const pt = k.clampPt(k.p.x + U.rand(-200, 200), k.p.y + U.rand(-200, 200));
        if (i === 0) { pt.x = k.p.x; pt.y = k.p.y; }
        k.circle(pt.x, pt.y, 62, { warn: 0.95 + i * 0.07, dmg: 1.1, visual: 'debris' });
      }
      yield 1.3;
    },
    *burrow(k) {
      const e = k.e;
      k.anim('burrow');
      e.untargetable = true;
      k.sfx('stomp', { vol: 0.6 });
      yield 0.5;
      const tx = k.p.x;
      const ty = k.p.y;
      k.circle(tx, ty, 115, { warn: 1.0, dmg: 1.8, kb: 300, label: '발밑 주의' });
      yield 1.0;
      e.x = tx;
      e.y = ty;
      e.untargetable = false;
      k.anim('attack');
      k.shake(10);
      k.ring(tx, ty, 115, 270, { warn: 0.35, dmg: 1.0 });
      yield 1.0;
    },
    *transition(k) {
      k.anim('roar');
      k.sfx('roar');
      k.shake(8);
      k.ring(k.e.x, k.e.y, 0, 300, { warn: 0.6, dmg: 0.6, kb: 420 });
      yield 1.2;
    },
  };

  /* 2. 아르카 — 방어형 기계 기사 */
  BOSS_AI.arka = {
    rest: [0.6, 1.1],
    init(e) { e.parts.shieldUp = 1; },
    idle(k, dt) {
      chase(k.W, k.e, dt, 150);
      k.e.shieldDown = false;
    },
    moves(k) {
      const d = k.dist();
      const m = [['sweep', d < 240 ? 4 : 1], ['charge', d > 220 ? 4 : 1.5], ['slam', 2.5]];
      if (k.phase > 1) m.push(['lances', 2.5]);
      return m;
    },
    *sweep(k) {
      const e = k.e;
      k.anim('windup');
      for (let i = 0; i < 6; i++) { e.facing = U.turnToward(e.facing, k.ang(), 0.25); yield 0.05; }
      k.sector(e.x, e.y, 178, e.facing, 3.0, { warn: 0.5, dmg: 1.4 });
      yield 0.5;
      k.anim('attack');
      k.sfx('slashHeavy', { pitch: 0.7 });
      yield 0.6;
    },
    *charge(k) {
      const e = k.e;
      const ang = k.face();
      k.anim('windup');
      k.line(e.x, e.y, ang, 540, 98, { warn: 0.85, life: 0.36, dmg: 1.6, kb: 320 });
      yield 0.85;
      k.anim('dash');
      k.dash(ang, 540, 0.36);
      k.sfx('stomp', { vol: 0.6 });
      yield 0.4;
      // 돌진 뒤에는 방패가 내려가 빈틈
      e.shieldDown = true;
      k.anim('recover');
      k.text('빈틈!', '#7cf7ff');
      yield 1.1;
      e.shieldDown = false;
    },
    *slam(k) {
      const e = k.e;
      k.face();
      k.anim('windup');
      const fx = e.x + Math.cos(e.facing) * 70;
      const fy = e.y + Math.sin(e.facing) * 70;
      k.circle(fx, fy, 150, { warn: 0.9, dmg: 1.8, kb: 300 });
      yield 0.9;
      k.anim('attack');
      k.shake(10);
      k.sfx('stomp');
      k.ring(fx, fy, 150, 285, { warn: 0.35, dmg: 1.0 });
      yield 0.9;
    },
    *lances(k) {
      const W = k.W;
      k.anim('cast');
      k.sfx('alarm', { vol: 0.4 });
      for (let i = 0; i < 3; i++) {
        const ang = U.rand(0, U.TAU);
        const px = k.p.x;
        const py = k.p.y;
        const ox = px - Math.cos(ang) * 1100;
        const oy = py - Math.sin(ang) * 1100;
        k.line(ox, oy, ang, 2200, 60, { warn: 1.0, dmg: 1.3, visual: 'lance' });
        yield 0.35;
      }
      yield 0.9;
      void W;
    },
    *transition(k) {
      k.anim('roar');
      k.sfx('clang');
      k.banner('방패 과부하', '아르카가 더 빠르게 돌아선다');
      k.ring(k.e.x, k.e.y, 0, 260, { warn: 0.6, dmg: 0.7, kb: 400 });
      k.e.def = Object.assign({}, k.e.def, { turnRate: 3.2 });
      yield 1.1;
    },
  };

  /* 3. 옵저버 — 감시 시스템 */
  BOSS_AI.observer = {
    rest: [0.7, 1.2],
    idle(k, dt) {
      const e = k.e;
      const p = k.p;
      const d = k.dist();
      const keep = 330;
      const a = U.angleTo(p.x, p.y, e.x, e.y) + dt * 0.35;
      moveToward(e, p.x + Math.cos(a) * keep, p.y + Math.sin(a) * keep, e.speed * (Math.abs(d - keep) > 80 ? 1.2 : 0.5), dt);
      e.facing = U.turnToward(e.facing, k.ang(), 3 * dt);
    },
    moves(k) {
      return [['beam', 3], ['eyeLaser', 3.5], ['mines', 2], ['drones', k.minions() < 3 ? 1.5 : 0], ['teleport', k.dist() < 160 ? 3 : 0.8]];
    },
    *beam(k) {
      const e = k.e;
      const dir = Math.random() < 0.5 ? 1 : -1;
      const a0 = k.ang() - 1.25 * dir;
      const lines = k.phase > 1 ? [a0, a0 + Math.PI] : [a0];
      k.anim('charge');
      for (const a of lines) {
        k.line(e.x, e.y, a, 780, 36, { warn: 0.9, life: 2.3, tick: 0.3, dmg: 0.7, follow: e,
          update: (h, W, dt) => { if (h.active) h.ang += dir * (2.6 / 2.3) * dt; } });
      }
      k.sfx('laser', { vol: 0.5 });
      yield 3.2;
    },
    *eyeLaser(k) {
      const e = k.e;
      const n = k.phase > 1 ? 3 : 1;
      for (let i = 0; i < n; i++) {
        k.anim('charge');
        const warn = i === 0 ? 1.3 : 0.9;
        k.line(e.x, e.y, k.ang(), 1050, 86, { warn, life: 0.3, dmg: 2.0, kb: 260, follow: e,
          update: (h, W, dt) => { if (!h.active && h.t < h.warn - 0.38) h.ang = U.turnToward(h.ang, U.angleTo(e.x, e.y, W.player.x, W.player.y), 2.6 * dt); } });
        k.sfx('charge', { vol: 0.5, pitch: 0.7 });
        yield warn;
        k.sfx('beam');
        k.shake(8);
        yield 0.35;
      }
      e.exposed = 3.6;
      k.anim('exposed');
      k.banner('렌즈 노출', '지금 공격하세요', 'chance');
      yield 1.2;
    },
    *mines(k) {
      k.anim('cast');
      const px = k.p.x;
      const py = k.p.y;
      for (let ix = -1; ix <= 1; ix++) {

  /* 4. 제로 — 라이벌 */

  /* 5. 아틀라스 — 거대 전투 병기 */
  BOSS_AI.atlas = {
    rest: [0.8, 1.3],
    idle(k, dt) { chase(k.W, k.e, dt, 220); },

      k.anim('slam');
      k.shake(10);
      k.sfx('stomp');
      yield 1.2;
    },
    *orbital(k) {
      const W = k.W;
      k.e.timers.orbital = W.t + 18;

      for (let i = 0; i < 2; i++) {
