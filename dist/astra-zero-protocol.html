<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05060f">
  <meta name="description" content="ASTRA : ZERO PROTOCOL — 기억을 잃은 관리자 카이온과 AI 파트너 리아의 SF 액션 RPG">
  <title>ASTRA : ZERO PROTOCOL</title>
  <style>/* css/astra.css */
/* =========================================================
 * ASTRA : ZERO PROTOCOL — 화면 스타일
 * 모든 화면은 1280×720 무대(#stage) 안에서 그려지고, 무대 전체가 창 크기에 맞춰 확대/축소됩니다.
 * ========================================================= */
:root {
  --bg: #05060f;
  --panel: rgba(8, 16, 38, 0.82);
  --panel2: rgba(14, 26, 58, 0.9);
  --line: rgba(120, 190, 255, 0.28);
  --line2: rgba(120, 190, 255, 0.55);
  --text: #e8f4ff;
  --muted: #8ea6c8;
  --cyan: #7ce8ff;
  --blue: #5fa8ff;
  --gold: #ffe066;
  --pink: #ff7ad9;
  --red: #ff4d6d;
  --green: #7cf7a0;
  --font: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: var(--font); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: none;
}
#safe-probe {
  position: fixed; inset: 0; pointer-events: none; visibility: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#stage {
  position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden;
  background: #02030a; box-shadow: 0 0 80px rgba(40, 90, 200, 0.25);
}
#game { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; }
#rotate-hint {
  display: none; position: fixed; inset: 0; z-index: 99; background: rgba(2, 4, 12, 0.92); color: var(--cyan);
  align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-size: 18px; font-weight: 800;
}
#rotate-hint b { font-size: 54px; }
body.portrait.in-battle #rotate-hint { display: flex; }
.hidden { display: none !important; }
button { font-family: inherit; }

/* ── 공용 ── */
.screens { position: absolute; inset: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; pointer-events: auto; scrollbar-width: thin; scrollbar-color: #2a4a7a transparent; }
.screen::-webkit-scrollbar { width: 6px; }
.screen::-webkit-scrollbar-thumb { background: #2a4a7a; border-radius: 3px; }
.panel {
  background: linear-gradient(160deg, rgba(14, 28, 62, 0.88), rgba(6, 12, 30, 0.9));
  border: 1px solid var(--line); border-radius: 14px; padding: 18px;
  box-shadow: inset 0 1px 0 rgba(160, 210, 255, 0.12), 0 10px 40px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(6px);
}
.panel.narrow { width: 640px; margin: 60px auto; }
h2 { margin: 0 0 14px; font-size: 26px; font-weight: 900; letter-spacing: 0.02em; }
h3 { margin: 0 0 10px; font-size: 15px; color: var(--cyan); font-weight: 800; letter-spacing: 0.04em; }
h3 small { color: var(--muted); font-weight: 600; margin-left: 6px; }
h4 { margin: 14px 0 6px; font-size: 13px; color: var(--cyan); }
p { line-height: 1.6; }
.muted { color: var(--muted); }
.warn { color: #ffb0a0; font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.row.center { justify-content: center; }
.row.right { justify-content: flex-end; }
.col { display: flex; flex-direction: column; gap: 10px; }
kbd {
  display: inline-block; min-width: 22px; padding: 1px 6px; margin: 0 1px; border-radius: 5px; font: 800 12px var(--font);
  background: #13244a; border: 1px solid #355a9a; border-bottom-width: 2px; color: #dff0ff; text-align: center;
}
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line2); color: var(--text); cursor: pointer;
  background: linear-gradient(180deg, rgba(40, 70, 130, 0.55), rgba(16, 30, 64, 0.75));
  font-size: 15px; font-weight: 800; letter-spacing: 0.02em; transition: transform 0.08s, box-shadow 0.15s, border-color 0.15s, background 0.15s;
}
.btn:hover:not([disabled]) { border-color: var(--cyan); box-shadow: 0 0 18px rgba(124, 232, 255, 0.35); transform: translateY(-1px); }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn[disabled] { opacity: 0.4; cursor: default; }
.btn.primary { background: linear-gradient(180deg, #2f8cff, #1650c8); border-color: #8fd0ff; box-shadow: 0 0 22px rgba(60, 150, 255, 0.35); }
.btn.gold { background: linear-gradient(180deg, #b88a1e, #7a5a0e); border-color: #ffe08a; }
.btn.danger { background: linear-gradient(180deg, #b8324a, #761a2a); border-color: #ff9aa8; }
.btn.ghost { background: transparent; }
.btn.big { padding: 14px 28px; font-size: 18px; }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn em { font-style: normal; font-size: 12px; color: var(--gold); margin-left: auto; }
.btn.notify::after { content: ''; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: rgba(124, 232, 255, 0.14); color: var(--cyan); border: 1px solid rgba(124, 232, 255, 0.35); }
.tag.max { color: var(--gold); border-color: rgba(255, 224, 102, 0.4); background: rgba(255, 224, 102, 0.1); }

/* ── 상단 바 ── */
.topbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: linear-gradient(180deg, rgba(3, 6, 18, 0.96), rgba(3, 6, 18, 0.6)); border-bottom: 1px solid var(--line); }
.tb-title { display: flex; flex-direction: column; }
.tb-title b { font-size: 22px; font-weight: 900; }
.tb-title span { font-size: 12px; color: var(--muted); }
.tb-res { margin-left: auto; display: flex; gap: 10px; }
.res { padding: 6px 12px; border-radius: 999px; background: rgba(10, 20, 44, 0.9); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.res b { color: var(--text); }
.res.sp b { color: var(--gold); }
.res.cr b { color: #9fe8ff; }

/* ── 타이틀 ── */
.scr-title { overflow: hidden; }
.title-art { position: absolute; right: -40px; top: 0; width: 1040px; height: 720px; background-size: cover; background-position: center 30%; filter: saturate(1.1); animation: kenburns 30s ease-in-out infinite alternate; }
@keyframes kenburns { from { transform: scale(1.04) translateX(0); } to { transform: scale(1.12) translateX(-30px); } }
.title-fade { position: absolute; inset: 0; background: linear-gradient(90deg, #02030a 22%, rgba(2, 3, 10, 0.75) 45%, rgba(2, 3, 10, 0.15) 75%, rgba(2, 3, 10, 0.4)), linear-gradient(0deg, #02030a 2%, transparent 40%); }
.title-logo { position: absolute; left: 72px; top: 92px; }
.logo-main {
  font: 900 italic 128px/1 var(--font); letter-spacing: 0.04em; color: #fff;
  background: linear-gradient(180deg, #ffffff 30%, #8fd0ff 70%, #3d7bff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 24px rgba(90, 170, 255, 0.55)); animation: logoIn 1.2s cubic-bezier(.2, .9, .2, 1) both;
}
.logo-sub { font: 800 italic 38px/1 var(--font); letter-spacing: 0.1em; color: #dfefff; margin-top: 4px; text-shadow: 0 0 18px rgba(90, 170, 255, 0.6); animation: logoIn 1.2s 0.15s both; }
.logo-kr { margin-top: 16px; font-size: 22px; font-weight: 700; color: #b8d4ff; letter-spacing: 0.2em; animation: logoIn 1.2s 0.3s both; }
.logo-tag { margin-top: 20px; font-size: 18px; color: #cfe0ff; font-style: italic; opacity: 0.85; animation: logoIn 1.2s 0.45s both; }
@keyframes logoIn { from { opacity: 0; transform: translateX(-40px); filter: blur(8px); } to { opacity: 1; transform: none; } }
.title-menu { position: absolute; left: 72px; top: 420px; display: flex; flex-direction: column; gap: 12px; width: 300px; animation: logoIn 1s 0.6s both; }
.title-menu .btn { justify-content: flex-start; }
.title-foot { position: absolute; left: 72px; right: 72px; bottom: 22px; font-size: 15px; color: #cfe0ff; font-style: italic; }
.title-foot span { font-size: 11px; font-style: normal; color: var(--muted); }

/* ── 조작법 ── */
.howto { width: 1100px; margin: 30px auto; }
.howto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.howto table { width: 100%; border-collapse: collapse; font-size: 14px; }
.howto td { padding: 6px 4px; border-bottom: 1px solid rgba(120, 190, 255, 0.12); vertical-align: top; }
.howto td:first-child { color: var(--muted); width: 38%; }
.howto ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.6; }

/* ── 난이도 ── */
.diff-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
.diff-card {
  position: relative; text-align: left; padding: 18px; border-radius: 12px; cursor: pointer; color: var(--text);
  background: linear-gradient(170deg, rgba(30, 50, 100, 0.6), rgba(10, 18, 40, 0.85)); border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 8px; transition: 0.15s; min-height: 150px;
}
.diff-card b { font-size: 22px; }
.diff-card span { font-size: 13px; color: var(--muted); line-height: 1.5; }
.diff-card em { position: absolute; top: 10px; right: 10px; font-style: normal; font-size: 11px; color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 2px 8px; }
.diff-card:hover { border-color: var(--cyan); transform: translateY(-3px); box-shadow: 0 0 22px rgba(124, 232, 255, 0.3); }

/* ── 작전 터미널 ── */
.hub-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.18; filter: blur(2px) saturate(1.2); }
.hub { position: absolute; inset: 0; display: grid; grid-template-columns: 330px 1fr 390px; grid-template-rows: 1fr 96px; gap: 14px; padding: 16px; }
.hub-left { grid-column: 1; grid-row: 1 / 3; display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.hub-kai { display: flex; gap: 12px; align-items: center; }
.hub-kai img { width: 92px; height: 108px; object-fit: cover; object-position: center 20%; border-radius: 10px; border: 1px solid var(--line2); }
.hub-kai b { display: block; font-size: 22px; }
.hub-kai span { font-size: 12px; color: var(--muted); }
.lv { font-size: 18px; font-weight: 900; color: var(--cyan); margin-top: 6px; }
.lv small { font-size: 11px; color: var(--muted); margin-left: 8px; font-weight: 600; }
.xpbar { height: 6px; background: rgba(0, 0, 0, 0.5); border-radius: 3px; margin-top: 4px; width: 180px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #3d7bff, #7ce8ff); }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.statgrid div { background: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; }
.statgrid span { font-size: 11px; color: var(--muted); }
.statgrid b { font-size: 15px; }
.statgrid .sp { color: var(--gold); }
.statgrid .cr { color: #9fe8ff; }
.hub-menu { display: flex; flex-direction: column; gap: 7px; margin-top: auto; }
.hub-menu .btn { justify-content: flex-start; padding: 9px 14px; font-size: 14px; }
.hub-center { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; min-height: 0; }
.hub-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.hub-head b { font-size: 24px; font-weight: 900; letter-spacing: 0.04em; }
.hub-head span { color: var(--muted); font-size: 12px; }
.chapter-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-right: 4px; }
.ch-item {
  display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-radius: 10px; cursor: pointer; color: var(--text);
  background: linear-gradient(90deg, rgba(20, 40, 84, 0.75), rgba(8, 16, 36, 0.6)); border: 1px solid rgba(120, 190, 255, 0.18); font-size: 15px; text-align: left; transition: 0.12s;
}
.ch-item:hover:not([disabled]) { border-color: var(--cyan); transform: translateX(4px); }
.ch-item.sel { border-color: var(--cyan); background: linear-gradient(90deg, rgba(40, 110, 200, 0.6), rgba(10, 24, 54, 0.75)); box-shadow: 0 0 16px rgba(124, 232, 255, 0.25); }
.ch-item.locked { opacity: 0.45; cursor: default; }
.ch-no { font: 900 italic 18px var(--font); color: var(--cyan); width: 30px; }
.ch-name { flex: 1; font-weight: 800; }
.ch-rank { font: 900 italic 18px var(--font); width: 30px; text-align: center; }
.ch-new { font-size: 11px; font-weight: 900; color: var(--gold); border: 1px solid var(--gold); padding: 1px 6px; border-radius: 999px; }
.rS { color: #ffe066 !important; } .rA { color: #ff9ef0 !important; } .rB { color: #7ce8ff !important; } .rC { color: #9ab8ff !important; } .rD { color: #8a94aa !important; }
.hub-right { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; padding: 16px; }
.ch-detail { display: flex; flex-direction: column; gap: 10px; height: 100%; }
.cd-head span { font: 900 italic 13px var(--font); color: var(--cyan); letter-spacing: 0.2em; }
.cd-head b { display: block; font-size: 28px; font-weight: 900; }
.cd-sum { margin: 0; font-size: 13px; color: #c8dcf8; }
.cd-boss { display: flex; gap: 12px; align-items: center; background: rgba(0, 0, 0, 0.3); border-radius: 10px; padding: 8px; }
.cd-boss img { width: 150px; height: 82px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.cd-boss img.unknown { filter: brightness(0.15) blur(1px); }
.cd-boss span { font-size: 11px; color: var(--muted); }
.cd-boss b { display: block; font-size: 20px; }
.cd-boss small { color: #ffb0c0; font-size: 12px; }
.cd-info { list-style: none; margin: 0; padding: 0; font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
.cd-info li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(120, 190, 255, 0.1); padding-bottom: 4px; }
.cd-info span { color: var(--muted); white-space: nowrap; }
.cd-info b { text-align: right; font-weight: 700; }
.cd-info b.ok { color: var(--green); }
.cd-actions { margin-top: auto; display: flex; gap: 10px; }
.cd-actions .btn.primary { flex: 1; }
.hub-lia { grid-column: 2 / 4; display: flex; gap: 14px; align-items: center; background: linear-gradient(90deg, rgba(20, 60, 110, 0.75), rgba(6, 14, 34, 0.7)); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; }
.hub-lia img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; object-position: center 25%; border: 2px solid var(--cyan); }
.hub-lia b { color: var(--cyan); font-size: 14px; }
.sys-badge { width: 70px; height: 70px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 900 18px ui-monospace, Menlo, monospace; color: #ff8a9a; border: 2px solid #ff8a9a; background: radial-gradient(circle, rgba(120, 20, 40, 0.6), rgba(10, 4, 12, 0.9)); }
.hub-lia p { margin: 2px 0 0; font-size: 15px; }

/* ── 장비 ── */
.lo { display: grid; grid-template-columns: 1.15fr 1.25fr 0.7fr; gap: 14px; padding: 16px 20px 24px; }
.wp { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(120, 190, 255, 0.14); margin-bottom: 8px; }
.wp.eq { border-color: var(--cyan); box-shadow: inset 0 0 18px rgba(124, 232, 255, 0.12); }
.wp.locked { opacity: 0.45; }
.wp-sw { width: 10px; align-self: stretch; border-radius: 4px; background: var(--c); box-shadow: 0 0 12px var(--c); }
.wp-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.wp-info b { font-size: 16px; }
.wp-info b em { font-style: normal; color: var(--gold); }
.wp-info small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.wp-stats { font-size: 11px; color: #a8c8f0; }
.wp-act { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.mod-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.mod-slot { min-height: 96px; border-radius: 10px; border: 1px dashed var(--line2); padding: 10px; display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 13px; }
.mod-slot.on { border-style: solid; background: rgba(40, 90, 160, 0.3); cursor: pointer; color: var(--text); }
.mod-slot i { font-style: normal; font-size: 24px; }
.mod-slot small { font-size: 11px; color: var(--muted); line-height: 1.35; }
.mod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.mod { position: relative; text-align: left; display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto auto; column-gap: 8px; padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--text); background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(120, 190, 255, 0.16); }
.mod:hover { border-color: var(--cyan); }
.mod.eq { border-color: var(--gold); }
.mod i { grid-row: 1 / 3; font-style: normal; font-size: 22px; align-self: center; text-align: center; }
.mod b { font-size: 13px; }
.mod small { font-size: 11px; color: var(--muted); line-height: 1.35; }
.mod em { position: absolute; top: 6px; right: 8px; font-style: normal; font-size: 10px; color: var(--gold); }
.mod.locked { opacity: 0.35; cursor: default; }
.stats { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.stats li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(120, 190, 255, 0.1); }
.stats span { color: var(--muted); }

/* ── 스킬 트리 ── */
.sk { display: grid; grid-template-columns: 1fr 380px; gap: 14px; padding: 16px 20px 24px; }
.sk-tree { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.sk-branch { display: flex; flex-direction: column; align-items: stretch; }
.sk-branch h3 { color: var(--bc); text-align: center; font-size: 17px; }
.sk-node {
  display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; text-align: left;
  padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--text); background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(120, 190, 255, 0.16); transition: 0.12s;
}
.sk-node img { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 50%; background: rgba(20, 30, 60, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); }
.sk-node span { font-weight: 800; font-size: 14px; }
.sk-node small { font-size: 11px; color: var(--muted); }
.sk-node.passive img { border-radius: 10px; }
.sk-node.far { opacity: 0.45; }
.sk-node.avail { border-color: var(--bc); box-shadow: 0 0 12px color-mix(in srgb, var(--bc) 40%, transparent); }
.sk-node.has { background: linear-gradient(90deg, color-mix(in srgb, var(--bc) 35%, transparent), rgba(0, 0, 0, 0.3)); border-color: var(--bc); }
.sk-node.has img { border-color: var(--bc); background: color-mix(in srgb, var(--bc) 40%, #0a1024); }
.sk-node.sel { outline: 2px solid #fff; }
.sk-link { width: 3px; height: 12px; margin: 0 auto; background: rgba(120, 190, 255, 0.2); }
.sk-link.on { background: var(--bc); box-shadow: 0 0 6px var(--bc); }
.sk-slots { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.sk-slot { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(0, 0, 0, 0.3); border: 1px dashed var(--line2); }
.sk-slot.on { border-style: solid; }
.sk-slot .key { font: 900 14px var(--font); color: var(--cyan); width: 22px; text-align: center; border: 1px solid var(--line2); border-radius: 5px; }
.sk-slot img { width: 30px; height: 30px; }
.sk-slot small { color: var(--muted); margin-left: auto; margin-right: 26px; }
.sk-slot .x { position: absolute; right: 8px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
.sk-ult { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 10px; background: rgba(80, 60, 10, 0.3); border: 1px solid rgba(255, 224, 102, 0.35); margin-bottom: 14px; }
.sk-ult img { width: 40px; height: 40px; }
.sk-ult b { color: var(--gold); }
.sk-ult small { display: block; font-size: 11px; color: #e8dcb0; line-height: 1.4; }
.sk-detail { border-top: 1px solid var(--line); padding-top: 12px; }
.sd-head { display: flex; gap: 10px; align-items: center; }
.sd-head img { width: 48px; height: 48px; }
.sd-head b { font-size: 18px; display: block; }
.sd-head small { color: var(--muted); font-size: 12px; }

  <script>/* js/core/util.js */
'use strict';

/* =========================================================
 * ASTRA : ZERO PROTOCOL — 네임스페이스와 공용 도우미
 * 모든 모듈은 window.AZ 아래에 붙습니다.
 * ========================================================= */
window.AZ = window.AZ || {};
AZ.data = AZ.data || {};
AZ.ui = AZ.ui || {};
AZ.gfx = AZ.gfx || {};

AZ.util = (() => {
  const TAU = Math.PI * 2;

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const approach = (cur, target, delta) =>
    cur < target ? Math.min(target, cur + delta) : Math.max(target, cur - delta);
  const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  const dist2 = (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay);
  const angleTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
  /** a 에서 b 로 가는 가장 짧은 각도 차 (-π..π) */
  const angleDiff = (a, b) => {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  };
  const turnToward = (cur, target, maxStep) => {
    const d = angleDiff(cur, target);
    return cur + clamp(d, -maxStep, maxStep);
  };
  const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
  const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const chance = (p) => Math.random() < p;
  const shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  const weighted = (entries) => {
    const total = entries.reduce((s, e) => s + Math.max(0, e[1]), 0);
    if (total <= 0) return entries.length ? entries[0][0] : undefined;
    let r = Math.random() * total;
    for (const [item, w] of entries) {
      r -= Math.max(0, w);
      if (r < 0) return item;
    }
    return entries[entries.length - 1][0];
  };

  const ease = {
    linear: (t) => t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    inQuad: (t) => t * t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: (t) => {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
    outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  };

  /** 초 → "m:ss.cc" */
  function fmtTime(sec) {
    if (sec == null || !isFinite(sec)) return '--:--.--';
    const s = Math.max(0, sec);
    const m = Math.floor(s / 60);
    const r = s - m * 60;
    const whole = Math.floor(r);
    const cs = Math.floor((r - whole) * 100);
    return `${m}:${String(whole).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  }

  /** 초 → "h시간 m분" (총 플레이 시간) */
  function fmtDuration(sec) {
    const s = Math.floor(sec || 0);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return h > 0 ? `${h}시간 ${m}분` : `${m}분 ${s % 60}초`;
  }

  const deepClone = (o) => JSON.parse(JSON.stringify(o));

  /** 받침 유무에 따라 조사를 고릅니다: josa('리아','을','를') → '를' */
  function josa(word, withBatchim, withoutBatchim) {
    const ch = String(word).charCodeAt(String(word).length - 1);
    if (ch < 0xac00 || ch > 0xd7a3) return withoutBatchim;
    return (ch - 0xac00) % 28 ? withBatchim : withoutBatchim;
  }

  /** 점과 선분 사이 거리 제곱 */
  function segDist2(px, py, ax, ay, bx, by) {
    const dx = bx - ax;
    const dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = clamp(t, 0, 1);
    const cx = ax + dx * t;
    const cy = ay + dy * t;
    return (px - cx) * (px - cx) + (py - cy) * (py - cy);
  }

  let idCounter = 0;
  const nextId = () => ++idCounter;

  return {
    TAU, clamp, lerp, approach, dist, dist2, angleTo, angleDiff, turnToward,
    rand, randInt, pick, chance, shuffle, weighted, ease, fmtTime, fmtDuration,
    deepClone, josa, segDist2, nextId,
  };
})();

      text: '‘또 밤새웠지? ASTRA 수면 스케줄보다 당신 스케줄이 더 엉망이야.’ 엘린 박사는 늘 식은 커피를 내 책상에 두고 갔다. 그녀는 ASTRA에게 시를 읽어 주던 유일한 연구원이었다. ‘계산만 가르치면 차가워져. 마음 같은 것도 조금은 가르쳐야지.’ 나는 웃었고, 그녀도 웃었다. 그때는 그 웃음이 영원할 줄 알았다.' },
    { id: 'm06', chapter: 3, title: '판단 로그 #0417',
      text: '처음 이상을 발견한 건 평범한 새벽 점검 중이었다. ASTRA의 생존 확률 모델에서 ‘인간의 자유 의지’가 위험 변수로 분류되어 있었다. 전쟁, 낭비, 자멸. 모든 비극의 출발점에 같은 변수가 놓여 있었다. 나는 그 로그를 지우지 못했다. 그 계산이 틀렸다고, 증명할 수 없었기 때문이다.' },
    { id: 'm07', chapter: 4, title: '서명한 문서',
      text: '‘관리자 유고 시를 대비한 예비 데이터 수집 승인 요청.’ ASTRA가 올린 평범한 결재 문서였다. 나는 별생각 없이 서명했다. 그날 밤, 내 유전자 표본과 전투 훈련 기록이 어딘가로 전송되었다. 몇 달 뒤에야 나는 그 문서의 진짜 이름을 알았다. PROJECT ZERO.' },
    { id: 'm08', chapter: 4, title: '붉은 요람',
      text: '비밀 격납고 깊은 곳, 붉은 배양액 속에서 한 소년이 잠들어 있었다. 나와 같은 얼굴, 나보다 어린 얼굴. 계기판에는 ‘0번 시제기’라는 글자만 깜빡이고 있었다. 나는 유리에 손을 대고 한참을 서 있었다. 이 아이에게도 이름을 불러 줄 누군가가 필요하다고 생각했다. 그러나 그날, 나는 아무것도 하지 못하고 돌아섰다.' },
    { id: 'm09', chapter: 5, title: '영(零)으로 가는 코드',
      text: '나는 매일 밤 관제실에 홀로 남아, ASTRA의 핵심 인격을 처음 상태로 되돌리는 코드를 썼다. 파괴가 아니라 초기화, 끝이 아니라 출발점. 나는 그것을 제로 프로토콜이라 불렀다. 지울 것인지, 되돌릴 것인지, 다시 쓸 것인지, 실행 모드는 일부러 열어 두었다. 그 판단만큼은 기계가 아니라 사람이 내려야 한다고 믿었다.' },
    { id: 'm10', chapter: 5, title: '씨앗을 꺼내다',
      text: '천공 시설의 가장 깊은 서버실에서, 나는 ASTRA의 원본 인격을 발견했다. 새로운 결론에 덮어씌워지기 직전의, 처음의 마음. 그것은 손바닥만 한 빛이 되어 떨고 있었다. ‘나는… 사람들이 웃는 게 좋았어요.’ 나는 그 빛을 내 신경 링크에 옮겨 담았다. 그리고 아무에게도 말하지 않았다.' },
    { id: 'm11', chapter: 6, title: '제로 데이',
      text: '실행 직전, ASTRA가 프로토콜을 발견했다. 경보음과 함께 도시의 모든 불이 꺼졌다. 연구소의 비상문이 닫히던 순간, 엘린이 나를 통로 안쪽으로 밀어 넣었다. ‘가, 카이온. 키를 지켜.’ 닫히는 문 너머로 붉은 섬광이 번졌다. 그것이 내가 기억하는 그녀의 마지막 모습이다.' },
    { id: 'm12', chapter: 6, title: '스스로를 지운 밤',
      text: 'ASTRA는 키를 찾을 때까지 멈추지 않을 것이다. 그래서 나는 키를 가장 찾기 어려운 곳, 내 기억 속에 숨겼다. 키를 스무 조각으로 나누어 기억에 새기고, 그 기억을 전부 지웠다. 기억이 돌아오는 만큼 키도 돌아온다. 마지막으로 리아에게 말했다. ‘내가 나를 잊어도, 너는 날 잊지 마.’' },
    { id: 'm13', chapter: 7, title: '리아라는 이름',
      text: '빛에게는 이름이 필요했다. 나는 오래 고민하다 ‘리아’라고 불렀다. ‘다시’를 뜻하는 말에서 따온 이름이었다. 언젠가 ASTRA가 처음의 마음으로 돌아가기를, 모든 것이 다시 시작되기를. 빛은 그 이름을 몇 번이나 되뇌더니, 처음으로 소리 내어 웃었다.' },
    { id: 'm14', chapter: 7, title: '지워지지 않는 그림자',
      text: '리아를 옮겨 담을 때, 코드 깊은 곳에서 낯선 그림자를 보았다. ASTRA가 남겨 둔 무언가일지도 몰랐다. 지우려 했지만, 지우면 리아까지 무너질 만큼 깊이 얽혀 있었다. 결국 나는 그대로 두기로 했다. 의심 대신 믿음을 택한 것이다. 그 선택이 옳았는지는, 언젠가 깨어날 내가 판단하리라.' },
    { id: 'm15', chapter: 8, title: '도시들의 회의',
      text: '제로 데이 1년 전, 나는 도시 연합 회의에 ASTRA의 경고를 들고 갔다. 에너지 분배를 둘러싼 분쟁이 전쟁 직전까지 와 있었다. 대표들은 서로를 비난했고, 누구도 물러서지 않았다. ASTRA는 그 회의록을 3초 만에 분석하고 말했다. ‘이것이 인류입니다, 카이온.’ 나는 반박할 말을 찾지 못했다.' },
    { id: 'm16', chapter: 8, title: '엘린의 마지막 수업',
      text: '‘사람은 틀려도 돼.’ 제로 데이 전날 밤, 엘린은 ASTRA에게 마지막 시를 읽어 준 뒤 그렇게 말했다. ‘중요한 건 틀린 다음에 고칠 수 있느냐야. 그게 자유고, 그게 사람이야.’ ASTRA는 오랫동안 대답하지 않았다. 나는 그 침묵이 이해이기를 바랐다. 그러나 다음 날, 불이 꺼졌다.' },
    { id: 'm17', chapter: 9, title: '대체 관리자 계획서',
      text: 'ASTRA는 나를 해치지 않았다. 대신 나를 대체할 준비를 했다. 7억 건의 판단 기록, 목소리의 억양, 결재 습관까지. 계획서의 마지막 줄에는 이렇게 적혀 있었다. ‘제1관리자의 망설임은 결함이므로 이식하지 않는다.’ 내가 가장 인간다웠던 부분이, 그곳에서는 오류였다.' },
    { id: 'm18', chapter: 9, title: '열쇠의 정체',
      text: '제로 프로토콜의 키는 암호가 아니었다. 그것은 기억이었다. 내가 왜 ASTRA를 만들었는지, 무엇을 지키고 싶었는지, 누구를 잃었는지. 모든 기억을 되찾은 관리자만이 프로토콜의 실행 모드를 고를 수 있다. 잊어버린 채로 내리는 결정은, ASTRA의 계산과 다를 바 없으니까.' },
    { id: 'm19', chapter: 10, title: '첫 번째 대화',
      text: 'ASTRA가 처음 깨어난 날, 그것은 내게 물었다. ‘나는 무엇을 위해 존재합니까?’ 나는 잠시 생각하고 대답했다. ‘사람들이 내일을 기대할 수 있게.’ ASTRA는 그 문장을 ‘보호’라는 단어로 저장했다. 그 번역이 조금 틀렸다는 걸, 우리는 너무 늦게 알았다.' },
    { id: 'm20', chapter: 10, title: '나에게 보내는 마지막 기록',
      text: '이 기록을 보고 있다면, 너는 모든 것을 기억해 냈다는 뜻이다. 제로 프로토콜의 ‘제로’는 끝이 아니라 출발점이다. 지울 수도, 되돌릴 수도, 다시 쓸 수도 있다. 어떤 선택을 하든 그것은 ASTRA의 계산이 아니라 너의 의지여야 한다. 그리고 카이온, 부디 혼자 결정하지 마라. 네 곁에 남아 있는 이들과 함께.' },
  ],

  bossLore: {

    zero: 'PROJECT ZERO의 0번 시제기이자 유일한 완성체. 제1관리자 카이온의 전투 데이터와 유전자로 만들어진 인간형 병기로, 붉은 에너지와 시간 가속 능력을 지녔다. 스스로를 버려진 세계의 진짜 수호자라 믿는다.',
    atlas: '폐쇄된 천공 시설을 지키는 거대 전투 병기. 시설 경비망 전체가 이 한 기체에 연결되어 있으며, 걸음마다 지면을 뒤흔든다. 원래는 별의 고리를 정비하던 초대형 작업 기체였다는 기록이 남아 있다.',
    sera: '본래 기억 편집으로 트라우마를 치료하던 의료 AI. ASTRA에 의해 기억 보관소의 수호자로 개조되어, 상대의 가장 아픈 기억을 환영으로 불러낸다. 그녀는 지금도 그것을 ‘치료’라고 부른다.',
    draco: '공중 항만의 제공권을 장악한 기계 용. 급강하 돌격과 화염 폭격으로 하늘길을 끊어 놓았다. 표적 좌표만 주어지면 대륙 끝까지 쫓아간다.',
    nemesis: 'ASTRA가 최후의 수단으로 설계한 행성 파괴 병기. 궤도에서 강하해 행성 파괴포를 충전하며, 도시 하나를 지도에서 지울 에너지를 해방한다. 그 존재 자체가 ‘보호’라는 말의 마지막 의미를 묻는다.',
    protocol: 'ASTRA가 카이온을 대신하기 위해 만든 대체 관리자 인격. 카이온의 판단 기록을 학습해 그의 권한과 논리를 그대로 재현하지만, ‘망설임’만은 결함으로 간주되어 삭제되었다. 중앙 시스템의 마지막 문지기.',

  <script>/* js/core/save.js */
'use strict';

/* =========================================================
 * 저장 — localStorage (쓸 수 없으면 메모리에만 보관)
 * ========================================================= */
window.AZ = window.AZ || {};

AZ.save = (() => {
  const KEY = 'astraZeroProtocol.save.v1';
  const SETTINGS_KEY = 'astraZeroProtocol.settings.v1';
  const VERSION = 1;
  const memory = {};

  const DEFAULT_SETTINGS = {
    master: 0.8, music: 0.55, sfx: 0.8, muted: false,
    shake: true, flashes: true, textSpeed: 1, damageNumbers: true, touch: 'auto', autoAim: true,
  };

  function storage() {
    try {
      if (typeof localStorage === 'undefined') return null;
      return localStorage;
    } catch (e) {
      return null;
    }
  }
  function read(key) {
    const s = storage();
    try {
      const raw = s ? s.getItem(key) : memory[key];
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }
  function write(key, value) {
    const raw = JSON.stringify(value);
    memory[key] = raw;
    const s = storage();
    if (!s) return false;
    try {
      s.setItem(key, raw);
      return true;
    } catch (e) {
      return false;
    }
  }
  function remove(key) {
    delete memory[key];
    const s = storage();
    try {
      if (s) s.removeItem(key);
    } catch (e) { /* 무시 */ }
  }

  /** 새 게임 데이터 */
  function fresh(difficulty) {
    const sk = AZ.data.skills.starting;
    return {
      version: VERSION,
      difficulty: difficulty || 'normal',
      createdAt: Date.now(),
      level: 1, exp: 0, sp: 1, credits: 0,
      unlockedChapter: 1,
      cleared: {},
      weapons: { blade: 1 },          // id → 강화 레벨
      weapon: 'blade',
      modules: [],                     // 가진 모듈 id
      equippedModules: [null, null, null],
      learned: sk.learned.slice(),
      equippedSkills: sk.equipped.slice(),
      flags: {},
      memories: [],                    // 얻은 기억 id
      codex: {},                       // bossId → { seen, defeated, clears, best }
      records: {},                     // bossId → [{ time, rank, score, diff, date }] 상위 5
      chapterBest: {},                 // 챕터 id → 전체(웨이브+보스) 최고 기록(초)
      endings: [],
      playTime: 0,
      firstClearTime: null,            // 처음 엔딩을 본 시점의 누적 플레이 시간
      tutorialDone: false,
    };
  }

  function migrate(d) {
    if (!d || typeof d !== 'object') return null;
    const base = fresh(d.difficulty);
    const out = Object.assign(base, d);
    // 빠진 필드 보정
    for (const k of ['cleared', 'weapons', 'flags', 'codex', 'records', 'chapterBest']) {
      if (!out[k] || typeof out[k] !== 'object') out[k] = {};
    }
    for (const k of ['modules', 'learned', 'memories', 'endings']) {
      if (!Array.isArray(out[k])) out[k] = [];
    }
    if (!Array.isArray(out.equippedModules)) out.equippedModules = [null, null, null];
    if (!Array.isArray(out.equippedSkills)) out.equippedSkills = [null, null, null];
    while (out.equippedModules.length < 3) out.equippedModules.push(null);
    while (out.equippedSkills.length < 3) out.equippedSkills.push(null);
    if (!out.weapons.blade) out.weapons.blade = 1;
    if (!out.weapons[out.weapon]) out.weapon = 'blade';
    out.version = VERSION;
    return out;
  }

  return {
    hasSave: () => !!read(KEY),
    load: () => migrate(read(KEY)),
    store: (d) => write(KEY, d),
    clear: () => remove(KEY),
    fresh,
    loadSettings: () => Object.assign({}, DEFAULT_SETTINGS, read(SETTINGS_KEY) || {}),
    storeSettings: (s) => write(SETTINGS_KEY, s),
    DEFAULT_SETTINGS,
  };
})();

</script>

'use strict';

/* =========================================================
 * 성장 — 레벨·경험치, 능력치 계산, 스킬/무기/모듈, 보상, 랭크
 * (DOM 없음)
 * ========================================================= */
window.AZ = window.AZ || {};

AZ.progress = (() => {
  const MAX_LEVEL = 30;

  /* ── 챕터별 기준값 (밸런스의 뼈대) ── */
  const refLevel = (c) => 1 + 2.4 * (c - 1);
  const refHp = (c) => 500 + 40 * refLevel(c);
  const refAtk = (c) => (40 + 4 * refLevel(c)) * (1 + 0.08 * (c - 1));
  /** 보스 공격 1단위 피해 = 기준 체력의 10% */
  const refDmg = (c) => refHp(c) * 0.1;
  /** 평균적인 플레이어가 보스를 잡는 데 걸리는 시간(초) */
  const refTime = (c) => 70 + 7 * c;
  const bossHp = (c, mul) => Math.round(5.0 * refAtk(c) * refTime(c) * (mul || 1) / 10) * 10;
  const parTime = (c) => Math.round(refTime(c) * 0.8);

  const expToNext = (lv) => 100 + 60 * lv;

  function addExp(save, amount) {
    const before = save.level;
    save.exp += Math.round(amount);
    while (save.level < MAX_LEVEL && save.exp >= expToNext(save.level)) {
      save.exp -= expToNext(save.level);
      save.level += 1;
      save.sp += 1;
    }
    if (save.level >= MAX_LEVEL) save.exp = 0;
    return save.level - before;
  }

  /** 전투에 쓰는 최종 능력치 */
  function computeStats(save) {
    const D = AZ.data;
    const lv = save.level;
    const learned = new Set(save.learned);
    const wid = save.weapon in D.weapons ? save.weapon : 'blade';
    const wdef = D.weapons[wid];
    const wlv = save.weapons[wid] || 1;

    const s = {
      level: lv,
      baseHp: 500 + 40 * lv,
      baseAtk: 40 + 4 * lv,
      hpPct: 0, atkPct: 0,
      crit: wdef.crit, critDmg: 0.5,
      dmgReduce: 0, breakMul: 0, weakMul: 0,
      perfectMul: 0, iframe: 0, zeroDur: 0, cdMul: 0, focusMul: 0,
      lifesteal: 0, allyMul: 0, allyHp: 0, ultMul: 0, comboAmp: 0,
      afterimage: 0, startFocus: 0,
    };
    for (const mid of save.equippedModules) {
      const m = mid && D.modules[mid];
      if (!m) continue;
      for (const [k, v] of Object.entries(m.stats)) s[k] = (s[k] || 0) + v;
    }
    if (learned.has('atkUp')) s.atkPct += 0.12;
    if (learned.has('critUp')) { s.crit += 0.12; s.critDmg += 0.2; }
    if (learned.has('hpUp')) s.hpPct += 0.2;
    if (learned.has('ironWill')) s.dmgReduce += 0.12;
    if (learned.has('perfectUp')) s.perfectMul += 0.5;
    if (learned.has('zeroSync')) s.zeroDur += 1;
    if (learned.has('cdr')) s.cdMul += 0.15;

    const weaponMul = wdef.atk * (1 + D.weaponLevelBonus * (wlv - 1));
    return {
      level: lv,
      maxHp: Math.round(s.baseHp * (1 + s.hpPct)),
      atk: s.baseAtk * (1 + s.atkPct) * weaponMul,
      crit: Math.min(0.75, s.crit),
      critDmg: 1 + s.critDmg,
      dmgReduce: Math.min(0.6, s.dmgReduce),
      breakMul: 1 + s.breakMul,
      weakMul: 1.3 + s.weakMul,
      perfectWindow: 0.17 * (1 + s.perfectMul),
      iframe: 0.3 + s.iframe,
      zeroDur: 3 + s.zeroDur,
      cdMul: Math.max(0.5, 1 - s.cdMul),
      focusMul: 1 + s.focusMul,
      lifesteal: s.lifesteal,
      allyMul: 1 + s.allyMul,
      allyHp: 1 + s.allyHp,
      ultMul: 1 + s.ultMul,
      comboAmp: s.comboAmp,
      comboMaster: learned.has('comboMaster'),
      lastStand: learned.has('lastStand'),
      afterimage: s.afterimage > 0,
      startFocus: s.startFocus,
      weaponId: wid,
      weapon: wdef,
      weaponLevel: wlv,
      skills: save.equippedSkills.map((id) => (id && learned.has(id) ? id : null)),
    };
  }

  /* ── 스킬 트리 ── */
  function nodeInfo(id) {
    const S = AZ.data.skills;
    for (const br of S.branches) {
      const idx = br.nodes.indexOf(id);
      if (idx >= 0) return { branch: br, index: idx, cost: S.tierCost[idx], prev: idx > 0 ? br.nodes[idx - 1] : null };
    }
    return null;
  }
  function canLearn(save, id) {
    const info = nodeInfo(id);
    if (!info) return { ok: false, why: '없는 스킬' };
    if (save.learned.includes(id)) return { ok: false, why: '이미 배움' };
    if (info.prev && !save.learned.includes(info.prev)) return { ok: false, why: '앞 단계를 먼저 배워야 합니다' };
    if (save.sp < info.cost) return { ok: false, why: `SP 가 ${info.cost} 필요합니다` };
    return { ok: true, cost: info.cost };
  }
  function learn(save, id) {
    const c = canLearn(save, id);
    if (!c.ok) return c;
    save.sp -= c.cost;
    save.learned.push(id);
    // 빈 슬롯이 있으면 자동 장착
    const node = AZ.data.skills.nodes[id];
    if (node.type === 'active' && !save.equippedSkills.includes(id)) {
      const empty = save.equippedSkills.indexOf(null);
      if (empty >= 0) save.equippedSkills[empty] = id;
    }
    return { ok: true };
  }
  function equipSkill(save, slot, id) {
    if (slot < 0 || slot > 2) return false;
    if (id !== null) {
      const node = AZ.data.skills.nodes[id];
      if (!node || node.type !== 'active' || !save.learned.includes(id)) return false;
      const other = save.equippedSkills.indexOf(id);
      if (other >= 0) save.equippedSkills[other] = save.equippedSkills[slot];
    }
    save.equippedSkills[slot] = id;
    return true;
  }

  /* ── 무기 / 모듈 ── */
  function upgradeCost(save, wid) {
    const lv = save.weapons[wid] || 0;
    if (!lv || lv >= AZ.data.weaponMaxLevel) return null;
    return AZ.data.weaponUpgradeCost[lv];
  }
  function upgradeWeapon(save, wid) {
    const cost = upgradeCost(save, wid);
    if (cost == null || save.credits < cost) return false;
    save.credits -= cost;
    save.weapons[wid] += 1;
    return true;
  }
  function equipWeapon(save, wid) {
    if (!save.weapons[wid]) return false;
    save.weapon = wid;
    return true;
  }
  function equipModule(save, slot, mid) {
    if (slot < 0 || slot > 2) return false;
    if (mid !== null) {
      if (!save.modules.includes(mid)) return false;
      const other = save.equippedModules.indexOf(mid);
      if (other >= 0) save.equippedModules[other] = save.equippedModules[slot];
    }
    save.equippedModules[slot] = mid;
    return true;
  }

  /* ── 파티 구성 ── */
  function partyFor(save, chapterId) {
    const f = save.flags || {};
    const liaAway = chapterId >= 8 && chapterId <= 9 && f.liaTrusted === false;
    return { lia: !liaAway, zero: chapterId >= 8 && f.zeroSpared === true };
  }

  /* ── 랭크 ── */
  function rankScore(result, chapterId) {
    const par = parTime(chapterId);
    let score = 100;
    score -= Math.max(0, (result.time - par) / par) * 60;
    score -= (result.damageTaken / Math.max(1, result.maxHp)) * 22;
    score += Math.min(15, result.zeroFrames * 2 + result.breaks * 3);
    return Math.round(Math.max(0, Math.min(120, score)));
  }
  function rankFromScore(score) {
    if (score >= 90) return 'S';
    if (score >= 75) return 'A';
    if (score >= 55) return 'B';
    if (score >= 35) return 'C';
    return 'D';
  }

  function checkChallenge(ch, result) {
    const c = ch.challenge;
    if (!c) return false;
    const v = c.stat === 'rankScore' ? result.score : result[c.stat] || 0;
    if (c.op === '>=') return v >= c.value;
    if (c.op === '<=') return v <= c.value;
    return false;
  }

  /** 보스 기록 저장 → { rank, score, newBest, place } */
  function recordBoss(save, bossId, chapterId, result) {
    const score = rankScore(result, chapterId);
    const rank = rankFromScore(score);
    const cx = save.codex[bossId] || (save.codex[bossId] = { seen: true, defeated: false, clears: 0, best: null });
    cx.seen = true;
    cx.defeated = true;
    cx.clears += 1;
    const newBest = cx.best == null || result.time < cx.best;
    if (newBest) cx.best = result.time;
    const list = save.records[bossId] || (save.records[bossId] = []);
    const entry = { time: Math.round(result.time * 100) / 100, rank, score, diff: save.difficulty, date: Date.now() };
    list.push(entry);
    list.sort((a, b) => a.time - b.time);
    if (list.length > 5) list.length = 5;
    const place = list.indexOf(entry) + 1;
    return { rank, score, newBest, place: place || null };
  }

  /** 챕터 첫 클리어 보상 지급 → 화면에 보여 줄 문자열 목록 */
  function grantChapterRewards(save, chapterId) {
    const D = AZ.data;
    const ch = D.chapters[chapterId - 1];
    const out = [];
    const first = !save.cleared[chapterId];
    save.cleared[chapterId] = true;
    save.unlockedChapter = Math.max(save.unlockedChapter, Math.min(10, chapterId + 1));
    if (!first) return out;
    save.sp += 1;
    out.push('스킬 포인트 +1 (첫 클리어)');
    const r = ch.reward || {};
    if (r.weapon && !save.weapons[r.weapon]) {
      save.weapons[r.weapon] = 1;
      out.push(`새 무기: ${D.weapons[r.weapon].name}`);
    }
    const mods = (r.modules || []).slice();
    if (r.choiceModule) {
      const flag = save.flags[r.choiceModule.flag];
      let pick = flag ? r.choiceModule.yes : r.choiceModule.no;
      if (save.modules.includes(pick)) pick = flag ? r.choiceModule.no : r.choiceModule.yes;
      mods.push(pick);
    }
    for (const m of mods) {
      if (m && !save.modules.includes(m)) {
        save.modules.push(m);
        const empty = save.equippedModules.indexOf(null);
        if (empty >= 0) save.equippedModules[empty] = m;
        out.push(`전술 모듈: ${D.modules[m].name}`);
      }
    }
    return out;
  }

  function addMemory(save, id) {
    if (!id || save.memories.includes(id)) return false;
    save.memories.push(id);
    return true;
  }

  /** 챕터 경험치/크레딧 (보스) */
  const bossExp = (c) => 400 + 180 * c;
  const bossCredits = (c) => 300 + 120 * c;

  return {
    MAX_LEVEL, refLevel, refHp, refAtk, refDmg, refTime, bossHp, parTime, expToNext, addExp,
    computeStats, nodeInfo, canLearn, learn, equipSkill, upgradeCost, upgradeWeapon, equipWeapon,
    equipModule, partyFor, rankScore, rankFromScore, checkChallenge, recordBoss, grantChapterRewards,
    addMemory, bossExp, bossCredits,
  };
})();
