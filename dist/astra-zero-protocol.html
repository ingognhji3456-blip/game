  <script>/* js/ui/input.js */
'use strict';

/* =========================================================
 * 입력 — 키보드, 마우스, 터치(가상 스틱 + HUD 버튼), 게임패드
 * frame() 이 전투용 입력 객체를 돌려주고 "이번 프레임에 눌림"을 비웁니다.
 * ========================================================= */
window.AZ = window.AZ || {};

AZ.input = (() => {
  const held = new Set();
  const pressed = new Set();
  let toLogical = (x, y) => ({ x, y });
  let canvas = null;
  let touchMode = false;
  let onTouchModeChange = null;
  let listeners = [];
  let stick = null; // { id, ox, oy, dx, dy }
  const touchButtons = new Map(); // pointerId → button id
  const pressedButtons = new Set();
  const heldButtons = new Set();
  let padPrev = [];
  let lastPadUse = 0;

  const KEYMAP = {
    KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
    KeyJ: 'attack', KeyK: 'heavy', Space: 'dodge', ShiftLeft: 'dodge', ShiftRight: 'dodge',
    KeyU: 'skill0', KeyI: 'skill1', KeyO: 'skill2', Digit1: 'skill0', Digit2: 'skill1', Digit3: 'skill2',
    KeyL: 'ult', Digit4: 'ult', KeyF: 'chain', KeyZ: 'cmd0', KeyX: 'cmd1', KeyC: 'cmd2',
    Escape: 'pause', KeyP: 'pause', Enter: 'confirm', NumpadEnter: 'confirm', Backspace: 'back',
  };
  const keyLabels = { skills: ['U', 'I', 'O'], ult: 'L', chain: 'F', cmds: ['Z', 'X', 'C'] };

  function setTouch(v) {
    if (touchMode === v) return;
    touchMode = v;
    if (onTouchModeChange) onTouchModeChange(v);
  }

  function on(target, type, fn, opts) {
    target.addEventListener(type, fn, opts);
    listeners.push(() => target.removeEventListener(type, fn, opts));
  }

  function init(opts) {
    canvas = opts.canvas;
    toLogical = opts.toLogical || toLogical;
    onTouchModeChange = opts.onTouchModeChange || null;
    on(window, 'keydown', (e) => {
      const a = KEYMAP[e.code];
      if (!a) return;
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      // 대화 중에는 포커스된 버튼이 Space/Enter 로 눌리지 않게
      if (AZ.ui.dialogue && AZ.ui.dialogue.active && (a === 'dodge' || a === 'confirm')) e.preventDefault();
      if (!e.repeat) pressed.add(a);
      held.add(a);
      if (opts.forced !== true && touchMode && AZ.game && AZ.game.settings && AZ.game.settings.touch === 'auto') setTouch(false);
      if (a === 'dodge' || a.startsWith('up') || a === 'down' || a === 'left' || a === 'right') {
        if (AZ.game && AZ.game.inBattle && AZ.game.inBattle()) e.preventDefault();
      }
      if (AZ.game && AZ.game.onKey) AZ.game.onKey(a, e);
    });
    on(window, 'keyup', (e) => {
      const a = KEYMAP[e.code];
      if (a) held.delete(a);
    });
    on(window, 'blur', () => { held.clear(); heldButtons.clear(); stick = null; });

    on(canvas, 'contextmenu', (e) => e.preventDefault());
    on(canvas, 'pointerdown', (e) => {
      const pt = toLogical(e.clientX, e.clientY);
      if (e.pointerType === 'touch' || e.pointerType === 'pen') {
        if (AZ.game && AZ.game.settings && AZ.game.settings.touch !== 'off') setTouch(true);
      }
      const btn = hitButton(pt.x, pt.y);
      if (btn) {
        pressedButtons.add(btn);
        heldButtons.add(btn);
        touchButtons.set(e.pointerId, btn);
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
        e.preventDefault();
        return;
      }
      if (touchMode && pt.x < 1280 * 0.5) {
        stick = { id: e.pointerId, ox: pt.x, oy: pt.y, dx: 0, dy: 0 };
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
        e.preventDefault();
        return;
      }
      if (!touchMode && e.pointerType === 'mouse') {
        if (e.button === 0) { pressed.add('attack'); held.add('mouseAttack'); }
        if (e.button === 2) pressed.add('heavy');
        e.preventDefault();
      } else if (touchMode) {
        pressed.add('attack');
      }
    });
    on(canvas, 'pointermove', (e) => {
      if (stick && e.pointerId === stick.id) {
        const pt = toLogical(e.clientX, e.clientY);
        let dx = (pt.x - stick.ox) / 64;
        let dy = (pt.y - stick.oy) / 64;
        const m = Math.hypot(dx, dy);
        if (m > 1) { dx /= m; dy /= m; }
        stick.dx = dx;
        stick.dy = dy;
      }
    });
    const up = (e) => {
      if (stick && e.pointerId === stick.id) stick = null;
      const b = touchButtons.get(e.pointerId);
      if (b) { heldButtons.delete(b); touchButtons.delete(e.pointerId); }
      if (e.pointerType === 'mouse') held.delete('mouseAttack');
    };
    on(canvas, 'pointerup', up);
    on(canvas, 'pointercancel', up);
    on(window, 'gamepadconnected', () => { lastPadUse = Date.now(); });
  }

  function hitButton(x, y) {
    const list = (AZ.gfx.render && AZ.gfx.render.buttons) || [];
    if (!AZ.game || !AZ.game.inBattle || !AZ.game.inBattle()) return null;
    for (const b of list) {
      if ((x - b.x) * (x - b.x) + (y - b.y) * (y - b.y) <= b.r * b.r) return b.id;
    }
    return null;
  }

  /* 게임패드: 표준 배치 */
  function pollPad(out) {
    if (typeof navigator === 'undefined' || !navigator.getGamepads) return;
    const pads = navigator.getGamepads();
    const pad = pads && Array.from(pads).find((p) => p && p.connected);
    if (!pad) return;
    const b = pad.buttons.map((x) => x && x.pressed);
    const edge = (i) => b[i] && !padPrev[i];
    const ax = pad.axes[0] || 0;
    const ay = pad.axes[1] || 0;
    if (Math.hypot(ax, ay) > 0.25) { out.mx = ax; out.my = ay; lastPadUse = Date.now(); }
    if (b[12]) out.my = -1;
    if (b[13]) out.my = 1;
    if (b[14]) out.mx = -1;
    if (b[15]) out.mx = 1;
    if (edge(2)) out.attack = true;        // X / □
    if (edge(3)) out.heavy = true;         // Y / △
    if (edge(0)) out.dodge = true;         // A / ✕
    if (edge(1)) out.chain = true;         // B / ○
    if (edge(4)) out.skills[0] = true;     // LB
    if (edge(5)) out.skills[1] = true;     // RB
    if (edge(6)) out.skills[2] = true;     // LT
    if (edge(7)) out.ult = true;           // RT
    if (edge(10)) out.cmds[0] = true;      // L3
    if (edge(11)) out.cmds[1] = true;      // R3
    if (edge(8)) out.cmds[2] = true;       // Back/Select
    if (edge(9) && AZ.game && AZ.game.onKey) AZ.game.onKey('pause', null);
    if (b.some(Boolean)) lastPadUse = Date.now();
    padPrev = b;
  }

  /** 전투용 입력 */
  function frame() {
    const out = {
      mx: 0, my: 0,
      attack: pressed.has('attack') || pressedButtons.has('attack'),
      heavy: pressed.has('heavy') || pressedButtons.has('heavy'),
      dodge: pressed.has('dodge') || pressedButtons.has('dodge'),
      skills: [0, 1, 2].map((i) => pressed.has('skill' + i) || pressedButtons.has('skill' + i)),
      ult: pressed.has('ult') || pressedButtons.has('ult'),
      chain: pressed.has('chain') || pressedButtons.has('chain'),
      cmds: [0, 1, 2].map((i) => pressed.has('cmd' + i) || pressedButtons.has('cmd' + i)),
      aim: null,
      stick: touchMode ? stick : null,
      keyLabels,
    };
    if (held.has('left')) out.mx -= 1;
    if (held.has('right')) out.mx += 1;
    if (held.has('up')) out.my -= 1;
    if (held.has('down')) out.my += 1;
    if (stick) { out.mx = stick.dx; out.my = stick.dy; }
    const m = Math.hypot(out.mx, out.my);
    if (m > 1) { out.mx /= m; out.my /= m; }
    // 계속 누르고 있으면 연타 (공격 버튼/마우스/J)
    if ((held.has('attack') || held.has('mouseAttack') || heldButtons.has('attack')) && !out.attack) {
      out.attackHeld = true;
    }
    pollPad(out);
    if (pressedButtons.has('pause') && AZ.game && AZ.game.onKey) AZ.game.onKey('pause', null);
    pressed.clear();
    pressedButtons.clear();
    return out;
  }

  function clear() {
    pressed.clear();
    pressedButtons.clear();
    held.clear();
    heldButtons.clear();
    stick = null;
  }

  return {
    init, frame, clear, keyLabels,
    setTouch,
    get touchMode() { return touchMode; },
    get padActive() { return Date.now() - lastPadUse < 15000; },
    isHeld: (a) => held.has(a),
  };
})();

</script>
  <script>/* js/ui/dialogue.js */
'use strict';

/* =========================================================
 * 대화 — 초상화, 타자기 효과, 선택지, 플래그 분기, 건너뛰기/자동/기록
 *   AZ.ui.dialogue.play(lines, { flags, theme }) → Promise (끝나면 resolve)
 * ========================================================= */
window.AZ = window.AZ || {};
AZ.ui = AZ.ui || {};

AZ.ui.dialogue = (() => {
  const U = AZ.util;
  const NAMES = { kai: '카이온', lia: '리아', zero: '제로', astra: 'ASTRA', sera: '세라', protocol: '프로토콜', system: 'SYSTEM', narr: '' };
  const PORTRAIT = { kai: 'kai', lia: 'lia', zero: 'zero', astra: 'astra', sera: 'boss_sera', protocol: 'boss_protocol' };
  const ACCENT = { kai: '#7cc8ff', lia: '#7ce8ff', zero: '#ff4d6d', astra: '#e8f0ff', sera: '#e2b8ff', protocol: '#ffe9a8', system: '#ff8a9a', npc: '#ffd6a0' };

  let root = null;
  let els = {};
  let state = null;

  function h(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function build(parent) {
    root = h('div', 'dlg hidden');
    root.innerHTML = `
      <canvas class="dlg-bg" width="1280" height="720"></canvas>
      <div class="dlg-shade"></div>
      <img class="dlg-portrait left" alt="">
      <img class="dlg-portrait right" alt="">
      <div class="dlg-flash"></div>
      <div class="dlg-box">
        <div class="dlg-name"></div>
        <div class="dlg-text"></div>
        <div class="dlg-next">▼</div>
      </div>
      <div class="dlg-choices"></div>
      <div class="dlg-ctrl">
        <button type="button" data-a="log">기록</button>
        <button type="button" data-a="auto">자동</button>
        <button type="button" data-a="skip">건너뛰기 ▶▶</button>
      </div>
      <div class="dlg-log hidden"><div class="dlg-log-inner"></div><button type="button" class="btn" data-a="closelog">닫기</button></div>`;
    parent.appendChild(root);
    els = {
      bg: root.querySelector('.dlg-bg'),
      left: root.querySelector('.dlg-portrait.left'),
      right: root.querySelector('.dlg-portrait.right'),
      box: root.querySelector('.dlg-box'),
      name: root.querySelector('.dlg-name'),
      text: root.querySelector('.dlg-text'),
      next: root.querySelector('.dlg-next'),
      choices: root.querySelector('.dlg-choices'),
      flash: root.querySelector('.dlg-flash'),
      log: root.querySelector('.dlg-log'),
      logInner: root.querySelector('.dlg-log-inner'),
      autoBtn: root.querySelector('[data-a="auto"]'),
    };
    root.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]');
      if (a) {
        e.stopPropagation();
        if (a.blur) a.blur();
        const act = a.dataset.a;
        if (act === 'skip') skip();
        if (act === 'auto') toggleAuto();
        if (act === 'log') openLog();
        if (act === 'closelog') els.log.classList.add('hidden');
        return;
      }
      if (e.target.closest('.dlg-choices') || e.target.closest('.dlg-log')) return;
      advance();
    });
  }

  /* ── 배경 ── */
  const BG_THEME = { ruins: 'ruins', city: 'city', lab: 'lab', highway: 'highway', sky: 'sky', archive: 'archive', skyport: 'skyport', warfront: 'warfront', core: 'core', void: 'void' };
  function drawBg(id) {
    const g = els.bg.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    if (id === 'black') {
      g.fillStyle = '#000';
      g.fillRect(0, 0, 1280, 720);
      return;
    }
    if (id === 'dawn') {
      const grd = g.createLinearGradient(0, 0, 0, 720);
      grd.addColorStop(0, '#1b2a5a');
      grd.addColorStop(0.45, '#c86a6a');
      grd.addColorStop(0.7, '#ffc58a');
      grd.addColorStop(1, '#2a2440');
      g.fillStyle = grd;
      g.fillRect(0, 0, 1280, 720);
      const sun = g.createRadialGradient(640, 470, 10, 640, 470, 360);
      sun.addColorStop(0, 'rgba(255,240,200,0.95)');
      sun.addColorStop(1, 'rgba(255,200,140,0)');
      g.fillStyle = sun;
      g.fillRect(0, 0, 1280, 720);
      g.fillStyle = '#1a1830';
      let x = 0;
      let s = 7;
      while (x < 1280) {
        s = (s * 9301 + 49297) % 233280;
        const w = 30 + (s % 70);
        const hh = 60 + (s % 180);
        g.fillRect(x, 520 - hh, w, hh + 200);
        x += w + 4;
      }
      return;
    }
    const sky = AZ.gfx.render.getSky(BG_THEME[id] || 'ruins');
    if (sky) g.drawImage(sky, -(sky.width - 1280) / 2, 0);
    // 땅
    const T = AZ.gfx.render.THEMES[BG_THEME[id] || 'ruins'];
    const grd = g.createLinearGradient(0, 446, 0, 720);
    grd.addColorStop(0, T.floor[0]);
    grd.addColorStop(1, '#020308');
    g.fillStyle = grd;
    g.fillRect(0, 446, 1280, 274);
  }

  /* ── 진행 ── */
  function setPortrait(who) {
    const key = PORTRAIT[who];
    if (!key) {
      els.left.classList.add('dim');
      els.right.classList.add('dim');
      return;
    }
    const side = who === 'kai' ? els.left : els.right;
    const other = side === els.left ? els.right : els.left;
    const src = AZ.data.assets[key];
    if (side.dataset.key !== key) {
      side.dataset.key = key;
      side.src = src;
      side.classList.remove('show');
      void side.offsetWidth;
    }
    side.classList.add('show');
    side.classList.remove('dim');
    side.classList.toggle('small', key.startsWith('boss_'));
    other.classList.add('dim');
  }

  function showLine(line) {
    const who = line.who || 'narr';
    if (line.bg) drawBg(line.bg);
    if (line.fx) doFx(line.fx);
    setPortrait(who);
    const name = who === 'npc' ? (line.name || '???') : NAMES[who] != null ? NAMES[who] : who;
    els.name.textContent = name;
    els.name.style.color = ACCENT[who] || '#e8f4ff';
    els.name.classList.toggle('hidden', !name);
    els.box.className = 'dlg-box' + (who === 'narr' ? ' narr' : '') + (who === 'system' ? ' system' : '');
    state.full = line.text;
    state.shown = 0;
    state.typing = true;
    state.lineT = 0;
    els.text.textContent = '';
    els.next.classList.remove('show');
    state.log.push({ name, text: line.text, who });
  }

  function doFx(fx) {
    if (fx === 'shake') {
      root.classList.remove('shake');
      void root.offsetWidth;
      root.classList.add('shake');
      if (AZ.audio) AZ.audio.sfx('explosion', { vol: 0.5 });
    } else if (fx === 'flash') {
      els.flash.classList.remove('go');
      void els.flash.offsetWidth;
      els.flash.classList.add('go');
      if (AZ.audio) AZ.audio.sfx('perfect', { vol: 0.4 });
    } else if (fx === 'glitch') {
      root.classList.remove('glitch');
      void root.offsetWidth;
      root.classList.add('glitch');
      if (AZ.audio) AZ.audio.sfx('glitch', { vol: 0.5 });
    } else if (fx === 'fadeIn') {
      root.classList.remove('fadein');
      void root.offsetWidth;
      root.classList.add('fadein');
    }
  }

  /** 다음에 보여 줄 대사 한 줄을 스택에서 꺼냄 (if/choice 처리) */
  function nextLine() {
    while (state.stack.length) {
      const top = state.stack[state.stack.length - 1];
      if (top.i >= top.lines.length) {
        state.stack.pop();
        continue;
      }
      const line = top.lines[top.i++];
      if (!line) continue;
      if (line.if) {
        const v = !!state.flags[line.if];
        const branch = v ? line.then : line.else;
        if (branch && branch.length) state.stack.push({ lines: branch, i: 0 });
        continue;
      }
      if (line.choice) return { choice: line };
      if (line.text != null) return { line };
    }
    return null;
  }

  function step() {
    const n = nextLine();
    if (!n) return finish();
    if (n.choice) return showChoice(n.choice);
    showLine(n.line);
    if (state.skipping) completeTyping();
  }

  function showChoice(c) {
    state.skipping = false;
    state.choosing = true;
    state.typing = false;
    const lastLine = state.log.slice().reverse().find((l) => l.who !== 'choice');
    if (lastLine) {
      els.name.textContent = lastLine.name || '';
      els.name.classList.toggle('hidden', !lastLine.name);
      els.text.textContent = lastLine.text;
    }
    els.choices.innerHTML = '';
    els.next.classList.remove('show');
    c.options.forEach((opt, idx) => {
      const b = h('button', 'dlg-choice');
      b.type = 'button';
      b.innerHTML = `<span class="num">${idx + 1}</span>${escapeHtml(opt.text)}`;
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        pick(c, opt);
      });
      els.choices.appendChild(b);
    });
    els.choices.classList.add('show');
    if (AZ.audio) AZ.audio.sfx('ui');
  }

  function pick(c, opt) {
    if (!state || !state.choosing) return;
    state.choosing = false;
    els.choices.classList.remove('show');
    els.choices.innerHTML = '';
    state.flags[c.choice] = opt.value;
    if (state.onFlag) state.onFlag(c.choice, opt.value);
    state.log.push({ name: '▶ 선택', text: opt.text, who: 'choice' });
    if (AZ.audio) AZ.audio.sfx('uiConfirm');
    if (opt.lines && opt.lines.length) state.stack.push({ lines: opt.lines, i: 0 });
    step();
  }

  function completeTyping() {
    state.shown = state.full.length;
    els.text.textContent = state.full;
    state.typing = false;
    els.next.classList.add('show');
    state.lineT = 0;
  }

  function advance() {
    if (!state || state.choosing) return;
    if (state.typing) {
      completeTyping();
      return;
    }
    if (AZ.audio) AZ.audio.sfx('ui', { vol: 0.3 });
    step();
  }

  function skip() {
    if (!state) return;
    state.skipping = true;
    if (state.choosing) return;
    // 선택지나 끝까지 빠르게
    let guard = 0;
    while (state && !state.choosing && guard++ < 2000) {
      const n = nextLine();
      if (!n) { finish(); return; }
      if (n.choice) { showChoice(n.choice); return; }
      if (n.line.bg) drawBg(n.line.bg);
      state.log.push({ name: n.line.who === 'npc' ? n.line.name : NAMES[n.line.who] || '', text: n.line.text, who: n.line.who });
    }
  }

  function toggleAuto() {
    if (!state) return;
    state.auto = !state.auto;
    els.autoBtn.classList.toggle('on', state.auto);
  }

  function openLog() {
    if (!state) return;
    els.logInner.innerHTML = state.log.map((l) =>
      `<div class="log-row ${l.who === 'choice' ? 'choice' : ''}"><b style="color:${ACCENT[l.who] || '#9ab8ff'}">${escapeHtml(l.name || '')}</b><span>${escapeHtml(l.text)}</span></div>`).join('');
    els.log.classList.remove('hidden');
    els.logInner.scrollTop = els.logInner.scrollHeight;
  }

  function finish() {
    const s = state;
    state = null;
    root.classList.add('hidden');
    els.left.classList.remove('show');
    els.right.classList.remove('show');
    els.left.dataset.key = '';
    els.right.dataset.key = '';
    if (s && s.resolve) s.resolve();
  }

  /** 프레임마다 (타자기) */
  function update(dt) {
    if (!state || state.choosing) return;
    if (state.typing) {
      const speed = 42 * (AZ.game && AZ.game.settings ? AZ.game.settings.textSpeed || 1 : 1);
      const fast = AZ.input && AZ.input.isHeld && AZ.input.isHeld('confirm');
      const before = Math.floor(state.shown);
      state.shown += dt * speed * (fast ? 4 : 1);
      const n = Math.min(state.full.length, Math.floor(state.shown));
      if (n !== before) {
        els.text.textContent = state.full.slice(0, n);
        if (n % 3 === 0 && AZ.audio) AZ.audio.sfx('text', { vol: 0.25 });
      }
      if (n >= state.full.length) completeTyping();
    } else {
      state.lineT += dt;
      if (state.auto && state.lineT > 1.2 + state.full.length * 0.045) step();
    }
  }

  function play(lines, opts) {
    const o = opts || {};
    if (!root) build(o.parent || document.getElementById('stage'));
    return new Promise((resolve) => {
      if (!lines || !lines.length) { resolve(); return; }
      state = {
        stack: [{ lines, i: 0 }], flags: o.flags || {}, onFlag: o.onFlag || null, resolve,
        full: '', shown: 0, typing: false, choosing: false, skipping: false, auto: state ? state.auto : false, log: [], lineT: 0,
      };
      els.autoBtn.classList.toggle('on', state.auto);
      els.choices.innerHTML = '';
      els.choices.classList.remove('show');
      els.log.classList.add('hidden');
      drawBg(o.bg || 'ruins');
      root.classList.remove('hidden');
      step();
    });
  }

  function onKey(a) {
    if (!state) return false;
    if (state.choosing) {
      return false;
    }
    if (a === 'confirm' || a === 'attack' || a === 'dodge' || a === 'cmd0') { advance(); return true; }
    return false;
  }

  /** 숫자 키로 선택 */
  function onDigit(n) {
    if (!state || !state.choosing) return false;
    const btn = els.choices.children[n - 1];
    if (btn) btn.click();
    return true;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  return { play, update, onKey, onDigit, get active() { return !!state; }, escapeHtml, NAMES, PORTRAIT, ACCENT };
})();

</script>
  <script>/* js/ui/screens.js */
'use strict';

/* =========================================================
 * 화면(DOM) — 타이틀, 난이도, 작전 터미널, 장비, 스킬 트리, 보스 도감, 기억 기록,
 * 전투 기록, 설정, 결과, 실패, 엔딩/크레딧, 일시정지, 챕터 카드, 보스 등장 연출
 * ========================================================= */
window.AZ = window.AZ || {};
AZ.ui = AZ.ui || {};

AZ.ui.screens = (() => {
  const U = AZ.util;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const G = () => AZ.game;
  const D = () => AZ.data;
  const P = () => AZ.progress;
  const sfx = (n, o) => { if (AZ.audio) AZ.audio.sfx(n, o); };

  let host = null;
  let current = null;
  let screenEl = null;
  const iconCache = {};

  function init(stage) {
    host = document.createElement('div');
    host.className = 'screens';
    stage.appendChild(host);
    screenEl = document.createElement('div');
    screenEl.className = 'screen hidden';
    host.appendChild(screenEl);
    host.addEventListener('click', onClick);
    host.addEventListener('input', onInput);
    host.addEventListener('change', onInput);
    host.addEventListener('mouseover', (e) => {
      const b = e.target.closest('button:not([disabled]), .hov');
      if (b && b !== host._lastHover) { host._lastHover = b; sfx('ui', { vol: 0.15, pitch: 1.4 }); }
    });
  }

  /** 스킬 아이콘 → data URL */
  function iconURL(icon, color, size) {
    const key = icon + (color || '') + (size || 48);
    if (iconCache[key]) return iconCache[key];
    const s = size || 48;
    const c = document.createElement('canvas');
    c.width = s * 2;
    c.height = s * 2;
    const g = c.getContext('2d');
    g.scale(2, 2);
    AZ.gfx.render.drawIcon(g, icon, s / 2, s / 2, s * 0.62, color || '#e8f4ff');
    iconCache[key] = c.toDataURL();
    return iconCache[key];
  }

  function show(name, html, cls) {
    current = name;
    screenEl.className = `screen scr-${name} ${cls || ''}`;
    screenEl.innerHTML = html;
    screenEl.scrollTop = 0;
    host.classList.remove('hidden');
  }
  function hide() {
    current = null;
    screenEl.className = 'screen hidden';
    screenEl.innerHTML = '';
  }

  /* ───────── 공용 조각 ───────── */
  const topbar = (title, sub) => `
    <div class="topbar">
      <button class="btn ghost back" data-act="hub">◀ 작전 터미널</button>
      <div class="tb-title"><b>${esc(title)}</b><span>${esc(sub || '')}</span></div>
      <div class="tb-res">${resBadge()}</div>
    </div>`;
  function resBadge() {
    const s = G().save;
    if (!s) return '';
    return `<span class="res">Lv.<b>${s.level}</b></span><span class="res sp">SP <b>${s.sp}</b></span><span class="res cr">◈ <b>${s.credits.toLocaleString()}</b></span>`;
  }

  /* ───────── 타이틀 ───────── */
  function title() {
    const has = AZ.save.hasSave();
    show('title', `
      <div class="title-art" style="background-image:url(${D().assets.keyart})"></div>
      <div class="title-fade"></div>
      <div class="title-logo">
        <div class="logo-main">ASTRA</div>
        <div class="logo-sub">: ZERO PROTOCOL</div>
        <div class="logo-kr">아스트라 : 제로 프로토콜</div>
        <div class="logo-tag">모든 것이, 다시 시작되는 곳…</div>
      </div>
      <div class="title-menu">
        ${has ? '<button class="btn primary big" data-act="continue">이어하기</button>' : ''}
        <button class="btn ${has ? '' : 'primary'} big" data-act="newgame">새 게임</button>
        <button class="btn big" data-act="settings-title">설정</button>
        <button class="btn big ghost" data-act="howto">조작법</button>
      </div>
      <div class="title-foot">“이 세계의 진실, 그리고… 우리의 기억은?”<br><span>원작 기획: ASTRA : ZERO PROTOCOL 게임 기획 요약 · 모든 연출과 음악은 브라우저에서 실시간으로 그려지고 합성됩니다</span></div>`);
  }

  function howto(back) {
    show('howto', `
      <div class="panel howto">
        <h2>조작법</h2>
        <div class="howto-grid">
          <div><h3>키보드 · 마우스</h3>
            <table>
              <tr><td>이동</td><td><kbd>W A S D</kbd> / 방향키</td></tr>
              <tr><td>공격 (누르고 있으면 연속)</td><td><kbd>J</kbd> / 마우스 왼쪽</td></tr>
              <tr><td>강공격</td><td><kbd>K</kbd> / 마우스 오른쪽</td></tr>
              <tr><td>회피</td><td><kbd>Space</kbd> / <kbd>Shift</kbd></td></tr>
              <tr><td>스킬 1·2·3</td><td><kbd>U</kbd> <kbd>I</kbd> <kbd>O</kbd> (또는 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>)</td></tr>
              <tr><td>궁극기</td><td><kbd>L</kbd> (또는 <kbd>4</kbd>)</td></tr>
              <tr><td>연계 공격</td><td><kbd>F</kbd></td></tr>
              <tr><td>전술 명령 분석·엄호·집중</td><td><kbd>Z</kbd> <kbd>X</kbd> <kbd>C</kbd></td></tr>
              <tr><td>일시정지</td><td><kbd>Esc</kbd> / <kbd>P</kbd></td></tr>
              <tr><td>대화 넘기기</td><td><kbd>Enter</kbd> / <kbd>Space</kbd> / 클릭</td></tr>
            </table>
          </div>
          <div><h3>게임패드 · 터치</h3>
            <table>
              <tr><td>게임패드</td><td>왼쪽 스틱 이동 · <b>X</b> 공격 · <b>Y</b> 강공격 · <b>A</b> 회피 · <b>B</b> 연계 · <b>LB/RB/LT</b> 스킬 · <b>RT</b> 궁극기 · <b>L3/R3/Select</b> 전술 명령</td></tr>
              <tr><td>터치</td><td>화면 왼쪽을 끌어 이동, 오른쪽 버튼으로 공격·회피·스킬. 가로 화면을 권장합니다.</td></tr>
            </table>
            <h3>전투의 핵심</h3>
            <ul>
              <li><b>ZERO FRAME</b> — 공격이 닿기 직전에 회피하면 발동. 적의 시간이 느려지고 모든 공격이 약점 공격이 됩니다. 직후 공격하면 <b>반격</b>.</li>
              <li><b>브레이크</b> — 강공격·스킬·약점 공격으로 보스의 노란 게이지를 깎으면 6초간 무방비. 이때 <b>연계 공격</b>이 공짜!</li>
              <li><b>약점</b> — 보스 발밑의 하늘색 호(등 뒤)나 "WEAK" 표시를 노리세요. <b>분석</b> 명령이 약점과 공격 방향을 보여 줍니다.</li>
              <li>붉은 경고 지역은 곧 공격이 떨어지는 곳. 흰색으로 바뀌면 직전입니다.</li>
            </ul>
          </div>
        </div>
        <div class="row center"><button class="btn primary" data-act="${back || 'title'}">돌아가기</button></div>
      </div>`);
  }

  /* ───────── 새 게임: 난이도 ───────── */
  function newGame() {
    const diffs = D().difficulties;
    show('newgame', `
      <div class="panel narrow">
        <h2>새 게임 — 난이도 선택</h2>

  /* ───────── 작전 터미널 ───────── */
  let hubSel = null;
  function hub(selChapter) {
    const s = G().save;
    const st = P().computeStats(s);
    const chs = D().chapters;
    if (selChapter != null) hubSel = selChapter;
    if (hubSel == null || hubSel > s.unlockedChapter) hubSel = Math.min(s.unlockedChapter, 10);
    const story = D().story || {};
    const line = pickHubLine(s);
    const expNeed = P().expToNext(s.level);
    const ch = chs[hubSel - 1];
    const boss = D().bosses[ch.boss];
    const cx = s.codex[ch.boss];
    const best = s.chapterBest[ch.id];
    const rec = (s.records[ch.boss] || [])[0];
    const memIds = (story.memories || []).filter((m) => m.chapter === ch.id).map((m) => m.id);
    const memGot = memIds.filter((id) => s.memories.includes(id)).length;
    const party = P().partyFor(s, ch.id);
    const rw = [];
    if (!s.cleared[ch.id]) {
      if (ch.reward.weapon) rw.push(`무기 「${D().weapons[ch.reward.weapon].name}」`);
      for (const m of ch.reward.modules || []) rw.push(`모듈 「${D().modules[m].name}」`);
      if (ch.reward.choiceModule) rw.push('선택에 따른 모듈 1개');
      rw.push('SP +1');
    }
    show('hub', `
      <div class="hub-bg" style="background-image:url(${D().assets.keyart})"></div>
      <div class="hub">
        <div class="hub-left panel">
          <div class="hub-kai">
            <img src="${D().assets.kai}" alt="">
            <div>
              <b>카이온</b><span>전직 ASTRA 관리자</span>
              <div class="lv">Lv.${s.level}<small>${s.level >= P().MAX_LEVEL ? 'MAX' : `${s.exp} / ${expNeed}`}</small></div>
              <div class="xpbar"><i style="width:${s.level >= P().MAX_LEVEL ? 100 : Math.round(s.exp / expNeed * 100)}%"></i></div>
            </div>
          </div>
          <div class="statgrid">
            <div><span>체력</span><b>${st.maxHp}</b></div>
            <div><span>공격력</span><b>${Math.round(st.atk)}</b></div>
            <div><span>치명타</span><b>${Math.round(st.crit * 100)}%</b></div>
            <div><span>무기</span><b>${esc(st.weapon.name)} +${st.weaponLevel - 1}</b></div>
            <div><span>SP</span><b class="sp">${s.sp}</b></div>
            <div><span>크레딧</span><b class="cr">◈ ${s.credits.toLocaleString()}</b></div>
          </div>
          <div class="hub-menu">
            <button class="btn" data-act="loadout">⚔ 장비 · 모듈</button>
            <button class="btn ${s.sp > 0 ? 'notify' : ''}" data-act="skills">✦ 스킬 트리${s.sp > 0 ? ` <em>SP ${s.sp}</em>` : ''}</button>
            <button class="btn" data-act="codex">◉ 보스 도감</button>
            <button class="btn" data-act="memories">❖ 기억 기록 <em>${s.memories.length}/20</em></button>
            <button class="btn" data-act="records">⏱ 전투 기록 · 랭킹</button>
            <button class="btn" data-act="settings">⚙ 설정</button>
            <button class="btn ghost" data-act="howto-hub">? 조작법</button>
            <button class="btn ghost" data-act="title">타이틀로</button>
          </div>
        </div>
        <div class="hub-center">
          <div class="hub-head"><b>작전 터미널</b><span>${esc(D().difficulties[s.difficulty].name)} · 플레이 ${U.fmtDuration(s.playTime)}${s.endings.length ? ` · 엔딩 ${s.endings.length}/3` : ''}</span></div>
          <div class="chapter-list">
            ${chs.map((c) => {
              const locked = c.id > s.unlockedChapter;
              const cleared = !!s.cleared[c.id];
              const r = (s.records[c.boss] || [])[0];
              return `<button class="ch-item ${locked ? 'locked' : ''} ${cleared ? 'cleared' : ''} ${c.id === hubSel ? 'sel' : ''}" ${locked ? 'disabled' : ''} data-act="sel-ch" data-ch="${c.id}">
                <span class="ch-no">${String(c.id).padStart(2, '0')}</span>
                <span class="ch-name">${locked ? '???' : esc(c.name)}</span>
                ${cleared ? `<span class="ch-rank r${r ? r.rank : ''}">${r ? r.rank : '✓'}</span>` : locked ? '<span class="ch-lock">🔒</span>' : '<span class="ch-new">NEW</span>'}
              </button>`;
            }).join('')}
          </div>
        </div>
        <div class="hub-right panel">
          <div class="ch-detail">
            <div class="cd-head"><span>CHAPTER ${ch.id}</span><b>${esc(ch.name)}</b></div>
            <p class="cd-sum">${esc((story.chapterSummaries || {})[ch.id] || '')}</p>
            <div class="cd-boss">
              <img src="${D().assets['boss_' + ch.boss]}" alt="" class="${cx && cx.seen ? '' : 'unknown'}">
              <div><span>목표</span><b>${cx && cx.seen ? esc(boss.name) : '???'}</b><small>${cx && cx.seen ? esc(boss.title) : '미확인 개체'}</small></div>
            </div>
            <ul class="cd-info">
              <li><span>파티</span><b>카이온${party.lia ? ' · 리아' : ''}${party.zero ? ' · 제로' : ''}</b></li>
              <li><span>보스 최고 기록</span><b>${rec ? `${U.fmtTime(rec.time)} (${rec.rank})` : '—'}</b></li>
              <li><span>챕터 최고 기록</span><b>${best ? U.fmtTime(best) : '—'}</b></li>
              <li><span>기억 파편</span><b>${memGot} / ${memIds.length || 2}</b></li>
              <li><span>도전 과제</span><b class="${cx && s.memories.includes(memIds[1]) ? 'ok' : ''}">${esc(ch.challenge.desc)}</b></li>
              ${rw.length ? `<li><span>첫 클리어 보상</span><b>${rw.map(esc).join(', ')}</b></li>` : ''}
            </ul>
            <div class="cd-actions">
              <button class="btn primary big" data-act="sortie" data-ch="${ch.id}">출격 ▶</button>
              ${s.cleared[ch.id] ? `<button class="btn" data-act="boss-only" data-ch="${ch.id}">보스전만</button>` : ''}
            </div>
          </div>
        </div>
        <div class="hub-lia">
          ${line.who === 'system' ? '<div class="sys-badge">SYS</div>' : `<img src="${D().assets[line.who === 'zero' ? 'zero' : 'lia']}" alt="">`}
          <div><b>${line.who === 'zero' ? '제로' : line.who === 'system' ? 'SYSTEM' : '리아'}</b><p>${esc(line.text)}</p></div>
        </div>
      </div>`);
  }

  function pickHubLine(s) {
    const list = ((D().story || {}).hub || []).filter((l) => {
      if (l.minChapter > s.unlockedChapter) return false;
      if (l.flag && s.flags[l.flag] !== true) return false;
      if (l.who === 'lia' && s.unlockedChapter >= 8 && s.unlockedChapter <= 9 && s.flags.liaTrusted === false && !s.cleared[9]) return false;
      return true;
    });
    if (!list.length) return { who: 'lia', text: '준비되면 출격해요. 저는 언제나 곁에 있을게요.' };
    // 최근 챕터 대사를 더 자주
    const maxCh = Math.max(...list.map((l) => l.minChapter));
    const recent = list.filter((l) => l.minChapter >= maxCh - 1);
    return U.pick(Math.random() < 0.65 && recent.length ? recent : list);
  }

  /* ───────── 장비 ───────── */
  function loadout() {
    const s = G().save;
    const st = P().computeStats(s);
    const W = D().weapons;
    const M = D().modules;
    show('loadout', `
      ${topbar('장비 · 전술 모듈', '무기를 고르고 강화하세요. 모듈은 3개까지 장착합니다.')}
      <div class="lo">
        <div class="lo-weapons panel">
          <h3>무기</h3>
          ${D().weaponOrder.map((id) => {
            const w = W[id];
            const lv = s.weapons[id];
            const cost = P().upgradeCost(s, id);
            const eq = s.weapon === id;
            if (!lv) {
              return `<div class="wp locked"><div class="wp-sw" style="--c:#445"></div><div class="wp-info"><b>???</b><small>${w.unlockAfter}장 클리어 시 획득</small></div></div>`;
            }
            return `<div class="wp ${eq ? 'eq' : ''}">
              <div class="wp-sw" style="--c:${w.color}"></div>

                <div class="wp-stats">공격 배율 ×${(w.atk * (1 + D().weaponLevelBonus * (lv - 1))).toFixed(2)} · 치명 ${Math.round(w.crit * 100)}% · 콤보 ${w.combo.length}단</div></div>
              <div class="wp-act">
                ${eq ? '<span class="tag">장착 중</span>' : `<button class="btn small" data-act="equip-w" data-id="${id}">장착</button>`}
                ${cost != null ? `<button class="btn small ${s.credits >= cost ? 'gold' : ''}" ${s.credits >= cost ? '' : 'disabled'} data-act="up-w" data-id="${id}">강화 ◈${cost}</button>` : '<span class="tag max">MAX</span>'}
              </div>
            </div>`;
          }).join('')}
        </div>
        <div class="lo-mods panel">
          <h3>전술 모듈 <small>장착 슬롯</small></h3>
          <div class="mod-slots">
            ${[0, 1, 2].map((i) => {
              const id = s.equippedModules[i];
              const m = id && M[id];
              return `<div class="mod-slot ${m ? 'on' : ''}" ${m ? `data-act="unequip-m" data-slot="${i}" title="클릭해서 해제"` : ''}>
                ${m ? `<i style="color:${m.color}">${m.icon}</i><b>${esc(m.name)}</b><small>${esc(m.desc)}</small>` : '<span>빈 슬롯</span>'}</div>`;
            }).join('')}
          </div>
          <h3>보유 모듈 <small>${s.modules.length} / ${Object.keys(M).length}</small></h3>
          <div class="mod-grid">
            ${Object.keys(M).map((id) => {
              const m = M[id];
              const own = s.modules.includes(id);
              const eq = s.equippedModules.includes(id);
              if (!own) return '<div class="mod locked"><i>?</i><b>미획득</b></div>';
              return `<button class="mod ${eq ? 'eq' : ''}" data-act="${eq ? 'unequip-mid' : 'equip-m'}" data-id="${id}">
                <i style="color:${m.color}">${m.icon}</i><b>${esc(m.name)}</b><small>${esc(m.desc)}</small>${eq ? '<em>장착</em>' : ''}</button>`;
            }).join('')}
          </div>
        </div>
        <div class="lo-stats panel">
          <h3>전투 능력치</h3>
          <ul class="stats">
            <li><span>최대 체력</span><b>${st.maxHp}</b></li>
            <li><span>공격력</span><b>${Math.round(st.atk)}</b></li>
            <li><span>치명타율</span><b>${Math.round(st.crit * 100)}%</b></li>
            <li><span>치명타 피해</span><b>${Math.round(st.critDmg * 100)}%</b></li>
            <li><span>약점 피해</span><b>${Math.round(st.weakMul * 100)}%</b></li>
            <li><span>브레이크 피해</span><b>${Math.round(st.breakMul * 100)}%</b></li>
            <li><span>받는 피해 감소</span><b>${Math.round(st.dmgReduce * 100)}%</b></li>
            <li><span>완벽 회피 판정</span><b>${st.perfectWindow.toFixed(2)}초</b></li>
            <li><span>ZERO FRAME</span><b>${st.zeroDur.toFixed(1)}초</b></li>
            <li><span>스킬 재사용</span><b>${Math.round(st.cdMul * 100)}%</b></li>
            <li><span>집중 획득</span><b>${Math.round(st.focusMul * 100)}%</b></li>
            ${st.lifesteal ? `<li><span>흡수</span><b>${Math.round(st.lifesteal * 100)}%</b></li>` : ''}
            ${st.allyMul > 1 ? `<li><span>동료 피해</span><b>${Math.round(st.allyMul * 100)}%</b></li>` : ''}
          </ul>
        </div>
      </div>`);
  }

  /* ───────── 스킬 트리 ───────── */
  let skillSel = null;
  function skills(sel) {
    const s = G().save;
    const S = D().skills;
    if (sel !== undefined) skillSel = sel;
    const node = skillSel ? S.nodes[skillSel] : null;
    const info = skillSel ? P().nodeInfo(skillSel) : null;
    const can = skillSel ? P().canLearn(s, skillSel) : null;
    const learned = skillSel && s.learned.includes(skillSel);
    show('skills', `
      ${topbar('스킬 트리', '레벨이 오르거나 챕터를 처음 클리어하면 SP 를 얻습니다.')}
      <div class="sk">
        <div class="sk-tree panel">
          ${S.branches.map((br) => `
            <div class="sk-branch" style="--bc:${br.color}">
              <h3>${esc(br.name)}</h3>
              ${br.nodes.map((id, idx) => {
                const n = S.nodes[id];
                const has = s.learned.includes(id);
                const avail = !has && P().canLearn(s, id).ok;
                const prevOk = idx === 0 || s.learned.includes(br.nodes[idx - 1]);
                return `${idx ? `<div class="sk-link ${has ? 'on' : ''}"></div>` : ''}
                  <button class="sk-node ${has ? 'has' : ''} ${avail ? 'avail' : ''} ${prevOk ? '' : 'far'} ${skillSel === id ? 'sel' : ''} ${n.type}" data-act="sel-skill" data-id="${id}">

                    <span>${esc(n.name)}</span><small>${n.type === 'active' ? '액티브' : '패시브'} · SP ${S.tierCost[idx]}</small>
                  </button>`;
              }).join('')}
            </div>`).join('')}
        </div>
        <div class="sk-side panel">
          <h3>장착 스킬 <small>전투에서 ${['U', 'I', 'O'].join(' · ')}</small></h3>
          <div class="sk-slots">
            ${[0, 1, 2].map((i) => {
              const id = s.equippedSkills[i];
              const n = id && S.nodes[id];
              return `<div class="sk-slot ${n ? 'on' : ''}">
                <span class="key">${['U', 'I', 'O'][i]}</span>
                ${n ? `<img src="${iconURL(n.icon, '#ffffff')}" alt=""><b>${esc(n.name)}</b><small>${n.cd}초</small><button class="x" data-act="unequip-s" data-slot="${i}" title="해제">×</button>` : '<b class="muted">비어 있음</b>'}
              </div>`;
            }).join('')}
          </div>
          <div class="sk-ult"><img src="${iconURL('ult', '#ffe066')}" alt=""><div><b>${esc(S.ultimate.name)}</b><small>궁극기 (L) — ${esc(S.ultimate.desc)}</small></div></div>
          ${node ? `
            <div class="sk-detail">
              <div class="sd-head"><img src="${iconURL(node.icon, '#ffffff')}" alt=""><div><b>${esc(node.name)}</b><small>${esc(info.branch.name)} · ${node.type === 'active' ? `액티브 · 재사용 ${node.cd}초` : '패시브'}</small></div></div>
              <p>${esc(node.desc)}</p>
              ${learned
                ? (node.type === 'active'
                  ? `<div class="row">${[0, 1, 2].map((i) => `<button class="btn small ${s.equippedSkills[i] === skillSel ? 'gold' : ''}" data-act="equip-s" data-id="${skillSel}" data-slot="${i}">${['U', 'I', 'O'][i]} 슬롯에 장착</button>`).join('')}</div>`
                  : '<span class="tag">습득 완료 — 항상 적용</span>')
                : `<button class="btn primary" ${can.ok ? '' : 'disabled'} data-act="learn" data-id="${skillSel}">배우기 (SP ${info.cost})</button>${can.ok ? '' : `<p class="warn">${esc(can.why)}</p>`}`}
            </div>` : '<p class="muted">노드를 눌러 자세히 보세요.</p>'}
        </div>
      </div>`);

  /* ───────── 보스 도감 ───────── */
  let codexSel = null;
  function codex(sel) {
    const s = G().save;
    const B = D().bosses;
    if (sel !== undefined) codexSel = sel;
    const order = D().bossOrder;
    if (!codexSel) codexSel = order.find((id) => s.codex[id] && s.codex[id].seen) || order[0];
    const b = B[codexSel];
    const cx = s.codex[codexSel] || {};
    const lore = ((D().story || {}).bossLore || {})[codexSel] || '';
    const recs = s.records[codexSel] || [];
    show('codex', `
      ${topbar('보스 도감', '분석 기록 — 처치하면 공략 메모가 열립니다.')}
      <div class="cx">
        <div class="cx-grid panel">
          ${order.map((id, i) => {
            const c = s.codex[id];
            return `<button class="cx-card ${c && c.seen ? '' : 'unknown'} ${c && c.defeated ? 'done' : ''} ${codexSel === id ? 'sel' : ''}" ${c && c.seen ? '' : 'disabled'} data-act="sel-codex" data-id="${id}">
              <img src="${D().assets['boss_' + id]}" alt="">
              <span>${String(i + 1).padStart(2, '0')}. ${c && c.seen ? esc(B[id].name) : '???'}</span>
            </button>`;
          }).join('')}
        </div>
        <div class="cx-detail panel">
          ${cx.seen ? `
            <div class="cx-hero"><img src="${D().assets['boss_' + codexSel]}" alt=""><div class="scan"></div></div>
            <div class="cx-name"><b>${esc(b.name)}</b><span>${esc(b.title)}</span></div>
            <p class="cx-lore">${esc(lore)}</p>
            <h4>분석 메모</h4>
            ${cx.defeated ? `<ul class="cx-tips">${b.tips.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : '<p class="muted">처치하면 공략 메모가 해금됩니다.</p>'}
            <div class="cx-meta"><span>처치 ${cx.clears || 0}회</span><span>최고 기록 ${cx.best ? U.fmtTime(cx.best) : '—'}</span></div>
            ${recs.length ? `<table class="rank-table small"><tr><th>#</th><th>기록</th><th>랭크</th><th>난이도</th></tr>${recs.map((r, i) => `<tr><td>${i + 1}</td><td>${U.fmtTime(r.time)}</td><td class="r${r.rank}">${r.rank}</td><td>${esc((D().difficulties[r.diff] || {}).name || '')}</td></tr>`).join('')}</table>` : ''}
