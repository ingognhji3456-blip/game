<!DOCTYPE html><html><body><canvas id="c" width="64" height="64"></canvas>
<script src="../js/core/noise.js"></script>
<script src="../js/render/shaders.js"></script>
<script>
(function(){
  const gl = document.getElementById('c').getContext('webgl2');
  const lib = EC.render.NOISE;
  const fs = `#version 300 es
precision highp float; out vec4 o;
${lib}
float fbm2g(vec2 p, int oct){ float s=0.0,a=0.5; for(int i=0;i<16;i++){ if(i>=oct) break; s+=a*snoise(vec3(p.x,7.31,p.y)); p = mat2(1.6,-1.2,1.2,1.6)*p + vec2(1.7,9.2); a*=0.5;} return s; }
void main(){ vec2 f = gl_FragCoord.xy; vec3 p = vec3(f.x*0.173-3.0, f.y*0.219+1.0, (f.x-f.y)*0.091);
  float n = snoise(p); float b = fbm5(p*0.7); float c = fbm2g(p.xy*0.5, 6);
  o = vec4(n*0.5+0.5, b*0.5+0.5, c*0.5+0.5, 1.0); }`;
  const vs = `#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;
  const mk=(t,s)=>{const h=gl.createShader(t);gl.shaderSource(h,s);gl.compileShader(h);if(!gl.getShaderParameter(h,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(h);return h;};
  const p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,vs));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'a');gl.linkProgram(p);gl.useProgram(p);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.viewport(0,0,64,64);gl.drawArrays(gl.TRIANGLES,0,3);
  const px=new Uint8Array(64*64*4);gl.readPixels(0,0,64,64,gl.RGBA,gl.UNSIGNED_BYTE,px);
  let maxErr=[0,0,0];
  for(let y=0;y<64;y++)for(let x=0;x<64;x++){const fx=x+0.5,fy=y+0.5;const P=[fx*0.173-3.0,fy*0.219+1.0,(fx-fy)*0.091];
    const n=EC.noise.snoise(P[0],P[1],P[2]);const bb=EC.noise.fbm(P[0]*0.7,P[1]*0.7,P[2]*0.7,5);const cc=EC.noise.fbm2(P[0]*0.5,P[1]*0.5,6);
    const i=(y*64+x)*4;[n,bb,cc].forEach((v,k)=>{maxErr[k]=Math.max(maxErr[k],Math.abs((v*0.5+0.5)*255-px[i+k]));});}
  const dbg=[];for(const [x,y] of [[0,0],[1,0],[5,7],[20,3]]){const fx=x+0.5,fy=y+0.5;const P=[fx*0.173-3.0,fy*0.219+1.0,(fx-fy)*0.091];const i=(y*64+x)*4;dbg.push([px[i],Math.round((EC.noise.snoise(P[0],P[1],P[2])*0.5+0.5)*255)]);}
  document.title='done '+JSON.stringify(maxErr.map(v=>+v.toFixed(2)))+' '+JSON.stringify(dbg);
})();
</script></body></html>
