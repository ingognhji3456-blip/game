  const PC = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
  function note(s) { // 'c#5' → 73, 'bb' → 10(옥타브 없으면 음이름만)
    const m = /^([a-g])(#|b)?(\d)?$/.exec(s);
    if (!m) return null;
    const pc = PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return m[3] == null ? (pc + 12) % 12 : 12 * (+m[3] + 1) + pc;
  }
  const QUAL = {
    '': [0, 4, 7], m: [0, 3, 7], 7: [0, 4, 7, 10], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], sus4: [0, 5, 7], sus2: [0, 2, 7],
    add9: [0, 4, 7, 14], m9: [0, 3, 7, 10, 14], dim: [0, 3, 6], m7b5: [0, 3, 6, 10], 6: [0, 4, 7, 9],
  };
  function chord(sym) {
    const m = /^([A-G])([#b]?)([^/]*)(?:\/([A-G][#b]?))?$/.exec(sym) || [];
    const root = note((m[1] || 'C').toLowerCase() + (m[2] || ''));
    return { sym, root, iv: QUAL[m[3] || ''] || QUAL[''], bass: m[4] ? note(m[4].toLowerCase()) : root, bad: !m[1] || !QUAL[m[3] || ''] };
  }
  function voicing(ch, low, n, spread) {
    if (spread) { // 넓게: 근음, 5도, 한 옥타브 위 3도, 7도/9도
      const r = fit(ch.root, low);
      const iv = ch.iv;
      const v = [r, r + iv[2], r + iv[1] + 12, r + (iv[3] != null ? iv[3] + 12 : 24)];
      while (v.length < n) v.push(v[v.length - 4] + 24);
      return v.slice(0, n);
    }
    const pcs = ch.iv.map((i) => (ch.root + i) % 12);
    const v = [];
    for (let m = low; v.length < n; m++) if (pcs.indexOf(m % 12) >= 0) v.push(m);
    return v;
  }

  function compile(tr) {
    if (tr._c) return tr._c;
    const warn = [];
    if (tr.once) {
      const beat = 60 / tr.bpm;
      const list = tr.once.map(([b, ns, len, inst, v]) => ({ t: b * beat, ms: ns.split(' ').map(note), d: len * beat, inst, v }));
      return (tr._c = { once: true, list, warn });
    }
    const sd = 60 / tr.bpm / tr.sub;
    const spb = tr.beats * tr.sub;
    const ok = (p, id) => !p.only || p.only.indexOf(id) >= 0;
    const bars = [];
    const segs = [];
    for (const id of tr.form) {
      tr.sec[id].ch.split(/\s+/).filter(Boolean).forEach((c) => {
        const ps = c.split(',');
        const l = Math.floor(spb / ps.length);
        const b = { id, segs: ps.map((s, k) => ({ s: k * l, l: k === ps.length - 1 ? spb - k * l : l, ch: chord(s) })) };
        b.segs.forEach((sg) => { if (sg.ch.bad) warn.push('화음 ' + sg.ch.sym); segs.push({ at: bars.length * spb + sg.s, l: sg.l, ch: sg.ch, id }); });
        bars.push(b);
      });
    }
    const total = bars.length * spb;
    const ev = [];
    for (let i = 0; i < total; i++) ev.push([]);
    const push = (step, e) => ev[step % total].push(e);
    // 선율
    let off = 0;
    for (const id of tr.form) {
      const s = tr.sec[id];
      const nb = s.ch.split(/\s+/).filter(Boolean).length;
      for (const p of tr.parts) {
        const line = p.t === 'mel' && ok(p, id) && s[p.line || 'mel'];
        if (!line) continue;
        const tk = line.split(/\s+/).filter((x) => x && x !== '|');
        if (tk.length !== nb * spb) warn.push(id + '.' + (p.line || 'mel') + ' 칸 수 ' + tk.length + ' ≠ ' + nb * spb);
        tk.forEach((x, i) => {
          if (x === '-' || x === '.') return;
          let len = 1;
          while (tk[i + len] === '-') len++;
          const m = note(x);
          if (m == null || m < 12) { warn.push(id + ' 음 ' + x); return; }
          push(off * spb + i, { i: p.inst, m: [m + (p.oct || 0)], d: len * sd, v: p.v });
        });
      }
      off += nb;
    }
    // 반주
    for (const p of tr.parts) {
      if (p.t === 'pad' || p.t === 'hold') {
        for (let i = 0; i < segs.length; i++) {
          const sg = segs[i];
          if (!ok(p, sg.id)) continue;
          let l = sg.l;
          while (i + 1 < segs.length && segs[i + 1].ch.sym === sg.ch.sym && ok(p, segs[i + 1].id)) l += segs[++i].l;
          const vs = voicing(sg.ch, p.low, p.t === 'hold' ? (p.idx || 0) + 1 : p.n || (p.spread ? 4 : 3), p.spread);
          push(sg.at, { i: p.inst, m: p.t === 'hold' ? [vs[vs.length - 1]] : vs, d: l * sd, v: p.v });
        }
      } else if (p.t !== 'mel') {
        bars.forEach((b, bi) => {
          if (!ok(p, b.id)) return;
          const pat = p.pat[bi % p.pat.length];
          for (let j = 0; j < spb; j++) {
            const c = pat[j];
            if (!c || c === '.') continue;
            let n = 1;
            while (j + n < spb && (pat[j + n] || '.') === '.') n++;
            let ch = b.segs[0].ch;
            for (const sg of b.segs) if (sg.s <= j) ch = sg.ch;
            const at = bi * spb + j;
            const d = n * sd * (p.len || 1);
            if (p.t === 'drum') push(at, { dr: p.k, m: ch.root, v: p.v * (c === 'x' ? 1 : c === 'o' ? 0.6 : 0.32) });
            else if (p.t === 'bass') {
              const b0 = fit(ch.bass, p.low);
              const m = c === 'o' ? b0 + 12 : c === '5' ? fit(ch.root + 7, b0 + 1) : c === '3' ? fit(ch.root + ch.iv[1], b0 + 1) : b0;
              push(at, { i: p.inst, m: [m], d, v: p.v });
            } else if (p.t === 'chord') push(at, { i: p.inst, m: voicing(ch, p.low, p.n || 3), d, v: p.v });
            else if (p.t === 'arp') push(at, { i: p.inst, m: [voicing(ch, p.low, 6, p.spread)[+c] || p.low], d, v: p.v });
          }
        });
      }
    }
    return (tr._c = { ev, sd, total, warn });
  }

  /* ---------------- 시퀀서 ---------------- */
  function playStep(c, i, t) {
    for (const e of c.ev[i]) {
      if (e.dr) { const fn = DRUM[e.dr]; if (fn) fn(t, e.v, e.m); continue; }
      const fn = INST[e.i];
      if (fn) for (const m of e.m) fn(mtof(m), t, e.d, e.v);
    }
  }

  function makeSeq(e, name, t0) {
    const tr = TR[name];
    const c = compile(tr);
    const ctx = e.ctx;
    const bus = ctx.createGain();
    const send = ctx.createGain();
    const level = tr.vol || 1;
    bus.gain.setValueAtTime(0, ctx.currentTime);
    bus.gain.linearRampToValueAtTime(level, t0 + (c.once ? 0.02 : FADE_IN));
    send.gain.value = tr.rev || 0.25;
    bus.connect(e.mBus); bus.connect(send); send.connect(e.mRev);
    const s = { name, e, c, bus, step: 0, next: t0, once: !!c.once, end: t0 };
    if (s.once && !(e === E && muted)) {
      X = e; D = bus; END = t0;
      for (const ev of c.list) {
        const t = t0 + ev.t;
        if (DRUM[ev.inst]) DRUM[ev.inst](t, ev.v, ev.ms[0]);
        else if (INST[ev.inst]) for (const m of ev.ms) if (m != null && m >= 12) INST[ev.inst](mtof(m), t, ev.d, ev.v);
      }
      s.end = END;
    }
    return s;
  }

  function pump(s, until) {
    const c = s.c;
    const now = s.e.ctx.currentTime;
    if (s.next < now) { // 메인 스레드가 멈췄다 돌아오면 밀린 칸은 건너뜀(몰아서 울리지 않게)
      const k = Math.ceil((now - s.next) / c.sd);
      s.step += k; s.next += k * c.sd;
    }
    X = s.e; D = s.bus;
    const quiet = s.e === E && (muted || vol.master <= 0 || vol.music <= 0);
    while (s.next < until) {
      if (!quiet) playStep(c, s.step % c.total, s.next);
      s.step++; s.next += c.sd;
    }
  }

  function stopSeq(s) {
    if (!s) return;
    const now = s.e.ctx.currentTime;
    const gp = s.bus.gain;
    try {
      if (gp.cancelAndHoldAtTime) gp.cancelAndHoldAtTime(now);
      else { gp.cancelScheduledValues(now); gp.setValueAtTime(gp.value, now); }
      gp.linearRampToValueAtTime(0, now + FADE_OUT);
    } catch (err) { /* 무시 */ }
    setTimeout(() => { try { s.bus.disconnect(); } catch (err) { /* 무시 */ } }, (FADE_OUT + 0.4) * 1000);
  }

  function tick() {
    if (!E || !seq || seq.once || E.ctx.state !== 'running') return;
    pump(seq, E.ctx.currentTime + LOOKAHEAD);
  }

  /* =========================================================
   * 효과음 재생
   * ========================================================= */
  function voice(e, def, t, o, v) {
    const ctx = e.ctx;
    const g = ctx.createGain();
    g.gain.value = v * (def.v || 1);
    let out = g;
    const pan = clamp(+o.pan || 0, -1, 1);
    if (pan && ctx.createStereoPanner) { const pn = ctx.createStereoPanner(); pn.pan.value = pan; g.connect(pn); out = pn; }
    out.connect(e.sBus);
    if (def.rev) { const s = ctx.createGain(); s.gain.value = def.rev; out.connect(s); s.connect(e.sRev); }
    const p = Math.pow(2, clamp(+o.pitch || 0, -36, 36) / 12) * (1 + (rnd() - 0.5) * (def.jit != null ? def.jit : 0.05));
    X = e; D = g; T0 = t; END = t;
    try { def.fn(p); } catch (err) { /* 소리 하나가 실패해도 게임은 계속 */ }
    return END;
  }

  /* =========================================================
   * 공개 함수
   * ========================================================= */
  function onVisibility() {
    if (!E || typeof document === 'undefined') return;
    if (document.hidden) safe(() => E.ctx.suspend());
    else safe(() => E.ctx.resume());
  }

  function init() {
    if (!AC) return;
    if (E) {
      if (E.ctx.state !== 'running' && !(typeof document !== 'undefined' && document.hidden)) safe(() => E.ctx.resume());
      return;
    }
    try {
      E = build(new AC());
    } catch (err) {
      E = null;
      return;
    }
    applyVol(E, true);
    if (typeof document !== 'undefined' && document.addEventListener) document.addEventListener('visibilitychange', onVisibility);
    timer = setInterval(tick, 25);
    if (E.ctx.state !== 'running') safe(() => E.ctx.resume());
    if (wanted !== 'none') { const w = wanted; wanted = 'none'; music(w); }
  }

  function play(name, opts) {
    if (!E || muted) return;
    const def = FX[name];
    if (!def) return;
    const ctx = E.ctx;
    if (ctx.state !== 'running' || vol.master <= 0 || vol.sfx <= 0) return;
    const o = opts || {};
    const v = o.vol == null ? 1 : clamp(+o.vol || 0, 0, 1);
    if (v <= 0) return;
    const now = ctx.currentTime;
    if (lastAt[name] != null && now - lastAt[name] < MIN_GAP) return;
    const mine = (perName[name] || []).filter((x) => x > now);
    perName[name] = mine;
    if (mine.length >= MAX_PER_NAME) return;
    if (now - burstAt >= BURST_WIN) { burstAt = now; burstN = 0; }
    if (burstN >= BURST_MAX && !def.pri) return;
    if (active.length >= MAX_VOICES) active = active.filter((x) => x > now);
    if (active.length >= MAX_VOICES && !def.pri) return;
    lastAt[name] = now;
    burstN++;
    // 같은 소리가 겹쳐 있을수록 조금씩 작게
    const end = voice(E, def, now + 0.005, o, v / (1 + 0.3 * mine.length));
    mine.push(end);
    active.push(end);
  }

  function music(track) {
    const name = track == null ? 'none' : String(track);
    if (name !== 'none' && !TR[name]) return;
    if (!E) { wanted = name; return; }
    const same = seq && seq.name === name;
    wanted = name;
    if (same && !(seq.once && E.ctx.currentTime > seq.end)) return;
    if (!seq && name === 'none') return;
    stopSeq(seq);
    seq = null;
    if (name === 'none') return;
    seq = makeSeq(E, name, E.ctx.currentTime + 0.06);
    if (!seq.once && E.ctx.state === 'running') pump(seq, E.ctx.currentTime + LOOKAHEAD);
  }

  function setVolume(v) {
    const o = v || {};
    for (const k of ['master', 'sfx', 'music']) {
      if (typeof o[k] === 'number' && isFinite(o[k])) vol[k] = clamp(o[k], 0, 1);
    }
    applyVol(E, false);
  }

  function setMuted(m) {
    muted = !!m;
    applyVol(E, false);
  }

  /* 점검용(게임에서는 쓰지 않음): 악보 검사, 오프라인 렌더링 */
  function _lint() {
    const out = { warnings: [], seconds: {} };
    for (const k of Object.keys(TR)) {
      const c = compile(TR[k]);
      c.warn.forEach((w) => out.warnings.push(k + ': ' + w));
      out.seconds[k] = c.once ? null : c.total * c.sd;
    }
    return out;
  }

  function _render(spec) {
    const sp = spec || {};
    if (!OAC) return Promise.resolve(null);
    const sec = sp.seconds || 4;
    const sr = sp.rate || 44100;
    const ctx = new OAC(2, Math.ceil(sec * sr), sr);
    const e = build(ctx);
    applyVol(e, true);
    e.master.gain.value = vol.master * 0.5; // 음소거와 무관하게 렌더링
    if (sp.track && TR[sp.track]) {
      const s = makeSeq(e, sp.track, sp.at || 0.02);
      if (!s.once) pump(s, sec);
    }
    for (const it of sp.sfx || []) {
      const [n, at, o] = Array.isArray(it) ? it : [it, 0, null];
      const def = FX[n];
      if (def) voice(e, def, at || 0, o || {}, o && o.vol != null ? o.vol : 1);
    }
    return ctx.startRendering();
  }

  return {
    init,
    play,
    music,
    setVolume,
    setMuted,
    isMuted: () => muted,
    currentTrack: () => wanted,
    SFX: Object.keys(FX),
    TRACKS: Object.keys(TR),
    _lint,
    _render,
  };
})();

  <script>/* js/fx/fx.js */
'use strict';

/* =========================================================
 * 효과 — 시뮬레이션 이벤트를 받아 파티클·고리·번개·떠오르는 글자를 만듭니다.
 * 좌표는 칸 단위(월드). 그리기는 RG.render가 ctx와 변환을 넘겨 줍니다.
 * ========================================================= */
RG.fx = (() => {
  const parts = [];      // 파티클
  const rings = [];      // 퍼지는 고리
  const bolts = [];      // 번개·선
  const texts = [];      // 떠오르는 글자
  const areas = [];      // 바닥 경고 원
  let shake = 0;
  const settings = { numbers: true, shake: true };
  const MAX_PARTS = 900;
  const MAX_TEXTS = 60;

  const COLORS = () => RG.data.elements;
  function colorOf(el) {
    if (el === 'steam') return '#e8f4ff';
    const e = COLORS()[el];
    return e ? e.color : '#ffffff';
  }
  function lightOf(el) {
    if (el === 'steam') return '#ffffff';
    const e = COLORS()[el];
    return e ? e.light : '#ffffff';
  }

  const rnd = Math.random;   // 연출 전용(시뮬레이션과 무관)

  function burst(x, y, color, n, speed = 2.2, life = 0.5, size = 0.06, gravity = 0) {
    for (let i = 0; i < n && parts.length < MAX_PARTS; i++) {
      const a = rnd() * Math.PI * 2;
      const s = speed * (0.3 + rnd() * 0.7);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.3, life, max: life, size: size * (0.6 + rnd() * 0.8), color, g: gravity });
    }
  }
  function ring(x, y, radius, color, life = 0.45, width = 0.08) { rings.push({ x, y, r: radius, color, life, max: life, w: width }); }
  function text(x, y, str, color, big) {
    if (texts.length >= MAX_TEXTS) texts.shift();
    texts.push({ x: x + (rnd() - 0.5) * 0.2, y, str, color, life: big ? 1.1 : 0.8, max: big ? 1.1 : 0.8, big: !!big });
  }
  function bolt(points, color, life = 0.16, width = 0.06, jag = 0.16) {
    // 지그재그 미리 계산
    const pts = [];
    for (let i = 0; i < points.length - 1; i++) {
      const [ax, ay] = points[i];
      const [bx, by] = points[i + 1];
      const segs = Math.max(2, Math.round(Math.hypot(bx - ax, by - ay) / 0.35));
      for (let k = 0; k <= segs; k++) {
        const t = k / segs;
        const off = (k === 0 || k === segs) ? 0 : (rnd() - 0.5) * jag * 2;
        const nx = -(by - ay);
        const ny = bx - ax;
        const L = Math.hypot(nx, ny) || 1;
        pts.push([ax + (bx - ax) * t + (nx / L) * off, ay + (by - ay) * t + (ny / L) * off]);
      }
    }
    bolts.push({ pts, color, life, max: life, w: width });
  }
  function line(ax, ay, bx, by, color, life = 0.14, width = 0.07) { bolts.push({ pts: [[ax, ay], [bx, by]], color, life, max: life, w: width, straight: true }); }

  /** 시뮬레이션 이벤트 처리 */
  function onEvents(events, game) {
    for (const e of events) {
      switch (e.type) {
        case 'hit':
          if (e.dot) break;
          burst(e.x, e.y - 0.2, colorOf(e.element), e.beam ? 2 : 4, 1.6, 0.3, 0.05);
          if (settings.numbers && (e.amount >= 1)) text(e.x, e.y - 0.55, String(Math.round(e.amount)), e.crit ? '#ffe066' : '#ffffff', e.crit);
          break;
        case 'kill': {
          const big = e.boss;
          burst(e.x, e.y - 0.25, '#c9c3d6', big ? 60 : 12, big ? 4 : 2.4, big ? 1.2 : 0.6, big ? 0.12 : 0.07, 2);
          burst(e.x, e.y - 0.25, '#ffffff', big ? 30 : 5, 1.2, 0.8, 0.05, -1.2);
          if (e.bounty) text(e.x, e.y - 0.8, `+${e.bounty}`, '#ffd34d');
          if (big) { addShake(0.5); ring(e.x, e.y, 2.5, '#ffffff', 0.9, 0.15); }
          break;
        }
        case 'splash':
          ring(e.x, e.y, e.radius, colorOf(e.element), e.big ? 0.6 : 0.35, e.big ? 0.14 : 0.09);
          burst(e.x, e.y, colorOf(e.element), e.big ? 26 : 10, 2.6, 0.45, 0.07, 1.5);
          if (e.big) addShake(0.2);
          break;
        case 'pulse':
          ring(e.x, e.y, e.radius, colorOf(e.element), e.big ? 0.7 : 0.45, e.big ? 0.15 : 0.1);
          break;
        case 'chain':
          bolt(e.points, colorOf(e.element), e.small ? 0.12 : 0.18, e.small ? 0.04 : 0.07);
          break;
        case 'fire':
          if (e.kind === 'ballista') line(e.x, e.y - 0.4, e.tx, e.ty, '#c8f2ff', 0.16, 0.09);
          break;
        case 'leak':
          if (game) {
            const L = game.map.lantern;
            ring(L.x, L.y, 1.2, e.shielded ? '#9ad7ff' : '#ff4a4a', 0.6, 0.15);
            if (!e.shielded) addShake(0.35);
          }
          break;
        case 'build': case 'upgrade': {
          const x = e.c + 0.5;
          const y = e.r + 0.5;
          ring(x, y + 0.3, 0.7, '#fff3c4', 0.5, 0.08);
          burst(x, y + 0.3, '#d9c7a0', 14, 1.8, 0.5, 0.07, 2);
          if (e.type === 'upgrade') burst(x, y - 0.3, '#ffe68a', 16, 1.5, 0.8, 0.05, -0.8);
          break;
        }
        case 'sell':
          burst(e.c + 0.5, e.r + 0.5, '#ffd34d', 16, 2, 0.6, 0.06, 1.5);
          text(e.c + 0.5, e.r, `+${e.value}`, '#ffd34d');
          break;
        case 'shieldBreak':
          burst(e.x, e.y - 0.3, '#bfe8ff', 14, 2.6, 0.5, 0.07, 2);
          break;
        case 'towerDisabled':
          if (game) {
            const t = game.state.towers.find((q) => q.id === e.towerId);
            if (t) burst(t.x, t.y - 0.3, e.reason === 'breath' ? '#bdefff' : '#c9b8ff', 10, 1.4, 0.6, 0.06);
          }
          break;
        case 'bossPhase':
          ring(e.x, e.y, 3, '#ffffff', 1, 0.2);
          addShake(0.6);
          break;
        case 'bossAbility':
          if (e.ability === 'emerge' || e.ability === 'blink') { ring(e.x, e.y, 1.4, '#ffb36b', 0.6, 0.15); burst(e.x, e.y, '#c9a27a', 24, 3, 0.7, 0.08, 2); addShake(0.3); }
          if (e.ability === 'breath' || e.ability === 'bolt') addShake(0.25);
          break;
        case 'trapTrigger':
          ring(e.x, e.y, 0.7, '#d14fc0', 0.4, 0.1);
          burst(e.x, e.y, '#6e1f66', 12, 1.6, 0.5, 0.06);
          break;
        case 'trap':
          line(e.fromX, e.fromY - 0.3, e.x, e.y, 'rgba(209,79,192,0.6)', 0.25, 0.04);
          break;
        case 'heroSkill':
          ring(e.x, e.y, 1.8, '#ffffff', 0.6, 0.12);
          break;
        case 'execute':
          text(e.x, e.y - 0.9, '처형!', '#ff7ad9', true);
          break;
        case 'gold':
          text(e.x, e.y - 0.7, `+${e.amount}`, '#ffd34d', true);
          burst(e.x, e.y - 0.3, '#ffd34d', 10, 1.4, 0.7, 0.06, -0.5);
          break;
        case 'immune':
          text(e.x, e.y - 0.6, '면역', '#b8b8c8');
          break;
        case 'absorb':
          text(e.x, e.y - 0.6, `+${Math.round(e.amount)}`, '#7dff9a');
          break;
        case 'revive':
          ring(e.x, e.y, 0.9, '#9fffc2', 0.6, 0.1);
          burst(e.x, e.y, '#9fffc2', 18, 1.2, 0.9, 0.06, -1);
          break;
        case 'warnArea':
          areas.push({ x: e.x, y: e.y, r: e.radius, life: e.dur, max: e.dur, color: colorOf(e.element) });
          break;
        case 'burrow': case 'unburrow':
          burst(e.x, e.y, '#c9a47a', 12, 1.6, 0.5, 0.07, 2);
          break;
        case 'cyclone':
          ring(e.x, e.y, e.radius, '#e7e4ff', 0.5, 0.12);
          burst(e.x, e.y, '#ffffff', 16, 2.4, 0.6, 0.05, -1);
          break;
        case 'enemyShot':
          line(e.x, e.y - 0.4, e.tx, e.ty - 0.3, '#c9a27a', 0.18, 0.05);
          break;
        case 'unitHit':
          if (e.amount > 0) burst(e.x, e.y - 0.3, '#ff9a9a', 3, 1, 0.25, 0.04);
          break;
        case 'heroDown':
          burst(e.x, e.y - 0.3, '#ffffff', 20, 2, 0.8, 0.06, -0.5);
          break;
        case 'heroLevel':
          if (game && game.state.hero) { const h = game.state.hero; ring(h.x, h.y, 1, '#ffe68a', 0.7, 0.1); text(h.x, h.y - 1.1, '레벨 업!', '#ffe68a', true); }
          break;
        case 'enemyHeal':
          ring(e.x, e.y, e.radius, '#7dff9a', 0.6, 0.06);
          break;
        case 'enemyShield':
          ring(e.x, e.y, e.radius, '#8fd6ff', 0.6, 0.06);
          break;
        case 'taskDone':
          break;
        default:
          break;
      }
    }
  }

  function addShake(v) { if (settings.shake) shake = Math.min(1, shake + v); }

  function update(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96; p.vy *= 0.96;
    }
    for (const list of [rings, bolts, texts, areas]) {
      for (let i = list.length - 1; i >= 0; i--) { list[i].life -= dt; if (list[i].life <= 0) list.splice(i, 1); }
    }
    for (const t of texts) t.y -= dt * (t.big ? 0.9 : 1.2);
    shake = Math.max(0, shake - dt * 2.2);
  }

  function shakeOffset(T) {
    if (shake <= 0) return [0, 0];
    const m = shake * shake * T * 0.18;
    return [(rnd() - 0.5) * m, (rnd() - 0.5) * m];
  }

  /** 바닥 효과(경고 원) — 유닛 아래 */
  function drawUnder(ctx, X, Y, T) {
    for (const a of areas) {
      const k = 1 - a.life / a.max;
      ctx.save();
      ctx.globalAlpha = 0.25 + 0.35 * Math.abs(Math.sin(k * Math.PI * 4));
      ctx.strokeStyle = a.color;
      ctx.fillStyle = a.color;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X(a.x), Y(a.y), a.r * T, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha *= 0.3;
      ctx.beginPath(); ctx.arc(X(a.x), Y(a.y), a.r * T * k, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  /** 위쪽 효과 */
  function draw(ctx, X, Y, T) {
    ctx.save();
    for (const r of rings) {
      const k = 1 - r.life / r.max;
      ctx.globalAlpha = Math.max(0, 1 - k) * 0.9;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = Math.max(1.5, r.w * T * (1 - k * 0.6));
      ctx.beginPath();
      ctx.arc(X(r.x), Y(r.y), Math.max(1, r.r * T * (0.35 + 0.65 * k)), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const b of bolts) {
      const a = b.life / b.max;
      ctx.globalAlpha = a;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = Math.max(1.5, b.w * T);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      b.pts.forEach(([x, y], i) => (i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))));
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(1, b.w * T * 0.35);
      ctx.stroke();
    }
    for (const p of parts) {
      ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5);
      ctx.fillStyle = p.color;
      const s = Math.max(1.2, p.size * T);
      ctx.fillRect(X(p.x) - s / 2, Y(p.y) - s / 2, s, s);
    }
    ctx.restore();
  }

  function drawTexts(ctx, X, Y, T) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const t of texts) {
      const a = Math.min(1, t.life / t.max * 2);
      ctx.globalAlpha = a;
      const fs = Math.round(Math.max(11, T * (t.big ? 0.42 : 0.3)));
      ctx.font = `800 ${fs}px system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
      ctx.lineWidth = Math.max(2.5, fs * 0.22);
      ctx.strokeStyle = 'rgba(20,14,30,0.9)';
      ctx.strokeText(t.str, X(t.x), Y(t.y));
      ctx.fillStyle = t.color;
      ctx.fillText(t.str, X(t.x), Y(t.y));
    }
    ctx.restore();
  }

  function clear() { parts.length = 0; rings.length = 0; bolts.length = 0; texts.length = 0; areas.length = 0; shake = 0; }

  return { onEvents, update, draw, drawUnder, drawTexts, shakeOffset, clear, settings, burst, ring, text, colorOf, lightOf };
})();

</script>
  <script>/* js/render/renderer.js */
'use strict';

/* =========================================================
 * 렌더러 — 캔버스 하나에 맵과 모든 것을 그립니다.
 * 순서: ARCHITECTURE.md §6
 * ========================================================= */
RG.render = (() => {
  let canvas = null;
  let ctx = null;
  let game = null;
  let T = 40;            // 1칸 = T CSS px
  let ox = 0;
  let oy = 0;
  let dpr = 1;
  let W = 0;
  let H = 0;
  let bg = null;         // 바탕 오프스크린 캔버스
  let bgFor = '';
  let time = 0;
  const overlay = { hover: null, selectedTower: null, ghost: null, selectedEnemy: null, heroSelected: false, skill: null, rally: null, showPaths: true };
  const REGION_BASE = { 1: '#5d7a3c', 2: '#c9d8e6', 3: '#b9774a', 4: '#3f7f86', 5: '#5d5672' };

  const X = (x) => ox + x * T;
  const Y = (y) => oy + y * T;
  const lerp = (a, b, k) => a + (b - a) * k;

  function attach(cv, g) {
    canvas = cv;
    ctx = canvas.getContext('2d');
    game = g;
    bg = null;
    bgFor = '';
    resize();
  }

  function detach() { game = null; }

  function resize() {
    if (!canvas || !game) return;
    const rect = canvas.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = Math.max(100, rect.width);
    H = Math.max(80, rect.height);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    const m = game.map;
    T = Math.max(8, Math.floor(Math.min(W / m.cols, H / m.rows)));
    ox = Math.floor((W - m.cols * T) / 2);
    oy = Math.floor((H - m.rows * T) / 2);
    buildBackground();
  }

  function buildBackground() {
    const m = game.map;
    const key = `${m.id}:${T}:${dpr}`;
    if (bgFor === key) return;
    bgFor = key;
    const w = Math.round(m.cols * T * dpr);
    const h = Math.round(m.rows * T * dpr);
    let svg = null;
    try { svg = RG.art.mapBackground ? RG.art.mapBackground(m) : null; } catch (e) { svg = null; }
    if (!svg) { bg = null; return; }
    const img = new Image();
    img.onload = () => {
      if (bgFor !== key) return;
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      bg = cv;
    };
    img.src = RG.art.sprites.dataUrl(RG.art.sprites.sized(svg, w, h));
  }

  function screenToWorld(px, py) { return { x: (px - ox) / T, y: (py - oy) / T }; }
  function worldToScreen(x, y) { return { x: X(x), y: Y(y) }; }
  const tileSize = () => T;

  /* ---------------- 그리기 도우미 ---------------- */
  function sprite(key, cx, cy, w, h, ax, ay, flip, alpha) {
    const s = RG.art.sprites.get(key);
    if (!s) return false;
    ctx.save();
    if (alpha != null) ctx.globalAlpha *= alpha;
    if (flip) {
      ctx.translate(cx, cy);
      ctx.scale(-1, 1);
      ctx.drawImage(s.canvas, -w * ax, -h * ay, w, h);
    } else {
      ctx.drawImage(s.canvas, cx - w * ax, cy - h * ay, w, h);
    }
    ctx.restore();
    return true;
  }

  function shadow(x, y, rx, ry, a = 0.32) {
    ctx.save();
    ctx.fillStyle = `rgba(10,6,20,${a})`;
    ctx.beginPath();
    ctx.ellipse(X(x), Y(y), Math.max(2, rx * T), Math.max(1, ry * T), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function bar(cx, top, w, ratio, color, shieldRatio, elite) {
    const h = Math.max(3, Math.round(T * 0.09));
    const x = Math.round(cx - w / 2);
    const y = Math.round(top);
    ctx.fillStyle = 'rgba(15,10,25,0.85)';
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = '#3a2a33';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, Math.max(0, w * ratio), h);
    if (shieldRatio > 0) {
      ctx.fillStyle = 'rgba(190,232,255,0.9)';
      ctx.fillRect(x, y, Math.max(0, w * Math.min(1, shieldRatio)), Math.max(2, h * 0.5));
    }
    if (elite) {
      ctx.fillStyle = '#ffd34d';
      ctx.beginPath();
      ctx.moveTo(x - 6, y - 1); ctx.lineTo(x - 2, y + h / 2); ctx.lineTo(x - 6, y + h + 1); ctx.closePath();
      ctx.fill();
    }
  }

  function elColor(el) { return (RG.data.elements[el] || { color: '#fff' }).color; }

  /* ---------------- 바탕·경로 ---------------- */
  function drawBackground() {
    const m = game.map;
    if (bg) ctx.drawImage(bg, X(0), Y(0), m.cols * T, m.rows * T);
    else {
      ctx.fillStyle = REGION_BASE[m.def.region] || '#556';
      ctx.fillRect(X(0), Y(0), m.cols * T, m.rows * T);
      // 그림이 없을 때도 칸이 읽히게
      for (let r = 0; r < m.rows; r++) {
        for (let c = 0; c < m.cols; c++) {
          const k = m.kinds[r * m.cols + c];
          const G = RG.grid.T;
          let col = null;
          if (k === G.PATH || k === G.SPAWN || k === G.LANTERN) col = '#c8a874';
          else if (k === G.OPEN) col = '#93b86a';
          else if (k === G.BUILD) col = '#6f9447';
          else if (k === G.WATER) col = '#3f7fb0';
          else col = '#3e4a33';
          ctx.fillStyle = col;
          ctx.fillRect(X(c) + 0.5, Y(r) + 0.5, T - 1, T - 1);
        }
      }
    }
  }

  function drawPortals() {
    const m = game.map;
    for (const s of m.spawns) {
      const cx = X(s.x);
      const cy = Y(s.y);
      ctx.save();
      const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, T * 0.55);
      g.addColorStop(0, 'rgba(30,24,40,0.9)');
      g.addColorStop(0.6, 'rgba(90,84,110,0.45)');
      g.addColorStop(1, 'rgba(160,150,180,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, T * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(220,214,240,0.35)';
      ctx.lineWidth = Math.max(1, T * 0.04);
      for (let i = 0; i < 3; i++) {
        const a = time * 1.6 + (i * Math.PI * 2) / 3;
        ctx.beginPath(); ctx.arc(cx, cy, T * (0.18 + 0.1 * i), a, a + 1.6); ctx.stroke();
      }
      ctx.restore();
    }
    for (const s of m.airSpawns) {
      const cx = X(s.x);
      const cy = Y(s.y);
      ctx.save();
      ctx.strokeStyle = 'rgba(235,235,255,0.55)';
      ctx.lineWidth = Math.max(1, T * 0.05);
      for (let i = 0; i < 3; i++) {
        const a = -time * 2 + (i * Math.PI * 2) / 3;
        ctx.beginPath(); ctx.arc(cx, cy, T * (0.2 + 0.09 * i), a, a + 2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  /** 준비 단계: 지상 경로 화살표와 비행 경로 점선 */
  function drawPathPreview() {
    const st = game.state;
    const m = game.map;
    if (!overlay.showPaths) return;
    if (st.wave.started && !(st.wave.countdown !== null && st.wave.countdown > 0 && st.enemies.length === 0)) return;
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.25 * Math.sin(time * 3);
    ctx.fillStyle = '#fff6d8';
    for (const s of m.spawns) {
      let c = s.c;
      let r = s.r;
      let guard = 0;
      let k = 0;
      while (guard++ < 200) {
        const nx = RG.grid.nextStep(m, game.flow, game.blocked, c, r, 0);
        if (!nx) break;
        if (k % 2 === 0) {
          const ax = X(c + 0.5);
          const ay = Y(r + 0.5);
          const bx = X(nx.c + 0.5);
          const by = Y(nx.r + 0.5);
          const ang = Math.atan2(by - ay, bx - ax);
          const mx = (ax + bx) / 2;
          const my = (ay + by) / 2;
          const s2 = T * 0.14;
          ctx.beginPath();
          ctx.moveTo(mx + Math.cos(ang) * s2, my + Math.sin(ang) * s2);
          ctx.lineTo(mx + Math.cos(ang + 2.4) * s2, my + Math.sin(ang + 2.4) * s2);
          ctx.lineTo(mx + Math.cos(ang - 2.4) * s2, my + Math.sin(ang - 2.4) * s2);
          ctx.closePath();
          ctx.fill();
        }
        c = nx.c; r = nx.r; k += 1;
      }
    }
    // 비행 경로
    const air = m.airSpawns.length ? m.airSpawns : [];
    ctx.setLineDash([T * 0.15, T * 0.15]);
    ctx.strokeStyle = 'rgba(235,240,255,0.75)';
    ctx.lineWidth = Math.max(1.5, T * 0.04);
    for (const a of air) {
      ctx.beginPath(); ctx.moveTo(X(a.x), Y(a.y)); ctx.lineTo(X(m.lantern.x), Y(m.lantern.y)); ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------------- 장판·덫 ---------------- */
  function drawZones() {
    const st = game.state;
    for (const z of st.zones) {
      const cx = X(z.x);
      const cy = Y(z.y);
      const R = z.radius * T;
      const fade = Math.min(1, (z.until - st.time) / 0.4);
      ctx.save();
      ctx.globalAlpha = 0.85 * fade;
      if (z.kind === 'fire') {
        const g = ctx.createRadialGradient(cx, cy, 1, cx, cy, R);
        g.addColorStop(0, 'rgba(255,214,120,0.75)');
        g.addColorStop(0.55, 'rgba(255,107,61,0.45)');
        g.addColorStop(1, 'rgba(160,40,20,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 0.8, 0, 0, Math.PI * 2); ctx.fill();
        if (Math.random() < 0.25) RG.fx.burst(z.x + (Math.random() - 0.5) * z.radius, z.y + (Math.random() - 0.5) * z.radius * 0.6, '#ffb070', 1, 0.6, 0.5, 0.05, -1.5);
      } else if (z.kind === 'void') {
        const g = ctx.createRadialGradient(cx, cy, 1, cx, cy, R);
        g.addColorStop(0, 'rgba(20,6,30,0.9)');
        g.addColorStop(0.7, 'rgba(110,31,102,0.55)');
        g.addColorStop(1, 'rgba(209,79,192,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 0.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(242,184,234,0.6)';
        ctx.lineWidth = Math.max(1, T * 0.03);
        for (let i = 0; i < 3; i++) {
          const a = -time * 2.5 + i * 2.1;
          ctx.beginPath(); ctx.ellipse(cx, cy, R * (0.4 + i * 0.18), R * 0.8 * (0.4 + i * 0.18), 0, a, a + 1.4); ctx.stroke();
        }
      } else if (z.kind === 'thorn') {
        ctx.fillStyle = 'rgba(74,122,38,0.35)';
        ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 0.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#9fd36a';
        ctx.strokeStyle = '#2b4a17';
        ctx.lineWidth = 1;
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          const rr = R * (0.45 + 0.4 * ((i * 37) % 10) / 10);
          const sx = cx + Math.cos(a) * rr;
          const sy = cy + Math.sin(a) * rr * 0.8;
          ctx.beginPath(); ctx.moveTo(sx - T * 0.05, sy); ctx.lineTo(sx, sy - T * 0.16); ctx.lineTo(sx + T * 0.05, sy); ctx.closePath(); ctx.fill(); ctx.stroke();
        }
      }
      ctx.restore();
    }
    for (const tr of st.traps) {
      const cx = X(tr.x);
      const cy = Y(tr.y);
      ctx.save();
      ctx.globalAlpha = 0.7 + 0.2 * Math.sin(time * 4 + tr.id);
      ctx.strokeStyle = '#d14fc0';
      ctx.fillStyle = 'rgba(40,10,40,0.55)';
      ctx.lineWidth = Math.max(1.5, T * 0.05);
      ctx.beginPath(); ctx.ellipse(cx, cy, T * 0.3, T * 0.22, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + time;
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * T * 0.26, cy + Math.sin(a) * T * 0.19);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------------- 공명 선 ---------------- */
  function drawLinks() {
    const st = game.state;
    const byId = new Map(st.towers.map((t) => [t.id, t]));
    ctx.save();
    ctx.lineCap = 'round';
    for (const t of st.towers) {
      for (const id of t.links) {
        if (id < t.id) continue;
        const n = byId.get(id);
        if (!n) continue;
        const ax = X(t.x);
        const ay = Y(t.y + 0.15);
        const bx = X(n.x);
        const by = Y(n.y + 0.15);
        const g = ctx.createLinearGradient(ax, ay, bx, by);
        g.addColorStop(0, elColor(RG.data.towers[t.type].element));
        g.addColorStop(1, elColor(RG.data.towers[n.type].element));
        const pulse = 0.5 + 0.5 * Math.sin(time * 3 + (t.id + n.id) * 0.7);
        ctx.globalAlpha = 0.35 + 0.35 * pulse;
        ctx.strokeStyle = g;
        ctx.lineWidth = Math.max(2, T * 0.09);
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        ctx.globalAlpha = 0.6 + 0.4 * pulse;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(1, T * 0.025);
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        // 흐르는 빛 구슬
        const k = (time * 0.7 + (t.id * 0.13)) % 1;
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(lerp(ax, bx, k), lerp(ay, by, k), Math.max(1.5, T * 0.05), 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  /* ---------------- 오버레이(사거리·미리보기) ---------------- */
  function rangeCircle(x, y, r, color, dash) {
    ctx.save();
    ctx.fillStyle = color.replace('A', '0.12');
    ctx.strokeStyle = color.replace('A', '0.85');
    ctx.lineWidth = Math.max(1.5, T * 0.035);
    if (dash) ctx.setLineDash([T * 0.12, T * 0.08]);
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * T, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawOverlayUnder() {
    const st = game.state;
    // 마우스가 올라간 칸
    if (overlay.hover && !overlay.ghost) {
      const { c, r } = overlay.hover;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = Math.max(1, T * 0.03);
      ctx.strokeRect(X(c) + 1.5, Y(r) + 1.5, T - 3, T - 3);
      ctx.restore();
    }
    // 고른 탑의 사거리
    const sel = overlay.selectedTower != null ? st.towers.find((t) => t.id === overlay.selectedTower) : null;
    if (sel && sel.calc) {
      const c = sel.calc;
      if (c.range) rangeCircle(sel.x, sel.y, c.range, 'rgba(255,240,200,A)');
      if (c.minRange) rangeCircle(sel.x, sel.y, c.minRange, 'rgba(255,120,100,A)', true);
      if (c.rallyRange) rangeCircle(sel.x, sel.y, c.rallyRange, 'rgba(180,230,140,A)', true);
      if (c.detect) rangeCircle(sel.x, sel.y, c.detect, 'rgba(255,230,140,A)', true);
      if (c.bountyAura) rangeCircle(sel.x, sel.y, c.bountyAura.radius, 'rgba(255,211,77,A)', true);
      if (c.aura || c.role === 'support') {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.setLineDash([T * 0.1, T * 0.08]);
        ctx.lineWidth = Math.max(1, T * 0.03);
        ctx.strokeRect(X(sel.c - 1) + 2, Y(sel.r - 1) + 2, T * 3 - 4, T * 3 - 4);
        ctx.restore();
      }
      if (sel.rally) {
        ctx.save();
        ctx.fillStyle = '#9fd36a';
        ctx.strokeStyle = '#1c1426';
        ctx.lineWidth = 2;
        const fx = X(sel.rally.x);
        const fy = Y(sel.rally.y);
        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - T * 0.45); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(fx, fy - T * 0.45); ctx.lineTo(fx + T * 0.3, fy - T * 0.35); ctx.lineTo(fx, fy - T * 0.25); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }
    // 건설 미리보기
    const gh = overlay.ghost;
    if (gh) {
      const td = RG.data.towers[gh.type];
      const spec = td.levels[0];
      const x = gh.c + 0.5;
      const y = gh.r + 0.5;
      ctx.save();
      ctx.fillStyle = gh.ok ? 'rgba(140,255,160,0.22)' : 'rgba(255,90,90,0.28)';
      ctx.fillRect(X(gh.c), Y(gh.r), T, T);
      ctx.restore();
      if (spec.range) rangeCircle(x, y, spec.range * (1 + ((game.meta && game.meta.rangePct) || 0)), gh.ok ? 'rgba(200,255,210,A)' : 'rgba(255,140,140,A)');
      if (spec.rallyRange) rangeCircle(x, y, spec.rallyRange, 'rgba(180,230,140,A)', true);
      if (spec.detect) rangeCircle(x, y, spec.detect, 'rgba(255,230,140,A)', true);
      for (const l of gh.links || []) {
        ctx.save();
        ctx.strokeStyle = elColor(td.element);
        ctx.globalAlpha = 0.9;
        ctx.setLineDash([T * 0.1, T * 0.06]);
        ctx.lineWidth = Math.max(2, T * 0.07);
        ctx.beginPath(); ctx.moveTo(X(x), Y(y + 0.15)); ctx.lineTo(X(l.c + 0.5), Y(l.r + 0.65)); ctx.stroke();
        ctx.restore();
      }
    }
    // 영웅 기술 조준
    if (overlay.skill && overlay.hover) {
      const { x, y } = overlay.skillPos || { x: overlay.hover.c + 0.5, y: overlay.hover.r + 0.5 };
      rangeCircle(x, y, overlay.skill.radius || 0.6, 'rgba(255,230,160,A)');
    }
    if (overlay.rally && overlay.hover) {
      const t = st.towers.find((q) => q.id === overlay.rally);
      if (t) rangeCircle(t.x, t.y, t.calc.rallyRange, 'rgba(180,230,140,A)', true);
    }
  }

  /* ---------------- 탑 ---------------- */
  function drawTower(t) {
    const cx = X(t.x);
    const baseY = Y(t.r + 0.82);
    const w = T;
    const h = T * 1.3;
    let sy = 1;
    if (t.anim > 0) sy = 1 - 0.07 * (t.anim / 0.25);
    const key = RG.art.sprites.towerKey(t.type, t.level, t.branch);
    ctx.save();
    if (t.building) ctx.globalAlpha = 0.55;
    if (sy !== 1) { ctx.translate(cx, baseY); ctx.scale(1 + (1 - sy) * 0.5, sy); ctx.translate(-cx, -baseY); }
    const ok = sprite(key, cx, baseY, w, h, 0.5, 112 / 130, false);
    if (!ok) {
      ctx.fillStyle = elColor(RG.data.towers[t.type].element);
      ctx.fillRect(cx - T * 0.3, baseY - T * 0.7, T * 0.6, T * 0.7);
    }
    ctx.restore();
    if (t.disabled) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = t.silenced ? '#6a6380' : '#bfe8ff';
      ctx.beginPath(); ctx.ellipse(cx, baseY - T * 0.35, T * 0.42, T * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      icon(t.silenced ? 'silence' : 'freeze', cx, baseY - T * 1.0, T * 0.4);
      ctx.restore();
    } else if (t.dampened) {
      icon('dampen', cx + T * 0.32, baseY - T * 0.95, T * 0.3);
    }
    if (t.building) {
      const k = 1 - Math.max(0, t.buildUntil - game.state.time) / game.rules.buildTime;
      ctx.save();
      ctx.strokeStyle = '#ffe68a';
      ctx.lineWidth = Math.max(2, T * 0.06);
      ctx.beginPath(); ctx.arc(cx, baseY - T * 0.4, T * 0.3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
      ctx.restore();
    }
    if (overlay.selectedTower === t.id) {
      ctx.save();
      ctx.strokeStyle = '#fff3c4';
      ctx.lineWidth = Math.max(2, T * 0.05);
      ctx.beginPath(); ctx.ellipse(cx, baseY, T * 0.46, T * 0.18, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  const iconCache = new Map();
  function icon(name, cx, cy, size) {
    let img = iconCache.get(name);
    if (!img && RG.art.icon) {
      img = new Image();
      img.src = RG.art.sprites.dataUrl(RG.art.sprites.sized(RG.art.icon(name), 64, 64));
      iconCache.set(name, img);
    }
    if (img && img.complete && img.naturalWidth) ctx.drawImage(img, cx - size / 2, cy - size / 2, size, size);
  }

  /* ---------------- 울림등 ---------------- */
  function drawLantern() {
    const st = game.state;
    const L = game.map.lantern;
    const ratio = st.lives / st.maxLives;
    const cx = X(L.x);
    const baseY = Y(L.r + 0.82);
    ctx.save();
    const glow = ctx.createRadialGradient(cx, baseY - T * 0.7, 2, cx, baseY - T * 0.7, T * (0.6 + ratio * 0.9));
    glow.addColorStop(0, `rgba(255,236,170,${0.25 + 0.35 * ratio + 0.05 * Math.sin(time * 3)})`);
    glow.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, baseY - T * 0.7, T * (0.6 + ratio * 0.9), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    sprite(RG.art.sprites.lanternKey(ratio), cx, baseY, T, T * 1.3, 0.5, 112 / 130, false);
  }

  /* ---------------- 적 ---------------- */
  function enemyScreen(e, alpha) {
    const x = lerp(e.px, e.x, alpha);
    const y = lerp(e.py, e.y, alpha);
    return { x, y };
  }

  function drawEnemy(e, alpha) {
    const st = game.state;
    const ed = RG.data.enemies[e.type];
    const { x, y } = enemyScreen(e, alpha);
    const size = e.size * T;
    const cx = X(x);
    let cy = Y(y);
    if (e.burrowed) {
      ctx.save();
      ctx.fillStyle = '#b68b5c';
      ctx.strokeStyle = '#3a2716';
      ctx.lineWidth = Math.max(1, T * 0.03);
      ctx.beginPath(); ctx.ellipse(cx, cy, size * 0.45, size * 0.2, 0, Math.PI, 0); ctx.fill(); ctx.stroke();
      ctx.restore();
      return;
    }
    const frozen = st.time < e.ccUntil && e.ccKind === 'freeze';
    const lifted = st.time < e.ccUntil && e.ccKind === 'lift';
    const moving = !e.blockedBy && !(st.time < e.ccUntil) ;
    const frame = moving ? Math.floor(e.walkT * 2.4) % 2 : 0;
    let lift = 0;
    if (e.flying) lift = T * 0.42 + Math.sin(time * 4 + e.id) * T * 0.04;
    else if (moving) lift = Math.abs(Math.sin(e.walkT * Math.PI * 1.2)) * T * 0.05;
    if (lifted) lift += T * 0.35 + Math.sin(time * 10) * T * 0.04;
    cy -= lift;
    const alphaS = (e.stealth && !e.revealed) ? 0.35 + 0.1 * Math.sin(time * 6) : 1;
    const hurt = st.time - e.lastHurt < 0.08;
    const flip = e.dir < 0;
    const key = RG.art.sprites.enemyKey(e.type, frame);
    const ok = sprite(key, cx, cy, size, size, 0.5, 0.9, flip, alphaS);
    if (!ok) {
      ctx.fillStyle = '#9a94a8';
      ctx.beginPath(); ctx.arc(cx, cy - size * 0.4, size * 0.35, 0, Math.PI * 2); ctx.fill();
    }
    if (hurt && ok) {
      ctx.save();
      ctx.globalAlpha = 0.45 * alphaS;
      ctx.globalCompositeOperation = 'lighter';
      sprite(key, cx, cy, size, size, 0.5, 0.9, flip, 1);
      ctx.restore();
    }
    // 상태 표시
    const top = cy - size * 0.92;
    if (frozen) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#bfefff';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(cx - size * 0.42, cy - size * 0.85, size * 0.84, size * 0.82, size * 0.1) : ctx.rect(cx - size * 0.42, cy - size * 0.85, size * 0.84, size * 0.82);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    if (st.time < e.ccUntil && e.ccKind === 'stun') {
      ctx.save();
      ctx.fillStyle = '#ffe066';
      for (let i = 0; i < 3; i++) {
        const a = time * 6 + (i * Math.PI * 2) / 3;
        ctx.beginPath(); ctx.arc(cx + Math.cos(a) * size * 0.3, top - 2 + Math.sin(a) * size * 0.08, Math.max(1.5, T * 0.04), 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    if (st.time < e.ccUntil && e.ccKind === 'root') {
      ctx.save();
      ctx.strokeStyle = '#d14fc0';
      ctx.lineWidth = Math.max(1.5, T * 0.04);
      ctx.beginPath(); ctx.ellipse(cx, Y(y), size * 0.4, size * 0.14, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    if (e.shield > 0) {
      ctx.save();
      ctx.globalAlpha = 0.3 + 0.15 * Math.sin(time * 4 + e.id);
      ctx.strokeStyle = '#bfe8ff';
      ctx.fillStyle = 'rgba(160,215,255,0.18)';
      ctx.lineWidth = Math.max(1.5, T * 0.035);
      ctx.beginPath(); ctx.ellipse(cx, cy - size * 0.42, size * 0.5, size * 0.52, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    if (st.time < e.st.slowUntil && !frozen) {
      ctx.save();
      ctx.strokeStyle = 'rgba(140,220,255,0.8)';
      ctx.lineWidth = Math.max(1, T * 0.03);
      ctx.beginPath(); ctx.ellipse(cx, Y(y) + 1, size * 0.36, size * 0.12, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    if (e.st.burns.length && Math.random() < 0.3) RG.fx.burst(x + (Math.random() - 0.5) * e.size * 0.6, y - e.size * 0.5, RG.fx.colorOf(e.st.burns[0].element), 1, 0.5, 0.45, 0.05, -1.6);
    if (e.st.curse && st.time < e.st.curse.until) icon('curse', cx + size * 0.38, top + 2, Math.max(10, T * 0.26));
    // 체력 막대
    const showBar = e.hp < e.maxHp || e.shield > 0 || ed.elite || ed.boss || overlay.selectedEnemy === e.id;
    if (showBar) {
      const bw = Math.max(18, size * (ed.boss ? 1.1 : 0.85));
      bar(cx, top - Math.max(4, T * 0.12), bw, e.hp / e.maxHp, ed.boss ? '#ff5f6d' : '#7ee36a', e.maxShield ? e.shield / e.maxHp : 0, ed.elite && !ed.boss);
    }
    if (overlay.selectedEnemy === e.id) {
      ctx.save();
      ctx.strokeStyle = '#ffe68a';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(cx, Y(y), size * 0.5, size * 0.18, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------------- 유닛 ---------------- */
  function drawUnit(u, alpha) {
    const st = game.state;
    if (u.dead) return;
    const x = lerp(u.px, u.x, alpha);
    const y = lerp(u.py, u.y, alpha);
    const cx = X(x);
    const cy = Y(y);
    const flip = u.dir < 0;
    if (u.kind === 'hero') {
      const moving = u.walking;
      const pose = u.attackAnim > 0 ? 'attack' : moving ? (Math.floor(time * 6) % 2 ? 'walk1' : 'walk2') : 'idle';
      const size = T * 0.95;
      const bob = moving ? Math.abs(Math.sin(time * 9)) * T * 0.04 : Math.sin(time * 2.2) * T * 0.012;
      if (overlay.heroSelected) {
        ctx.save();
        ctx.strokeStyle = '#ffe68a';
        ctx.lineWidth = Math.max(2, T * 0.05);
        ctx.beginPath(); ctx.ellipse(cx, cy, T * 0.42, T * 0.16, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      sprite(RG.art.sprites.heroKey(u.heroId, pose), cx, cy - bob, size, size, 0.5, 0.9, flip, 1);
      if (u.stunUntil > st.time) icon('stun', cx, cy - size * 1.0, T * 0.3);
      bar(cx, cy - size * 0.98, Math.max(22, T * 0.8), u.hp / u.maxHp, '#6fd3ff', 0, false);
      // 레벨
      ctx.save();
      ctx.font = `800 ${Math.max(9, Math.round(T * 0.22))}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1c1426';
      ctx.fillStyle = '#ffe68a';
      const lx = cx - Math.max(22, T * 0.8) / 2 - T * 0.12;
      ctx.strokeText(String(u.level), lx, cy - size * 0.9);
      ctx.fillText(String(u.level), lx, cy - size * 0.9);
      ctx.restore();
      return;
    }
    if (u.kind === 'soldier') {
      const size = T * 0.62;
      const pose = u.attackAnim > 0 ? 'attack' : 'idle';
      const bob = (Math.abs(u.x - u.px) + Math.abs(u.y - u.py)) > 0.001 ? Math.abs(Math.sin(time * 10 + u.id)) * T * 0.03 : 0;
      sprite(RG.art.sprites.unitKey(u.look || 'stone_soldier', pose), cx, cy - bob, size, size, 0.5, 0.9, flip, 1);
      if (u.hp < u.maxHp) bar(cx, cy - size * 1.0, Math.max(14, T * 0.5), u.hp / u.maxHp, '#b8e986', 0, false);
      return;
    }
    if (u.kind === 'wall') {
      const size = T * 1.0;
      sprite(RG.art.sprites.unitKey('rock_wall', 'idle'), cx, cy + T * 0.1, size, size, 0.5, 0.9, false, 1);
      bar(cx, cy - size * 0.8, Math.max(20, T * 0.7), u.hp / u.maxHp, '#b8e986', 0, false);
      return;
    }
    if (u.kind === 'drone') {
      const size = T * 0.6;
      const hover = Math.sin(time * 5) * T * 0.05;
      shadow(x, y, 0.2, 0.07, 0.25);
      sprite(RG.art.sprites.unitKey('drone', u.cd > u.interval - 0.15 ? 'attack' : 'idle'), cx, cy - T * 0.5 + hover, size, size, 0.5, 0.6, false, 1);
    }
  }

  /* ---------------- 투사체·광선 ---------------- */
  function drawProjectiles(alpha) {
    const st = game.state;
    ctx.save();
    for (const p of st.projectiles) {
      const x = lerp(p.px, p.x, alpha);
      const y = lerp(p.py, p.y, alpha);
      const col = RG.fx.colorOf(p.element);
      const sx = X(x);
      const sy = Y(y);
      if (p.kind === 'shell') {
        const h = (p.h || 0) * T;
        shadow(x, y + 0.1, 0.12, 0.05, 0.3);
        ctx.fillStyle = '#2a2230';
        ctx.beginPath(); ctx.arc(sx, sy - h, Math.max(3, T * 0.12), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = col;
        ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.arc(sx, sy - h, Math.max(2, T * 0.07), 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        continue;
      }
      const dx = p.x - p.px;
      const dy = p.y - p.py;
      const L = Math.hypot(dx, dy) || 1;
      if (p.kind === 'arrow' || (p.kind === 'heroShot' && (p.heroId === 'sio'))) {
        const len = T * 0.36;
        ctx.strokeStyle = '#5a3d22';
        ctx.lineWidth = Math.max(1.5, T * 0.04);
        ctx.beginPath(); ctx.moveTo(sx - (dx / L) * len, sy - (dy / L) * len); ctx.lineTo(sx, sy); ctx.stroke();
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(sx, sy, Math.max(2, T * 0.06), 0, Math.PI * 2); ctx.fill();
        continue;
      }
      if (p.kind === 'gust') {
        ctx.strokeStyle = 'rgba(240,240,255,0.9)';
        ctx.lineWidth = Math.max(1.5, T * 0.04);
        ctx.beginPath(); ctx.arc(sx, sy, T * 0.12, time * 12, time * 12 + 4.5); ctx.stroke();
        continue;
      }
      if (p.kind === 'orb') {
        ctx.fillStyle = '#1a0820';
        ctx.strokeStyle = '#d14fc0';
        ctx.lineWidth = Math.max(1.5, T * 0.04);
        ctx.beginPath(); ctx.arc(sx, sy, T * 0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        continue;
      }
      // bolt / heroShot
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, T * 0.16);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.4, col);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(sx, sy, T * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = Math.max(1, T * 0.05);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - (dx / L) * T * 0.3, sy - (dy / L) * T * 0.3); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // 광선
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const b of st.beams) {
      const k = (b.mult - 1) / Math.max(0.01, b.max - 1);
      ctx.strokeStyle = 'rgba(255,214,110,0.55)';
      ctx.lineWidth = Math.max(2, T * (0.06 + 0.14 * k));
      ctx.beginPath(); ctx.moveTo(X(b.x1), Y(b.y1)); ctx.lineTo(X(b.x2), Y(b.y2) - T * 0.3); ctx.stroke();
      ctx.strokeStyle = '#fffbe8';
      ctx.lineWidth = Math.max(1, T * (0.02 + 0.05 * k));
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------------- 보스 경고 ---------------- */
  function drawAlerts() {
    const st = game.state;
    for (const a of st.alerts) {
      for (const id of a.towerIds) {
        const t = st.towers.find((q) => q.id === id);
        if (!t) continue;
        const k = Math.max(0, (a.at - st.time) / RG.data.rules.bossWarn);
        ctx.save();
        ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(time * 10));
        ctx.strokeStyle = '#ff5a5a';
        ctx.lineWidth = Math.max(2, T * 0.06);
        ctx.beginPath(); ctx.arc(X(t.x), Y(t.y), T * (0.45 + 0.2 * k), 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#ff5a5a';
        ctx.font = `900 ${Math.max(12, Math.round(T * 0.5))}px system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('!', X(t.x), Y(t.y) - T * 0.85);
        ctx.restore();
      }
    }
  }

  /* ---------------- 한 프레임 ---------------- */
  function frame(alpha, dt) {
    if (!game || !ctx) return;
    time += dt;
    RG.fx.update(dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const base = REGION_BASE[game.map.def.region] || '#556';
    const g0 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.75);
    g0.addColorStop(0, RG.art._h.mix(base, '#141019', 0.55));
    g0.addColorStop(1, '#0d0a12');
    ctx.fillStyle = g0;
    ctx.fillRect(0, 0, W, H);
    // 맵 테두리
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(X(0) - 4, Y(0) - 4, game.map.cols * T + 8, game.map.rows * T + 8);
    ctx.strokeStyle = 'rgba(233,196,122,0.55)';
    ctx.lineWidth = 2;
    ctx.strokeRect(X(0) - 3, Y(0) - 3, game.map.cols * T + 6, game.map.rows * T + 6);
    const [sx, sy] = RG.fx.shakeOffset(T);
    ctx.save();
    ctx.translate(sx, sy);
    drawBackground();
    drawPortals();
    drawZones();
    drawPathPreview();
    drawOverlayUnder();
    drawLinks();
    RG.fx.drawUnder(ctx, X, Y, T);

    const st = game.state;
    // 그림자
    for (const t of st.towers) shadow(t.x, t.r + 0.8, 0.36, 0.12, 0.28);
    for (const e of st.enemies) {
      if (e.burrowed) continue;
      const p = enemyScreen(e, alpha);
      shadow(p.x, p.y, e.size * 0.32, e.size * 0.11, e.flying ? 0.18 : 0.3);
    }
    for (const u of st.units) if (!u.dead && u.kind !== 'drone') shadow(lerp(u.px, u.x, alpha), lerp(u.py, u.y, alpha), u.kind === 'wall' ? 0.45 : 0.22, 0.08, 0.3);

    // y 순서로
    const list = [];
    for (const t of st.towers) list.push([t.r + 0.82, 0, t]);
    list.push([game.map.lantern.r + 0.82, 1, null]);
    for (const e of st.enemies) if (!e.flying) list.push([lerp(e.py, e.y, alpha), 2, e]);
    for (const u of st.units) if (!u.dead) list.push([lerp(u.py, u.y, alpha), 3, u]);
    list.sort((a, b) => a[0] - b[0]);
    for (const [, kind, obj] of list) {
      if (kind === 0) drawTower(obj);
      else if (kind === 1) drawLantern();
      else if (kind === 2) drawEnemy(obj, alpha);
      else drawUnit(obj, alpha);
    }
    // 비행 적은 위에
    const flyers = st.enemies.filter((e) => e.flying).sort((a, b) => a.y - b.y);
    for (const e of flyers) drawEnemy(e, alpha);
    // 건설 미리보기 탑 그림
    const gh = overlay.ghost;
    if (gh) {
      ctx.save();
      ctx.globalAlpha = 0.65;
      sprite(RG.art.sprites.towerKey(gh.type, 1, null), X(gh.c + 0.5), Y(gh.r + 0.82), T, T * 1.3, 0.5, 112 / 130, false);
      ctx.restore();
    }
    drawProjectiles(alpha);
    RG.fx.draw(ctx, X, Y, T);
    drawAlerts();
    RG.fx.drawTexts(ctx, X, Y, T);
    ctx.restore();
  }

  return { attach, detach, resize, frame, screenToWorld, worldToScreen, overlay, tileSize, get T() { return T; } };
})();

  <script>/* js/ui/common.js */
'use strict';

/* =========================================================
 * 화면 공용 — 화면 전환, 모달, 토스트, 툴팁, 설정, 소리 도우미
 * ========================================================= */
(() => {
  const { el } = RG.util;
  const screens = {};
  let current = null;

  /** 화면 등록: { id, enter(data), leave(), onKey(e) } */
  function register(id, def) { screens[id] = Object.assign({ id }, def); }

  function show(id, data) {
    const next = screens[id];
    if (!next) throw new Error(`화면 없음: ${id}`);
    if (current && current.leave) current.leave();
    document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
    const sec = document.getElementById(`screen-${id}`);
    sec.classList.add('active');
    current = next;
    closeAllModals();
    hideTooltip();
    if (next.enter) next.enter(sec, data || {});
    document.body.dataset.screen = id;
  }
  const currentId = () => (current ? current.id : null);

  /* ---------------- 소리 ---------------- */
  function sfx(name, opts) { try { if (RG.audio) RG.audio.play(name, opts); } catch (e) { /* 무시 */ } }
  function music(track) { try { if (RG.audio) RG.audio.music(track); } catch (e) { /* 무시 */ } }

  /* ---------------- 설정 ---------------- */
  const DEFAULT_SETTINGS = { master: 0.8, sfx: 0.8, music: 0.5, muted: false, speed: 1, shake: true, numbers: true, bigText: false, paths: true };
  let settings = null;
  function getSettings() {
    if (!settings) settings = Object.assign({}, DEFAULT_SETTINGS, RG.save.get(RG.save.KEYS.settings, {}));
    return settings;
  }
  function setSettings(patch) {
    Object.assign(getSettings(), patch);
    RG.save.set(RG.save.KEYS.settings, settings);
    applySettings();
  }
  function applySettings() {
    const s = getSettings();
    try {
      if (RG.audio) { RG.audio.setVolume({ master: s.master, sfx: s.sfx, music: s.music }); RG.audio.setMuted(s.muted); }
    } catch (e) { /* 무시 */ }
    RG.fx.settings.shake = s.shake;
    RG.fx.settings.numbers = s.numbers;
    RG.render.overlay.showPaths = s.paths;
    document.documentElement.classList.toggle('big-text', !!s.bigText);
  }

  /* ---------------- 모달 ---------------- */
  const modals = [];
  function modal(content, opts = {}) {
    const root = document.getElementById('modal-root');
    const back = el('div', { class: `modal-back ${opts.className || ''}` });
    const box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' });
    if (opts.title) box.appendChild(el('h2', { class: 'modal-title', text: opts.title }));
    if (typeof content === 'string') box.appendChild(el('div', { class: 'modal-body', html: content }));
    else box.appendChild(content);
    if (opts.buttons) {
      const row = el('div', { class: 'modal-buttons' });
      for (const b of opts.buttons) {
        row.appendChild(el('button', {
          class: `btn ${b.primary ? 'btn-primary' : ''} ${b.danger ? 'btn-danger' : ''}`,
          text: b.text,
          onclick: () => { sfx('click'); if (b.keep !== true) close(); if (b.onClick) b.onClick(); },
        }));
      }
      box.appendChild(row);
    }
    back.appendChild(box);
    if (opts.dismiss !== false) back.addEventListener('pointerdown', (e) => { if (e.target === back) { close(); if (opts.onClose) opts.onClose(); } });
    root.appendChild(back);
    const handle = { el: box, close, onClose: opts.onClose };
    modals.push(handle);
    function close() {
      back.remove();
      const i = modals.indexOf(handle);
      if (i >= 0) modals.splice(i, 1);
    }
    return handle;
  }
  function closeAllModals() { while (modals.length) modals[modals.length - 1].close(); }
  const modalOpen = () => modals.length > 0;
  function closeTopModal() {
    const m = modals[modals.length - 1];
    if (m) { m.close(); if (m.onClose) m.onClose(); return true; }
    return false;
  }

  function confirmBox(text, onYes, opts = {}) {
    return modal(el('p', { class: 'modal-text', text }), {
      title: opts.title || '확인',
      buttons: [{ text: opts.no || '취소' }, { text: opts.yes || '확인', primary: !opts.danger, danger: !!opts.danger, onClick: onYes }],
    });
  }

  /* ---------------- 토스트 ---------------- */
  function toast(text, kind = 'info', ms = 1800) {
    const root = document.getElementById('toast-root');
    const t = el('div', { class: `toast toast-${kind}`, text });
    root.appendChild(t);
    while (root.children.length > 3) root.firstChild.remove();
    setTimeout(() => t.classList.add('out'), ms);
    setTimeout(() => t.remove(), ms + 400);
  }

  /* ---------------- 툴팁 ---------------- */
  let tipTarget = null;
  function tooltipFor(node, getHtml) {
    node.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') showTooltip(node, typeof getHtml === 'function' ? getHtml() : getHtml); });
    node.addEventListener('pointerleave', hideTooltip);
  }
  function showTooltip(node, html) {
    const tip = document.getElementById('tooltip');
    tip.innerHTML = html;
    tip.classList.add('show');
    tipTarget = node;
    const r = node.getBoundingClientRect();
    const tw = tip.offsetWidth;
    const th = tip.offsetHeight;
    let x = r.left + r.width / 2 - tw / 2;
    let y = r.top - th - 8;
    if (y < 6) y = r.bottom + 8;
    x = Math.max(6, Math.min(window.innerWidth - tw - 6, x));
    tip.style.left = `${x}px`;
    tip.style.top = `${y}px`;
  }
  function hideTooltip() {
    const tip = document.getElementById('tooltip');
    if (tip) tip.classList.remove('show');
    tipTarget = null;
  }

  /* ---------------- 그림 도우미 ---------------- */
  function svgImg(svg, cls, alt) {
    return el('img', { class: cls || '', src: RG.art.sprites.dataUrl(svg), alt: alt || '', draggable: 'false' });
  }
  function icon(name, cls) { return svgImg(RG.art.icon(name), `icon ${cls || ''}`, name); }
  function towerImg(type, level = 1, branch = null, cls = '') { return svgImg(RG.art.tower(type, level, branch), `tower-img ${cls}`, RG.data.towers[type].name); }
  function enemyImg(type, cls = '') { return svgImg(RG.art.enemy(type, 0), `enemy-img ${cls}`, RG.data.enemies[type].name); }
  function portrait(id, mood = 'normal', cls = '') { return svgImg(RG.art.portrait(id, mood), `portrait ${cls}`, id); }

  function stars(n, max = 3, cls = '') {
    const box = el('span', { class: `stars ${cls}` });
    for (let i = 0; i < max; i++) box.appendChild(icon(i < n ? 'star' : 'star_empty', 'star-icon'));
    return box;
  }

  function elementBadge(element) {
    const e = RG.data.elements[element];
    return el('span', { class: `el-badge el-${element}` }, [icon(element, 'el-icon'), e.name]);
  }

  Object.assign(RG.ui, {
    register, show, currentId, sfx, music, getSettings, setSettings, applySettings, modal, closeAllModals, modalOpen, closeTopModal,
    confirmBox, toast, tooltipFor, showTooltip, hideTooltip, svgImg, icon, towerImg, enemyImg, portrait, stars, elementBadge, screens,
  });
})();

    body.append(
      slider('master', '전체 음량'), slider('sfx', '효과음'), slider('music', '음악'),
      toggle('muted', '소리 끄기'), toggle('shake', '화면 흔들림'), toggle('numbers', '피해 숫자'), toggle('paths', '준비 중 길 미리보기'), toggle('bigText', '큰 글씨'),

  /* =====================================================
   * 월드 지도

  let worldRegion = null;
  UI.register('world', {
    enter(sec, data) {

      const frontMap = D().maps.find((m) => m.id === front);

      const head = el('header', { class: 'top-bar' }, [
        el('button', { class: 'icon-btn', title: '타이틀', onclick: () => UI.show('title', {}) }, [UI.icon('back')]),

          el('button', { class: 'btn small', onclick: () => UI.show('codex', {}) }, [UI.icon('book', 'tiny'), '도감']),

        }, [el('b', { text: `${reg.id}. ${reg.name}` }), el('small', { text: maps.length ? `★ ${got}/${maps.length * 5}` : '잠김' })]));
      }
      const reg = D().regions.find((r) => r.id === worldRegion);
      const maps = D().maps.filter((m) => m.region === worldRegion);
      const board = el('div', { class: `region-board theme-${reg.theme}` });
      board.appendChild(UI.svgImg(RG.art.regionBanner ? RG.art.regionBanner(reg.id) : '', 'region-banner'));
      board.appendChild(el('div', { class: 'region-desc' }, [el('h3', { text: reg.name }), el('p', { text: reg.desc })]));
      const nodes = el('div', { class: 'map-nodes' });
      maps.forEach((m, i) => {
        const open = P().mapUnlocked(m.id);
        const rec = P().mapRec(m.id);
        const node = el('button', {

          open ? UI.stars(rec.stars || 0, 3, 'mn-stars') : UI.icon('lock', 'mn-lock'),

      const noHero = mode === 'challenge' && def.challenge && def.challenge.type === 'noHero';
