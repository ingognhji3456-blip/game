<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f1a">
  <title>카드 원정대</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/battle.css">
  <link rel="stylesheet" href="css/fx.css">
  <link rel="stylesheet" href="css/art.css">
</head>
<body>
  <div id="app">
    <header id="hud" class="hidden">
      <div class="hud-bar">
        <div class="hud-group">
          <div class="hud-stat hud-hp" id="hud-hp" title="체력"><span class="hud-icon">❤️</span><span id="hud-hp-text">0/0</span></div>
          <div class="hud-stat hud-gold" id="hud-gold" title="골드"><span class="hud-icon">💰</span><span id="hud-gold-text">0</span></div>
          <div class="hud-potions" id="hud-potions"></div>
        </div>
        <div class="hud-floor" id="hud-floor"></div>
        <div class="hud-group hud-buttons">
          <button class="icon-btn" id="hud-map" title="지도 보기" aria-label="지도 보기">🗺️</button>
          <button class="icon-btn" id="hud-deck" title="덱 보기" aria-label="덱 보기">🂠<span class="badge" id="hud-deck-count">0</span></button>
          <button class="icon-btn" id="hud-mute" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">🔊</button>
          <button class="icon-btn" id="hud-settings" title="설정" aria-label="설정">⚙️</button>
        </div>
      </div>
      <div class="hud-relics" id="hud-relics"></div>
    </header>

    <main id="screens">
      <section class="screen" id="screen-title"></section>
      <section class="screen" id="screen-map"></section>
      <section class="screen" id="screen-battle"></section>
      <section class="screen" id="screen-reward"></section>
      <section class="screen" id="screen-shop"></section>
      <section class="screen" id="screen-rest"></section>
      <section class="screen" id="screen-event"></section>
      <section class="screen" id="screen-treasure"></section>
      <section class="screen" id="screen-gameover"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="tooltip" class="tooltip" role="tooltip"></div>
  <div id="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/data/keywords.js"></script>
  <script src="js/data/cards.js"></script>
  <script src="js/data/enemies.js"></script>
  <script src="js/data/relics.js"></script>
  <script src="js/data/potions.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/art/icons.js"></script>
  <script src="js/art/enemies.js"></script>
  <script src="js/fx/audio.js"></script>
  <script src="js/fx/fx.js"></script>
  <script src="js/core/combat.js"></script>
  <script src="js/core/run.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/ui/common.js"></script>
  <script src="js/ui/map.js"></script>
  <script src="js/ui/screens.js"></script>
  <script src="js/ui/battle.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
